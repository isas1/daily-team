<style>

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111316;--pack-surface:#1a1d21;--pack-text:#e7e9ec;--pack-muted:#9aa1ab;--pack-accent:#6fa8dc;--pack-border:#2c3138}:root[data-theme="light"]{--pack-bg:#f6f7f9;--pack-surface:#ffffff;--pack-text:#16191d;--pack-muted:#5b636e;--pack-accent:#2f6db3;--pack-border:#d6dae0}</style></head><body>

<script>(function(){
  var $=function(i){return document.getElementById(i)};
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var T1=['checkout.spec.ts › pays for Forever plan','checkout.spec.ts › applies coupon'];
  var T2=['upload.spec.ts › rejects cat-pics-2 over 2 GB'];
  var OUT={pass:{o:'passed',f:[],dur:39},same:{o:'failed',f:T1,dur:41,ln:[212,219],why:'timeout 5000 ms'},new:{o:'failed',f:T2,dur:33,ln:[187],why:'expected 413, got 500'}};
  var att,running=null,timer=0,raf=0,drawStart=0;
  function seed(){att=[{n:1,o:'failed',f:T1,dur:41,ln:[212,219],why:'timeout 5000 ms'}]}
  function file(a){return a.f[0].split(' ›')[0]}
  function same(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(b.indexOf(a[i])<0)return false;return true}
  function prevVerdict(k){for(var i=k-1;i>=0;i--)if(att[i].o!=='stopped')return att[i];return null}

    var line=$('av5-line'),sub=$('av5-sub'),g=$('av5-g'),log=$('av5-log');
    clear(line);clear(log);
    var last=att[att.length-1],next=att.length+1;
    $('av5-seg').disabled=!!running;
    var rb=$('av5-run');
    if(running){
      g.dataset.s='running';$('av5-att').textContent='Attempt '+running.n;
      line.textContent='Attempt '+running.n+' running';
      var pv=prevVerdict(att.length);
      sub.textContent=pv?'Will compare with attempt '+pv.n:'No earlier attempt to compare';
      logLine('  1 $ npm test -- --retry='+running.n);logLine('  2 running 148 tests…');
      rb.textContent='Stop';rb.dataset.s='running';return;
    }
    rb.textContent='Retry · attempt '+next;rb.dataset.s='ready';
    $('av5-att').textContent='Attempt '+last.n+' of '+att.length;
    g.dataset.s=last.o;
    var pv2=prevVerdict(att.length-1);
    if(last.o==='passed'){
      line.textContent='Passed on attempt '+last.n+' · '+last.dur+' s';
      sub.textContent='Slowest: checkout.spec.ts at 4900 ms of a 5000 ms limit';
      logLine('301 148 passed · 0 failed','av5-e');logLine('302 exit 0');
    }else if(last.o==='stopped'){
      line.textContent='Stopped at '+last.dur+' s · no verdict';
      sub.textContent=pv2?'Last verdict: attempt '+pv2.n+' '+pv2.o:'No verdict yet';
      logLine(' 88 stopped by user · Escape pressed','av5-e');
    }else{
      var lead;
      if(!pv2){lead='Failed · '+last.f.length+' of 148 tests · ';sub.textContent=last.dur+' s · '+last.why}
      else if(pv2.o==='passed'){lead='Failed after a pass · ';sub.textContent='Attempt '+pv2.n+' passed, so this may be flaky'}
      else if(same(last.f,pv2.f)){lead='Failed again · same test · ';sub.textContent='Matches attempt '+pv2.n+' · retrying will not fix it'}
      else{lead='Failed · different error · ';sub.textContent='Attempt '+pv2.n+' failed in '+file(pv2)}
      line.appendChild(document.createTextNode(lead));
      var b=el('button','av5-link',file(last));b.type='button';
      b.addEventListener('click',jump);line.appendChild(b);
      last.f.forEach(function(t,i){logLine(String(last.ln[i]).padStart(3)+' FAIL '+t+' · '+last.why,'av5-e','av5-l'+i)});
      logLine(String(last.ln[last.ln.length-1]+40).padStart(3)+' exit 1');
    }
  }
  function jump(){
    var log=$('av5-log'),t=$('av5-l0');if(!t)return;
    log.scrollTop=t.offsetTop-log.offsetTop-8;log.scrollLeft=0;
    var ls=log.querySelectorAll('.av5-e');ls.forEach(function(s){s.classList.add('av5-fl')});
    log.focus();setTimeout(function(){ls.forEach(function(s){s.classList.remove('av5-fl')})},900);
  }
  function start(){
    if(running)return;
    var v=document.querySelector('input[name=av5-o]:checked').value,o=OUT[v];
    running={n:att.length+1,o:o.o,f:o.f,dur:o.dur,ln:o.ln||[],why:o.why||'',t:performance.now()};
    render();timer=setTimeout(finish,1600);
  }
  function finish(){
    var r=running;if(!r)return;running=null;clearTimeout(timer);
    att.push({n:r.n,o:r.o,f:r.f,dur:r.dur,ln:r.ln,why:r.why});render();
    if(r.o==='passed'){drawStart=0;$('av5-ck').style.strokeDashoffset='1';kick()}
  }
  function stop(){
    var r=running;if(!r)return;running=null;clearTimeout(timer);
    var s=Math.max(1,Math.round((performance.now()-r.t)/1600*r.dur));
    att.push({n:r.n,o:'stopped',f:[],dur:s,ln:[]});render();
  }
  function step(now){
    if(!drawStart)drawStart=now;
    var p=Math.min(1,(now-drawStart)/200),e=1-Math.pow(1-p,3);
    $('av5-ck').style.strokeDashoffset=String(1-e);return p<1;

  function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame);else if(document.hidden)snapToTarget()}

    if(document.hidden){cancelAnimationFrame(raf);raf=0;snapToTarget()}});

    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});
  $('av5-run').addEventListener('click',function(){running?stop():start()});
  $('av5-reset').addEventListener('click',function(){running=null;clearTimeout(timer);seed();render()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&running){e.preventDefault();stop();$('av5-run').focus()}});
  seed();render();
})();</script>
