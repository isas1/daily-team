<div class="cf6-root" id="cf6-root" role="group" aria-label="Copy failure notice for a clip share link">
 <div class="cf6-card">
  <label class="cf6-lbl" for="cf6-link">Forever clip: cat-pics-2 at 1:42</label>
  <input class="cf6-link" id="cf6-link" readonly value="https://media.example/v/hd7k2?t=102">
  <button class="cf6-btn cf6-copy" id="cf6-copy" type="button" data-s="failed">
   <svg class="cf6-ico" viewBox="0 0 16 16" aria-hidden="true"><g class="cf6-cp"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 2.5h-7a1 1 0 0 0-1 1v7"/></g><path class="cf6-ck" d="M3 8.5l3 3 7-7"/></svg>
   <span class="cf6-lab"><span data-k="idle">Copy link</span><span data-k="pending">Copying</span><span data-k="copied">Copied</span><span data-k="failed">Copy failed</span></span>
   <span class="cf6-bar" id="cf6-bar"></span>
  </button>
  <div class="cf6-note" id="cf6-note">
   <h2 class="cf6-h" id="cf6-h" tabindex="-1"><span class="cf6-bang" aria-hidden="true">!</span><span id="cf6-ht">Clipboard blocked by browser</span></h2>
   <p class="cf6-sub" id="cf6-sub">Retry, or select the link and copy it yourself.</p>
   <div class="cf6-acts" id="cf6-acts">
    <button class="cf6-btn" id="cf6-retry" type="button">Retry</button>
    <button class="cf6-btn" id="cf6-sel" type="button">Select link</button>
    <button class="cf6-btn" id="cf6-dis" type="button">Dismiss</button>
   </div>
  </div>
  <div class="cf6-sim"><label class="cf6-lbl" for="cf6-mode">Test as</label>
   <select id="cf6-mode"><option value="blocked">Blocked clipboard</option><option value="insecure">Page not secure</option><option value="hang">No answer</option><option value="real">Real clipboard</option></select>
  </div>
  <div class="cf6-sr" id="cf6-sr" aria-live="polite"></div>
 </div>

<script>(function(){
  var $=function(i){return document.getElementById('cf6-'+i)};
  var link=$('link'),copyB=$('copy'),bar=$('bar'),note=$('note'),h=$('h'),ht=$('ht'),sub=$('sub'),acts=$('acts'),retry=$('retry'),sel=$('sel'),dis=$('dis'),mode=$('mode'),sr=$('sr');
  var MSG={blocked:'Clipboard blocked by browser',insecure:'Page not secure',timeout:'Clipboard did not answer'};
  var KEY=/Mac|iP/.test(navigator.platform)?'\u2318C':'Ctrl+C';
  var S={status:'failed',reason:'blocked',shown:true,manual:false,attempt:0,t0:0};
  var limitT=0,doneT=0,sayT=0;
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  function say(t){sr.textContent='';clearTimeout(sayT);sayT=setTimeout(function(){sr.textContent=t},60)}
  function manualHint(){return matchMedia('(pointer:coarse)').matches?'Link selected. Use Copy in the menu.':'Link selected. Press '+KEY+'.'}
  function render(){
    var pend=S.status==='pending';
    copyB.dataset.s=S.status;copyB.setAttribute('aria-disabled',pend);
    note.hidden=!S.shown;
    if(S.reason)ht.textContent=MSG[S.reason];
    sub.textContent=pend?'Retrying':S.manual?manualHint():'Retry, or select the link and copy it yourself.';
    retry.setAttribute('aria-disabled',pend);
    if(S.manual)link.setAttribute('data-sel','');else link.removeAttribute('data-sel');
    draw();
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function copy(){
    if(S.status==='pending')return;
    var id=++S.attempt;clearTimeout(doneT);clearTimeout(limitT);
    S.status='pending';S.manual=false;S.t0=performance.now();render();kick();
    limitT=setTimeout(function(){done(id,'timeout')},1500);
    var m=mode.value,p;
    if(m==='blocked')p=wait(500).then(function(){throw{name:'NotAllowedError'}});
    else if(m==='insecure')p=wait(300).then(function(){throw{name:'Insecure'}});
    else if(m==='hang')p=new Promise(function(){});
    else if(!window.isSecureContext||!navigator.clipboard)p=Promise.reject({name:'Insecure'});
    else p=navigator.clipboard.writeText(link.value);
    p.then(function(){done(id)},function(e){done(id,e&&e.name==='Insecure'?'insecure':'blocked')});
  }
  function copied(){
    S.status='copied';S.shown=false;S.manual=false;note.removeAttribute('role');
    clearTimeout(doneT);doneT=setTimeout(function(){S.status='idle';render()},2000);
    say('Link copied');
  }
  function done(id,r){
    if(id!==S.attempt||S.status!=='pending')return;
    clearTimeout(limitT);
    var inNote=note.contains(document.activeElement);
    if(!r){copied();render();if(inNote)copyB.focus();return}
    var first=!S.shown;
    S.status='failed';S.reason=r;S.shown=true;
    if(first)note.setAttribute('role','alert');else say(MSG[r]);
    render();if(first)h.focus();
  }
  function dismiss(){
    S.attempt++;clearTimeout(limitT);
    S.status='idle';S.shown=false;S.manual=false;S.reason=null;
    note.removeAttribute('role');render();copyB.focus();
  }
  function selectLink(){
    S.manual=true;render();link.focus();link.select();
    try{link.setSelectionRange(0,link.value.length)}catch(e){}
    say(manualHint());
  }
  copyB.addEventListener('click',copy);
  retry.addEventListener('click',function(){if(S.status!=='pending')copy()});
  sel.addEventListener('click',selectLink);
  dis.addEventListener('click',dismiss);
  link.addEventListener('click',function(){link.select()});
  link.addEventListener('blur',function(){if(S.manual){S.manual=false;render()}});
  link.addEventListener('copy',function(){if(S.shown&&S.status!=='pending'){copied();render()}});
  acts.addEventListener('keydown',function(e){
    var b=[retry,sel,dis],i=b.indexOf(document.activeElement),d=0;
    if(e.key==='ArrowRight'||e.key==='ArrowDown')d=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')d=-1;
    if(d&&i>-1){e.preventDefault();b[(i+d+3)%3].focus()}
  });
  $('root').addEventListener('keydown',function(e){if(e.key==='Escape'&&S.shown){e.preventDefault();dismiss()}});

  var raf=0,last=0;
  function step(){return S.status==='pending'}
  function draw(){
    var k=S.status==='pending'&&!reduce()?Math.min(1,(performance.now()-S.t0)/1500):0;
    bar.style.transform='scaleX('+k+')';
  }
  function snapToTarget(){bar.style.transform='scaleX(0)'}
  function frame(now){last=now;
    var moving=reduce()?(snapToTarget(),false):step();
    if(!reduce())draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});

  render();
})();</script>
