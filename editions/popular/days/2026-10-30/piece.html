function lcp(a,b){var i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}
function split(s){var a=s.indexOf('://');a=a<0?0:a+3;var h=s.indexOf('/',a);if(h<0)h=s.length;
  var r=s.slice(h),q=r.indexOf('?'),p=q<0?r:r.slice(0,q),qs=q<0?'':r.slice(q),k=Math.min(3,p.length);
  return [s.slice(0,a),s.slice(a,h),p.slice(0,p.length-k),p.slice(p.length-k)+qs]}
function fill(el,str,off){el.replaceChildren();var c=Math.max(0,Math.min(str.length,diffAt-off));
  if(c>0)el.append(document.createTextNode(str.slice(0,c)));
  if(c<str.length){var n=document.createElement('span');n.className='ms-new';n.textContent=str.slice(c);el.append(n)}}
function endType(){anim=null;clearTimeout(fadeT);fadeT=setTimeout(function(){vis.classList.add('ms-fade')},700)}
function stepLink(now){if(!anim)return false;
  var k=Math.floor((now-anim.t0)/24);
  if(k>=anim.del+anim.add){shown=anim.to;endType();return false}
  shown=k<anim.del?anim.from.slice(0,anim.from.length-k):anim.to.slice(0,anim.p+k-anim.del);
  return true}
function snapLink(){if(anim){shown=anim.to;endType()}}
var drawnShown=null,drawnTyping=null;
function drawLink(){var typing=!!anim;
  if(shown!==drawnShown||typing!==drawnTyping){var p=split(shown),off=0;
    for(var i=0;i<4;i++){fill(parts[i],p[i],off);off+=p[i].length}
    drawnShown=shown;drawnTyping=typing}
  vis.classList.toggle('ms-typing',typing);box.classList.toggle('ms-sel',sel)}

function frame(now){var dt=last?Math.min(now-last,50)/1000:1/60;last=now;
  var m1,m2;
  if(reduce()){snapSheet();snapLink();m1=m2=false}else{m1=stepSheet(dt);m2=stepLink(now)}
  drawSheet();drawLink();
  raf=(m1||m2)?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

/* ---------- Row 1 + Row 2: open, snap, close ---------- */
function renderTrigger(){
  fab.setAttribute('aria-expanded',String(S.open));
  l1.setAttribute('aria-hidden',String(S.open));l2.setAttribute('aria-hidden',String(!S.open));
  sheet.inert=!S.open;ed.inert=S.open}
function setSnap(s,vel){S.snap=s;if(vel!==undefined)v=vel;measure();kick()}
function openSheet(focus){
  if(S.open)return;
  var wasHidden=sheet.hidden;
  S.open=true;sheet.hidden=false;scrim.hidden=false;
  if(wasHidden){x=Y('closed');v=0}
  renderTrigger();setSnap('peek');drawSheet();
  est.textContent='Sheet open. The button now reads Close.';
  if(focus!==false)grip.focus({preventScroll:true})}
function closeSheet(why,vel){
  if(!S.open)return;
  S.open=false;resetCopy();clearStatus();
  renderTrigger();setSnap('closed',vel);
  fab.focus({preventScroll:true});
  est.textContent='Closed by '+why+'. Focus is back on Share.'}

fab.addEventListener('click',function(){S.open?closeSheet('the Close button'):openSheet()});
cls.addEventListener('click',function(){closeSheet('the header Close button')});
scrim.addEventListener('click',function(){closeSheet('a tap outside')});
fab.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter')fab.classList.add('ms-dn')});
['keyup','blur'].forEach(function(t){fab.addEventListener(t,function(){fab.classList.remove('ms-dn')})});

grip.addEventListener('click',function(){if(performance.now()<eat)return;setSnap(S.snap==='full'?'peek':'full')});
grip.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'){e.preventDefault();setSnap('full')}
  else if(e.key==='ArrowDown'){e.preventDefault();S.snap==='full'?setSnap('peek'):closeSheet('the Down key')}});

hd.addEventListener('pointerdown',function(e){
  if(e.button>0||e.target===cls||!S.open)return;
  drag={id:e.pointerId,y0:e.clientY,x0:x,from:S.snap,moved:false,s:[[e.timeStamp,e.clientY]]};v=0;
  hd.setPointerCapture(e.pointerId)});
hd.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0;if(Math.abs(dy)>6)drag.moved=true;
  var nx=drag.x0+dy;x=nx<0?nx/3:nx;
  drag.s.push([e.timeStamp,e.clientY]);while(drag.s.length>2&&e.timeStamp-drag.s[0][0]>100)drag.s.shift();
  drawSheet()});
function release(e){if(!drag||e.pointerId!==drag.id)return;var d=drag;drag=null;
  if(!d.moved){kick();return}eat=performance.now()+300;
  var a=d.s[0],b=d.s[d.s.length-1],vel=b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0,
    visH=H*.9-Y(d.from),dist=x-Y(d.from);
  if(e.timeStamp-b[0]>100)vel=0;
  if(vel>.5||dist>.4*visH)closeSheet('a swipe',vel*1000);
  else if(vel<-.5)setSnap('full',vel*1000);
  else setSnap(Math.abs(x-Y('full'))<Math.abs(x-Y('peek'))?'full':'peek',vel*1000)}
hd.addEventListener('pointerup',release);hd.addEventListener('pointercancel',release);

function focusables(){
  var list=[].slice.call(sheet.querySelectorAll('button,input,select')).filter(function(el){return !el.disabled&&el.getClientRects().length});
  list.push(fab);return list}
document.addEventListener('keydown',function(e){
  if(!S.open)return;
  if(e.key==='Escape'){
    if(document.activeElement===tin&&S.startOn&&tin.value!==fmt(S.startSec)){
      e.preventDefault();tin.value=fmt(S.startSec);S.err='';renderStart();return}
    e.preventDefault();closeSheet('Escape');return}
  if(e.key==='Tab'){var f=focusables(),i=f.indexOf(document.activeElement);
    if(i<0){e.preventDefault();f[0].focus()}
    else if(e.shiftKey&&i===0){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});

/* ---------- Row 3: start-at field ---------- */
function parse(val){val=val.trim();var m;
  if(/^\d{1,4}$/.test(val))return +val;
  if((m=/^(\d{1,3}):([0-5]\d)$/.exec(val)))return m[1]*60+(+m[2]);
  return NaN}
function renderStart(){
  on.checked=S.startOn;
  tin.disabled=dn.disabled=up.disabled=!S.startOn;
  tin.setAttribute('aria-invalid',S.err?'true':'false');
  tmsg.className='ms-tmsg'+(S.err?' ms-bad':'');
  tmsg.textContent=S.err||(S.startOn?'Type m:ss, then Enter. Up and Down step 1s, Shift steps 10s.':'Tick Start at to open the link at a moment.')}
function commitTime(){if(!S.startOn)return;
  var n=parse(tin.value);
  if(isNaN(n))S.err='Use m:ss, like 1:42. Link keeps '+fmt(S.startSec)+'.';
  else if(n>S.duration)S.err='Clip is '+fmt(S.duration)+' long. Link keeps '+fmt(S.startSec)+'.';
  else{S.startSec=n;S.err='';tin.value=fmt(n)}
  renderStart();setUrl()}
function nudge(d){if(!S.startOn)return;
  S.startSec=Math.max(0,Math.min(S.duration,S.startSec+d));S.err='';tin.value=fmt(S.startSec);
  renderStart();setUrl()}
on.addEventListener('change',function(){S.startOn=on.checked;S.err='';tin.value=fmt(S.startSec);renderStart();setUrl();if(S.startOn)tin.focus()});
on.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();on.click()}});
tin.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();nudge((e.key==='ArrowUp'?1:-1)*(e.shiftKey?10:1))}
  else if(e.key==='Enter'){e.preventDefault();commitTime()}});
tin.addEventListener('blur',commitTime);
tin.addEventListener('focus',function(){tin.select()});
dn.addEventListener('click',function(e){nudge(e.shiftKey?-10:-1)});
up.addEventListener('click',function(e){nudge(e.shiftKey?10:1)});

/* ---------- Row 4: link retype line ---------- */
function setUrl(){
  var nu=buildUrl();if(nu===S.url)return;
  S.url=nu;linp.value=nu;if(sel)linp.select();
  vis.classList.remove('ms-fade');clearTimeout(fadeT);
  if(anim||reduce()){diffAt=lcp(S.url,shown);shown=nu;anim=null;diffAt=Math.min(diffAt,lcp(anim?anim.from:shown,nu));endType()}
  else{var p=lcp(shown,nu);diffAt=p;anim={from:shown,to:nu,p:p,del:shown.length-p,add:nu.length-p,t0:performance.now()}}
  drawLink();kick();
  if(C.status==='copied'){C.attempt++;clearTimeout(backT);C.status='idle';renderCopy()}
  setStatus(S.startOn&&S.startSec>0?'Link now opens at '+fmt(S.startSec)+'. Copy again to share it.':'Link opens at 0:00.')}
function selectAll(){sel=true;linp.select();try{linp.setSelectionRange(0,linp.value.length)}catch(_){}drawLink()}
linp.addEventListener('focus',function(){setTimeout(function(){if(document.activeElement===linp)selectAll()},0)});
linp.addEventListener('click',selectAll);
linp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectAll()}});
linp.addEventListener('blur',function(){sel=false;if(C.manual){C.manual=false;renderCopy()}drawLink()});
linp.addEventListener('copy',function(){if(C.status!=='pending'){C.attempt++;clearTimeout(toT);copiedState('Copied '+linkName()+' with '+KEY+'.')}});

/* ---------- Row 5: copy check button ---------- */
var backT=0,toT=0;
function setStatus(t){st.textContent=t}
function clearStatus(){st.textContent=''}
function renderCopy(){
  var pend=C.status==='pending';
  copyB.dataset.s=C.status;st.dataset.s=C.status;
  copyB.setAttribute('aria-disabled',String(pend));
  retry.setAttribute('aria-disabled',String(pend));
  note.hidden=!C.shown;
  if(C.reason)nht.textContent=MSG[C.reason];
  nsub.textContent=pend?'Retrying.':C.manual?(matchMedia('(pointer:coarse)').matches?'Link selected. Use Copy in the menu.':'Link selected. Press '+KEY+'.'):'Retry, or select the link and copy it yourself.';
  if(C.manual)box.setAttribute('data-sel','');else box.removeAttribute('data-sel')}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function copyJob(){
  if(C.status==='pending')return;
  var id=++C.attempt,url=S.url,m=S.sim,p;
  clearTimeout(backT);clearTimeout(toT);
  C.status='pending';C.manual=false;renderCopy();setStatus('Copying link.');
  toT=setTimeout(function(){finish(id,'timeout')},1500);
  if(m==='blocked')p=wait(400).then(function(){throw{name:'NotAllowedError'}});
  else if(m==='insecure')p=wait(240).then(function(){throw{name:'Insecure'}});
  else if(m==='hang')p=new Promise(function(){});
  else if(!window.isSecureContext||!navigator.clipboard||!navigator.clipboard.writeText)p=Promise.reject({name:'Insecure'});
  else{try{p=navigator.clipboard.writeText(url)}catch(err){p=Promise.reject(err)}}
  p.then(function(){finish(id)},function(err){finish(id,err&&(err.name==='Insecure'||err.name==='SecurityError')?'insecure':'blocked')})}
function copiedState(msg){
  var id=C.attempt,inNote=note.contains(document.activeElement);
  clearTimeout(backT);
  C.status='copied';C.shown=false;C.reason=null;C.manual=false;note.removeAttribute('role');
  renderCopy();setStatus(msg);if(inNote)copyB.focus();
  backT=setTimeout(function(){if(id===C.attempt&&C.status==='copied'){C.status='idle';renderCopy()}},2000)}
function finish(id,reason){
  if(id!==C.attempt||C.status!=='pending')return;
  clearTimeout(toT);
  if(!reason){copiedState('Copied '+linkName()+'.');return}
  var first=!C.shown;
  C.status='failed';C.reason=reason;C.shown=true;
  if(first){note.setAttribute('role','alert');clearStatus()}else setStatus(MSG[reason]+'. Retry or select the link.');
  renderCopy();if(first)nh.focus()}
function resetCopy(){C.attempt++;clearTimeout(backT);clearTimeout(toT);
  C.status='idle';C.shown=false;C.reason=null;C.manual=false;note.removeAttribute('role');renderCopy()}
copyB.addEventListener('click',copyJob);

/* ---------- Row 6: failure notice ---------- */
retry.addEventListener('click',function(){if(C.status!=='pending')copyJob()});
selB.addEventListener('click',function(){C.manual=true;renderCopy();linp.focus();selectAll();
  setStatus(nsub.textContent)});
dis.addEventListener('click',function(){resetCopy();setStatus('Notice dismissed.');copyB.focus()});
acts.addEventListener('keydown',function(e){
  var b=[retry,selB,dis],i=b.indexOf(document.activeElement),d=0;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')d=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')d=-1;
  if(d&&i>-1){e.preventDefault();b[(i+d+3)%3].focus()}});

/* ---------- Test controls ---------- */
sim.addEventListener('change',function(){S.sim=sim.value});
lng.addEventListener('change',function(){S.baseUrl=lng.checked?LONG:BASE;setUrl()});

/* ---------- lifecycle ---------- */
new ResizeObserver(function(){H=root.clientHeight||H;if(!sheet.hidden)measure();if(!drag&&!raf){x=Y(S.snap)}drawSheet()}).observe(root);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
    document.documentElement.setAttribute('data-theme',m.theme);drawSheet();drawLink()}});

/* Initial sample state: sheet at peek, start time off, link ready. */
linp.value=S.url;sim.value=S.sim;
renderStart();renderCopy();
S.open=true;S.snap='peek';sheet.hidden=false;scrim.hidden=false;
renderTrigger();measure();x=Y('peek');drawSheet();drawLink();
est.textContent='Sheet open at peek. Escape, Close or a swipe down closes it.';
})();</script>
</body></html>
