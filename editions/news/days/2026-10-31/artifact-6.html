<script>(function(){

function init(){return[
{id:'install',st:'passed',t:18,log:['$ forever install','added 812 packages','done in 18 s']},
{id:'lint',st:'passed',t:9,needs:['install'],log:['$ forever lint','0 problems in 140 files']},
{id:'compile',st:'passed',t:20,needs:['lint'],log:['$ forever build web','emotional-baggage.js 2.1 MB (heaviest chunk)','built in 20 s']},
{id:'test',st:'failed',t:72,needs:['compile'],log:['$ forever test api','PASS api/users.test.ts','PASS api/billing.test.ts (Forever plan)','!FAIL api/auth.test.ts:88 expected 200, got 401','!FAIL api/auth.test.ts:121 token expired','!FAIL api/cat-pics-2.test.ts:14 upload too heavy','3 of 212 failed · exit 1']},
{id:'bundle',st:'skipped',t:0,needs:['test'],log:[]},
{id:'deploy',st:'skipped',t:0,needs:['bundle'],log:[]}]}

var key=g.st+':'+g.items[0].id,b=el('button','p6-fold p6-'+pos),sum=0;b.type='button';b.dataset.k='f:'+key;

var fk=list.contains(document.activeElement)?document.activeElement.dataset.k:null,ff=fk&&document.activeElement.dataset.f;
list.textContent='';var h=el('div','p6-run');h.append(el('b',null,'Run 418'),' · main');list.append(h);
var i=S.indexOf(get(sel));add(segs(S.slice(0,i)),'b');row(S[i],'s');add(segs(S.slice(i+1)),'a');fresh=null;
var s=S[i];det.dataset.st=s.st;dn.textContent=nameOf(s.id);
ds.textContent=s.st==='failed'?'exit 1 · 3 of 212 tests failed':s.st==='passed'?'Passed in '+fmt(s.t)+(s.att>1?' on attempt '+s.att:''):

else if(allPassed()){act.hidden=false;act.disabled=false;act.textContent='Reset run 418'}
else if(s.st==='failed'){act.hidden=false;act.disabled=false;act.textContent='Retry '+nameOf(s.id)}
else act.hidden=true;
log.setAttribute('aria-label','Log, '+nameOf(s.id));ol.textContent='';
var lines=s.st==='skipped'?null:s.st==='queued'?null:s.st==='running'?[PL[s.id][0]]:s.log,first=null;
if(!lines)ol.append(el('li','p6-z',s.st==='queued'?'Waiting to run':'Did not run'));
else lines.forEach(function(t){var e=t[0]==='!',li=el('li',e?'p6-e':null,e?t.slice(1):t);if(e&&!first)first=li;ol.append(li)});
if(s.st==='running')ol.append(el('li','p6-z','running'));
if(lastSel!==sel+s.st){log.scrollTop=first?Math.max(0,first.offsetTop-6):0;log.scrollLeft=0;lastSel=sel+s.st}
if(fk){var t=list.querySelector('[data-k="'+fk+'"]');

function deps(id){var r=[id];S.forEach(function(s){if(s.needs&&s.needs.some(function(n){return r.indexOf(n)>-1}))r.push(s.id)});return r.slice(1).map(get)}

if(allPassed()){S=init();sel='test';open={};say('Run 418 reset. Test api failed');render();return}
var s=get(sel);if(s.st!=='failed')return;s.att=(s.att||1)+1;queue=[s].concat(deps(s.id));

function finish(){var c=queue[qi];c.st='passed';c.t=RT[c.id];c.log=PL[c.id];qi++;clock=0;

})();</script>
