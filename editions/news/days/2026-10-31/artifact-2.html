<style>

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111316;--pack-surface:#1a1d21;--pack-text:#e6e8eb;--pack-muted:#9aa1aa;--pack-accent:#6ea8fe;--pack-border:#2c3138}:root[data-theme="light"]{--pack-bg:#f6f7f9;--pack-surface:#ffffff;--pack-text:#16191d;--pack-muted:#5b636d;--pack-accent:#1f5fbf;--pack-border:#d5d9df}</style></head><body>
<div class="fs2-root" role="group" aria-label="Failure summary for run 418">
<div class="fs2-steps" role="radiogroup" aria-label="Sample step" id="fs2-steps"></div>
<div class="fs2-card" id="fs2-card"></div>
<div class="fs2-demo"><button class="fs2-btn" id="fs2-demo" type="button"></button></div>
</div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var N={'compile-web':'Compile web','test-api':'Test api','bundle-assets':'Bundle assets'};
  function nameOf(id){return N[id]}
  var order=['compile-web','test-api','bundle-assets'];
  var S={'compile-web':{state:'passed',dur:'31 s'},
    'test-api':{state:'failed',attempts:[{exit:1,failed:3,total:212,file:'api/auth.test.ts:88',line:214}]},
    'bundle-assets':{state:'skipped',needs:'test-api'}};
  var log=[[213,'  ● renews Forever plan session'],[214,'error  expected 200, received 401'],[215,'  token for cat-pics-2 expired 3 naps ago']];
  var sel='test-api',open=true;
  var $=function(i){return document.getElementById(i)};
  var steps=$('fs2-steps'),card=$('fs2-card'),demo=$('fs2-demo');
  var wrap,head,anim=null,raf=0;
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
  function status(id){var s=S[id];
    if(s.state==='failed')return s.attempts.length>1?'recovered':'failed';return s.state}
  function glyph(st){return el('span','fs2-g fs2-g-'+(st==='recovered'?'passed':st),null)}
  function word(st){return {failed:'failed',passed:'passed',recovered:'passed',skipped:'skipped'}[st]}
  function failBlock(a,parent){
    parent.appendChild(el('p',null,'exit '+a.exit+' · '+a.failed+' of '+a.total+' tests failed'));
    var p=el('p',null,'First at ');p.appendChild(el('code',null,a.file));parent.appendChild(p);
    var j=el('button','fs2-link','Jump to line '+a.line);j.type='button';parent.appendChild(j);
    var lg=el('div','fs2-log');lg.hidden=true;lg.setAttribute('role','region');lg.setAttribute('aria-label','Log of '+nameOf('test-api')+', attempt 1');
    var hit;
    log.forEach(function(l){var r=el('div','fs2-ln');r.appendChild(el('span',null,String(l[0])));
      r.appendChild(el('span',l[0]===a.line?'fs2-err':null,l[1]));
      if(l[0]===a.line){r.classList.add('fs2-hit');r.tabIndex=-1;hit=r}lg.appendChild(r)});
    parent.appendChild(lg);
    j.addEventListener('click',function(){
      lg.hidden=false;wrap.style.height='';
      requestAnimationFrame(function(){lg.classList.add('fs2-in');hit.focus({preventScroll:true});
        hit.scrollIntoView({block:'nearest',behavior:reduce()?'auto':'smooth'})})});
    hit.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();lg.classList.remove('fs2-in');lg.hidden=true;j.focus()}});
  }
  function body(){
    var b=el('div','fs2-body'),s=S[sel],st=status(sel);
    if(st==='failed')failBlock(s.attempts[0],b);
    else if(st==='recovered'){
      b.appendChild(el('p',null,'Passed on attempt 2 · '+s.attempts[1].dur));
      b.appendChild(el('p','fs2-sub','Attempt 1'));failBlock(s.attempts[0],b)}
    else if(st==='passed')b.appendChild(el('p',null,'Passed in '+s.dur));
    else{b.appendChild(el('p',null,'Did not run'));
      b.appendChild(el('p','fs2-mu',status(s.needs)==='recovered'?'Queued after '+nameOf(s.needs):'Skipped because '+nameOf(s.needs)+' failed'))}
    return b}
  function meta(){var s=S[sel],st=status(sel);
    return st==='failed'?'exit 1 · '+s.attempts[0].failed+' failed':st==='recovered'?'attempt 2':st==='passed'?s.dur:'did not run'}
  function renderSteps(){
    while(steps.firstChild)steps.removeChild(steps.firstChild);
    order.forEach(function(id){var b=el('button','fs2-seg');b.type='button';b.setAttribute('role','radio');
      b.setAttribute('aria-checked',String(id===sel));b.tabIndex=id===sel?0:-1;b.dataset.id=id;
      b.appendChild(glyph(status(id)));b.appendChild(el('span',null,nameOf(id)));
      b.addEventListener('click',function(){pick(id,false)});steps.appendChild(b)})}
  function renderCard(){
    var st=status(sel);
    while(card.firstChild)card.removeChild(card.firstChild);
    card.className='fs2-card'+(st==='failed'?' fs2-fail':'')+(open?'':' fs2-closed');
    head=el('button','fs2-head');head.type='button';head.id='fs2-head';
    head.setAttribute('aria-expanded',String(open));head.setAttribute('aria-controls','fs2-region');
    head.appendChild(glyph(st));head.appendChild(el('span','fs2-name',nameOf(sel)));
    head.appendChild(el('span','fs2-word',word(st)));head.appendChild(el('span','fs2-meta',meta()));
    head.appendChild(el('span','fs2-chev'));
    head.addEventListener('click',toggle);
    wrap=el('div','fs2-wrap');wrap.id='fs2-region';wrap.setAttribute('role','region');
    wrap.setAttribute('aria-labelledby','fs2-head');wrap.appendChild(body());
    if(!open){wrap.hidden=true;wrap.style.height='0px'}
    card.appendChild(head);card.appendChild(wrap);anim=null;
    demo.textContent=S['test-api'].attempts.length>1?'Reset to attempt 1':'Demo: pass attempt 2'}
  function pick(id,focus){sel=id;open=true;renderSteps();renderCard();
    if(focus)steps.querySelector('[data-id="'+id+'"]').focus()}
  function dur(){var v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pack-motion-duration'));return v>0?v:180}
  function toggle(){
    open=!open;head.setAttribute('aria-expanded',String(open));card.classList.toggle('fs2-closed',!open);
    var from=wrap.hidden?0:wrap.offsetHeight;wrap.hidden=false;
    var to=open?wrap.scrollHeight:0;
    anim={from:from,to:to,t0:0,d:dur()};kick()}
  function step(now){
    if(!anim)return false;if(!anim.t0)anim.t0=now;
    var k=Math.min(1,(now-anim.t0)/anim.d),e=1-Math.pow(1-k,3);
    wrap.style.height=(anim.from+(anim.to-anim.from)*e)+'px';
    if(k>=1){snapToTarget();return false}return true}
  function snapToTarget(){if(!anim)return;anim=null;
    if(open)wrap.style.height='';else{wrap.style.height='0px';wrap.hidden=true}}
  function frame(now){var moving=reduce()?(snapToTarget(),false):step(now);raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0;snapToTarget()}else kick()});
  steps.addEventListener('keydown',function(e){
    var i=order.indexOf(sel),n=order.length,k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown')i=(i+1)%n;else if(k==='ArrowLeft'||k==='ArrowUp')i=(i+n-1)%n;
    else if(k==='Home')i=0;else if(k==='End')i=n-1;else return;
    e.preventDefault();pick(order[i],true)});
  card.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&open){e.preventDefault();toggle();head.focus()}});
  demo.addEventListener('click',function(){
    var a=S['test-api'].attempts;
    if(a.length>1)a.pop();else a.push({pass:true,dur:'34 s'});
    pick('test-api',false);demo.focus()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});
  renderSteps();renderCard();
})();</script>
