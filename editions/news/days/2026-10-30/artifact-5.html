<style>

<script>(function(){

var IC={copy:'M5 5h8v8H5zM3 11V3h8',copying:'M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2',copied:'M3 8.5l3 3 7-7',retry:'M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3'};

var lbls=el('span','cb5-lbls'),L={};Object.keys(LB).forEach(function(k){L[k]=el('span','cb5-l',LB[k]);lbls.append(L[k])});
