    if(i>-1&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();nBtns[(i+(e.key==='ArrowRight'?1:2))%3].focus()}});
  deny.addEventListener('change',function(){S.denyClipboard=deny.checked;render()});

  /* link field and embed block: select all, manual copy counts as success */
  [linkIn,embedTa].forEach(function(el){var just=false;
    el.addEventListener('focus',function(){el.select();just=true});
    el.addEventListener('click',function(){if(just){just=false;el.select()}});
    el.addEventListener('blur',function(){just=false});
    el.addEventListener('copy',function(){resetCopy();var my=tok;succeed(my);render()});
  });
  linkIn.addEventListener('scroll',fade);
  linkIn.addEventListener('keyup',fade);
  function showEnd(){if(S.format==='link'){linkIn.scrollLeft=linkIn.scrollWidth;fade()}}

  /* format tabs */
  function selectFormat(f){if(S.format===f)return;S.format=f;resetCopy();render()}
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){selectFormat(t.dataset.f)});
    t.addEventListener('keydown',function(e){
      var n=e.key==='ArrowRight'||e.key==='ArrowLeft'?(i+1)%2:e.key==='Home'?0:e.key==='End'?1:-1;
      if(n<0)return;e.preventDefault();selectFormat(tabs[n].dataset.f);tabs[n].focus();
    });
  });

  /* start time */
  startCb.addEventListener('change',function(){S.startOn=startCb.checked;resetCopy();render();showEnd()});
  range.addEventListener('input',function(){S.startSec=+range.value;resetCopy();render();showEnd()});
  range.addEventListener('keydown',function(e){var v=S.startSec;
    if(e.key==='PageUp')v=Math.min(S.clip.duration,v+10);else if(e.key==='PageDown')v=Math.max(0,v-10);else return;
    e.preventDefault();S.startSec=v;resetCopy();render();showEnd()});

  /* preview: 12 sampled frames, crossfade between them */
  var ctx=cv.getContext('2d'),snap=document.createElement('canvas'),sctx=snap.getContext('2d'),FR=12,cur=-1,fa=1,ft0=0;
  function idx(s){return Math.round(s/S.clip.duration*(FR-1))}
  function col(n){return getComputedStyle(document.documentElement).getPropertyValue('--pack-'+n).trim()||'#888'}
  function paint(c,i,W,H){
    var t=i/(FR-1),tide=Math.sin(Math.PI*t),k,y;
    c.globalAlpha=1;c.fillStyle=col('surface');c.fillRect(0,0,W,H);
    c.fillStyle=col('muted');c.beginPath();c.arc(W*(.15+.7*t),H*(.5-.28*tide),Math.max(4,H*.08),0,Math.PI*2);c.fill();
    c.fillStyle=col('border');c.fillRect(W*.5,H*.4,W*.45,Math.max(2,H*.03));
    for(k=0;k<5;k++)c.fillRect(W*(.53+k*.1),H*.4,Math.max(2,W*.012),H*.6);
    y=H*(.88-.4*tide);
    c.globalAlpha=.85;c.fillStyle=col('accent');c.fillRect(0,y,W,H-y);
    c.globalAlpha=.5;c.fillStyle=col('surface');
    for(k=0;k<4;k++)c.fillRect(W*(.08+k*.22+(i%2)*.04),y+H*(.05+(k%2)*.06),W*.08,Math.max(1,H*.012));
    c.globalAlpha=1;c.fillStyle=col('text');c.font=Math.round(H*.13)+'px '+col('typography-family');
    c.fillText('Frame '+(i+1)+' of '+FR,Math.round(H*.08),Math.round(H*.2));
  }
  function drawPrev(){var W=cv.width,H=cv.height;if(!W||!H||cur<0)return;
    paint(ctx,cur,W,H);
    if(fa<1){ctx.globalAlpha=Math.pow(1-fa,2);ctx.drawImage(snap,0,0);ctx.globalAlpha=1}}
  function fadeTo(i){if(i===cur)return;
    if(cur>=0&&cv.width>1&&S.open&&!reduce()){sctx.clearRect(0,0,snap.width,snap.height);sctx.drawImage(cv,0,0);fa=0;ft0=0}else fa=1;
    cur=i;drawPrev();if(fa<1)kick()}
  if(window.ResizeObserver){
    new ResizeObserver(function(){var b=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
      if(!b.width)return;cv.width=snap.width=Math.max(1,Math.round(b.width*d));cv.height=snap.height=Math.max(1,Math.round(b.height*d));
      fa=1;drawPrev()}).observe(cv.parentNode);
    new ResizeObserver(fade).observe(wrap);
  }

  /* sheet motion */
  var raf=0,last=0,mode='closed',y=0,v=0,H=1,anim=null,how='';
  function tween(to,d,then){anim={k:'t',a:y,b:to,t:0,d:d,then:then};kick()}
  function done(){var a=anim;anim=null;if(a&&a.then)a.then()}
  function step(dt){
    if(anim.k==='t'){anim.t+=dt;var p=Math.min(1,anim.t/anim.d),e=1-Math.pow(1-p,3);
      y=anim.a+(anim.b-anim.a)*e;if(p>=1){done();return false}return true}
    var k=520,c=2*.72*Math.sqrt(k),n=Math.ceil(dt/4),h=dt/1000/n;
    for(var i=0;i<n;i++){v+=(-k*y-c*v)*h;y+=v*h}
    if(Math.abs(y)<.5&&Math.abs(v)<8){y=0;v=0;done();return false}
    return true;
  }
  function snapToTarget(){y=anim.k==='t'?anim.b:0;v=0;done()}
  function drawSheet(){
    if(mode==='closed'){scrim.style.opacity=0;return}
    var yy=Math.max(-4,y);
    sheet.style.transform='translateY('+yy.toFixed(2)+'px)';
    scrim.style.opacity=(Math.max(0,Math.min(1,1-yy/H))*.7).toFixed(3);
  }
  function drawBar(now){var p=S.copyStatus==='copied'&&!reduce()?Math.max(0,1-(now-S.copiedAt)/2000):0;
    cbar.style.transform='scaleX('+p.toFixed(4)+')';return p>0}
  function frame(now){
    var dt=last?Math.min(now-last,50):16.7,more=false;last=now;
    if(anim){if(reduce())snapToTarget();else more=step(dt);drawSheet()}
    if(anim)more=true;
    if(fa<1){if(reduce())fa=1;else{if(!ft0)ft0=now;fa=Math.min(1,(now-ft0)/dur())}drawPrev();if(fa<1)more=true}
    if(drawBar(now))more=true;
    raf=more?requestAnimationFrame(frame):0;
  }
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});

  /* open, and the one close routine for swipe, Close and Esc */
  function openSheet(){
    if(mode!=='closed')return;
    resetCopy();S.open=true;
    sheet.showModal();body.scrollTop=0;
    H=sheet.offsetHeight||1;y=H;v=0;mode='opening';drawSheet();
    copyB.focus({preventScroll:true});
    render();
    tween(0,dur()+40,function(){mode='open'});
  }
  function closeSheet(w,vel){
    if(mode==='closed'||mode==='closing')return;
    how=w;resetCopy();render();mode='closing';
    var d=dur();if(vel>0)d=Math.max(120,Math.min(d,(H-y)/vel));
    tween(H,d,finish);
  }
  function finish(){
    mode='closed';anim=null;y=H;v=0;
    if(sheet.open)sheet.close();
    S.open=false;S.note='Closed by '+how+'. Focus is back on Share.';
    render();drawSheet();share.focus();
  }
  share.addEventListener('click',openSheet);
  closeB.addEventListener('click',function(){closeSheet('the Close button')});
  sheet.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();closeSheet('Esc')}});
  sheet.addEventListener('cancel',function(e){e.preventDefault();closeSheet('Esc')});
  sheet.addEventListener('close',function(){if(mode!=='closed'){if(mode!=='closing')how='Esc';resetCopy();finish()}});

  /* drag on the handle strip */
  var pid=null,sy=0,so=0,ly=0,lt=0;
  grab.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')||mode==='closed'||mode==='closing'||pid!==null)return;
    pid=e.pointerId;grab.setPointerCapture(pid);anim=null;mode='dragging';
    H=sheet.offsetHeight||1;sy=e.clientY;so=Math.max(0,y);ly=so;lt=e.timeStamp;v=0;
  });
  grab.addEventListener('pointermove',function(e){
    if(e.pointerId!==pid||mode!=='dragging')return;
    y=Math.max(0,so+e.clientY-sy);
    var dt=e.timeStamp-lt;if(dt>0){v=v*.5+((y-ly)/dt)*.5;ly=y;lt=e.timeStamp}
    drawSheet();
  });
  function up(e){
    if(e.pointerId!==pid)return;pid=null;
    if(mode!=='dragging')return;
    var vm=e.timeStamp-lt>100?0:v;
    if(y>.3*H||vm>.5)closeSheet('swipe',vm);
    else{mode='spring';v=vm*1000;anim={k:'s',then:function(){mode='open'}};kick()}
  }
  grab.addEventListener('pointerup',up);
  grab.addEventListener('pointercancel',up);
  addEventListener('resize',function(){if(mode!=='closed'){H=sheet.offsetHeight||1;if(mode==='open')y=0;drawSheet();fade()}});

  rq.addEventListener&&rq.addEventListener('change',function(){fa=1;drawPrev();kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);fa=1;drawPrev();drawSheet()}});
  render();drawSheet();
})();</script>
</body></html>
