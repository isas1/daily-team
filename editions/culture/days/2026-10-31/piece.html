nextSel.addEventListener('change',function(){ui.next=nextSel.value});
resetB.addEventListener('click',function(){if(state.run.phase==='retrying')return;state.run=fresh();snap=null;ui.att=0;logFor=null;ui.preview=null;
 if(ui.opened!==FID)openTile(FID,false);else render();focusCell(FID);announce('Demo reset')});
root.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var t=e.target;
 if(state.run.phase==='retrying'){e.preventDefault();cancel();return}
 if(t.dataset&&t.dataset.id&&grid.contains(t)){e.preventDefault();
  if(ui.opened)closeTile();else{roveSeg(ui.lastSeg);segs[ui.lastSeg].focus();say('Back on the '+S[ui.lastSeg]+' stage. Arrows pick a stage.')}return}
 if(ui.opened&&ins.contains(t)){e.preventDefault();closeTile()}});

/* frame loop: rotate, inset height, log scroll, retry clock, running arc */
var raf=0,last=0,ang=0;
function busy(){return A.flip||A.ins||A.sc||state.run.phase==='retrying'}
function frame(now){var dt=last?Math.min(now-last,50):16.7,rm=reduce();last=now;raf=0;
 if(state.run.phase==='retrying')tickRetry(dt);
 if(A.flip){A.flip.t+=rm?1e4:dt;drawFlip()}
 if(A.ins){if(rm)A.ins.t=A.ins.d;stepIns(rm?0:dt)}
 if(A.sc){if(rm)snapSc();else stepSc(dt/1000)}
 if(!rm)ang=(ang+dt*.36)%360;
 var arcs=root.querySelectorAll('.bt-arc');for(var i=0;i<arcs.length;i++)arcs[i].setAttribute('transform','rotate('+(rm?0:ang.toFixed(1))+' 10 10)');
 if(busy())raf=requestAnimationFrame(frame)}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){cancelAnimationFrame(raf);raf=0;
  if(A.flip){A.flip.t=1e4;drawFlip()}if(A.ins)endIns();snapSc()}
 else kick()});
window.addEventListener('message',function(e){var m=e.data;
 if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))document.documentElement.setAttribute('data-theme',m.theme)});
new ResizeObserver(function(){var n=root.getBoundingClientRect().width<480;
 if(n!==ui.narrow){ui.narrow=n;root.classList.toggle('bt-narrow',n);layout();render()}else{placeBorder();placeNotch()}}).observe(root);

ui.narrow=root.getBoundingClientRect().width<480;root.classList.toggle('bt-narrow',ui.narrow);
ins.style.height='auto';layout();render();focusCell(FID,true);
})();</script>
</body></html>
