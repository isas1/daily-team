<style>

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:16px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:8px;--pack-motion-duration:200ms;--pack-motion-easing:ease-out;--pack-bg:#121416;--pack-surface:#1b1f23;--pack-text:#e9ecef;--pack-muted:#9aa3ab;--pack-accent:#7ea6d8;--pack-border:#2c3238}:root[data-theme="light"]{--pack-bg:#f6f7f8;--pack-surface:#ffffff;--pack-text:#16191c;--pack-muted:#5b6570;--pack-accent:#2f5f9e;--pack-border:#d6dbe0}</style></head><body>
<main class="cr5-root" role="group" aria-label="Copy repair notice for a share link">
<p class="cr5-file"><b>cat-pics-2.mp4</b><span>Forever plan · starts 0:42</span></p>
<label class="cr5-lab" for="cr5-link">Share link</label>
<textarea id="cr5-link" class="cr5-link" rows="2" readonly spellcheck="false">https://forever.example/c/cat-pics-2?t=42&amp;exp=7d</textarea>
<div class="cr5-row"><button id="cr5-copy" class="cr5-btn" type="button">Copy link</button><label class="cr5-chk"><input id="cr5-block" type="checkbox" checked>Block clipboard</label></div>
<section id="cr5-note" class="cr5-note">

<p id="cr5-hint" class="cr5-sub" hidden>Link selected. Press Ctrl+C, ⌘C, or tap Copy.</p>
</section></main>
<script>(function(){
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var raf=0,last=0,p=0,target=0,lt=0;
var q=function(i){return document.getElementById('cr5-'+i)};
var root=document.querySelector('.cr5-root'),ta=q('link'),copyB=q('copy'),block=q('block'),note=q('note'),
alertP=q('alert'),liveP=q('live'),sub=q('sub'),acts=q('acts'),retry=q('retry'),sel=q('sel'),dis=q('dis'),hint=q('hint'),st=q('st');
var S={phase:'failed',fails:1,why:'clipboard blocked',at:new Date(Date.now()-6e4),fix:null,how:'',hint:false,pending:false,tok:0};
function fmt(d){return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function ord(n){var s=n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th';return n+s}
function open(){return S.phase==='failed'||S.phase==='retrying'}
function render(){
  var f=open(),two=S.fails>1;
  note.classList.toggle('cr5-fail',f);
  alertP.textContent=f?(two?ord(S.fails)+' attempt failed · ':"Couldn't copy · ")+S.why:'';
  liveP.textContent=S.phase==='repaired'?'Copy failed '+fmt(S.at)+' · repaired by '+S.how+' '+fmt(S.fix):S.phase==='dismissed'?'Dismissed · logged as failed':'';
  sub.textContent=f?'Copy failed '+fmt(S.at):S.phase==='dismissed'?'Copy link to try again':'';
  acts.hidden=!f;
  retry.disabled=S.pending;
  retry.textContent=S.phase==='retrying'?'Retrying':'Retry';
  if(two&&acts.firstElementChild!==sel)acts.insertBefore(sel,retry);
  if(!two&&acts.firstElementChild!==retry)acts.insertBefore(retry,sel);
  sel.classList.toggle('cr5-pri',two);retry.classList.toggle('cr5-pri',!two);
  hint.hidden=!(f&&S.hint);
  copyB.disabled=S.pending;
}
function attempt(){return new Promise(function(res,rej){
  if(block.checked){setTimeout(function(){rej('clipboard blocked')},450);return}
  var t=setTimeout(function(){rej("clipboard didn't answer")},3000);
  var w=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject();
  w.then(function(){clearTimeout(t);setTimeout(res,300)},function(){clearTimeout(t);rej('clipboard blocked')});
})}
function done(){S.pending=false;copyB.textContent='Copy link'}
function keepFocus(){if(acts.contains(document.activeElement))copyB.focus()}
function repair(how){S.tok++;done();S.phase='repaired';S.how=how;S.fix=new Date();S.hint=false;
  p=0;target=1;render();keepFocus();draw();kick()}
function run(isRetry){
  if(S.pending)return;
  S.pending=true;var tk=++S.tok;clearTimeout(lt);
  if(isRetry)S.phase='retrying';else copyB.textContent='Copying';
  render();
  attempt().then(function(){if(tk!==S.tok)return;done();
    copyB.textContent='Copied';lt=setTimeout(function(){if(!S.pending)copyB.textContent='Copy link'},1600);
    if(open())repair('retry');else render()},
  function(w){if(tk!==S.tok)return;done();S.why=w;
    if(open())S.fails++;else{S.fails=1;S.at=new Date()}
    S.phase='failed';S.hint=false;p=target=0;draw();render()});
}
function dismiss(){S.tok++;done();S.phase='dismissed';S.hint=false;keepFocus();render()}
copyB.addEventListener('click',function(){run(false)});
retry.addEventListener('click',function(){run(true)});
dis.addEventListener('click',dismiss);
sel.addEventListener('click',function(){ta.focus();ta.setSelectionRange(0,ta.value.length);S.hint=true;render()});
ta.addEventListener('focus',function(){ta.setSelectionRange(0,ta.value.length)});
ta.addEventListener('copy',function(){if(ta.selectionEnd>ta.selectionStart&&open())repair('hand')});
root.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&open()){e.preventDefault();dismiss();return}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&acts.contains(e.target)){
    var b=[].filter.call(acts.children,function(n){return!n.disabled}),i=b.indexOf(e.target);
    if(i<0)return;e.preventDefault();b[(i+(e.key==='ArrowRight'?1:b.length-1))%b.length].focus()}
});
function step(dt){if(p>=target){p=target;return false}p=Math.min(target,p+dt*16.667/240);return p<target}
function draw(){var e=1-Math.pow(1-p,3);st.style.transform='scaleX('+e+')'}
function snapToTarget(){p=target}
function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
  var moving=reduce()?(snapToTarget(),false):step(dt);draw();
  raf=moving?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
    document.documentElement.setAttribute('data-theme',m.theme);draw()}});
render();draw();
})();</script>
