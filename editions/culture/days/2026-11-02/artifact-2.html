<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--pack-bg);color:var(--pack-text);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size)}
.ab2-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--pack-spacing-gap);padding:clamp(10px,4%,var(--pack-spacing-padding));background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:calc(var(--pack-radii-control)*2);overflow:auto;container-type:inline-size}
.ab2-hd{display:flex;flex-direction:column;gap:2px}
.ab2-t{margin:0;font-size:1em;font-weight:600}
.ab2-hint{margin:0;font-size:.82em;color:var(--pack-muted);line-height:1.35}
.ab2-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ab2-rule{min-height:44px;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);background:transparent;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;transition:transform 80ms var(--pack-motion-easing),border-color var(--pack-motion-duration) var(--pack-motion-easing),box-shadow var(--pack-motion-duration) var(--pack-motion-easing)}
.ab2-rule:not(:disabled):active{transform:scale(.97)}
@media (hover:hover){.ab2-rule:not(:disabled):hover{border-color:var(--pack-muted)}}
.ab2-rule[aria-pressed="true"]{border-color:var(--pack-accent);box-shadow:inset 0 0 0 1px var(--pack-accent)}
.ab2-rule:disabled{opacity:.5;cursor:default}
.ab2-rule:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}

.ab2-rule[aria-pressed="true"] .ab2-box{border:1.5px solid var(--pack-accent);background:var(--pack-accent)}
.ab2-rule[aria-pressed="true"] .ab2-box::after{content:"";position:absolute;left:3.5px;top:0.5px;width:3px;height:7px;border:solid var(--pack-surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ab2-txt{min-width:0}
.ab2-n{display:block;font-weight:600;font-size:.92em;line-height:1.2}
.ab2-c{display:block;font-size:.78em;color:var(--pack-muted);font-variant-numeric:tabular-nums}

@container (max-width:300px){.ab2-root>*{font-size:12px}.ab2-rule{padding:5px 7px;gap:6px}.ab2-box{width:11px;height:11px}.ab2-rule[aria-pressed="true"] .ab2-box::after{left:2.5px;top:0;width:2px;height:5px}.ab2-f{flex-wrap:wrap;gap:0 6px}}

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#121417;--pack-surface:#1b1e23;--pack-text:#e8eaed;--pack-muted:#9aa1ab;--pack-accent:#7d9be6;--pack-border:#2e333a}:root[data-theme="light"]{--pack-bg:#f6f7f8;--pack-surface:#ffffff;--pack-text:#1a1d21;--pack-muted:#5c636d;--pack-accent:#2f4fa8;--pack-border:#d9dde2}</style></head><body>
<div class="ab2-root" role="group" aria-label="Group resist rules for the spring-catalogue download">
<div class="ab2-hd"><h2 class="ab2-t">Group rules · spring-catalogue</h2>
<p class="ab2-hint">Tap a rule to leave that group out of the download. Hand masks stay as they are.</p></div>
<div class="ab2-grid" id="ab2-grid"></div>
<div class="ab2-st"><span class="ab2-s1" id="ab2-s1" role="status" aria-live="polite"></span><span class="ab2-s2" id="ab2-s2"></span></div>
<ul class="ab2-list" id="ab2-list" aria-label="Files these rules cover"></ul>
</div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var TOTAL=23,raf=0;
  var rules=[{k:'d',n:'Drafts'},{k:'f',n:'Fonts'},{k:'r',n:'Raw photos'},{k:'e',n:'Emotional baggage'}];
  var files=[['layouts/cover-v1.indd','d',1],['layouts/spread-04-draft.indd','d'],['copy/forever-plan-blurb-draft.docx','d'],['photos/cat-pics-2-draft.raw','dr'],['photos/monday-shoot-011.raw','r'],['photos/monday-shoot-012.raw','r'],['fonts/ForeverSans-Bold.otf','f'],['fonts/ForeverSans-Regular.otf','f']];
  var on={},rows=[],btns=[];
  var grid=document.getElementById('ab2-grid'),list=document.getElementById('ab2-list');
  var s1=document.getElementById('ab2-s1'),s2=document.getElementById('ab2-s2');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function cover(k){return files.filter(function(f){return f[1].indexOf(k)>=0}).length}
  function hits(f){return rules.filter(function(r){return on[r.k]&&f[1].indexOf(r.k)>=0})}
  rules.forEach(function(r){
    var n=cover(r.k),b=el('button','ab2-rule');b.type='button';
    b.setAttribute('aria-pressed','false');
    var tx=el('span','ab2-txt');tx.appendChild(el('span','ab2-n',r.n));
    tx.appendChild(el('span','ab2-c',n?n+(n===1?' file':' files'):'none in project'));
    b.appendChild(el('span','ab2-box'));b.appendChild(tx);
    if(!n)b.disabled=true;
    b.addEventListener('click',function(){toggle(r.k,b)});
    grid.appendChild(b);btns.push(b);
  });
  files.forEach(function(f){
    var li=el('li','ab2-f'),w=el('span','ab2-w');
    li.appendChild(el('span','ab2-fn',f[0]));li.appendChild(w);list.appendChild(li);
    rows.push({f:f,li:li,w:w,key:'',due:0});
  });
  function target(f){var h=hits(f),p=[];if(f[2])p.push('by hand');
    h.forEach(function(r){p.push(r.n.toLowerCase())});
    return {k:(f[2]?'h':'')+(h.length?'r':''),w:p.length?p.join(' · '):'in bundle'}}
  function apply(o){var t=target(o.f);o.key=t.k;o.due=0;
    o.li.classList.toggle('ab2-rm',t.k.indexOf('r')>=0);
    o.li.classList.toggle('ab2-hm',t.k.indexOf('h')>=0);o.w.textContent=t.w}
  function status(){
    var m=0,ov=0,out=0;
    files.forEach(function(f){var h=hits(f).length;if(h)m++;if(h>1)ov++;if(h||f[2])out++});
    s1.textContent=m?'Masking '+m+(m===1?' file':' files')+(ov?' · '+ov+' in two rules':''):'No rules on';
    s2.textContent='Bundle '+(TOTAL-out)+' of '+TOTAL+' · 1 hand mask untouched';
  }
  function schedule(){
    var now=performance.now(),i=0;
    rows.forEach(function(o){var t=target(o.f);
      if(t.k===o.key&&o.w.textContent===t.w){o.due=0;return}
      if(!o.due)o.due=now+i*35;i++});
    kick();
  }
  function frame(now){
    var pending=false,rm=reduce();
    rows.forEach(function(o){if(!o.due)return;if(rm||now>=o.due)apply(o);else pending=true});
    raf=pending?requestAnimationFrame(frame):0;
  }
  function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}
  function toggle(k,b){on[k]=!on[k];b.setAttribute('aria-pressed',String(!!on[k]));status();schedule()}
  grid.addEventListener('keydown',function(e){
    var live=btns.filter(function(b){return !b.disabled}),i=live.indexOf(document.activeElement);
    if(i<0)return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();live[(i+1)%live.length].focus()}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();live[(i-1+live.length)%live.length].focus()}
    else if(e.key==='Home'){e.preventDefault();live[0].focus()}
    else if(e.key==='End'){e.preventDefault();live[live.length-1].focus()}
    else if(e.key==='Escape'){var b=live[i],r=rules[btns.indexOf(b)];if(on[r.k]){e.preventDefault();toggle(r.k,b)}}
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});
  rows.forEach(apply);status();
})();</script>
</body></html>
