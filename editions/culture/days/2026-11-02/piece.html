var DUR=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pack-motion-duration'))||180;
var PACK_MS=60;

/* shared sample data: 23 files, 41.2 MB, sizes in tenths of a MB */
var D=[['layouts',[['cover-final.indd',62],['cover-v1.indd',31,'d'],['catalogue-spread-monday.indd',41],['back-cover.indd',19],['cover-v1-client-revision-final.indd',24,'d']]],
['images',[['hero-forever.jpg',58],['cat-pics-2.jpg',14],['product-row-01.jpg',12],['product-row-02.jpg',11],['swatch-sheet.png',9],['team-photo-monday.jpg',13],['logo-forever.svg',2]]],
['fonts',[['ForeverSans-Regular.otf',4,'f'],['ForeverSans-Bold.otf',4,'f']]],
['copy',[['headlines.docx',3],['prices.xlsx',2],['legal-notes.txt',1],['emotional-baggage-draft.docx',4,'d'],['captions.docx',2]]],
['exports',[['print-ready.pdf',53],['web-preview.pdf',24],['proof-01.pdf',7,'d'],['contact-sheet.pdf',12]]]];
var RULES=[{k:'d',n:'Drafts'},{k:'f',n:'Fonts'},{k:'r',n:'Raw photos'}];
var FOLDERS=[],FILES=[],BY={};
D.forEach(function(g){var fo={name:g[0],open:g[0]!=='images',kids:[]};FOLDERS.push(fo);
  g[1].forEach(function(x){var f={name:x[0],s:x[1],t:x[2]||'',id:g[0]+'/'+x[0],fo:fo};fo.kids.push(f);FILES.push(f);BY[f.id]=f})});
var TOTAL=FILES.length;

/* one store */
var S={hand:new Set(),rules:{},exc:new Set(),bundle:null,mode:'ready',prep:[],packed:0,acc:0,willFail:false,flash:0,msg:'',reveal:0,pvOpen:false,chgOpen:false,prev:null,ut:0};
function hits(f){return RULES.filter(function(r){return S.rules[r.k]&&f.t.indexOf(r.k)>=0})}
function names(h){return h.map(function(r){return r.n}).join(' · ')}
function inc(f){return !S.hand.has(f.id)&&!(hits(f).length&&!S.exc.has(f.id))}
function current(){return FILES.filter(inc)}
function word(f){var h=hits(f);if(S.hand.has(f.id))return 'masked by hand';if(!h.length)return '';return S.exc.has(f.id)?'kept despite '+names(h):'masked by '+names(h)}
function flip(f){if(inc(f)){if(hits(f).length&&S.exc.has(f.id))S.exc.delete(f.id);else S.hand.add(f.id)}
  else{S.hand.delete(f.id);if(hits(f).length)S.exc.add(f.id)}}
function snap(){return {hand:Array.from(S.hand),rules:Object.assign({},S.rules),exc:Array.from(S.exc)}}
function applySnap(s){S.hand=new Set(s.hand);S.rules=Object.assign({},s.rules);S.exc=new Set(s.exc)}
function hash(ids){var s=ids.slice().sort().join('|'),h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return ('0000'+h.toString(16)).slice(-4)}
function diff(a,b){return {add:b.filter(function(x){return a.indexOf(x)<0}),rem:a.filter(function(x){return b.indexOf(x)<0})}}
var live=$('live'),sayT=0;
function say(t){clearTimeout(sayT);live.textContent='';sayT=setTimeout(function(){live.textContent=t},40)}
function locked(){if(S.mode==='prep'){say('Masks are locked while preparing. Press Escape or Stop to stop.');return true}return false}
function changed(){if(S.mode==='failed')S.mode='ready';if(S.mode!=='done')S.msg='';render()}

/* row 1: tree */
var tree=$('tree'),rows=[],cur=null;
function trow(o,lv,pos,n){var e=el('div','re-row'+(lv===1?' re-fo':''),null,tree);
  e.setAttribute('role','treeitem');e.setAttribute('aria-level',lv);e.setAttribute('aria-posinset',pos);e.setAttribute('aria-setsize',n);
  e.tabIndex=-1;e.style.setProperty('--l',lv-1);
  el('span','re-tw',null,e).setAttribute('aria-hidden','true');
  o.box=el('span','re-box',null,e);o.box.setAttribute('aria-hidden','true');
  var t=el('span','re-txt',null,e);el('span','re-nm',lv===1?o.name+'/':o.name,t);
  o.why=el('span','re-why',null,t);o.szE=el('span','re-sz',null,e);
  e._o=o;rows.push(e);o.el=e;return e}
FOLDERS.forEach(function(fo,gi){trow(fo,1,gi+1,FOLDERS.length);fo.kids.forEach(function(f,i){trow(f,2,i+1,fo.kids.length)})});
function setCur(e,f){if(cur)cur.tabIndex=-1;cur=e;e.tabIndex=0;if(f)e.focus()}
function pop(o){o.box.classList.remove('re-pop');void o.box.offsetWidth;o.box.classList.add('re-pop')}
function setOpen(fo,v){fo.open=v;render()}
function act(o){if(locked())return;
  if(o.kids){var all=o.kids.every(inc);o.kids.forEach(function(f){if(inc(f)===all)flip(f)})}else flip(o);
  changed();pop(o);var n=current().length;
  say(o.kids?o.name+': '+o.why.textContent+'. '+n+' of '+TOTAL+' in bundle.':o.name+' '+(word(o)||'included')+'. '+n+' of '+TOTAL+' in bundle.')}
tree.addEventListener('click',function(e){var r=e.target.closest('.re-row');if(!r)return;var o=r._o;setCur(r,true);
  if(o.kids&&!e.target.closest('.re-box'))setOpen(o,!o.open);else act(o)});
tree.addEventListener('keydown',function(e){if(!cur)return;
  var vis=rows.filter(function(r){return !r.hidden}),i=vis.indexOf(cur),o=cur._o,fo=o.kids?o:null,k=e.key,to=null;
  if(k==='ArrowDown')to=vis[i+1]||cur;
  else if(k==='ArrowUp')to=vis[i-1]||cur;
  else if(k==='Home')to=vis[0];
  else if(k==='End')to=vis[vis.length-1];
  else if(k==='ArrowRight'){if(fo&&!fo.open)setOpen(fo,true);else if(fo)to=vis[i+1]}
  else if(k==='ArrowLeft'){if(fo&&fo.open)setOpen(fo,false);else if(!fo)to=o.fo.el}
  else if(k==='Escape'){if(S.mode==='prep')return;if(fo&&fo.open)setOpen(fo,false);else if(!fo){setCur(o.fo.el,true);setOpen(o.fo,false)}else return}
  else if(k===' '||k==='Spacebar')act(o);
  else if(k==='Enter'){if(fo)setOpen(fo,!fo.open);else act(o)}
  else return;
  e.preventDefault();if(to)setCur(to,true)});

/* row 2: rules */
var grid=$('grid'),rb={};
RULES.forEach(function(r){r.count=FILES.filter(function(f){return f.t.indexOf(r.k)>=0}).length;
  var b=el('button','re-rule',null,grid);b.type='button';b.setAttribute('aria-pressed','false');
  el('span','re-rbox',null,b).setAttribute('aria-hidden','true');
  var tx=el('span','re-rtx',null,b);el('span','re-rn',r.n,tx);el('span','re-rc',r.count?nf(r.count):'none in project',tx);
  if(!r.count)b.disabled=true;
  b.addEventListener('click',function(){toggleRule(r)});rb[r.k]=b});
function toggleRule(r){if(!r.count||locked())return;S.rules[r.k]=!S.rules[r.k];changed();
  var m=FILES.filter(function(f){return f.t.indexOf(r.k)>=0&&!inc(f)}).length;
  say(r.n+' rule '+(S.rules[r.k]?'on, masking '+nf(m):'off')+'. '+current().length+' of '+TOTAL+' in bundle.')}
grid.addEventListener('keydown',function(e){var lv=RULES.map(function(r){return rb[r.k]}).filter(function(b){return !b.disabled}),i=lv.indexOf(document.activeElement),j=-1;
  if(i<0)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')j=(i+1)%lv.length;
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=(i-1+lv.length)%lv.length;
  else if(e.key==='Home')j=0;else if(e.key==='End')j=lv.length-1;
  if(j>-1){e.preventDefault();lv[j].focus()}});

/* samples and demo controls */
[].forEach.call(document.querySelectorAll('.re-sam'),function(b){b.addEventListener('click',function(){
  if(locked())return;var s=b.dataset.s;S.hand=new Set();S.exc=new Set();S.rules={};
  if(s==='handoff'){S.rules.d=true;S.rules.f=true}else if(s==='empty')FILES.forEach(function(f){S.hand.add(f.id)});
  changed();var n=current().length;say('Sample '+b.textContent+' loaded. '+n+' of '+TOTAL+' in bundle.')})});
var frameEl=$('frame'),ph=$('ph'),failCb=$('fail');
ph.addEventListener('click',function(){var p=ph.getAttribute('aria-pressed')!=='true';ph.setAttribute('aria-pressed',String(p));frameEl.classList.toggle('re-phone',p)});

/* row 3: preview */
var plist=$('plist'),pItems=[],rt=0,tog=$('tog'),dis=$('dis'),pl=$('pl');
var pEmpty=el('li','re-pempty',null,plist);el('div',null,'No files to download',pEmpty);
FOLDERS.forEach(function(fo){var li=el('li','re-pdir',null,plist);fo.pv={li:li,inn:el('div',null,fo.name+'/',li),x:false};pItems.push(fo.pv);
  fo.kids.forEach(function(f){var li=el('li','re-prow',null,plist),r=el('div','re-pin',null,li);
    el('span','re-pnm',f.name,r);el('span','re-psz',mb(f.s),r);f.pv={li:li,inn:r,w:el('span','re-pwhy',null,r),x:false};pItems.push(f.pv)})});
function drawPv(){var e=1-Math.pow(1-rt,3),xs=[];
  pItems.forEach(function(p){var s=p.li.style;if(!p.x){s.display='';s.height='';s.opacity='';return}
    xs.push(p);s.display=rt>0?'':'none';if(rt>=1||rt<=0){s.height='';s.opacity=''}});
  if(rt>0&&rt<1){var h=xs.map(function(p){return p.inn.offsetHeight});xs.forEach(function(p,i){p.li.style.height=h[i]*e+'px';p.li.style.opacity=e})}}
function setReveal(v){if(v&&current().length===TOTAL)return;S.reveal=v;render();kick()}
tog.addEventListener('click',function(){setReveal(S.reveal?0:1)});
dis.addEventListener('click',function(){S.pvOpen=!S.pvOpen;render()});
function narrow(){return getComputedStyle(dis).display!=='none'}

/* row 5: button */
var go=$('go'),stack=$('stack'),ticks=$('ticks'),note=$('note'),stopB=$('stop');
var K=['idle','prep','done','same','chg','fail','empty'],L={};
K.forEach(function(k){L[k]=el('span',null,null,stack)});
function save(blob,id){var u=URL.createObjectURL(blob),a=el('a');a.href=u;a.download='spring-catalogue-'+id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function press(){if(go.getAttribute('aria-disabled')==='true'||S.mode==='prep'||S.mode==='done')return;
  var ids=current().map(function(f){return f.id});if(!ids.length)return;
  var k=hash(ids),b=S.bundle;S.msg='';
  if(b&&b.id===k&&b.blob){
    try{save(b.blob,k)}catch(e){S.mode='failed';S.msg='Not saved. The browser blocked the file.';say(S.msg);render();return}
    S.mode='done';S.flash=1200;S.msg='Saved cached bundle '+k+' again. No repacking.';say('Downloaded again · same bundle '+k)}
  else{S.prep=ids;S.packed=0;S.acc=0;S.willFail=failCb.checked;S.mode='prep';
    while(ticks.firstChild)ticks.removeChild(ticks.firstChild);
    ids.forEach(function(){el('i',null,null,ticks)});say('Preparing '+nf(ids.length))}
  render();kick()}
function stop(){if(S.mode!=='prep')return;S.mode='ready';S.msg='Stopped at '+S.packed+' of '+S.prep.length+'. Nothing saved.';say(S.msg);render();go.focus()}
function failRun(){var N=S.prep.length;S.mode='failed';failCb.checked=false;S.msg='Demo failure at '+(S.packed+1)+' of '+N+'. Nothing saved.';say('Not prepared. '+S.msg)}
function finish(){var ids=S.prep,id=hash(ids),d=new Date(),sz=0,sn=snap(),bl;
  var time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  ids.forEach(function(i){sz+=BY[i].s});
  var data={project:'spring-catalogue',bundle:id,prepared:d.toISOString(),files:ids.map(function(i){return {path:i,mb:BY[i].s/10}}),totalMB:sz/10,masks:sn};
  try{bl=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});save(bl,id)}
  catch(e){S.mode='failed';S.msg='Not saved. The browser blocked the file.';say(S.msg);return}
  S.bundle={id:id,snap:sn,ids:ids.slice(),n:ids.length,sz:sz,time:time,blob:bl,told:false};
  S.mode='done';S.flash=1200;S.chgOpen=false;S.prev=null;
  S.msg='Saved spring-catalogue-'+id+'.json at '+time+'.';say('Downloaded '+nf(ids.length)+' · bundle '+id)}
go.addEventListener('click',press);
go.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter')go.classList.add('re-down')});
go.addEventListener('keyup',function(){go.classList.remove('re-down')});
go.addEventListener('blur',function(){go.classList.remove('re-down')});
stopB.addEventListener('click',stop);

/* row 6: receipt */
var rcp=$('rcp'),show=$('show'),rest=$('rest'),chg=$('chg'),undo=$('undo'),ub=$('ub'),bar=$('bar');
show.addEventListener('click',function(){S.chgOpen=!S.chgOpen;render()});
rest.addEventListener('click',function(){var b=S.bundle;if(!b||locked())return;
  S.prev=snap();applySnap(b.snap);S.ut=0;$('ut').textContent='Masks restored to '+b.id;
  changed();ub.focus();say('Masks restored to bundle '+b.id+'. Undo is available for 5 seconds.');kick()});
ub.addEventListener('click',function(){if(!S.prev)return;applySnap(S.prev);S.prev=null;changed();rest.focus();say('Restore undone.')});
function hideUndo(){var f=document.activeElement===ub;S.prev=null;S.ut=0;render();if(f)(rest.disabled?go:rest).focus()}

/* render all rows from the store */
function render(){
  var I=current(),n=I.length,sz=0,ids=[],prep=S.mode==='prep';
  I.forEach(function(f){sz+=f.s;ids.push(f.id)});
  var nres=TOTAL-n,c=nf(n)+' · '+mb(sz);
  /* row 1 */
  FILES.forEach(function(f){var i=inc(f),h=S.hand.has(f.id),r=hits(f).length>0,cl=f.el.classList;
    cl.toggle('re-out',!i);cl.toggle('re-hand',h);cl.toggle('re-rm',r&&!h&&!i);cl.toggle('re-exc',i&&r);
    f.why.textContent=word(f);f.el.setAttribute('aria-checked',String(i));f.szE.textContent=mb(f.s);
    f.el.hidden=!f.fo.open;f.el.setAttribute('aria-disabled',String(prep))});
  FOLDERS.forEach(function(fo){var k=0,z=0,t=fo.kids.length;
    fo.kids.forEach(function(f){if(inc(f)){k++;z+=f.s}});
    fo.el.setAttribute('aria-checked',k===t?'true':k?'mixed':'false');
    fo.el.setAttribute('aria-expanded',String(fo.open));fo.el.setAttribute('aria-disabled',String(prep));
    fo.why.textContent=k+' of '+t+' included';fo.szE.textContent=mb(z)});
  if(cur&&cur.hidden)setCur(cur._o.fo.el,document.activeElement===cur);
  /* row 2 */
  var m=0,ov=0;FILES.forEach(function(f){var h=hits(f).length;if(h)m++;if(h>1)ov++});
  RULES.forEach(function(r){var b=rb[r.k];b.setAttribute('aria-pressed',String(!!S.rules[r.k]));if(r.count)b.setAttribute('aria-disabled',String(prep))});
  $('rst1').textContent=m?'Masking '+nf(m)+(ov?' · '+ov+' in two rules':''):'No rules on';
  var hc=S.hand.size,ec=S.exc.size;
  $('rst2').textContent='Bundle '+n+' of '+TOTAL+' · '+hc+(hc===1?' hand mask':' hand masks')+(ec?' · '+ec+(ec===1?' exception':' exceptions'):'')+' untouched by rules';
  /* row 3 */
  $('pcount').textContent=c;$('dc').textContent=c;
  $('psub').textContent='spring-catalogue · '+(nres?nres+' of '+TOTAL+' resisted':'nothing resisted');
  FILES.forEach(function(f){var x=!inc(f),h=S.hand.has(f.id);f.pv.x=x;f.pv.li.classList.toggle('re-px',x);
    f.pv.inn.classList.toggle('re-pmh',x&&h);f.pv.inn.classList.toggle('re-pmr',x&&!h);f.pv.w.textContent=x?word(f):''});
  FOLDERS.forEach(function(fo){fo.pv.x=fo.kids.every(function(f){return !inc(f)})});
  pEmpty.hidden=n>0;
  if(!nres){S.reveal=0;rt=0}
  tog.disabled=!nres;tog.setAttribute('aria-pressed',S.reveal?'true':'false');
  $('lshow').style.visibility=nres?'':'hidden';$('lnone').style.visibility=nres?'hidden':'';$('tn').textContent=nres?nres:'';
  pl.hidden=!S.pvOpen;dis.setAttribute('aria-expanded',String(S.pvOpen));
  drawPv();
  /* row 5 */
  var b=S.bundle,k=hash(ids),dd=b?diff(b.ids,ids):{add:[],rem:[]},nc=dd.add.length+dd.rem.length,N=prep?S.prep.length:n;
  L.idle.textContent='Download '+c;
  L.prep.textContent='Preparing · '+(prep?S.packed:N)+' of '+N;
  L.done.textContent='Downloaded';L.same.textContent='Download again · same bundle';
  L.chg.textContent='Prepare new bundle · '+nc+(nc===1?' change':' changes');
  L.fail.textContent='Not prepared · Retry';L.empty.textContent='No files selected';
  var key=prep?'prep':S.mode==='done'?'done':S.mode==='failed'?'fail':!n?'empty':b?(b.id===k?'same':'chg'):'idle';
  K.forEach(function(x){L[x].classList.toggle('re-on',x===key)});
  go.setAttribute('data-k',key);go.setAttribute('aria-disabled',key==='prep'||key==='empty'?'true':'false');
  [].forEach.call(ticks.children,function(t,i){t.classList.toggle('re-on',i<S.packed)});
  stopB.hidden=!prep;failCb.disabled=prep;
  [].forEach.call(document.querySelectorAll('.re-sam'),function(x){x.setAttribute('aria-disabled',String(prep))});
  var nt=prep?'Packing '+N+' files at 60 ms each. Press Escape or Stop to stop.':S.msg?S.msg:!n?'Check at least one file, or load a sample.':b?(b.id===k?'Matches bundle '+b.id+'.':'Bundle '+b.id+' no longer matches these files.'):'Masks decide what gets packed.';
  if(note.textContent!==nt)note.textContent=nt;
  /* row 6 */
  if(!b){rcp.hidden=true}else{
    rcp.hidden=false;var d=nc>0,ln=$('line');
    ln.textContent='spring-catalogue · '+nf(b.n)+' · '+mb(b.sz)+' · '+b.time+' · bundle ';el('span','re-id',b.id,ln);
    var p=[];if(dd.add.length)p.push(dd.add.length+' added');if(dd.rem.length)p.push(dd.rem.length+' removed');
    $('st').textContent=d?'Bundle '+b.id+' out of date · '+p.join(' · ')+' since':'Matches current masks';
    rcp.classList.toggle('re-drift',d);
    if(d&&!b.told&&!prep){b.told=true;say('Bundle '+b.id+' out of date. '+p.join(', ')+' since the download.')}
    if(!d)S.chgOpen=false;
    show.disabled=!d;rest.disabled=!d||prep;
    show.setAttribute('aria-expanded',String(S.chgOpen));show.textContent=S.chgOpen?'Hide changes':'Show changes';
    chg.hidden=!S.chgOpen;
    while(chg.firstChild)chg.removeChild(chg.lastChild);
    dd.add.forEach(function(i){var li=el('li',null,'+ '+i,chg);el('span',null,'added since',li)});
    dd.rem.forEach(function(i){var li=el('li',null,'− '+i,chg);el('span',null,'removed since',li)});
    undo.hidden=!S.prev;bar.style.transform=S.prev&&!reduce()?'scaleX('+Math.max(0,1-S.ut/5000)+')':''}
}

/* one loop: packing, settle, reveal, undo timer */
var raf=0,last=0;
function step(ms){var mv=false;
  if(S.mode==='prep'){var N=S.prep.length;S.acc+=ms;
    while(S.packed<N&&S.acc>=PACK_MS){if(S.willFail&&S.packed===Math.floor(N/2)){failRun();break}S.acc-=PACK_MS;S.packed++}
    if(S.mode==='prep'&&S.packed>=N)finish();mv=true}
  else if(S.mode==='done'){S.flash-=ms;if(S.flash<=0)S.mode='ready';else mv=true}
  var T=S.reveal;
  if(rt!==T){if(reduce())rt=T;else{var dl=ms/DUR;rt=T>rt?Math.min(T,rt+dl):Math.max(T,rt-dl)}if(rt!==T)mv=true}
  if(S.prev){S.ut+=ms;if(S.ut>=5000)hideUndo();else mv=true}
  return mv}
function frame(now){var ms=last?Math.min(now-last,100):16;last=now;var mv=step(ms);render();raf=mv?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});

document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;
  if(S.mode==='prep'){e.preventDefault();stop();return}
  if(e.defaultPrevented)return;
  if(S.prev){hideUndo();return}
  if(S.chgOpen){S.chgOpen=false;render();show.focus();return}
  if(narrow()&&S.pvOpen){S.pvOpen=false;render();dis.focus();return}
  if(S.reveal){setReveal(0);if(!tog.disabled&&tog.offsetParent)tog.focus()}});

window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.setAttribute('data-theme',m.theme);render()}});

setCur(rows[0],false);render();
})();</script>
</body></html>
