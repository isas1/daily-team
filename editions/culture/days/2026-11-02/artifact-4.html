<style>

<div class="rx-root" role="group" aria-label="Export panel for spring-catalogue">
<div class="rx-panel">
<div class="rx-hd"><span class="rx-t">spring-catalogue</span><button class="rx-tg" type="button" aria-pressed="false">Phone width</button></div>

</section>

</div>

  var D='layouts/cover-v1-client-revision-final.indd 46 0|layouts/cover-forever-plan.indd 42|layouts/spread-monday.indd 34|layouts/spread-tuesday.indd 31|layouts/back-cover.indd 19|images/emotional-baggage.psd 68|images/cat-pics-2.jpg 24|images/cat-pics-2-final-actually.jpg 23 0|images/hero-forever.jpg 22|images/product-01.jpg 12|images/product-02.jpg 11|images/product-03.jpg 10|images/logo-forever.svg 5|fonts/forever-sans-regular.otf 4 0|fonts/forever-sans-bold.otf 4 0|copy/prices-monday.txt 1|copy/captions.docx 3|copy/legal-small-print.pdf 5|copy/readme-forever.txt 1|copy/swatches.ase 2|drafts/cover-sketch.png 10 0|drafts/do-not-send.png 9 0|exports/catalogue-preview.pdf 26';
