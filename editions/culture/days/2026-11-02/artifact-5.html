<style>

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#121417;--pack-surface:#1b1e23;--pack-text:#e8eaed;--pack-muted:#9aa1ab;--pack-accent:#7d9be6;--pack-border:#2e333a}:root[data-theme="light"]{--pack-bg:#f6f7f8;--pack-surface:#ffffff;--pack-text:#1a1d21;--pack-muted:#5c636d;--pack-accent:#2f4fa8;--pack-border:#d9dde2}</style></head><body>
<div class="rx5-root" role="group" aria-label="Download bundle button for the spring-catalogue file panel">
<div class="rx5-head"><span class="rx5-title">spring-catalogue</span>
<label class="rx5-fail"><input type="checkbox" id="rx5-fail">Fail next run</label></div>
<fieldset id="rx5-fs"><ul class="rx5-list" id="rx5-list" aria-label="Files in bundle"></ul></fieldset>
<button class="rx5-btn" id="rx5-btn" type="button"><span class="rx5-stack" id="rx5-stack"></span><span class="rx5-ticks" id="rx5-ticks" aria-hidden="true"></span></button>
<p class="rx5-note" id="rx5-note" aria-live="polite"></p>
</div>
<script>(function(){
  var F=[['forever-plan-cover.indd',6.2],['emotional-baggage.psd',14.6],['cat-pics-2.zip',3.1],['cover-v1-client-revision-final.indd',4.9],['price-list-final-final.pdf',1.8],['logo-forever.svg',0.4],['monday-notes.txt',0.1],['delete-me-later.tmp',0.3]];
  var inc=F.map(function(_,i){return i!==7});
  var $=function(i){return document.getElementById(i)};
  var root=document.querySelector('.rx5-root'),list=$('rx5-list'),btn=$('rx5-btn'),stack=$('rx5-stack'),ticks=$('rx5-ticks'),note=$('rx5-note'),fail=$('rx5-fail'),fs=$('rx5-fs');
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var mode='ready',packed=0,acc=0,prep=[],willFail=false,flash=0,bundle=null,msg='';
  var K=['idle','prep','done','same','chg','fail','empty'],L={};
  K.forEach(function(k){var s=document.createElement('span');L[k]=s;stack.appendChild(s)});
  F.forEach(function(f,i){var li=document.createElement('li'),lb=document.createElement('label'),cb=document.createElement('input'),n=document.createElement('span'),m=document.createElement('span');
    lb.className='rx5-row';cb.type='checkbox';cb.checked=inc[i];n.className='rx5-name';n.textContent=f[0];m.className='rx5-mb';m.textContent=f[1].toFixed(1)+' MB';
    cb.addEventListener('change',function(){inc[i]=cb.checked;msg='';if(mode==='failed')mode='ready';render()});
    lb.appendChild(cb);lb.appendChild(n);lb.appendChild(m);li.appendChild(lb);list.appendChild(li)});
  list.addEventListener('keydown',function(e){var b=[].slice.call(list.querySelectorAll('input')),i=b.indexOf(document.activeElement);if(i<0)return;
    var j=e.key==='ArrowDown'?i+1:e.key==='ArrowUp'?i-1:e.key==='Home'?0:e.key==='End'?b.length-1:-2;if(j===-2)return;e.preventDefault();b[Math.max(0,Math.min(b.length-1,j))].focus()});
  function cur(){var r=[];inc.forEach(function(v,i){if(v)r.push(i)});return r}
  function hash(ids){var h=0x811c9dc5,s=ids.map(function(i){return F[i][0]}).sort().join('|');for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return('0000'+h.toString(16)).slice(-4)}
  function mb(ids){return ids.reduce(function(a,i){return a+F[i][1]},0).toFixed(1)}
  function files(n){return n+(n===1?' file':' files')}
  function cost(i){return 60+60*F[i][1]}
  function save(b){var u=URL.createObjectURL(b.blob),a=document.createElement('a');a.href=u;a.download='spring-catalogue-'+b.id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
  function press(){if(btn.getAttribute('aria-disabled')==='true'||mode==='prep'||mode==='done')return;
    var ids=cur();if(!ids.length)return;var k=hash(ids);msg='';
    if(bundle&&bundle.id===k){save(bundle);mode='done';flash=1200;msg='Saved cached bundle '+k+'.';}
    else{prep=ids;packed=0;acc=0;willFail=fail.checked;mode='prep';
      while(ticks.firstChild)ticks.removeChild(ticks.firstChild);
      ids.forEach(function(){ticks.appendChild(document.createElement('i'))});}
    render();kick()}
  function stop(){if(mode!=='prep')return;mode='ready';msg='Stopped at '+packed+' of '+prep.length+'. Nothing saved.';render()}
  function step(ms){
    if(mode==='prep'){acc+=ms;
      while(packed<prep.length&&acc>=cost(prep[packed])){
        if(willFail&&packed===Math.floor(prep.length/2)){mode='failed';fail.checked=false;msg='Demo failure at '+(packed+1)+' of '+prep.length+'. Nothing saved.';return false}
        acc-=cost(prep[packed]);packed++}
      if(packed===prep.length){var id=hash(prep),t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        var data={project:'spring-catalogue',bundle:id,files:prep.map(function(i){return{name:F[i][0],mb:F[i][1]}}),totalMB:+mb(prep)};
        bundle={id:id,ids:prep.slice(),time:t,blob:new Blob([JSON.stringify(data,null,2)],{type:'application/json'})};
        save(bundle);mode='done';flash=1200;msg='Saved spring-catalogue-'+id+'.json at '+t+'.'}
      return true}
    if(mode==='done'){flash-=ms;if(flash<=0){mode='ready';return false}return true}
    return false}
  function render(){var ids=cur(),n=ids.length,k=hash(ids),c=0;
    if(bundle){var s={};bundle.ids.forEach(function(i){s[i]=1});ids.forEach(function(i){if(s[i])delete s[i];else c++});c+=Object.keys(s).length}
    L.idle.textContent='Download '+files(n)+' · '+mb(ids)+' MB';
    var pn=mode==='prep'?prep.length:n;L.prep.textContent='Preparing · '+(mode==='prep'?packed:pn)+' of '+pn;
    L.done.textContent='Downloaded';L.same.textContent='Download again · same bundle';
    L.chg.textContent='Prepare new bundle · '+c+(c===1?' change':' changes');
    L.fail.textContent='Not prepared · Retry';L.empty.textContent='No files selected';
    var key=mode==='prep'?'prep':mode==='done'?'done':mode==='failed'?'fail':!n?'empty':bundle?(bundle.id===k?'same':'chg'):'idle';
    K.forEach(function(x){L[x].classList.toggle('rx5-on',x===key)});
    btn.setAttribute('data-k',key);btn.setAttribute('aria-disabled',key==='prep'||key==='empty'?'true':'false');
    [].forEach.call(ticks.children,function(t,i){t.classList.toggle('rx5-on',i<packed)});
    fs.disabled=fail.disabled=mode==='prep';
    var t=mode==='prep'?'Packing files. Press Esc to stop.':msg?msg:!n?'Check at least one file.':bundle?(bundle.id===k?'Bundle '+bundle.id+' · saved '+bundle.time+'.':'Bundle '+bundle.id+' no longer matches these files.'):'Uncheck files to leave them out.';
    if(note.textContent!==t)note.textContent=t}
  btn.addEventListener('click',press);
  btn.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter')btn.classList.add('rx5-down')});
  btn.addEventListener('keyup',function(){btn.classList.remove('rx5-down')});
  btn.addEventListener('blur',function(){btn.classList.remove('rx5-down')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')stop()});
  var raf=0,last=0;
  function frame(now){var ms=last?Math.min(now-last,250):16;last=now;root.classList.toggle('rx5-rm',reduce());
    var moving=step(ms);render();raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.setAttribute('data-theme',m.theme);render()}});
  root.classList.toggle('rx5-rm',reduce());render();
})();</script>
</body></html>
