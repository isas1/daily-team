name: Suggest a task
description: Suggest a spark for the daily team to make something from.
title: "Task: "
labels: [task-suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Each week the open suggestions with the most thumbs-up votes are screened. Accepted ones join the task pool and run on a future day. The rules are in [CONTRIBUTING.md](https://github.com/isas1/daily-team/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One line. An image, a force, a place, or a moment the team can make something from.
      placeholder: "Tide: something that arrives, stays a while, and leaves."
    validations:
      required: true
  - type: input
    id: helps
    attributes:
      label: Who it is for
      placeholder: Anyone who likes watching things change slowly.
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: What you hope to see
      placeholder: "Something that moves in and out on its own."
  - type: checkboxes
    id: credit
    attributes:
      label: Credit
      options:
        - label: Credit me by GitHub username on the day this task runs.
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I agree that this suggestion can be used and changed under the repository's MIT license.
          required: true
