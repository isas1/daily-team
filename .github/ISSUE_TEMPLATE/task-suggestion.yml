name: Suggest a task
description: Suggest a component for people building projects and prototypes.
title: "Task: "
labels: [task-suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Each week the open suggestions with the most thumbs-up votes are screened. Accepted ones join the task pool and run on a future day. The rules are in [CONTRIBUTING.md](https://github.com/isas1/daily-team/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One line. Name one component, its project use, and what someone can do with it. Leave its visual style open.
      placeholder: "Pricing switch: a toggle for a subscription page that changes monthly to yearly billing and updates the price."
    validations:
      required: true
  - type: input
    id: helps
    attributes:
      label: Who it is for
      placeholder: Someone building a subscription page for a small app or larger product.
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: What you hope to see
      placeholder: "Switch billing periods and see the price update with clear feedback."
  - type: checkboxes
    id: credit
    attributes:
      label: Credit
      options:
        - label: Credit me by GitHub username on the day this task runs.
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I agree that this suggestion can be used and changed under the repository's MIT license.
          required: true
