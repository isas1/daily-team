name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['days/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install gawk and mawk
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gawk mawk
      - run: node --test test.mjs security.test.mjs comparison.test.mjs pack.test.mjs editions.test.mjs project.test.mjs
