name: Season

# Runs when a season pull request is merged: tells each suggester the outcome and announces
# the new members. No model credential is used here.
on:
  push:
    branches: [main]
    paths: ['pools/*.json']

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the season starts after every recorded day
        run: |
          for f in $(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'pools/*.json'); do
            start=$(basename "$f" .json)
            last=$(ls days | sort | tail -1)
            if [ -n "$last" ] && [ "$(echo "$start" | tr -d -)" -le "$(echo "$last" | tr -d -)" ]; then
              echo "::error::Season $start was merged after day $last was recorded. Revert this merge and run Recruit again."
              exit 1
            fi
          done
      - name: Comment, close, and announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in $(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'pools/*.json'); do
            node github.mjs close-loop "$f"
            node github.mjs announce "$f" || echo "::warning::Announcement failed for $f"
          done
