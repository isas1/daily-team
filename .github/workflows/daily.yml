name: Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Project prototype or explicit legacy component pack
        type: choice
        options: [project, components]
        default: project
      artifacts:
        description: Project 0 or 1 (empty 1); component pack 0 to 10 (empty 6)
        default: ''
      force:
        description: Replace today's results
        type: boolean
        default: false
      provider:
        description: Model provider for this run (empty uses the PROVIDER variable)
        type: choice
        options: ['', openrouter, claude]
        default: ''
      compare:
        description: Build Opus, Sonnet, and Haiku comparison plus square MP4 (Claude provider)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: read
    outputs:
      pages: ${{ steps.pages_artifact.outcome == 'success' }}
    env:
      TZ: ${{ vars.TZ || 'UTC' }}
      PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'openrouter' }}
    steps:
      - name: Check credentials
        id: key
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$PROVIDER" = claude ]; then need=CLAUDE_CODE_OAUTH_TOKEN; have=$CLAUDE_TOKEN
          else need=OPENROUTER_API_KEY; have=$OPENROUTER_KEY; fi
          if [ -n "$have" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Add the $need secret to enable daily runs."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude'
        run: npm install --global @anthropic-ai/claude-code@2.1.288
      - name: Read component requests from both repositories
        if: steps.key.outputs.ok == 'true' && inputs.mode == 'components'
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_REQUESTS_TOKEN || github.token }}
        run: node github.mjs requests > "$RUNNER_TEMP/component-requests.json"
      - name: Read reviewed component bases from 00-components
        if: steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude' && inputs.mode == 'components'
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_REQUESTS_TOKEN || github.token }}
        run: node github.mjs component-sources > "$RUNNER_TEMP/component-sources.json"
      - name: Run today's team
        if: steps.key.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ env.PROVIDER != 'claude' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PROVIDER == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MODEL: ${{ vars.MODEL }}
          API_URL: ${{ vars.API_URL }}
          ARTIFACTS: ${{ inputs.artifacts }}
          RUN_MODE: ${{ inputs.mode == 'components' && '--pack' || '--project' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          COMPONENT_REQUESTS_FILE: ${{ inputs.mode == 'components' && format('{0}/component-requests.json', runner.temp) || '' }}
          COMPONENT_FEED_CACHE: .cache/feed-backlog.json
          COMPONENT_SOURCES_FILE: ${{ inputs.mode == 'components' && env.PROVIDER == 'claude' && format('{0}/component-sources.json', runner.temp) || '' }}
        run: node run.mjs $RUN_MODE $FORCE
      - name: Design daily project cover
        continue-on-error: true
        if: always() && steps.key.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ env.PROVIDER != 'claude' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PROVIDER == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MODEL: ${{ vars.MODEL }}
          API_URL: ${{ vars.API_URL }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node cover.mjs $FORCE
      - name: Screenshot new artifacts
        if: always() && steps.key.outputs.ok == 'true'
        run: sh shot.sh days || true
      - name: Build three-model comparison
        id: comparison
        if: success() && steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude' && (github.event_name != 'workflow_dispatch' || inputs.compare)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COMPARE_OPUS_MODEL: ${{ vars.COMPARE_OPUS_MODEL }}
          COMPARE_SONNET_MODEL: ${{ vars.COMPARE_SONNET_MODEL }}
          COMPARE_HAIKU_MODEL: ${{ vars.COMPARE_HAIKU_MODEL }}
        run: |
          day=$(date +%Y-%m-%d)
          if node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync(process.argv[1])); process.exit(d.component && d.artifacts.some(a=>a.row) ? 0 : 1)' "days/$day/day.json"; then
            node compare.mjs --date "$day"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install video renderer
        if: success() && steps.comparison.outputs.ready == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Record square comparison video
        if: success() && steps.comparison.outputs.ready == 'true'
        run: node render-comparison.mjs --date "$(date +%Y-%m-%d)"
      - name: Read suggestions for the vote table
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node github.mjs suggestions > "$RUNNER_TEMP/suggestions.json" || echo '[]' > "$RUNNER_TEMP/suggestions.json"
      - name: Update README and site
        id: publish
        if: always() && steps.key.outputs.ok == 'true'
        env:
          PAGES_URL: ${{ vars.PAGES == 'true' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
          SITE: ${{ vars.PAGES == 'true' && '_site' || '' }}
        run: node publish.mjs --suggestions "$RUNNER_TEMP/suggestions.json" ${SITE:+--site "$SITE"}
      - name: Commit results
        if: always() && steps.key.outputs.ok == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add README.md ARCHIVE.md days .cache/feed-backlog.json 2>/dev/null || git add README.md ARCHIVE.md days
          if [ -d editions ]; then git add editions; fi
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily team $(date +%Y-%m-%d)"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --quiet "$remote" main
          git push "$remote" HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages_artifact
        if: always() && steps.publish.outcome == 'success' && vars.PAGES == 'true'
        with:
          path: _site

  pages:
    needs: run
    if: always() && needs.run.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
