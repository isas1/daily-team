name: Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      artifacts:
        description: Number of HTML artifacts, 0 to 10 (empty is 10 plus a piece on component days, else 1)
        default: ''
      force:
        description: Replace today's results
        type: boolean
        default: false
      provider:
        description: Model provider for this run (empty uses the PROVIDER variable)
        type: choice
        options: ['', openrouter, claude]
        default: ''

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      issues: read
    outputs:
      pages: ${{ steps.key.outputs.ok == 'true' && vars.PAGES == 'true' }}
    env:
      TZ: ${{ vars.TZ || 'UTC' }}
      PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'openrouter' }}
    steps:
      - name: Check credentials
        id: key
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$PROVIDER" = claude ]; then need=CLAUDE_CODE_OAUTH_TOKEN; have=$CLAUDE_TOKEN
          else need=OPENROUTER_API_KEY; have=$OPENROUTER_KEY; fi
          if [ -n "$have" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Add the $need secret to enable daily runs."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude'
        run: npm install --global @anthropic-ai/claude-code@2.1.288
      - name: Read component requests from both repositories
        if: steps.key.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_REQUESTS_TOKEN || github.token }}
        run: node github.mjs requests > "$RUNNER_TEMP/component-requests.json"
      - name: Read reviewed component bases from 00-components
        if: steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude'
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_REQUESTS_TOKEN || github.token }}
        run: node github.mjs component-sources > "$RUNNER_TEMP/component-sources.json"
      - name: Run today's team
        if: steps.key.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ env.PROVIDER != 'claude' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PROVIDER == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MODEL: ${{ vars.MODEL }}
          API_URL: ${{ vars.API_URL }}
          ARTIFACTS: ${{ inputs.artifacts || vars.ARTIFACTS || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          COMPONENT_REQUESTS_FILE: ${{ runner.temp }}/component-requests.json
          COMPONENT_SOURCES_FILE: ${{ env.PROVIDER == 'claude' && format('{0}/component-sources.json', runner.temp) || '' }}
        run: node run.mjs $FORCE
      - name: Screenshot new artifacts
        if: always() && steps.key.outputs.ok == 'true'
        run: sh shot.sh days || true
      - name: Read suggestions for the vote table
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node github.mjs suggestions > "$RUNNER_TEMP/suggestions.json" || echo '[]' > "$RUNNER_TEMP/suggestions.json"
      - name: Update README and site
        if: always() && steps.key.outputs.ok == 'true'
        env:
          PAGES_URL: ${{ vars.PAGES == 'true' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
          SITE: ${{ vars.PAGES == 'true' && '_site' || '' }}
        run: node publish.mjs --suggestions "$RUNNER_TEMP/suggestions.json" ${SITE:+--site "$SITE"}
      - name: Commit results
        if: always() && steps.key.outputs.ok == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add README.md ARCHIVE.md days 2>/dev/null || git add README.md ARCHIVE.md
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily team $(date +%Y-%m-%d)"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --quiet "$remote" main
          git push "$remote" HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: always() && steps.key.outputs.ok == 'true' && vars.PAGES == 'true'
        with:
          path: _site

  pages:
    needs: run
    if: always() && needs.run.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
