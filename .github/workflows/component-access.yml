name: Component access

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'github.mjs'
      - 'component-*.mjs'
      - 'component-inspiration.json'
      - '.github/workflows/component-access.yml'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test private component access without model calls
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_REQUESTS_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::Add COMPONENT_REQUESTS_TOKEN to enable this optional access check."
            exit 0
          fi
          node github.mjs access-check
