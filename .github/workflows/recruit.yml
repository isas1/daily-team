name: Recruit

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider for this run (empty uses the PROVIDER variable)
        type: choice
        options: ['', openrouter, claude]
        default: ''

permissions:
  contents: read

concurrency:
  group: recruit
  cancel-in-progress: false

jobs:
  recruit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read
    env:
      PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'openrouter' }}
    steps:
      - name: Check credentials
        id: key
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$PROVIDER" = claude ]; then need=CLAUDE_CODE_OAUTH_TOKEN; have=$CLAUDE_TOKEN
          else need=OPENROUTER_API_KEY; have=$OPENROUTER_KEY; fi
          if [ -n "$have" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Add the $need secret to enable recruiting."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.key.outputs.ok == 'true' && env.PROVIDER == 'claude'
        run: npm install --global @anthropic-ai/claude-code@2.1.288
      - name: Read suggestions
        if: steps.key.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node github.mjs suggestions > "$RUNNER_TEMP/suggestions.json"
      - name: Draft the next season
        id: draft
        if: steps.key.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ env.PROVIDER != 'claude' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PROVIDER == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MODEL: ${{ vars.MODEL }}
        run: |
          node recruit.mjs --suggestions "$RUNNER_TEMP/suggestions.json" | tee "$RUNNER_TEMP/out.txt"
          echo "start=$(sed -n 's/^season //p' "$RUNNER_TEMP/out.txt")" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.key.outputs.ok == 'true'
        run: node --test test.mjs
      - name: Open or update the pull request
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.draft.outputs.start }}
        run: |
          branch="recruit/$START"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add pools
          git commit -m "Season $START: new members and tasks"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          node recruit.mjs --summary "pools/$START.json" > "$RUNNER_TEMP/body.md"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "Season $START" --body-file "$RUNNER_TEMP/body.md"
          fi
