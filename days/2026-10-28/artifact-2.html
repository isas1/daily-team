<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Load stages for the checkout-api latency chart</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--pack-bg);color:var(--pack-text);font-family:var(--pack-typography-family)}
.lb2-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;box-sizing:border-box;container-type:inline-size;background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:calc(var(--pack-radii-control)*2);overflow:auto;-webkit-overflow-scrolling:touch}
.lb2-in{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;gap:var(--pack-spacing-gap);padding:clamp(10px,4cqi,var(--pack-spacing-padding));font-size:clamp(11px,calc(var(--pack-typography-size)*.25 + 2.6cqi),20px);line-height:1.3}
.lb2-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;flex-wrap:wrap}
.lb2-title{font-weight:600}
.lb2-sub{color:var(--pack-muted);font-size:.85em}
.lb2-stages{list-style:none;margin:0;padding:0;display:grid;gap:.55em}
.lb2-stage{display:grid;grid-template-columns:1em 1fr auto;column-gap:.6em;align-items:start;transition:opacity var(--pack-motion-duration) var(--pack-motion-easing)}
.lb2-mark{width:1em;height:1em;margin-top:.15em;box-sizing:border-box;border-radius:50%;border:2px solid var(--pack-border);position:relative;transition:background-color var(--pack-motion-duration) var(--pack-motion-easing),border-color var(--pack-motion-duration) var(--pack-motion-easing)}
.lb2-name{font-weight:600;color:var(--pack-muted)}
.lb2-det{display:block;font-weight:400;font-size:.82em;color:var(--pack-muted);overflow-wrap:anywhere}
.lb2-time{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;color:var(--pack-muted);font-size:.88em}
[data-s=active] .lb2-name,[data-s=done] .lb2-name,[data-s=fail] .lb2-name{color:var(--pack-text)}
[data-s=active] .lb2-time{color:var(--pack-text)}
[data-s=active] .lb2-mark{border-top-color:var(--pack-accent);animation:lb2-spin .8s linear infinite}
.lb2-still [data-s=active] .lb2-mark{animation:none;border-color:var(--pack-accent)}
[data-s=done] .lb2-mark{background:var(--pack-accent);border-color:var(--pack-accent)}
[data-s=done] .lb2-mark::after{content:"";position:absolute;left:30%;top:12%;width:22%;height:48%;border:solid var(--pack-surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
[data-s=fail] .lb2-mark{border-color:var(--pack-text)}
[data-s=fail] .lb2-mark::before,[data-s=fail] .lb2-mark::after{content:"";position:absolute;left:15%;top:calc(50% - 1px);width:70%;height:2px;background:var(--pack-text);transform:rotate(45deg)}
[data-s=fail] .lb2-mark::after{transform:rotate(-45deg)}
[data-s=cancel] .lb2-mark{border-style:dashed;border-color:var(--pack-muted)}
[data-s=skip]{opacity:.45}
@keyframes lb2-spin{to{transform:rotate(360deg)}}
.lb2-status{margin:0;min-height:2.6em;box-sizing:border-box;padding:.55em .7em;background:var(--pack-bg);border:1px solid var(--pack-border);border-left:3px solid var(--pack-border);border-radius:var(--pack-radii-control);display:flex;align-items:center}
.lb2-status[data-k=ok]{border-left-color:var(--pack-accent)}
.lb2-status[data-k=bad]{border-left-color:var(--pack-text);font-weight:600}
.lb2-acts{display:flex;flex-wrap:wrap;gap:.5em;margin-top:auto}
.lb2-btn{font:inherit;font-weight:600;min-height:44px;padding:0 1em;border-radius:var(--pack-radii-control);border:1px solid var(--pack-border);background:transparent;color:var(--pack-text);cursor:pointer;flex:1 1 auto;transition:transform 120ms var(--pack-motion-easing),opacity var(--pack-motion-duration) var(--pack-motion-easing)}
.lb2-pri{background:var(--pack-accent);border-color:var(--pack-accent);color:var(--pack-surface);min-width:7.5em;flex-grow:2}
.lb2-btn:active:not([aria-disabled=true]){transform:scale(.97)}
.lb2-btn[aria-disabled=true]{opacity:.5;cursor:default}
.lb2-fail{display:flex;align-items:center;gap:.5em;min-height:44px;color:var(--pack-muted);font-size:.88em;cursor:pointer}
.lb2-fail input{width:1.3em;height:1.3em;margin:0;accent-color:var(--pack-accent)}
.lb2-btn:focus-visible,.lb2-fail input:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.lb2-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.lb2-stage,.lb2-mark,.lb2-btn{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111315;--pack-surface:#1A1D20;--pack-text:#E6E4DF;--pack-muted:#9A9790;--pack-accent:#7FA8C9;--pack-border:#2C3035}:root[data-theme="light"]{--pack-bg:#F5F4F1;--pack-surface:#FFFFFF;--pack-text:#1C1E21;--pack-muted:#5F5D58;--pack-accent:#3C6A8E;--pack-border:#D9D6D0}</style></head><body>
<div class="lb2-root" id="lb2-root" role="group" aria-label="Load stages for the checkout-api latency chart">
<div class="lb2-in">
<div class="lb2-head"><span class="lb2-title">checkout-api latency</span><span class="lb2-sub">Forever plan</span></div>
<ol class="lb2-stages" id="lb2-list"></ol>
<p class="lb2-status" id="lb2-status" role="status" aria-live="polite" data-k="ok">Loaded 6h · 72 points · 14:40</p>
<div class="lb2-acts" id="lb2-acts">
<button class="lb2-btn lb2-pri" id="lb2-pri" type="button">Load 24h</button>
<button class="lb2-btn" id="lb2-can" type="button" aria-disabled="true">Cancel</button>
</div>
<label class="lb2-fail"><input type="checkbox" id="lb2-fail"> Make Aggregate fail</label>
</div></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var $=function(i){return document.getElementById(i)};
  var root=$('lb2-root'),list=$('lb2-list'),status=$('lb2-status'),pri=$('lb2-pri'),can=$('lb2-can'),fail=$('lb2-fail');
  var R={'6h':{pts:72,smp:216,mb:'0.4'},'24h':{pts:288,smp:864,mb:'1.4'}};
  var NAMES=['Fetch','Aggregate','Draw'],MS=[900,1200,500];
  var WORD={pending:'waiting',active:'running',done:'done',fail:'failed',cancel:'cancelled',skip:'skipped'};
  var rows=NAMES.map(function(n){
    var li=document.createElement('li');li.className='lb2-stage';
    var m=document.createElement('span');m.className='lb2-mark';m.setAttribute('aria-hidden','true');
    var nm=document.createElement('span');nm.className='lb2-name';nm.textContent=n;
    var sr=document.createElement('span');sr.className='lb2-sr';
    var d=document.createElement('span');d.className='lb2-det';
    var t=document.createElement('span');t.className='lb2-time';
    nm.appendChild(sr);nm.appendChild(d);li.appendChild(m);li.appendChild(nm);li.appendChild(t);list.appendChild(li);
    return {li:li,sr:sr,d:d,t:t};
  });
  function det(i,r){return i===0?r+' · '+R[r].mb+' MB, mostly timestamps':i===1?R[r].smp+' samples → '+R[r].pts+' points':'p99 line, 300 ms SLO'}
  function setRow(i,s,time){var w=rows[i];w.li.setAttribute('data-s',s);w.sr.textContent=' '+WORD[s]+' ';w.t.textContent=time==null?'—':time.toFixed(1)+' s'}
  function say(t,k){status.textContent=t;status.setAttribute('data-k',k||'')}
  function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

  var loaded='6h',failedRange=null,job=null,gen=0;
  [0.9,1.1,0.5].forEach(function(t,i){rows[i].d.textContent=det(i,'6h');setRow(i,'done',t)});

  function target(){return failedRange||(loaded==='6h'?'24h':'6h')}
  function syncButtons(){
    pri.setAttribute('aria-disabled',job?'true':'false');
    can.setAttribute('aria-disabled',job?'false':'true');
    pri.textContent=job?'Loading '+job.range:(failedRange?'Retry '+failedRange:'Load '+target());
  }
  function wait(ms,sig){return new Promise(function(res,rej){
    var t=setTimeout(res,ms);
    sig.addEventListener('abort',function(){clearTimeout(t);rej(new DOMException('Cancelled','AbortError'))},{once:true});
  })}

  function start(){
    if(job)return; /* one load at a time; repeated taps do nothing */
    var r=target(),c=new AbortController();
    job={gen:++gen,stage:0,range:r,ctl:c,t0:performance.now()};
    rows.forEach(function(w,i){w.d.textContent=det(i,r);setRow(i,'pending')});
    syncButtons();run(job);
  }
  function cancel(){if(job)job.ctl.abort()}

  async function run(j){
    var msg=['Fetching '+j.range,'Aggregating '+R[j.range].smp+' samples','Drawing p99'];
    try{
      for(var i=0;i<3;i++){
        j.stage=i;j.t0=performance.now();setRow(i,'active',0);say(msg[i]);kick();
        if(i===1&&fail.checked){await wait(700,j.ctl.signal);throw new Error('Aggregate')}
        await wait(MS[i],j.ctl.signal);
        if(j.gen!==gen)return;
        setRow(i,'done',(performance.now()-j.t0)/1000);
      }
      loaded=j.range;failedRange=null;job=null;
      say('Loaded '+loaded+' · '+R[loaded].pts+' points · '+clock(),'ok');
    }catch(e){
      if(j.gen!==gen)return;
      var s=j.stage,el=(performance.now()-j.t0)/1000,ab=e.name==='AbortError';
      setRow(s,ab?'cancel':'fail',el);
      for(var k=s+1;k<3;k++)setRow(k,'skip');
      job=null;
      if(ab){failedRange=null;say('Cancelled · kept '+loaded)}
      else{failedRange=j.range;say(NAMES[s]+' failed · kept '+loaded,'bad')}
    }
    syncButtons();
  }

  pri.addEventListener('click',function(){if(pri.getAttribute('aria-disabled')!=='true')start()});
  can.addEventListener('click',function(){if(can.getAttribute('aria-disabled')!=='true')cancel()});
  root.addEventListener('keydown',function(e){
    if(e.key==='Escape'){cancel();return}
    var f=[pri,can,fail],i=f.indexOf(document.activeElement);
    if(i<0)return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){f[(i+1)%3].focus();e.preventDefault()}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){f[(i+2)%3].focus();e.preventDefault()}
  });

  var raf=0;
  function frame(now){
    root.classList.toggle('lb2-still',reduce());
    if(job){rows[job.stage].t.textContent=((now-job.t0)/1000).toFixed(1)+' s';raf=requestAnimationFrame(frame)}
    else raf=0;
  }
  function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});
  syncButtons();kick();
})();</script>
</body></html>
