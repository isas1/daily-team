<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percentile tiles for checkout-api latency</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--pack-bg)}
body{font-family:var(--pack-typography-family);font-size:var(--pack-typography-size);color:var(--pack-text)}
.pt3-root{box-sizing:border-box;width:clamp(180px,92vmin,640px);aspect-ratio:1;padding:var(--pack-spacing-padding);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);display:flex;flex-direction:column;gap:var(--pack-spacing-gap);overflow:hidden}
.pt3-head{font-size:.86em;color:var(--pack-muted)}
.pt3-tiles{--pt3-a:1fr;--pt3-b:1fr;--pt3-c:2.2fr;--pt3-d:1fr;flex:1;min-height:0;display:grid;grid-template-columns:var(--pt3-a) var(--pt3-b) var(--pt3-c) var(--pt3-d);gap:8px}
.pt3-tile{min-width:0;min-height:44px;margin:0;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;font:inherit;text-align:left;color:var(--pack-muted);background:transparent;border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);cursor:pointer;touch-action:manipulation;transition:border-color var(--pack-motion-duration) var(--pack-motion-easing),background-color var(--pack-motion-duration) var(--pack-motion-easing),color var(--pack-motion-duration) var(--pack-motion-easing)}
.pt3-tile:hover{color:var(--pack-text)}
.pt3-tile[aria-pressed="true"]{color:var(--pack-text);background:var(--pack-bg);border-color:var(--pack-accent)}
.pt3-tile:focus-visible{outline:2px solid var(--pack-accent);outline-offset:-2px}
.pt3-name{font-size:.86em}
.pt3-val{font-size:1.3em;font-weight:600;color:var(--pack-text);white-space:nowrap;font-variant-numeric:tabular-nums}
.pt3-detail{font-size:.8em;font-weight:300;line-height:1.3}
.pt3-tile[aria-pressed="true"] .pt3-detail{font-weight:500}
.pt3-note{margin:0;font-size:.86em;color:var(--pack-muted)}
.pt3-compact .pt3-tiles{display:flex;flex-wrap:wrap;align-content:stretch;overflow-y:auto;grid-template-columns:none}
.pt3-compact .pt3-tile{flex:1 1 calc(50% - 4px)}
@media (prefers-reduced-motion:reduce){.pt3-tile{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111315;--pack-surface:#1A1D20;--pack-text:#E6E4DF;--pack-muted:#9A9790;--pack-accent:#7FA8C9;--pack-border:#2C3035}:root[data-theme="light"]{--pack-bg:#F5F4F1;--pack-surface:#FFFFFF;--pack-text:#1C1E21;--pack-muted:#5F5D58;--pack-accent:#3C6A8E;--pack-border:#D9D6D0}</style></head><body>
<div class="pt3-root" role="group" aria-label="Latency percentiles for checkout-api"></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var root=document.querySelector('.pt3-root');
  var D=2,sel=D,last=0,raf=0;
  var K=['a','b','c','d'];
  var S=[
    {n:'p50',v:'118 ms',d:'Median request'},
    {n:'p95',v:'412 ms',d:'1 in 20 slower'},
    {n:'p99',v:'640 ms',d:'340 over 300 ms SLO'},
    {n:'Error rate',v:'2.4%',d:'Failed requests'}
  ];
  var cur=[1,1,2.2,1],tgt=[1,1,2.2,1];
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function instant(){return reduce()||root.classList.contains('pt3-compact')}
  var head=el('div','pt3-head','checkout-api \u00b7 latest 14:35');
  var tiles=el('div','pt3-tiles');
  tiles.setAttribute('role','group');tiles.setAttribute('aria-label','Percentile to plot');
  var note=el('p','pt3-note');note.setAttribute('aria-live','polite');
  var btns=S.map(function(s,i){
    var b=el('button','pt3-tile');b.type='button';
    b.appendChild(el('span','pt3-name',s.n));
    b.appendChild(el('span','pt3-val',s.v));
    b.appendChild(el('span','pt3-detail',s.d));
    b.onclick=function(){pick(i)};
    tiles.appendChild(b);return b;
  });
  root.appendChild(head);root.appendChild(tiles);root.appendChild(note);
  function mark(){
    btns.forEach(function(b,k){b.setAttribute('aria-pressed',k===sel?'true':'false')});
    note.textContent='Plotting '+S[sel].n+' for 6h \u00b7 select a tile to switch';
  }
  function draw(){
    for(var i=0;i<4;i++)tiles.style.setProperty('--pt3-'+K[i],cur[i].toFixed(3)+'fr');
  }
  function step(now){
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=false;
    if(instant()){cur=tgt.slice()}
    else{
      var k=1-Math.pow(0.86,dt),err=0;
      for(var i=0;i<4;i++){cur[i]+=(tgt[i]-cur[i])*k;err+=Math.abs(tgt[i]-cur[i])}
      if(err<0.002)cur=tgt.slice();else moving=true;
    }
    draw();
    if(moving)raf=requestAnimationFrame(step);else{raf=0;last=0}
  }
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(step)}}
  function pick(i){
    if(i===sel)return;
    sel=i;mark();
    for(var k=0;k<4;k++)tgt[k]=k===i?2.2:1;
    if(instant()){cur=tgt.slice();draw()}else kick();
  }
  tiles.addEventListener('keydown',function(e){
    var i=btns.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();pick(D);return}
    if(i<0)return;
    var j=e.key==='ArrowRight'?(i+1)%4:e.key==='ArrowLeft'?(i+3)%4:-1;
    if(j>=0){e.preventDefault();btns[j].focus();pick(j)}
  });
  new ResizeObserver(function(){root.classList.toggle('pt3-compact',root.clientWidth<480)}).observe(root);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  mark();draw();
})();</script>
</body></html>
