<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time range selector for a checkout-api latency card</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--pack-bg);color:var(--pack-text);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size);line-height:1.4}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ab1-card{box-sizing:border-box;width:100%;display:grid;gap:var(--pack-spacing-gap);padding:var(--pack-spacing-padding);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control)}
.ab1-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.ab1-title{font-weight:600}
.ab1-svc{color:var(--pack-muted);font-size:12px}
.ab1-group{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:var(--pack-bg);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control)}
.ab1-seg{position:relative;display:block;min-height:44px;min-width:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:4px}
.ab1-in{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0}
.ab1-txt{display:flex;align-items:center;justify-content:center;height:100%;min-height:44px;color:var(--pack-muted);border-radius:4px;transition:background-color var(--pack-motion-duration) var(--pack-motion-easing),color var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-seg:hover .ab1-txt{color:var(--pack-text)}
.ab1-in:checked+.ab1-txt{background:var(--pack-accent);color:var(--pack-surface)}
.ab1-in:focus-visible+.ab1-txt{outline:2px solid var(--pack-accent);outline-offset:2px}
.ab1-bar{display:none;position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--pack-surface);transform:translateX(-100%)}
.ab1-seg[data-pend] .ab1-bar{display:block}
.ab1-row{display:flex;align-items:center;gap:8px;min-height:44px}
.ab1-status{margin:0;flex:1;min-width:0;color:var(--pack-muted);font-size:13px}
.ab1-cancel{min-width:44px;min-height:44px;padding:0 12px;font:inherit;color:var(--pack-text);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);cursor:pointer;visibility:hidden}
.ab1-cancel:hover{border-color:var(--pack-accent)}
.ab1-cancel:active{background:var(--pack-border)}
.ab1-cancel:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ab1-txt{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111315;--pack-surface:#1A1D20;--pack-text:#E6E4DF;--pack-muted:#9A9790;--pack-accent:#7FA8C9;--pack-border:#2C3035}:root[data-theme="light"]{--pack-bg:#F5F4F1;--pack-surface:#FFFFFF;--pack-text:#1C1E21;--pack-muted:#5F5D58;--pack-accent:#3C6A8E;--pack-border:#D9D6D0}</style></head>
<body>
<div class="ab1-root" role="group" aria-label="Latency time window for checkout-api, with cancel during loads"></div>
<script>(function(){
var RANGES=[['1h',12,500],['6h',72,800],['24h',288,1100],['7d',2016,1400]];
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var loaded='6h',pending=null,gen=0,sevenFailed=false,msg='Showing 6h · 72 points';
var raf=0,inputs=[],labels=[],bars=[];
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function ix(r){for(var i=0;i<RANGES.length;i++)if(RANGES[i][0]===r)return i;return -1}

var root=document.querySelector('.ab1-root');
var card=el('div','ab1-card');
var head=el('div','ab1-head');
head.appendChild(el('span','ab1-title','Time range'));
head.appendChild(el('span','ab1-svc','checkout-api · prod'));
var group=el('div','ab1-group');
group.setAttribute('role','radiogroup');group.setAttribute('aria-label','Time range');
RANGES.forEach(function(r){
  var lab=el('label','ab1-seg'),inp=el('input','ab1-in'),txt=el('span','ab1-txt',r[0]),bar=el('i','ab1-bar');
  inp.type='radio';inp.name='ab1-range';inp.value=r[0];
  lab.appendChild(inp);lab.appendChild(txt);lab.appendChild(bar);
  group.appendChild(lab);inputs.push(inp);labels.push(lab);bars.push(bar);
});
var statusEl=el('p','ab1-status');statusEl.setAttribute('aria-live','polite');
var cancelBtn=el('button','ab1-cancel','Cancel');cancelBtn.type='button';
var row=el('div','ab1-row');row.appendChild(statusEl);row.appendChild(cancelBtn);
card.appendChild(head);card.appendChild(group);card.appendChild(row);root.appendChild(card);

function abort(){if(pending){clearTimeout(pending.timer);pending=null}}

function draw(){
  var want=pending?pending.range:loaded;
  inputs.forEach(function(i,k){
    i.checked=i.value===want;
    if(pending&&pending.range===RANGES[k][0])labels[k].setAttribute('data-pend','');
    else labels[k].removeAttribute('data-pend');
  });
  group.setAttribute('aria-busy',pending?'true':'false');
  cancelBtn.style.visibility=pending?'visible':'hidden';
  statusEl.textContent=pending?'Fetching '+pending.range:msg;
}

function done(g){
  if(!pending||pending.gen!==g)return;
  var r=pending.range;pending=null;
  if(r==='7d'&&!sevenFailed){sevenFailed=true;msg='7d timed out · Kept '+loaded}
  else{loaded=r;msg='Showing '+r+' · '+RANGES[ix(r)][1]+' points'}
  draw();
}

function cancelLoad(){
  if(!pending)return;
  abort();msg='Cancelled · Kept '+loaded;draw();
}

function startLoad(r){
  if(pending?pending.range===r:r===loaded)return;
  if(pending&&r===loaded){cancelLoad();return}
  abort();
  var g=++gen;
  pending={range:r,gen:g,timer:setTimeout(function(){done(g)},RANGES[ix(r)][2])};
  draw();kick();
}

function kick(){if(!raf&&pending&&!document.hidden)raf=requestAnimationFrame(frame)}
function frame(now){
  raf=0;
  if(!pending||document.hidden)return;
  var b=bars[ix(pending.range)];
  if(reduce()){b.style.transform='translateX(0)';return}
  b.style.transform='translateX('+(-100+((now%1100)/1100)*200).toFixed(1)+'%)';
  raf=requestAnimationFrame(frame);
}

group.addEventListener('change',function(e){if(e.target.type==='radio')startLoad(e.target.value)});
card.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(pending){e.preventDefault();cancelLoad()}return}
  if((e.key==='Home'||e.key==='End')&&e.target.type==='radio'){
    e.preventDefault();
    var t=e.key==='Home'?inputs[0]:inputs[inputs.length-1];
    t.focus();startLoad(t.value);
  }
});
cancelBtn.addEventListener('click',cancelLoad);

document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick();
});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
    document.documentElement.setAttribute('data-theme',m.theme)});

draw();
})();</script>
</body></html>
