<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pin pair: latency delta for a service dashboard chart</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--pack-bg);color:var(--pack-text);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size)}
.pp6-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;box-sizing:border-box;container-type:size;background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:calc(var(--pack-radii-control)*2);overflow:hidden}
.pp6-in{box-sizing:border-box;height:100%;overflow:auto;padding:var(--pack-spacing-padding);display:grid;grid-template-rows:auto auto minmax(72px,1fr) auto auto;gap:var(--pack-spacing-gap)}
.pp6-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--pack-muted)}
.pp6-top b{color:var(--pack-text);font-weight:600}
.pp6-read{display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums;align-items:baseline}
.pp6-rt{font-weight:600;min-width:7.5ch}
.pp6-rv{font-size:1.15em;font-weight:600;min-width:6ch}
.pp6-ro{color:var(--pack-muted);font-size:12px}
.pp6-ro.pp6-over{color:var(--pack-text);text-decoration:underline 2px var(--pack-accent);text-underline-offset:3px}
.pp6-plot{position:relative;min-height:72px;border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);touch-action:none;cursor:crosshair;outline:none}
.pp6-plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pp6-plot text{font:11px var(--pack-typography-family);fill:var(--pack-muted)}
.pp6-ctl{display:flex;align-items:center;gap:10px}
.pp6-btn{min-height:44px;min-width:44px;border-radius:var(--pack-radii-control);border:1px solid var(--pack-border);background:transparent;color:var(--pack-text);font:inherit;cursor:pointer;transition:transform var(--pack-motion-duration) var(--pack-motion-easing),opacity var(--pack-motion-duration) var(--pack-motion-easing)}
.pp6-btn:active{transform:scale(.96)}
.pp6-pin{display:grid;padding:0 14px;background:var(--pack-accent);color:var(--pack-surface);border-color:var(--pack-accent);font-weight:600;flex:none}
.pp6-pin span{grid-area:1/1;visibility:hidden;align-self:center;white-space:nowrap}
.pp6-pin span.pp6-on{visibility:visible}
.pp6-pin[aria-disabled=true]{opacity:.62}
.pp6-delta{min-width:0;line-height:1.25;font-variant-numeric:tabular-nums}
.pp6-delta b{display:block;font-size:1.15em}
.pp6-delta small{color:var(--pack-muted);font-size:12px}
.pp6-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center}
.pp6-chip{display:flex;border:1px solid var(--pack-accent);border-radius:var(--pack-radii-control)}
.pp6-chip .pp6-btn{border:0;font-size:13px;font-variant-numeric:tabular-nums}
.pp6-cj{padding:0 4px 0 10px}
.pp6-cx{color:var(--pack-muted)!important;font-size:18px!important}
.pp6-none{color:var(--pack-muted);font-size:12px}
.pp6-btn:focus-visible,.pp6-plot:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.pp6-new{transform-box:fill-box;transform-origin:center;animation:pp6pop var(--pack-motion-duration) var(--pack-motion-easing)}
@keyframes pp6pop{from{transform:scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pp6-new{animation:none}.pp6-btn{transition:none}}
.pp6-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@container (max-width:300px){.pp6-in{padding:10px;gap:6px}.pp6-plan{display:none}.pp6-pin{padding:0 10px}.pp6-delta b{font-size:1em}}
</style><style data-pack-tokens>:root{--pack-typography-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111315;--pack-surface:#1A1D20;--pack-text:#E6E4DF;--pack-muted:#9A9790;--pack-accent:#7FA8C9;--pack-border:#2C3035}:root[data-theme="light"]{--pack-bg:#F5F4F1;--pack-surface:#FFFFFF;--pack-text:#1C1E21;--pack-muted:#5F5D58;--pack-accent:#3C6A8E;--pack-border:#D9D6D0}</style></head><body>
<div class="pp6-root" role="group" aria-label="Pin pair: compare latency at two moments">
<div class="pp6-in">
 <div class="pp6-top"><span><b>checkout-api</b> · p99 · 6h</span><span class="pp6-plan">Forever plan</span></div>
 <div class="pp6-read" id="pp6-read" aria-live="polite"><span class="pp6-rt" id="pp6-rt"></span><span class="pp6-rv" id="pp6-rv"></span><span class="pp6-ro" id="pp6-ro"></span></div>
 <div class="pp6-plot" id="pp6-plot" tabindex="0" role="group" aria-label="Latency chart. Left and Right step, P pins, Escape returns to worst breach"></div>
 <div class="pp6-ctl"><button class="pp6-btn pp6-pin" id="pp6-pin" type="button"></button><div class="pp6-delta" id="pp6-delta"></div></div>
 <div class="pp6-chips" id="pp6-chips"></div>
</div>
<div class="pp6-sr" id="pp6-live" aria-live="polite"></div>
</div>
<script>(function(){
var $=function(i){return document.getElementById(i)},NS='http://www.w3.org/2000/svg';
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var N=72,SLO=300,MAX=700,T0=660,WORST=43,L=10,R=10,T=22,B=20,i;
var S=[];for(i=0;i<N;i++)S.push(Math.round(184+16*Math.sin(i*.9)+9*Math.sin(i*2.3)));
var o={12:338,13:312,25:322,39:228,40:262,41:470,42:590,43:640,44:612,45:520,46:318,58:362,59:331};
for(i in o)S[i]=o[i];
var cur=WORST,ax=WORST,pins=[39],just=false,w=300,h=150,raf=0,last=0,drag=false;
var LB=['Pin this point','Pin second point','Replace oldest','Pinned','Already pinned'];
var plot=$('pp6-plot'),btn=$('pp6-pin'),chips=$('pp6-chips'),delta=$('pp6-delta');
function tl(k){var m=T0+k*5,hh=Math.floor(m/60),mm=m%60;return (hh%12||12)+':'+(mm<10?'0':'')+mm+' '+(hh<12?'AM':'PM')}
function dur(k){var d=k*5;return d<60?d+' min':Math.floor(d/60)+' h'+(d%60?' '+d%60+' min':'')}
function X(k){return L+k/(N-1)*(w-L-R)}
function Y(v){return T+(1-v/MAX)*(h-T-B)}
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function tx(t,a,p,s){var e=el(t,a,p);e.textContent=s;return e}
var svg=el('svg',{'aria-hidden':'true'},plot);
var gHint=tx('text',{x:L,y:14},svg,'Drag or use arrow keys');
var dep=el('line',{stroke:'var(--pack-border)','stroke-width':2,'stroke-dasharray':'2 3'},svg);
var depT=tx('text',{'text-anchor':'end'},svg,'deploy "tiny fix"');
var slo=el('line',{stroke:'var(--pack-muted)','stroke-dasharray':'5 4'},svg);
var sloT=tx('text',{'text-anchor':'end'},svg,'SLO 300 ms');
var path=el('path',{fill:'none',stroke:'var(--pack-text)','stroke-width':1.6,'stroke-linejoin':'round',opacity:.85},svg);
var a0=tx('text',{},svg,tl(0)),a1=tx('text',{'text-anchor':'end'},svg,tl(N-1));
var dl=el('line',{stroke:'var(--pack-accent)','stroke-width':2,'stroke-dasharray':'6 4'},svg);
var gp=el('g',{},svg);
var cl=el('line',{stroke:'var(--pack-accent)','stroke-width':1.5},svg);
var cd=el('circle',{r:4,fill:'var(--pack-surface)',stroke:'var(--pack-accent)','stroke-width':2},svg);
function drawStatic(){
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  var d='';for(var k=0;k<N;k++)d+=(k?'L':'M')+X(k).toFixed(1)+' '+Y(S[k]).toFixed(1);
  path.setAttribute('d',d);
  var ys=Y(SLO);slo.setAttribute('x1',L);slo.setAttribute('x2',w-R);slo.setAttribute('y1',ys);slo.setAttribute('y2',ys);
  sloT.setAttribute('x',w-R);sloT.setAttribute('y',ys-4);
  var xd=X(40);dep.setAttribute('x1',xd);dep.setAttribute('x2',xd);dep.setAttribute('y1',T);dep.setAttribute('y2',h-B);
  depT.setAttribute('x',xd-4);depT.setAttribute('y',h-B-4);
  a0.setAttribute('x',L);a0.setAttribute('y',h-5);a1.setAttribute('x',w-R);a1.setAttribute('y',h-5);
  drawPins(-1);drawCursor();
}
function sorted(){return pins.slice().sort(function(a,b){return a-b})}
function drawPins(nw){
  while(gp.firstChild)gp.removeChild(gp.firstChild);
  var s=sorted();
  s.forEach(function(k,n){var g=el('g',{'class':k===nw?'pp6-new':''},gp);
    el('circle',{cx:X(k),cy:Y(S[k]),r:6,fill:'var(--pack-accent)',stroke:'var(--pack-surface)','stroke-width':2},g);
    tx('text',{x:X(k),y:Math.max(12,Y(S[k])-10),'text-anchor':'middle','font-weight':700,style:'fill:var(--pack-accent)'},g,'AB'[n]);});
  if(s.length===2){dl.setAttribute('x1',X(s[0]));dl.setAttribute('y1',Y(S[s[0]]));dl.setAttribute('x2',X(s[1]));dl.setAttribute('y2',Y(S[s[1]]));dl.style.opacity=1}
  else dl.style.opacity=0;
}
function drawCursor(){
  var f=Math.floor(ax),c=Math.min(N-1,f+1),t=ax-f,v=S[f]+(S[c]-S[f])*t,x=X(ax);
  cl.setAttribute('x1',x);cl.setAttribute('x2',x);cl.setAttribute('y1',T-4);cl.setAttribute('y2',h-B);
  cd.setAttribute('cx',x);cd.setAttribute('cy',Y(v));
}
function say(m){$('pp6-live').textContent=m}
function ui(){
  var v=S[cur],off=v-SLO,ro=$('pp6-ro');
  $('pp6-rt').textContent=tl(cur);$('pp6-rv').textContent=v+' ms';
  ro.textContent=off>0?'+'+off+' over SLO':(-off)+' under SLO';ro.className='pp6-ro'+(off>0?' pp6-over':'');
  var has=pins.indexOf(cur)>=0,k=has?(just?3:4):pins.length;
  Array.prototype.forEach.call(btn.children,function(s,n){s.className=n===k?'pp6-on':''});
  btn.setAttribute('aria-disabled',has?'true':'false');
  while(delta.firstChild)delta.removeChild(delta.firstChild);
  var s=sorted();
  if(s.length===2){var d=S[s[1]]-S[s[0]],b=document.createElement('b'),sm=document.createElement('small');
    b.textContent=(d>=0?'+':'\u2212')+Math.abs(d)+' ms p99';sm.textContent='over '+dur(s[1]-s[0]);
    delta.appendChild(b);delta.appendChild(sm);}
  else{var p=document.createElement('small');p.textContent=s.length?'Pin one more to compare.':'Two pins give a delta.';delta.appendChild(p)}
}
function chipsUI(){
  while(chips.firstChild)chips.removeChild(chips.firstChild);
  var s=sorted();
  if(!s.length){var n=document.createElement('span');n.className='pp6-none';n.textContent='No pins yet';chips.appendChild(n);return}
  s.forEach(function(k,n){var c=document.createElement('div');c.className='pp6-chip';
    var j=document.createElement('button');j.type='button';j.className='pp6-btn pp6-cj';j.textContent='AB'[n]+' '+tl(k);
    j.addEventListener('click',function(){setCur(k,true)});
    j.addEventListener('keydown',function(e){if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();unpin(k)}});
    var x=document.createElement('button');x.type='button';x.className='pp6-btn pp6-cx';x.textContent='\u00d7';
    x.setAttribute('aria-label','Remove pin '+'AB'[n]+', '+tl(k));
    x.addEventListener('click',function(){unpin(k)});
    c.appendChild(j);c.appendChild(x);chips.appendChild(c);});
}
function pin(){
  if(pins.indexOf(cur)>=0){just=false;ui();say('Already pinned. No change.');return}
  var msg='Pinned '+tl(cur);
  if(pins.length===2)msg+=', replaced '+tl(pins.shift());
  pins.push(cur);just=true;drawPins(cur);chipsUI();ui();
  var s=sorted();if(s.length===2)msg+='. Delta '+delta.textContent;
  say(msg);
}
function unpin(k){pins.splice(pins.indexOf(k),1);just=false;drawPins(-1);chipsUI();ui();btn.focus();say('Removed pin '+tl(k))}
function setCur(k,anim){k=Math.max(0,Math.min(N-1,k));if(k!==cur)just=false;cur=k;
  if(!anim||reduce()){ax=cur;drawCursor()}else kick();ui()}
function step(dt){ax+=(cur-ax)*(1-Math.pow(.72,dt));if(Math.abs(cur-ax)<.01){ax=cur;return false}return true}
function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
  var moving=reduce()?(ax=cur,false):step(dt);drawCursor();raf=moving?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0;ax=cur;drawCursor()}});
function fromX(cx){var r=plot.getBoundingClientRect();setCur(Math.round((cx-r.left-L)/(r.width-L-R)*(N-1)),false)}
plot.addEventListener('pointerdown',function(e){drag=true;plot.setPointerCapture(e.pointerId);fromX(e.clientX)});
plot.addEventListener('pointermove',function(e){if(drag)fromX(e.clientX)});
['pointerup','pointercancel'].forEach(function(t){plot.addEventListener(t,function(){drag=false})});
plot.addEventListener('keydown',function(e){var k=e.key,m={ArrowLeft:-1,ArrowRight:1,ArrowDown:-1,ArrowUp:1,PageDown:-12,PageUp:12};
  if(m[k]!==undefined)setCur(cur+m[k],false);
  else if(k==='Home')setCur(0,true);else if(k==='End')setCur(N-1,true);
  else if(k==='Escape')setCur(WORST,true);
  else if(k==='p'||k==='P'||k==='Enter'||k===' ')pin();else return;
  e.preventDefault()});
LB.forEach(function(t){var s=document.createElement('span');s.textContent=t;btn.appendChild(s)});
btn.addEventListener('click',pin);
new ResizeObserver(function(){var r=plot.getBoundingClientRect();w=Math.max(60,r.width);h=Math.max(60,r.height);drawStatic()}).observe(plot);
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.setAttribute('data-theme',m.theme);ui()}});
chipsUI();ui();
})();</script>
</body></html>
