<style>

<div class="lc4-root" id="lc4-root" role="group" aria-label="Cursor chart: checkout-api p99 latency">
 <div class="lc4-head"><div class="lc4-title">checkout-api · p99 latency</div><div class="lc4-sub">Forever plan · last 6h · 5 min samples</div></div>
 <div class="lc4-read" aria-hidden="true"><span class="lc4-time" id="lc4-t"></span><span class="lc4-val"><small>p99</small><span id="lc4-v"></span><small>ms</small></span><span class="lc4-delta" id="lc4-o"></span></div>
 <div class="lc4-plot" id="lc4-plot" tabindex="0" role="group" aria-label="Latency plot" aria-describedby="lc4-hint">

  <div class="lc4-hint" id="lc4-hint"></div>
  <div class="lc4-empty">No samples in range</div>

 <div class="lc4-foot"><span class="lc4-stat" id="lc4-stat">Updated 15:55</span><button class="lc4-btn" id="lc4-reload" type="button">Reload</button><button class="lc4-btn" id="lc4-toggle" type="button">Empty</button></div>

<script>(function(){

  var SLO=300,YMAX=700,N=72,T0=600,DEP=52,PL=30,PR=8,PT=14,PB=18;
  var HINT='Drag across the chart to read any point',KEYS='\u2190 \u2192 5 min · PgUp/PgDn 1 h · Esc worst';
  var data=[],s=11,i,k;
  function rnd(){s=(s*9301+49297)%233280;return s/233280}

  var bump={14:334,15:352,16:311,33:308,34:319,51:228,52:262,53:418,54:566,55:640,56:604,57:472,58:296,66:348,67:331};
  for(k in bump)data[k]=bump[k];
  var empty=false,stale=false,gen=0,timer=0,drag=false,w=0,h=0,idx=0,cx=0,at=0;

  function X(j){return PL+(w-PL-PR)*j/(N-1)}
  function Y(v){return PT+(h-PT-PB)*(1-v/YMAX)}
  var NS='http://www.w3.org/2000/svg';
  function set(e,a){for(var q in a)e.setAttribute(q,a[q]);return e}
  function el(t,a,p){var e=set(document.createElementNS(NS,t),a);(p||svg).appendChild(e);return e}

  var clip=el('rect',{},el('clipPath',{id:'lc4-clip'},el('defs',{})));
  var grid=el('g',{}),dep=el('line',{'class':'lc4-dep'}),depT=tx(0,0,'','end'),slo=el('line',{'class':'lc4-slo'}),sloT=tx(0,0,'SLO 300','end');
  var g=el('g',{'class':'lc4-data'}),area=el('path',{'class':'lc4-area'},g),br=el('path',{'class':'lc4-br','clip-path':'url(#lc4-clip)'},g),line=el('path',{'class':'lc4-line'},g),cur=el('line',{'class':'lc4-cur'},g),dot=el('circle',{'class':'lc4-dot',r:4.5},g);

    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    while(grid.firstChild)grid.removeChild(grid.firstChild);
    [0,200,400,600].forEach(function(v){var y=Y(v);el('line',{x1:PL,x2:w-PR,y1:y,y2:y,'class':'lc4-grid'},grid);if(v)tx(PL-4,y+3,v,'end',grid)});

    var y3=Y(SLO),xd=X(DEP);
    set(slo,{x1:PL,x2:w-PR,y1:y3,y2:y3});set(sloT,{x:w-PR,y:y3-4});
    set(dep,{x1:xd,x2:xd,y1:PT,y2:h-PB});set(depT,{x:xd-4,y:PT-3});depT.textContent=w>=320?'cat-pics-2 deploy':'deploy';
    var p='';for(var j=0;j<N;j++)p+=(j?'L':'M')+X(j).toFixed(1)+','+Y(data[j]).toFixed(1);
    var a=p+'L'+X(N-1)+','+Y(0)+'L'+X(0)+','+Y(0)+'Z';
    set(line,{d:p});set(area,{d:a});set(br,{d:a});set(clip,{x:0,y:0,width:w,height:y3});
  }
  function draw(){
    if(!w)return;
    var i0=Math.floor(cx),i1=Math.min(i0+1,N-1),f=cx-i0,v=data[i0]+(data[i1]-data[i0])*f,x=X(cx);

  }
  function readout(){

    $('t').textContent=fmt(idx);$('v').textContent=v;
    $('o').textContent=o>0?'+'+o+' over SLO':o<0?'\u2212'+(-o)+' under SLO':'At SLO';
    if(o>0)root.setAttribute('data-over','');else root.removeAttribute('data-over');

    var moving=reduce()?(cx=idx,false):step(dt);draw();

    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){

  function pick(e){var r=plot.getBoundingClientRect();setIdx(Math.round((e.clientX-r.left-PL)/(w-PL-PR)*(N-1)),false)}
  plot.addEventListener('pointerdown',function(e){if(empty)return;drag=true;try{plot.setPointerCapture(e.pointerId)}catch(_){}pick(e)});
  plot.addEventListener('pointermove',function(e){if(!empty&&(drag||e.pointerType==='mouse'))pick(e)});
  plot.addEventListener('pointerup',function(){drag=false});
  plot.addEventListener('pointercancel',function(){drag=false});

    if(stale)return;

    timer=setTimeout(function(){if(my!==gen)return;setStale(false);stat.textContent=empty?'Range empty':'Updated 15:55';readout()},900);
  });
  tog.addEventListener('click',function(){
    gen++;clearTimeout(timer);setStale(false);empty=!empty;
    if(empty){root.setAttribute('data-empty','');tog.textContent='Restore';stat.textContent='Range empty'}
    else{root.removeAttribute('data-empty');tog.textContent='Empty';stat.textContent='Updated 15:55';idx=cx=worst()}
    readout();kick();
  });

  hint.textContent=HINT;idx=cx=worst();layout();readout();draw();
})();</script>
