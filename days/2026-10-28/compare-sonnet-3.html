<title>Percentile tiles for checkout-api latency</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');

<style>

.ab3-t{appearance:none;font:inherit;color:inherit;text-align:left;box-sizing:border-box;min-height:46px;min-width:0;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--pack-radii-control);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;touch-action:none;transition:border-color var(--pack-motion-duration) var(--pack-motion-easing),background var(--pack-motion-duration) var(--pack-motion-easing),transform 90ms var(--pack-motion-easing)}
.ab3-t:hover{border-color:var(--mut)}

.ab3-t[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--sf)}
.ab3-t:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab3-n{font-size:.8em;color:var(--mut)}
.ab3-t[aria-pressed=true] .ab3-n{color:var(--acc)}
.ab3-v{font-size:1.15em;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.ab3-w .ab3-g{grid-template-columns:none}
.ab3-w .ab3-t{min-height:96px;justify-content:flex-start;padding:12px}
.ab3-w .ab3-d{display:block}

</style><style data-pack-tokens>:root{--pack-typography-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--pack-typography-size:14px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#111315;--pack-surface:#1A1D20;--pack-text:#E6E4DF;--pack-muted:#9A9790;--pack-accent:#7FA8C9;--pack-border:#2C3035}:root[data-theme="light"]{--pack-bg:#F5F4F1;--pack-surface:#FFFFFF;--pack-text:#1C1E21;--pack-muted:#5F5D58;--pack-accent:#3C6A8E;--pack-border:#D9D6D0}</style></head><body>
<div class="ab3-root" id="ab3-root" role="group" aria-label="Percentile tiles: pick the series the latency chart plots"></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var D=[{n:'p50',v:'92 ms',d:'Typical cart',o:'Forever calm',lo:70,hi:92},
    {n:'p95',v:'310 ms',d:'Slowest 1 in 20',o:'Warm, not on fire',lo:140,hi:310},
    {n:'p99',v:'640 ms',d:'Slowest 1 in 100',o:'340 ms over SLO',lo:180,hi:640},
    {n:'Errors',v:'2.4%',d:'Failed checkouts',o:'Emotional baggage',lo:.3,hi:2.4}];
  var N=24,PK=11,root=document.getElementById('ab3-root'),tiles=[],sel=2,wide=false;
  var tr=[1,1,1,1],tt=[1,1,1,1],ys=[],ty=[],raf=0,last=0,drag=false,moved=false;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function ns(t,a){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);return e}
  function ys_for(s){var d=D[s],o=[],i,p,q;
    for(i=0;i<N;i++){p=i<8?.1:i<PK+1?.1+.9*(i-7)/4:1-.45*(1-Math.exp(-(i-PK)/5));
      if(i!==PK)p+=Math.sin(i*12.99+s*78.2)*.025;p=Math.max(0,Math.min(1,p));
      q=(d.lo+(d.hi-d.lo)*p)/d.hi;o.push(4+(1-q)*32)}
    return o}
  ty=ys_for(sel);ys=ty.slice();
  var hint=el('div','ab3-h','Pick a series for the chart');
  var grid=el('div','ab3-g');grid.setAttribute('role','group');grid.setAttribute('aria-label','Series');
  D.forEach(function(d,i){var b=el('button','ab3-t');b.type='button';b.setAttribute('aria-pressed',i===sel);
    b.appendChild(el('span','ab3-n',d.n));b.appendChild(el('span','ab3-v',d.v));b.appendChild(el('span','ab3-d',d.d));
    b.addEventListener('click',function(){if(moved){moved=false;return}select(i)});
    b.addEventListener('keydown',function(e){var k=e.key,j=-1;
      if(k==='ArrowRight'||k==='ArrowDown')j=(i+1)%4;else if(k==='ArrowLeft'||k==='ArrowUp')j=(i+3)%4;
      if(j>=0){e.preventDefault();tiles[j].focus()}});
    tiles.push(b);grid.appendChild(b)});
  var panel=el('div','ab3-p'),cap=el('div','ab3-c'),c1=el('b'),c2=el('span');
  cap.setAttribute('aria-live','polite');cap.appendChild(c1);cap.appendChild(c2);
  var svg=ns('svg',{viewBox:'0 0 100 40',preserveAspectRatio:'none','aria-hidden':'true'});svg.setAttribute('class','ab3-s');
  var base=ns('line',{x1:0,x2:100,y1:36,y2:36,stroke:'var(--pack-border)','stroke-width':1,'vector-effect':'non-scaling-stroke'});
  var area=ns('path',{fill:'var(--pack-accent)','fill-opacity':.14});
  var line=ns('path',{fill:'none',stroke:'var(--pack-accent)','stroke-width':2,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'});
  var dot=ns('path',{fill:'none',stroke:'var(--pack-accent)','stroke-width':8,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'});
  [base,area,line,dot].forEach(function(n){svg.appendChild(n)});
  panel.appendChild(cap);panel.appendChild(svg);
  root.appendChild(hint);root.appendChild(grid);root.appendChild(panel);
  function caption(){var d=D[sel];c1.textContent='Chart plots '+d.n;c2.textContent=d.v+' \u00b7 '+d.o}
  function retarget(){for(var i=0;i<4;i++)tt[i]=wide&&i===sel?2.2:1;ty=ys_for(sel)}
  function select(i){if(i===sel)return;sel=i;
    tiles.forEach(function(b,j){b.setAttribute('aria-pressed',j===sel)});
    caption();retarget();if(!wide)tr=tt.slice();kick()}
  function step(dt){var k=1-Math.pow(1-.14,dt),e=0,i;
    for(i=0;i<4;i++){tr[i]+=(tt[i]-tr[i])*k;e+=Math.abs(tt[i]-tr[i])}
    for(i=0;i<N;i++){ys[i]+=(ty[i]-ys[i])*k;e+=Math.abs(ty[i]-ys[i])*.1}
    if(e<.002){snapToTarget();return false}return true}
  function snapToTarget(){tr=tt.slice();ys=ty.slice()}
  function draw(){
    grid.style.gridTemplateColumns=wide?tr.map(function(v){return 'minmax(0,'+v.toFixed(3)+'fr)'}).join(' '):'';
    var p=ys.map(function(y,i){return (i*100/(N-1)).toFixed(2)+' '+y.toFixed(2)}).join('L');
    line.setAttribute('d','M'+p);area.setAttribute('d','M'+p+'L100 36L0 36Z');
    dot.setAttribute('d','M'+(PK*100/(N-1)).toFixed(2)+' '+ys[PK].toFixed(2)+'h0')}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

    root.classList.toggle('ab3-xs',w<220);
    if(nw!==wide||!root.dataset.m){wide=nw;root.dataset.m=1;root.classList.toggle('ab3-w',wide);retarget();tr=tt.slice();draw();kick()}}
  grid.addEventListener('pointerdown',function(e){drag=true;moved=false;
    if(e.target.releasePointerCapture)try{e.target.releasePointerCapture(e.pointerId)}catch(x){}});
  grid.addEventListener('pointermove',function(e){if(!drag)return;
    var u=document.elementFromPoint(e.clientX,e.clientY),t=u&&u.closest?u.closest('.ab3-t'):null,i=tiles.indexOf(t);
    if(i>=0&&i!==sel){moved=true;select(i)}});
  function up(){drag=false}
  grid.addEventListener('pointerup',up);grid.addEventListener('pointercancel',up);
  root.addEventListener('keydown',function(e){moved=false;if(e.key==='Escape')select(2)});
  new ResizeObserver(mode).observe(root);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  caption();mode();draw();
})();</script>
</body></html>
