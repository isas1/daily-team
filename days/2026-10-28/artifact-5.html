<script>(function(){
  var $=function(i){return document.getElementById('bs5-'+i)};
  var root=document.querySelector('.bs5-root'),plot=$('plot'),runsG=$('runs'),ln=$('ln'),cx=$('cx'),cy=$('cy'),
      r1=$('r1'),r2=$('r2'),ct=$('ct'),pv=$('pv'),nx=$('nx'),rg=[].slice.call(document.querySelectorAll('.bs5-rg'));
  var NS='http://www.w3.org/2000/svg';

  var D=[];for(var i=0;i<72;i++)D.push(O[i]||Math.round(182+14*Math.sin(i*.9)+9*Math.sin(i*2.3)));

      ct.textContent='No breaches';r1.appendChild(span('No breaches in '+range+' · peak '+mx+' ms'));
      r2.textContent='Switch to 6h to step through 4.';}
    var f=document.activeElement;

  }

    while(h>0){var s=Math.min(h,1/120);h-=s;vx+=(w*w*(tx-x)-2*w*vx)*s;x+=vx*s}
    if(Math.abs(tx-x)<.005&&Math.abs(vx)<.02){x=tx;vx=0;return false}return true}

  function draw(){
    var c=Math.max(0,Math.min(n-1,x)),i0=Math.floor(c),i1=Math.min(n-1,i0+1),f=c-i0,
