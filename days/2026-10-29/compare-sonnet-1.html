<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose files empty state: importing a brand kit into a poster</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:var(--pack-bg);--ink:var(--pack-text);--acc:var(--pack-accent)}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size)}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;box-sizing:border-box;padding:clamp(8px,3vmin,var(--pack-spacing-padding));display:flex;flex-direction:column;gap:calc(var(--pack-spacing-gap)/2);container-type:inline-size}
.ab1-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ab1-zone{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(var(--pack-spacing-gap),3cqw);padding:8px;font:inherit;color:var(--pack-text);background:var(--pack-surface);border:2px dashed var(--pack-border);border-radius:var(--pack-radii-control);cursor:pointer;text-align:center;overflow:auto;transition:border-color var(--pack-motion-duration) var(--pack-motion-easing),background var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-zone:hover{border-color:var(--pack-accent)}
.ab1-zone.ab1-over{border-style:solid;border-color:var(--pack-accent);background:color-mix(in srgb,var(--pack-accent) 12%,var(--pack-surface))}
.ab1-zone svg,.ab1-ok svg{width:clamp(22px,13cqw,40px);height:auto;stroke:var(--pack-accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ab1-title{font-weight:650;font-size:clamp(12px,6cqw,18px);line-height:1.2}
.ab1-sub{color:var(--pack-muted);font-size:clamp(11px,5cqw,14px);line-height:1.2}
.ab1-cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:clamp(120px,50cqw,180px);box-sizing:border-box;padding:0 16px;border-radius:var(--pack-radii-control);background:var(--pack-accent);color:var(--pack-bg);font-weight:650;font-size:clamp(12px,5.6cqw,16px);box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform 90ms var(--pack-motion-easing),box-shadow 90ms var(--pack-motion-easing)}
.ab1-zone:active .ab1-cta,.ab1-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.ab1-zone:focus-visible,.ab1-btn:focus-visible,.ab1-head:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.ab1-note{min-height:1.3em;margin:0;text-align:center;color:var(--pack-muted);font-size:clamp(11px,5cqw,14px)}
.ab1-res{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(var(--pack-spacing-gap),2.5cqw);padding:8px;text-align:center;overflow:auto;background:var(--pack-surface);border:2px solid var(--pack-border);border-radius:var(--pack-radii-control)}
.ab1-res[hidden],.ab1-zone[hidden],.ab1-note[hidden]{display:none}
.ab1-head{font-weight:650;font-size:clamp(14px,7cqw,20px);margin:0}
.ab1-list{list-style:none;margin:0;padding:0;max-width:100%;color:var(--pack-muted);font-size:clamp(11px,5cqw,14px);line-height:1.35}
.ab1-list li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab1-btn{font:inherit;font-weight:650;font-size:clamp(12px,5.6cqw,16px);min-height:44px;box-sizing:border-box;padding:0 16px;color:var(--pack-text);background:transparent;border:2px solid var(--pack-border);border-radius:var(--pack-radii-control);cursor:pointer;transition:border-color var(--pack-motion-duration) var(--pack-motion-easing),transform 90ms var(--pack-motion-easing)}
.ab1-btn:hover{border-color:var(--pack-accent)}
@media (prefers-reduced-motion:reduce){.ab1-root *{transition:none!important}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:8px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#0f1012;--pack-surface:#17181b;--pack-text:#ececef;--pack-muted:#a0a1a8;--pack-accent:#6aa8ff;--pack-border:#2a2c31}:root[data-theme="light"]{--pack-bg:#f7f7f8;--pack-surface:#ffffff;--pack-text:#16171a;--pack-muted:#5b5d66;--pack-accent:#2563c9;--pack-border:#dcdde2}</style></head><body>
<div class="ab1-root" role="group" aria-label="Choose files to import into your poster"></div>
<script>(function(){
  var root=document.querySelector('.ab1-root');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className='ab1-'+c;if(x!=null)e.textContent=x;return e}
  function svg(d){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 40 40');s.setAttribute('aria-hidden','true');
    d.forEach(function(p){var q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',p);s.appendChild(q)});return s}
  var input=el('input','in');input.type='file';input.multiple=true;input.tabIndex=-1;input.setAttribute('aria-hidden','true');
  var zone=el('button','zone');zone.type='button';zone.setAttribute('aria-describedby','ab1-note');
  var icon=svg(['M20 6v18','M12 17l8 8 8-8','M7 26v6h26v-6']);
  var title=el('span','title','Drop brand kit here');
  zone.append(icon,title,el('span','sub','Logos, fonts, photos'),el('span','cta','Choose files'));
  var note=el('p','note','');note.id='ab1-note';note.setAttribute('aria-live','polite');
  var res=el('div','res');res.hidden=true;
  var ok=el('div','ok');ok.appendChild(svg(['M9 21l8 8 14-17']));
  var head=el('h2','head','');head.tabIndex=-1;
  var list=el('ul','list');
  var status=el('p','note','');status.setAttribute('aria-live','polite');
  var again=el('button','btn','Choose other files');again.type='button';
  res.append(ok,head,list,status,again);
  root.append(input,zone,note,res);

  /* motion: reveal (rv) and icon nudge (ic), eased on draw, 180 ms */
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,rv=1,rvT=1,ic=0,icT=0,DUR=180;
  function ease(p){return 1-(1-p)*(1-p)}
  function move(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d)}
  function step(dt){var d=dt/DUR;rv=move(rv,rvT,d);ic=move(ic,icT,d);return rv!==rvT||ic!==icT}
  function snapToTarget(){rv=rvT;ic=icT}
  function draw(){var r=ease(rv);res.style.opacity=r;res.style.transform='translateY('+(6*(1-r)).toFixed(2)+'px)';
    icon.style.transform='translateY('+(3*ease(ic)).toFixed(2)+'px)'}
  function frame(now){var dt=last?Math.min(now-last,50):16;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});

  function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
  function take(files){
    if(!files||!files.length){note.textContent='Nothing dropped. Try Choose files.';zone.focus();return}
    var f=[].slice.call(files),sum=f.reduce(function(a,x){return a+x.size},0);
    head.textContent=f.length+(f.length===1?' file':' files')+' \u00b7 '+fmt(sum);
    list.textContent='';
    f.slice(0,3).forEach(function(x){list.appendChild(el('li',null,x.name))});
    if(f.length>3)list.appendChild(el('li',null,'+'+(f.length-3)+' more'));
    status.textContent='Import started: reading '+f.length+(f.length===1?' file':' files');
    note.textContent='';zone.hidden=true;note.hidden=true;res.hidden=false;
    rv=0;rvT=1;draw();kick();
    head.focus();
  }
  function reset(){
    res.hidden=true;zone.hidden=false;note.hidden=false;note.textContent='';
    input.value='';over(false);depth=0;zone.focus();
  }
  zone.addEventListener('click',function(){note.textContent='';input.click()});
  input.addEventListener('change',function(){if(input.files&&input.files.length)take(input.files)});
  again.addEventListener('click',reset);
  root.addEventListener('keydown',function(e){if(e.key==='Escape'&&!res.hidden){e.preventDefault();reset()}});

  var depth=0;
  function over(on){zone.classList.toggle('ab1-over',on);title.textContent=on?'Drop to import':'Drop brand kit here';icT=on?1:0;kick()}
  zone.addEventListener('dragenter',function(e){e.preventDefault();depth++;over(true)});
  zone.addEventListener('dragover',function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy'});
  zone.addEventListener('dragleave',function(){depth=Math.max(0,depth-1);if(!depth)over(false)});
  zone.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();depth=0;over(false);take(e.dataTransfer&&e.dataTransfer.files)});
  ['dragover','drop'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault()})});

  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  draw();
})();</script>
</body></html>
