  sum.hidden=!(p==='done'||p==='failed');if(!sum.hidden)renderSummary();
  renderCanvas();set(cmsg,S.cmsg);
  var dis=true,lab='Nothing to undo',ic='↶';
  if(S.flash){lab=S.flash;ic='✓'}
  else if(b){lab='Undo import'}
  else if(S.undo.length){lab='Undo import';dis=false}
  else if(S.redo.length){lab='Redo import';ic='↷';dis=false}
  set(ulbl,lab);set(uico,ic);undoB.setAttribute('aria-disabled',String(dis||!!S.flash));
  renderManifest();
  if(S.focusTo){var t=S.focusTo==='zone'?zone:S.focusTo==='sum'?sh:cancelB;S.focusTo='';t.focus()}
  else if(D.activeElement===cancelB&&cancelB.hidden)zone.focus()}

/* loop */
var raf=0,last=0;
function frame(now){raf=0;var ms=last?Math.min(now-last,50):16;last=now;var mv=false;
  if(busy()){tickJob(ms);mv=busy()}
  mv=animTray(now)||mv;mv=animHl(now)||mv;
  render();if(mv)raf=requestAnimationFrame(frame);else last=0}
function kick(){if(!raf&&!D.hidden){last=0;raf=requestAnimationFrame(frame)}}
D.addEventListener('visibilitychange',function(){if(D.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
mq.addEventListener('change',function(){render();kick()});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){D.documentElement.setAttribute('data-theme',m.theme);render()}});

/* inputs */
function labelFor(list){return list.length===1?list[0].name:plural(list.length,'chosen file')}
function realFiles(fl){var a=[];for(var i=0;i<fl.length;i++)a.push({name:fl[i].name,size:fl[i].size});return a}
zone.addEventListener('click',function(){S.note=NOTE;S.noteKind='';render();input.click()});
input.addEventListener('change',function(){if(input.files&&input.files.length){var a=realFiles(input.files);input.value='';begin(a,labelFor(a))}});
var depth=0;
zone.addEventListener('dragenter',function(e){e.preventDefault();depth++;emptyBox.classList.add('bk-over');set(zhint,'Drop to import')});
zone.addEventListener('dragover',function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy'});
zone.addEventListener('dragleave',function(){if(--depth<=0){depth=0;emptyBox.classList.remove('bk-over');set(zhint,'Drop files here, or')}});
zone.addEventListener('drop',function(e){e.preventDefault();depth=0;emptyBox.classList.remove('bk-over');set(zhint,'Drop files here, or');
  var fl=e.dataTransfer&&e.dataTransfer.files;if(!fl||!fl.length){noFiles();return}var a=realFiles(fl);begin(a,labelFor(a))});
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('drop',function(e){e.preventDefault()});
sampleB.addEventListener('click',function(){if(busy())return;
  begin(SAMPLE.map(function(s){return{name:s[0],size:s[1],cfail:s[2]}}),'brand-kit.zip')});
failB.addEventListener('click',function(){if(busy())return;S.fail=!S.fail;render()});
cancelB.addEventListener('click',cancel);
undoB.addEventListener('click',function(){if(S.flash)return;if(S.undo.length)doUndo();else if(S.redo.length)doRedo();else{S.cmsg='Nothing to undo';render()}});
skipB.addEventListener('click',function(){var j=S.job,first=-1;
  j.files.forEach(function(f,i){if(f.st==='s'){toggle(i,true);if(first<0)first=i}});
  if(first>=0){select(first,true);say('Showing skipped files in Files')}});
again.addEventListener('click',function(){var pick=again.textContent==='Choose other files';goIdle(NOTE,'',true);if(pick)input.click()});
D.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(k==='z'||k==='y')){e.preventDefault();if(e.repeat)return;if(k==='y'||e.shiftKey)doRedo();else doUndo();return}
  if(k==='escape'&&S.phase==='running'){e.preventDefault();cancelB.classList.add('bk-down');setTimeout(function(){cancelB.classList.remove('bk-down')},120);cancel();return}
  if((k==='enter'||k===' ')&&e.target&&e.target.tagName==='BUTTON')e.target.classList.add('bk-down')});
D.addEventListener('keyup',function(e){if(e.target&&e.target.classList)e.target.classList.remove('bk-down')});
D.addEventListener('focusout',function(e){if(e.target&&e.target.classList)e.target.classList.remove('bk-down')});

render();
})();</script>
</body></html>
