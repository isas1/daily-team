<style>

</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:8px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#0f1012;--pack-surface:#17181b;--pack-text:#ececef;--pack-muted:#a0a1a8;--pack-accent:#6aa8ff;--pack-border:#2a2c31}:root[data-theme="light"]{--pack-bg:#f7f7f8;--pack-surface:#ffffff;--pack-text:#16171a;--pack-muted:#5b5d66;--pack-accent:#2563c9;--pack-border:#dcdde2}</style></head><body>
<div class="ci3-root" role="group" aria-label="Cancel import for Spring poster.canvas">
<div class="ci3-p">
<div><p class="ci3-t" id="ci3-t">Importing brand-kit.zip</p><p class="ci3-sub">14 files · 3.2 MB into Spring poster.canvas</p></div>
<ol class="ci3-sg" id="ci3-sg" aria-label="Import stages"></ol>
<p class="ci3-now" id="ci3-now"></p>
<div class="ci3-cv"><p class="ci3-ch"><b>Canvas</b> <span id="ci3-n"></span></p><ul class="ci3-chips" id="ci3-l" aria-label="Canvas layers"></ul></div>
<p class="ci3-st" id="ci3-st" role="status" aria-live="polite"></p>
<button type="button" class="ci3-btn" id="ci3-c"><span class="ci3-lb" id="ci3-cl">Cancel import</span><kbd class="ci3-k" id="ci3-k">Esc</kbd></button>
<button type="button" class="ci3-btn ci3-go" id="ci3-g" hidden></button>
</div></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var $=function(i){return document.getElementById(i)};
  var tEl=$('ci3-t'),sg=$('ci3-sg'),now=$('ci3-now'),cnt=$('ci3-n'),list=$('ci3-l'),stEl=$('ci3-st'),cb=$('ci3-c'),cl=$('ci3-cl'),kb=$('ci3-k'),gb=$('ci3-g');
  var BASE=['background','logo-mark','hero-photo','headline','subhead','Monday date-line','Forever badge','footer','grid'];
  var IN=['logo-mark','hero-photo','headline','cat-pics-2','emotional-baggage','forever-wordmark','icon-set','pattern-a','pattern-b','sticker-monday','swatch-sheet','type-specimen'];
  var S=[{n:'Read',tot:14,ms:70},{n:'Check',tot:14,ms:70},{n:'Convert',tot:13,ms:240},{n:'Place',tot:12,ms:700}];
  var lis=S.map(function(s){var li=document.createElement('li'),g=document.createElement('span'),t=document.createElement('span');
    g.className='ci3-g';t.className='ci3-sn';t.textContent=s.n;li.appendChild(g);li.appendChild(t);sg.appendChild(li);return li});
  var st='idle',job=null,layers=[],placed=[],rb=[],rbN=0,stop=0,raf=0,last=0;
  function set(el,t){if(el.textContent!==t)el.textContent=t}
  function chip(L){var li=document.createElement('li');li.className='ci3-chip';li.textContent=L.name;L.el=li;return li}
  function resetCanvas(){list.replaceChildren();layers=BASE.map(function(n,i){return{id:'b'+i,name:n,tag:''}});
    layers.forEach(function(L){list.appendChild(chip(L))})}
  function placeOne(k){var name=IN[k],ex=null;
    for(var i=0;i<layers.length;i++)if(layers[i].name===name&&!layers[i].tag){ex=layers[i];break}
    if(ex){ex.tag='rep';ex.el.classList.add('ci3-rep');placed.push({L:ex,rep:true})}
    else{var L={id:'n'+k,name:name,tag:'new'};layers.push(L);var el=chip(L);el.classList.add('ci3-new','ci3-in');list.appendChild(el);placed.push({L:L,rep:false});list.scrollTop=list.scrollHeight}}
  function undoOne(p){var L=p.L;
    if(p.rep){L.tag='';L.el.classList.remove('ci3-rep')}
    else{layers.splice(layers.indexOf(L),1);var el=L.el;el.classList.remove('ci3-in');el.classList.add('ci3-out');
      if(reduce())el.remove();else setTimeout(function(){el.remove()},200)}

  function onAbort(){st='cxl';stop=job.s;rb=placed.slice().reverse();rbN=rb.length;job.t=0;render();kick()}
  function start(){if(st==='run'||st==='cxl'||st==='cxd')return;
    resetCanvas();placed=[];job={s:0,n:0,t:0,ctrl:new AbortController()};
    job.ctrl.signal.addEventListener('abort',onAbort);st='run';render();kick()}
  function cancel(){if(st!=='run')return;job.ctrl.abort()}
  function step(ms){
    if(st==='run'){if(job.ctrl.signal.aborted)return true;job.t+=ms;var s=S[job.s];
      while(job.t>=s.ms){job.t-=s.ms;job.n++;if(job.s===3)placeOne(job.n-1);
        if(job.n>=s.tot){if(job.s===3){st='done';return false}job.s++;job.n=0;s=S[job.s]}}
      return true}
    if(st==='cxl'){
      if(reduce()){while(rb.length)undoOne(rb.shift())}
      else{job.t+=ms;while(rb.length&&job.t>=140){job.t-=140;undoOne(rb.shift())}}
      if(!rb.length){st='cxd';job.t=0}return true}
    if(st==='cxd'){job.t+=ms;if(job.t>=900){st='idle';return false}return true}
    return false}
  function render(){
    var s=job?S[job.s]:S[0],stopped=st==='cxl'||st==='cxd'||st==='idle';
    set(tEl,st==='done'?'Imported brand-kit.zip':stopped?'Import cancelled':'Importing brand-kit.zip');
    lis.forEach(function(li,i){var c='';
      if(st==='done'||(job&&i<job.s))c='ci3-ok';else if(st==='run'&&i===job.s)c='ci3-on';else if(stopped&&i===stop)c='ci3-stop';
      if(li.className!==c)li.className=c;
      if(c==='ci3-on')li.setAttribute('aria-current','step');else li.removeAttribute('aria-current')});
    set(now,st==='run'?s.n+' · '+job.n+' of '+s.tot+(reduce()?' · running':''):st==='done'?'All 4 stages done':st==='cxl'?'Stopping at '+S[stop].n:'Stopped at '+S[stop].n);
    var run=placed.length;set(cnt,layers.length+' layers'+(run?' · '+run+' from this run':''));
    set(stEl,st==='run'?'Cancel removes anything placed so far.':st==='cxl'?(rbN?'Removing '+rbN+' placed layer'+(rbN>1?'s':''):'Stopping'):st==='done'?'12 of 14 placed · 3 replaced · 2 skipped':'Cancelled at '+S[stop].n+' · canvas unchanged');
    var showC=st==='run'||st==='cxl'||st==='cxd';
    set(cl,st==='cxl'?'Cancelling':st==='cxd'?'Cancelled':'Cancel import');
    cb.setAttribute('aria-disabled',st==='run'?'false':'true');kb.hidden=st!=='run';
    if(!showC)cb.classList.remove('ci3-down');
    var hadFocus=document.activeElement===cb||document.activeElement===gb;
    cb.hidden=!showC;gb.hidden=showC;set(gb,st==='done'?'Import again':'Import brand-kit.zip');
    if(hadFocus){var t=showC?cb:gb;if(document.activeElement!==t)t.focus()}}
  function frame(t){var ms=last?Math.min(t-last,50):16;last=t;var moving=step(ms);render();raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  cb.addEventListener('click',cancel);
  gb.addEventListener('click',start);
  [cb,gb].forEach(function(b){
    b.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&b.getAttribute('aria-disabled')!=='true')b.classList.add('ci3-down')});
    b.addEventListener('keyup',function(){b.classList.remove('ci3-down')});
    b.addEventListener('blur',function(){b.classList.remove('ci3-down')})});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&st==='run'){e.preventDefault();
    cb.classList.add('ci3-down');setTimeout(function(){cb.classList.remove('ci3-down')},120);cancel()}});
  document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',render);
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.setAttribute('data-theme',m.theme);render()}});
  start();
  while(st==='run'&&!(job.s===3&&job.n>=4))step(70);
  placed.forEach(function(p){if(p.L.el)p.L.el.classList.remove('ci3-in')});
  render();
})();</script>
