<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cancel import: brand kit into Spring poster</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--pack-bg);color:var(--pack-text);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size)}
*{box-sizing:border-box}
.ci3-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;display:flex;flex-direction:column;gap:var(--pack-spacing-gap);padding:calc(var(--pack-spacing-padding)*.75);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:calc(var(--pack-radii-control)*1.5);overflow:auto}
.ci3-title{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci3-sub{font-size:12px;color:var(--pack-muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci3-status{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;min-height:20px;border-top:1px solid var(--pack-border);padding-top:8px;font-variant-numeric:tabular-nums}
.ci3-status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci3-g{display:inline-block;width:14px;text-align:center;flex:none}
.ci3-list{flex:1;min-height:0;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.ci3-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;min-height:24px;font-size:13px}
.ci3-row b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci3-row i{font-style:normal;font-size:11px;color:var(--pack-muted)}
.ci3-new{animation:ci3-in var(--pack-motion-duration) var(--pack-motion-easing)}
.ci3-out{animation:ci3-out 130ms var(--pack-motion-easing) forwards;text-decoration:line-through}
.ci3-empty{color:var(--pack-muted)}
@keyframes ci3-in{from{opacity:0;transform:translateY(6px)}}
@keyframes ci3-out{to{opacity:0;transform:translateX(-10px)}}
.ci3-btn{flex:none;width:100%;min-height:44px;font:inherit;font-weight:700;color:var(--pack-text);background:var(--pack-surface);border:1.5px solid var(--pack-text);border-radius:var(--pack-radii-control);box-shadow:0 2px 0 var(--pack-border);cursor:pointer;transition:transform 90ms var(--pack-motion-easing),box-shadow 90ms var(--pack-motion-easing),background var(--pack-motion-duration) var(--pack-motion-easing)}
.ci3-btn:active,.ci3-btn.ci3-p{transform:translateY(1px);box-shadow:0 1px 0 var(--pack-border)}
.ci3-btn[aria-disabled=true]{color:var(--pack-muted);border-color:var(--pack-border);border-style:dashed;box-shadow:none;cursor:default;transform:none}
.ci3-btn.ci3-go{background:var(--pack-accent);border-color:var(--pack-accent);color:var(--pack-bg)}
.ci3-btn:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.ci3-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.ci3-new,.ci3-out{animation:none}.ci3-btn{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:12px;--pack-spacing-padding:16px;--pack-radii-control:8px;--pack-motion-duration:180ms;--pack-motion-easing:ease-out;--pack-bg:#0f1012;--pack-surface:#17181b;--pack-text:#ececef;--pack-muted:#a0a1a8;--pack-accent:#6aa8ff;--pack-border:#2a2c31}:root[data-theme="light"]{--pack-bg:#f7f7f8;--pack-surface:#ffffff;--pack-text:#16171a;--pack-muted:#5b5d66;--pack-accent:#2563c9;--pack-border:#dcdde2}</style></head><body>
<div class="ci3-root" id="ci3-root" role="group" aria-label="Cancel import for brand-kit.zip"></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var root=document.getElementById('ci3-root');
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  var N=[['logo-mark.svg',1],['forever-plan.svg',0],['hero-photo.png',1],['cat-pics-2.jpg',0],['headline.svg',1],['emotional-baggage.png',0],['forever-badge.svg',0],['footer-wave.svg',0],['sticker-1.png',0],['sticker-2.png',0],['qr-code.png',0],['cat-pics-3.jpg',0]];
  var FILES=N.map(function(f){return{n:f[0],rep:!!f[1],name:f[0].replace(/\.\w+$/,'')}});
  var placed,layers,state,how,fresh=null,leaving=false,ctrl=null;
  var title=el('div','ci3-title','brand-kit.zip'),sub=el('div','ci3-sub'),
      status=el('div','ci3-status'),sg=el('span','ci3-g'),st=el('span'),
      list=el('ul','ci3-list'),btn=el('button','ci3-btn'),sr=el('div','ci3-sr');
  btn.type='button';sr.setAttribute('aria-live','polite');
  status.append(sg,st);
  var head=el('div');head.append(title,sub);
  root.append(head,status,list,btn,sr);

  /* Timers pause while the tab is hidden and resume with the time left. */
  var timers=new Set();
  function wait(ms,sig){return new Promise(function(res,rej){
    var r={left:ms,t:0,s:0};
    function done(){clearTimeout(r.t);r.t=0;timers.delete(r);if(sig)sig.removeEventListener('abort',ab)}
    function ab(){done();rej(new DOMException('aborted','AbortError'))}
    r.go=function(){if(document.hidden||r.t)return;r.s=Date.now();
      r.t=setTimeout(function(){done();res()},r.left)};
    r.pause=function(){if(!r.t)return;clearTimeout(r.t);r.t=0;r.left-=Date.now()-r.s};
    if(sig&&sig.aborted)return rej(new DOMException('aborted','AbortError'));
    if(sig)sig.addEventListener('abort',ab,{once:true});
    timers.add(r);r.go()})}
  document.addEventListener('visibilitychange',function(){
    timers.forEach(function(r){document.hidden?r.pause():r.go()})});

  function render(){
    sub.textContent='Spring poster.canvas \u00b7 '+layers+' layers';
    var g='\u25a0',t='Place \u00b7 '+placed.length+' of 12';
    if(state==='cancelling'){var f=placed[placed.length-1];g='\u25a1';t=f?(f.rep?'Restoring ':'Removing ')+f.name:'Rolling back'}
    else if(state==='cancelled'||(state==='ended'&&how==='cancel')){g='\u00d7';t='Cancelled at Place'}
    else if(state==='ended'){g='\u2713';t='Imported '+placed.length+' of 12'}
    sg.textContent=g;st.textContent=t;
    list.replaceChildren();
    if(!placed.length&&state!=='running'){
      var e=el('li','ci3-row ci3-empty');e.append(el('span','ci3-g','\u25a1'),el('b',null,'Canvas unchanged'),el('i',null,'9 layers'));list.append(e)}
    placed.slice(-4).forEach(function(f,i,a){
      var li=el('li','ci3-row'+(f===fresh?' ci3-new':'')+(leaving&&i===a.length-1?' ci3-out':''));
      li.append(el('span','ci3-g',f.rep?'\u25ce':'\u25cf'),el('b',null,f.n),el('i',null,f.rep?'replaced':'new'));
      list.append(li)});
    fresh=null;
    var lock=state==='cancelling'||state==='cancelled';
    btn.textContent={running:'Cancel import',cancelling:'Cancelling',cancelled:'Cancelled',ended:'Run again'}[state];
    btn.setAttribute('aria-disabled',lock?'true':'false');
    btn.classList.toggle('ci3-go',state==='ended');
  }

  async function rollback(){
    state='cancelling';sr.textContent='Cancelling. Rolling back placed files.';render();
    var quick=reduce();
    while(placed.length){
      if(!quick){leaving=true;render();await wait(130)}
      var f=placed.pop();if(!f.rep)layers--;leaving=false;render();
      if(!quick&&placed.length)await wait(50)}
    how='cancel';state='cancelled';sr.textContent='Cancelled at Place. Canvas unchanged, 9 layers.';
    render();
    if(!reduce())await wait(900);
    state='ended';render();
  }

  async function run(){
    ctrl=new AbortController();state='running';render();
    try{
      while(placed.length<12){
        await wait(900,ctrl.signal);
        var f=FILES[placed.length];placed.push(f);if(!f.rep)layers++;fresh=f;render()}
      how='done';state='ended';sr.textContent='Import complete. 12 of 12 placed.';render();
    }catch(e){if(e.name==='AbortError')await rollback();else throw e}
  }

  function cancel(){if(state!=='running')return;state='cancelling';ctrl.abort();render()}
  function reset(){placed=FILES.slice(0,4);layers=9+placed.filter(function(f){return!f.rep}).length;leaving=false;how=''}

  btn.addEventListener('click',function(){
    if(state==='running')cancel();
    else if(state==='ended'){reset();run()}});
  btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')btn.classList.add('ci3-p')});
  btn.addEventListener('keyup',function(){btn.classList.remove('ci3-p')});
  btn.addEventListener('blur',function(){btn.classList.remove('ci3-p')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')cancel()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});

  reset();run();
})();</script>
</body></html>
