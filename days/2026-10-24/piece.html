<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low Water Log</title>
<style>
:root{--bg:#f7f7f5;--ink:#121316;--mut:#8f9196;--acc:#0b7a66}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lw-root{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.lw-cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.lw-title{position:absolute;margin:0;font:600 clamp(14px,2.2vmin,18px)/1 system-ui,-apple-system,sans-serif;letter-spacing:.04em;pointer-events:none;z-index:4}
.lw-tools{position:absolute;display:flex;gap:6px;z-index:4}
.lw-btn{min-width:44px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:22px;background:var(--bg);color:var(--ink);font:500 14px/1 system-ui,-apple-system,sans-serif;cursor:pointer}
.lw-btn:active{opacity:.6}
.lw-btn[aria-pressed="false"]{text-decoration:line-through;opacity:.55}
.lw-add{position:absolute;z-index:3}
.lw-hit{position:absolute;touch-action:none;border-radius:6px;outline:none}
.lw-btn:focus-visible,.lw-hit:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#lw-line{z-index:1;cursor:pointer}
#lw-loom{z-index:1;cursor:crosshair}
#lw-tide{z-index:1;cursor:ew-resize}
#lw-stack{z-index:2;cursor:ns-resize}
#lw-anem{z-index:2;cursor:pointer}
#lw-crab{z-index:3;cursor:pointer;border-radius:50%}
.lw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@page{size:A5;margin:10mm}
@media print{html,body{background:#fff;overflow:visible;height:auto}.lw-root{position:static}.lw-tools,.lw-hit,.lw-add{display:none}.lw-title{position:static;color:#000;margin:0 0 4mm}.lw-cv{position:static;width:100%;height:auto;max-height:180mm;object-fit:contain}}
</style></head><body>
<div class="lw-root" id="lw-root">
<canvas class="lw-cv" id="lw-cv" role="img" aria-label="Low Water Log, a tide pool drawn in black line with plankton drifting in the water"></canvas>
<h1 class="lw-title" id="lw-title">Low Water Log</h1>
<div class="lw-tools" id="lw-tools"><button class="lw-btn" id="lw-snd" type="button" aria-pressed="true">Sound</button><button class="lw-btn" id="lw-print" type="button">Print</button></div>
<div class="lw-hit" id="lw-line" role="application" tabindex="0" aria-label="Waterline. One periwinkle waits on the line. Tap the line or press Enter to drop an entry in. Drag along the water to stir it."></div>
<button class="lw-btn lw-add" id="lw-add" type="button" aria-label="Add an entry">Add</button>
<div class="lw-hit" id="lw-crab" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0" aria-valuetext="0 items" aria-label="Specimen tray. Press and hold the hermit crab to catalog an entry. Arrow up adds, arrow down pulls out the newest."></div>
<div class="lw-hit" id="lw-loom" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0" aria-valuetext="0 items" aria-label="Still weft. Drag right across the threads to weave in an entry. Drag left to pull out the newest. Drag an entry toward the anemone to fling it away. Arrow right adds, arrow left pulls."></div>
<div class="lw-hit" id="lw-stack" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="No entry chosen" aria-label="Accession stack. Arrow keys choose an entry. Drag or scroll to move through the stack. Delete flings the chosen entry to the anemone. U brings it back."></div>
<div class="lw-hit" id="lw-anem" role="application" tabindex="0" aria-label="Swallowed item. Flung entries wait inside the anemone for 5 seconds. Tap it, or press Enter or U, to bring the last one back."></div>
<div class="lw-hit" id="lw-tide" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0 items" aria-label="Tide chart. Drag, scroll, or use the arrow keys to move through the log."></div>
<div class="lw-sr" id="lw-live" aria-live="polite"></div>
</div>
<script>(function(){
'use strict';
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var D=document;function $(i){return D.getElementById(i)}
var root=$('lw-root'),cv=$('lw-cv'),X=cv.getContext('2d'),live=$('lw-live');
var eLine=$('lw-line'),eAdd=$('lw-add'),eLoom=$('lw-loom'),eStack=$('lw-stack'),eAnem=$('lw-anem'),eTide=$('lw-tide'),eCrab=$('lw-crab'),eSnd=$('lw-snd'),ePrint=$('lw-print'),eTitle=$('lw-title'),eTools=$('lw-tools');
var W=1,H=1,dpr=1,L=null,raf=0,last=0,printing=false,t=0,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function cl(a,b,c){return a<b?b:a>c?c:a}
function place(el,x,y,w,h){var s=el.style;s.left=x+'px';s.top=y+'px';s.width=Math.max(0,w)+'px';s.height=Math.max(0,h)+'px'}
function ln(a,b,c,d){X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke()}

/* sound */
var ac=null,snd=true;
function tone(f0,f1,d,ty,g){if(!snd||printing)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),q=ac.createGain(),n=ac.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+d*.8);
  q.gain.setValueAtTime(g||.05,n);q.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(q);q.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(_){}}
eSnd.addEventListener('click',function(){snd=!snd;eSnd.setAttribute('aria-pressed',String(snd));if(snd)tone(520,700,.08)});
function say(s){live.textContent=s}
function items(n){return n+(n===1?' item':' items')}

/* state */
var NAMES=['Forever plan','Bed 4 fluids','cat-pics-2','Call back pharmacy','Hand-off notes','Emotional baggage','Low tide 6:04','Refill the bucket','Monday','Forever plan, v2','Sunscreen','Socks, 12 ounces','Check on the crab','cat-pics-3'];
var ni=0,accN=0,E=[],sel=-1,MAXN=60;
var NW=56,wu=new Float32Array(NW),wvv=new Float32Array(NW),drops=[];
var NP=17,wo=new Float32Array(NP),wov=new Float32Array(NP);for(var q0=1;q0<NP-1;q0++)wo[q0]=3*Math.sin(Math.PI*q0/(NP-1)*3);
var sc=0,scv=0,scT=0,sm='rest',userSc=false;
var cr={r:0,v:0,h:0,tw:.8,twp:0,T:0,Tv:0},hold=null;
var ao=0,aov=0,awake=200,pend=null,fly=[],drag=null,ptimer=0;
var K=[],P=[],ptr=null,fp=null,rip=-1;

function real(){return E.filter(function(e){return !e.gap})}
function count(){var n=0;for(var i=0;i<E.length;i++)if(!E[i].gap&&!E[i].prov)n++;return n}
function maxSc(){return Math.max(0,real().length+1-L.vis)}
function hgt(no){return .55+.45*((no*37+11)%10)/10}

/* layout */
function layout(){
  var m=cl(Math.min(W,H)*.04,12,32),hy=m+44,ly=hy+cl(H*.07,28,70),th=cl(H*.15,78,130);
  var tide={x0:m,x1:W-m,y0:H-m-th,y1:H-m},pool={x0:m,x1:W-m,y0:ly+34,y1:tide.y0-16};
  var pw=pool.x1-pool.x0,ph=pool.y1-pool.y0,aw=cl(Math.min(W*.22,ph*.42),80,190),gap=12;
  var sw=Math.min(pw-aw-gap,700),gx=pool.x0+(pw-(sw+gap+aw))/2;
  var st={x0:gx,x1:gx+sw,y0:pool.y0,y1:pool.y1},rowH=cl(H*.06,32,46),ry0=st.y0+rowH*.95;
  L={m:m,ly:ly,lx0:m,lx1:W-m-64,tide:tide,pool:pool,st:st,rowH:rowH,ry0:ry0,vis:Math.max(1,Math.floor((st.y1-ry0-4)/rowH)),
     aw:aw,ax:st.x1+gap+aw/2,amy:pool.y1-aw*.62,lab:cl(sw*.22,58,84)};
  eTitle.style.left=m+'px';eTitle.style.top=(m+14)+'px';eTools.style.right=m+'px';eTools.style.top=m+'px';
  eAdd.style.right=m+'px';eAdd.style.top=(ly-22)+'px';
  place(eLine,L.lx0,ly-24,L.lx1-L.lx0,48);
  place(eLoom,st.x0,st.y0,sw,st.y1-st.y0);
  place(eStack,st.x0,ry0,L.lab,st.y1-ry0);
  place(eAnem,L.ax-aw/2,L.amy-aw*.55,aw,aw*1.1);
  place(eTide,tide.x0,tide.y0,tide.x1-tide.x0,th);
}
function initP(){P=[];for(var i=0;i<150;i++)P.push({hx:Math.random(),hy:Math.random(),x:0,y:0,vx:0,vy:0,r:.8+Math.random()*1.2,k:Math.random()<.28,a:Math.random()*Math.PI,X:0,Y:0})}
function homeP(){var p=L.pool;P.forEach(function(q){q.X=p.x0+q.hx*(p.x1-p.x0);q.Y=p.y0+q.hy*(p.y1-p.y0);q.x=q.X+(Math.random()-.5)*14;q.y=q.Y+(Math.random()-.5)*14;q.vx=q.vy=0})}

/* geometry helpers */
function wnode(x){return cl(Math.round((x-L.lx0)/(L.lx1-L.lx0)*(NW-1)),1,NW-2)}
function wat(x){var f=cl((x-L.lx0)/(L.lx1-L.lx0),0,1)*(NW-1),i=Math.min(NW-2,f|0),r=f-i;return wu[i]*(1-r)+wu[i+1]*r}
function wpoke(x,a){var n=wnode(x);wvv[n]+=a;wvv[n-1]+=a*.6;wvv[n+1]+=a*.6}
function wx(i,y){var s=L.st;return s.x0+(s.x1-s.x0)*i/(NP-1)+wo[i]*Math.sin(Math.PI*cl((y-s.y0)/(s.y1-s.y0),0,1))}
function wpush(a,b){var d=b-a,sw=L.st.x1-L.st.x0;for(var i=1;i<NP-1;i++){var f=i/(NP-1);if((f-a)*(f-b)<0)wov[i]+=cl(d*sw*.3,-3,3)}}
function shudder(){for(var i=1;i<NP-1;i++)wov[i]+=(i%2?1.4:-1.4)}
function warpAt(x){var s=L.st;return cl(Math.round((x-s.x0)/(s.x1-s.x0)*(NP-1)),1,NP-2)}
function rowTop(tg){var a=0;for(var i=0;i<E.length;i++){if(E[i]===tg)break;a+=Math.max(0,E[i].h)}return L.ry0+(a-sc)*L.rowH}
function rowAt(y){var a=0,k=0;for(var i=0;i<E.length;i++){var e=E[i],top=L.ry0+(a-sc)*L.rowH,hh=Math.max(0,e.h)*L.rowH;a+=Math.max(0,e.h);if(e.gap)continue;
  if(y>=top&&y<top+hh&&y>=L.ry0&&y<=L.st.y1)return{e:e,k:k,top:top};k++}return null}
function scrollEnd(){scT=maxSc();sm='spring'}
function scrollShow(k){if(k<0)return;if(k<scT)scT=k;else if(k>scT+L.vis-1)scT=k-L.vis+1;scT=cl(scT,0,maxSc());sm='spring'}

/* effects */
function burst(x,y,n,a,sp,up){for(var i=0;i<n;i++){var g=up?-Math.PI/2+(Math.random()-.5)*1.2:Math.random()*6.283,v=sp*(.4+Math.random());
  K.push({x:x,y:y,vx:Math.cos(g)*v,vy:Math.sin(g)*v,l:1,c:a,r:.8+Math.random()*1.2})}}
function stirAt(x,y,s){var S=Math.min(W,H),R2=S*.25;for(var i=0;i<P.length;i++){var p=P[i],dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)+.01;
  if(d<R2){var f=(1-d/R2)*s*S;p.vx+=dx/d*f;p.vy+=dy/d*f}}kick()}

/* list actions */
function lastName(){var R=real();for(var i=R.length-1;i>=0;i--)if(!R[i].prov)return R[i].name;return ''}
function sync(){var n=count(),R=real(),vt=n?items(n)+', newest: '+lastName():'0 items. Still pool, one crab waiting.';
  [eCrab,eLoom].forEach(function(el){el.setAttribute('aria-valuenow',n);el.setAttribute('aria-valuetext',vt)});
  var mx=maxSc(),a=Math.round(cl(scT,0,mx));eTide.setAttribute('aria-valuemax',mx);eTide.setAttribute('aria-valuenow',a);
  eTide.setAttribute('aria-valuetext',n?'Rows '+(a+1)+' to '+Math.min(n,a+L.vis)+' of '+n:'0 items');
  eStack.setAttribute('aria-valuemax',Math.max(1,R.length));eStack.setAttribute('aria-valuenow',Math.max(0,sel+1));
  eStack.setAttribute('aria-valuetext',sel>=0&&R[sel]?'No. '+R[sel].no+', '+R[sel].name:'No entry chosen')}
function addEntry(src,x){var R=real();if(R.length>=MAXN){shudder();say('The log is full.');kick();return null}
  var dr=src==='drag',e={no:++accN,name:NAMES[ni++%NAMES.length],h:dr?1:0,hv:0,w:0,wv:dr?0:.05,dir:dr?0:1,prov:true,held:dr};
  E.push(e);scrollEnd();
  var A=cl(H*.018,6,13);
  if(src==='line'){if(x==null)x=L.lx0+(L.lx1-L.lx0)*(.3+Math.random()*.6);wpoke(x,A);drops.push({x:x,y:L.ly,vy:-2,e:e,tx:cl(x,L.st.x0+12,L.st.x1-12)});tone(560,170,.16,'sine',.06)}
  else if(!dr){wpoke(L.lx0+(L.lx1-L.lx0)*(.3+Math.random()*.5),A*.5);if(src==='crab'){tone(880,528,.1);var p=crabPose();stirAt(p.x,p.y,.004)}}
  sync();kick();return e}
function commit(e){e.prov=false;wov[NP-2]-=2.5;var n=count();tone(330+n*18,330+n*18,.22,'triangle',.05);
  say('Woven in: '+e.name+'. '+items(n)+'.');stirAt(L.st.x1,rowTop(e)+L.rowH*.8,.004);sync()}
function pullNewest(){var R=real();for(var i=R.length-1;i>=0;i--){var e=R[i];if(!e.prov&&!e.dir&&!e.drag&&!e.held){e.dir=-1;e.wv=-.05;kick();return}}shudder();cr.tw=1;kick()}
function fling(e,x,y,vx,vy){var i=E.indexOf(e);if(i<0)return;var ri=real().indexOf(e);E[i]={gap:true,h:Math.max(0,e.h),hv:0};
  e.drag=false;e.held=false;e.dir=0;e.w=1;fly.push({e:e,i:ri,x:x,y:y,vx:vx,vy:vy,s:1,age:0});awake=160;tone(420,260,.12);
  var n=real().length;if(sel>=n)sel=n-1;sync();kick()}
function labW(){return Math.min(240,(L.st.x1-L.st.x0)*.8)}
function flingRow(e){var top=rowTop(e),x=L.st.x0+6+labW()/2,y=top+L.rowH*.5;fling(e,x,y,(L.ax-x)*.02,(L.amy-y)*.02-2)}
function swallow(f){if(pend)digest();pend={e:f.e,i:f.i,end:performance.now()+5000,s:0,sv:0};burst(L.ax,L.amy,22,1,6);tone(240,80,.16,'sine',.07);
  stirAt(L.ax,L.amy,.005);say(f.e.name+' swallowed. Tap the anemone or press U within 5 seconds to bring it back.');
  if(!ptimer)ptimer=setInterval(function(){if(pend&&performance.now()>=pend.end)digest();kick()},250);kick()}
function stopT(){clearInterval(ptimer);ptimer=0}
function digest(){if(!pend)return;burst(L.ax,L.amy+L.aw*.25,8,0,2,true);say(pend.e.name+' is gone. '+items(count())+'.');pend=null;stopT();sync();kick()}
function restore(){if(!pend){say('Nothing to bring back.');return}var e=pend.e,ri=pend.i,k=0,pos=E.length;
  for(var i=0;i<E.length;i++){if(E[i].gap)continue;if(k===ri){pos=i;break}k++}
  e.h=0;e.hv=0;e.w=1;e.wv=0;e.dir=0;e.prov=false;e.drag=false;e.held=false;E.splice(pos,0,e);pend=null;stopT();
  burst(L.ax,L.amy,10,1,4);tone(300,560,.14,'sine',.06);sel=real().indexOf(e);scrollShow(sel);wov[1]+=2;
  say(e.name+' is back. '+items(count())+'.');sync();kick()}

/* crab hold */
function startHold(){if(hold)return;hold={t0:performance.now()};kick()}
function stopHold(){if(hold&&cr.h<.3){cr.tw=1}hold=null;kick()}
function tickHold(now){if(!hold)return;cr.h=Math.min(1,(now-hold.t0)/650);if(cr.h>=1){hold=null;cr.h=0;addEntry('crab')}}
function crabPose(){var s=L.st,T=cl(cr.T,0,1),k0=Math.min(1.8,Math.min(s.x1-s.x0,s.y1-L.ry0)*.5/120),
  x0=(s.x0+s.x1)/2,y0=(L.ry0+s.y1)/2,x1=s.x0+L.rowH*1.05,y1=s.y0+L.rowH*.47,k1=L.rowH*.8/85;
  return{x:x0+(x1-x0)*T,y:y0+(y1-y0)*T,k:k0+(k1-k0)*T}}
var cpl='';
function placeCrab(){var p=crabPose(),sz=Math.max(48,100*p.k),x=p.x+2*p.k-sz/2,y=p.y-sz/2,key=Math.round(x)+','+Math.round(y)+','+Math.round(sz);
  if(key!==cpl){cpl=key;place(eCrab,x,y,sz,sz)}}

/* simulation */
function aoT(){var d=1e9;if(drag)d=Math.hypot(drag.x-L.ax,drag.y-L.amy);fly.forEach(function(f){d=Math.min(d,Math.hypot(f.x-L.ax,f.y-L.amy))});
  if(d<1e9)return .35+.65*cl(1-d/(L.aw*1.6),0,1);if(pend)return .12;return count()?.3:0}
function step(dt){var mv=false,i,n=Math.ceil(dt),h=dt/n,s;t+=dt;
  for(s=0;s<n;s++){for(i=1;i<NW-1;i++){var a=-.16*wu[i]+.34*(wu[i-1]+wu[i+1]-2*wu[i]);wvv[i]=(wvv[i]+a*h)*Math.pow(.86,h)}for(i=1;i<NW-1;i++)wu[i]+=wvv[i]*h}
  for(i=1;i<NW-1;i++)if(Math.abs(wu[i])>.05||Math.abs(wvv[i])>.05){mv=true;break}
  for(s=0;s<n;s++){for(i=1;i<NP-1;i++)wov[i]+=(.2*(wo[i-1]+wo[i+1]-2*wo[i])-.02*wo[i])*h;for(i=1;i<NP-1;i++){wov[i]*=Math.pow(.97,h);wo[i]+=wov[i]*h}}
  for(i=1;i<NP-1;i++)if(Math.abs(wo[i])>.03||Math.abs(wov[i])>.03){mv=true;break}
  for(i=drops.length-1;i>=0;i--){var d=drops[i];d.vy+=.4*dt;d.y+=d.vy*dt;d.x+=(d.tx-d.x)*.08*dt;
    var ty=E.indexOf(d.e)>=0?cl(rowTop(d.e)+L.rowH*.86,L.ry0,L.st.y1):L.st.y1;
    if(d.y>=ty&&d.vy>0){drops.splice(i,1);burst(d.x,ty,6,0,1.5);stirAt(d.x,ty,.004);wov[warpAt(d.x)]+=2.2}else mv=true}
  for(i=E.length-1;i>=0;i--){var e=E[i];
    if(e.gap){e.hv=(e.hv+(0-e.h)*.2*dt)*Math.pow(.78,dt);e.h+=e.hv*dt;if(e.h<.01&&Math.abs(e.hv)<.01){E.splice(i,1);continue}mv=true;continue}
    e.hv=(e.hv+(1-e.h)*.17*dt)*Math.pow(.8,dt);e.h+=e.hv*dt;if(Math.abs(e.hv)>.002||Math.abs(1-e.h)>.002)mv=true;else{e.h=1;e.hv=0}
    if(!e.held&&(e.prov||e.w<1||e.dir)){var tg=e.dir||(e.w>.5?1:-1);e.wv=cl((e.wv+tg*.0022*dt)*Math.pow(.95,dt),-.07,.07);
      var nw=cl(e.w+e.wv*dt,0,1);wpush(e.w,nw);e.w=nw;mv=true;
      if(e.w>=1){e.w=1;e.wv=0;e.dir=0;if(e.prov)commit(e)}
      else if(e.w<=0){if(e.prov){E.splice(i,1);sync()}else{e.w=1;e.dir=0;flingRow(e)}}}
    if(e.held)mv=true}
  var mx=maxSc();scT=cl(scT,0,mx);
  if(sm==='coast'){sc+=scv*dt;scv*=Math.pow(.92,dt);if(sc<0||sc>mx||Math.abs(scv)<.03){scT=cl(Math.round(sc+scv*8),0,mx);sm='spring'}mv=true}
  else if(sm==='spring'){scv+=(scT-sc)*.16*dt;scv*=Math.pow(.8,dt);sc+=scv*dt;
    if(Math.abs(scv)<.001&&Math.abs(scT-sc)<.002){sc=scT;scv=0;sm='rest';if(userSc){userSc=false;tone(560+scT*12,330,.09,'sine',.03)}sync()}else mv=true}
