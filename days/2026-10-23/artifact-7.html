<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File drop in a sounding well</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#f7f7f5;--ink:#121316;--acc:#0b7a66;--hole:#121316}
:root[data-theme="dark"]{--bg:#0e0f11;--ink:#f2f2f0;--acc:#3cc4a8;--hole:#050607}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.wq-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;outline:none;overflow:hidden;border-radius:4px}
.wq-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wq-c{position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;box-sizing:border-box;pointer-events:none;transform:translate(-50%,-50%)}
.wq-r{border:1px solid var(--ink);animation:wq-b 6.4s ease-in-out infinite}
.wq-h{background:var(--hole);border:1px solid var(--ink)}
.wq-w{border:1px solid var(--ink)}
.wq-e{border:2px solid var(--acc)}
.wq-f{position:absolute;aspect-ratio:1;box-sizing:border-box;border:1px solid var(--ink);background:var(--bg);border-radius:1px;pointer-events:none}
.wq-s{position:absolute;inset:0;pointer-events:none}
.wq-t{position:absolute;left:50%;top:7.4%;width:2px;height:5.2%;margin-left:-1px;background:var(--acc);border-radius:1px}
.wq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes wq-b{50%{opacity:.18}}
@media (prefers-reduced-motion:reduce){.wq-r{animation:none}}
</style></head><body>
<div class="wq-root" role="region" tabindex="0" aria-label="Sounding well. Tap or press Enter to drop a file. Hold to carry it before letting go. Arrow keys drop from that edge. Escape pulls a falling file back. Shift Enter picks a real file, or drag one in. Rings spread down the shaft and a returning colored ring adds a stitch on the rim when it has arrived."></div>
<span class="wq-sr" aria-live="polite"></span>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,R=document.querySelector('.wq-root'),SR=document.querySelector('.wq-sr');
  var D=[80,51.2,33.2,22.4,15.2,11.6,8],OP=[1,.7,.55,.45,.38,.32,1];
  var rings=[],files=[],waves=[],pends=[],echoes=[],stitches=[],count=0,cur=null,si=0,ac=null;
  var S=[['cat-pics-2.jpg',2.4e6],['Forever plan.pdf',1.8e5],['Monday.txt',1.2e4],['Emotional baggage',9.8e6]];
  function el(c,p){var e=document.createElement('div');e.className=c;(p||R).appendChild(e);return e}
  function sp(x,t){return{x:x,v:0,t:t}}
  function ss(s,dt,k,d){s.v+=(s.t-s.x)*k*dt;s.v*=Math.pow(d,dt);s.x+=s.v*dt;
    return Math.abs(s.t-s.x)>1e-3||Math.abs(s.v)>1e-3}
  D.forEach(function(d,i){var e=el('wq-c '+(i==6?'wq-h':'wq-r'));e.style.width=d+'%';
    if(i<6){e.style.opacity=OP[i];e.style.animationDelay=(i*.55)+'s'}rings.push({e:e,b:sp(0,0)})});
  function tone(f,g){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.frequency.value=f;
    v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(1e-4,t+.35);
    o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+.4)}catch(e){}}
  function fmt(b){return b>=1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB'}
  function stitch(now){var i=count++%64;stitches=stitches.filter(function(s){if(s.i==i){s.e.remove();return false}return true});
    var c=el('wq-s');c.style.transform='rotate('+(i*5.625)+'deg)';var t=el('wq-t',c);
    stitches.push({e:c,t:t,i:i,s:sp(now?1:0,1)})}
  for(var k=0;k<3;k++)stitch(1);
  function spawn(x,y,name,bytes,hp){var z=5+Math.min(5,Math.max(0,Math.log10(bytes/1e4)*2));
    var e=el('wq-f');e.style.width=z+'%';
    var f={e:e,x:x,y:y,x0:x,y0:y,name:name,bytes:bytes,hp:hp,p:sp(0,0),sc:sp(0,1),held:1,cx:0};
    files.push(f);rings.forEach(function(r){r.b.v-=.004});kick();return f}
  function release(f){f.held=0;f.x0=f.x;f.y0=f.y;f.p.t=1;kick()}
  function sample(x,y){var s=S[si++%S.length];return spawn(x,y,s[0],s[1],null)}
  function real(file,x,y){var hp=file.arrayBuffer().then(function(b){
      return crypto.subtle?crypto.subtle.digest('SHA-256',b):b});
    release(spawn(x,y,file.name,file.size,hp))}
  function impact(f){f.e.remove();var b=f.bytes,n=b<3e4?1:b<3e5?3:b<3e6?5:6;
    for(var i=0;i<n;i++){var e=el('wq-c wq-w');e.style.opacity=0;
      waves.push({e:e,s:sp(8,D[5-i]),d:i*5,age:0,ri:5-i,hit:0})}
    rings[6].b.v-=.03;tone(196,.08);
    var p={f:f,w:24+Math.min(60,b/2e5),ready:!f.hp};
    if(f.hp)f.hp.then(function(){p.ready=true;kick()},function(){});pends.push(p)}
  function echo(f){echoes.push({e:el('wq-c wq-e'),s:sp(8,80),age:0,st:0});tone(784,.05);
    SR.textContent=f.name+' arrived, '+fmt(f.bytes)}
  function step(dt){var m=false;
    files=files.filter(function(f){if(ss(f.sc,dt,.18,.8))m=true;
      if(f.cx){if(f.sc.x<.03){f.e.remove();return false}m=true;return true}
      if(!f.held){ss(f.p,dt,.14,.84);m=true;if(f.p.x>.96){impact(f);return false}}return true});
    rings.forEach(function(r){if(ss(r.b,dt,.2,.78))m=true});
    waves=waves.filter(function(w){m=true;w.d-=dt;if(w.d>0)return true;
      ss(w.s,dt,.16,.8);w.age+=dt;
      if(!w.hit&&w.s.x>w.s.t-1){w.hit=1;rings[w.ri].b.v+=.012}
      if(w.age>90){w.e.remove();return false}return true});
    pends=pends.filter(function(p){if(!p.ready)return true;m=true;p.w-=dt;
      if(p.w<=0){echo(p.f);return false}return true});
    echoes=echoes.filter(function(e){m=true;ss(e.s,dt,.12,.8);e.age+=dt;
      if(!e.st&&e.age>36){e.st=1;stitch(0);rings[0].b.v+=.01}
      if(e.age>80){e.e.remove();return false}return true});
    stitches.forEach(function(s){if(ss(s.s,dt,.22,.76))m=true});
    return m}
  function draw(){
    rings.forEach(function(r){r.e.style.transform='translate(-50%,-50%) scale('+(1+r.b.x)+')'});
    files.forEach(function(f){var p=f.held?0:Math.min(1,Math.max(0,f.p.x));
      var x=f.held?f.x:f.x0+(50-f.x0)*p,y=f.held?f.y:f.y0+(50-f.y0)*p;
      f.e.style.left=x+'%';f.e.style.top=y+'%';
      f.e.style.transform='translate(-50%,-50%) rotate('+(p*48)+'deg) scale('+Math.max(0,f.sc.x*(1-.86*p))+')'});
    waves.forEach(function(w){w.e.style.width=Math.max(0,w.s.x)+'%';
      w.e.style.opacity=w.d>0?0:w.age<40?.9:Math.max(0,.9-(w.age-40)/50)});
    echoes.forEach(function(e){e.e.style.width=Math.max(0,e.s.x)+'%';
      e.e.style.opacity=e.age<36?1:Math.max(0,1-(e.age-36)/44)});
    stitches.forEach(function(s){s.t.style.transform='scaleY('+Math.max(0,s.s.x)+')'})}
  function snapToTarget(){
    files=files.filter(function(f){if(f.cx){f.e.remove();return false}
      if(f.held){f.sc.x=1;f.sc.v=0;return true}impact(f);return false});
    waves.forEach(function(w){w.e.remove()});waves=[];
    rings.forEach(function(r){r.b.x=r.b.v=0});
    pends=pends.filter(function(p){if(!p.ready)return true;
      echoes.push({e:el('wq-c wq-e'),s:sp(80,80),age:99,st:0});SR.textContent=p.f.name+' arrived, '+fmt(p.f.bytes);return false});
    echoes.forEach(function(e){if(!e.st)stitch(1);e.e.remove()});echoes=[];
    stitches.forEach(function(s){s.s.x=1;s.s.v=0})}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function pos(e){var r=R.getBoundingClientRect();
    return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}
  R.addEventListener('pointerdown',function(e){e.preventDefault();R.focus();
    try{R.setPointerCapture(e.pointerId)}catch(_){}
    if(cur)release(cur);var p=pos(e);cur=sample(p[0],p[1])});
  R.addEventListener('pointermove',function(e){if(!cur)return;var p=pos(e);cur.x=p[0];cur.y=p[1];kick()});
  function up(){if(cur){release(cur);cur=null}}
  R.addEventListener('pointerup',up);R.addEventListener('pointercancel',up);
  var inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.hidden=true;
  inp.setAttribute('aria-hidden','true');document.body.appendChild(inp);
  inp.addEventListener('change',function(){Array.prototype.forEach.call(inp.files,function(f,i){real(f,50,6+i*3)});inp.value=''});
  R.addEventListener('dragover',function(e){e.preventDefault()});
  R.addEventListener('drop',function(e){e.preventDefault();var p=pos(e);
    Array.prototype.forEach.call(e.dataTransfer.files,function(f){real(f,p[0],p[1])})});
  var E={ArrowUp:[50,6],ArrowDown:[50,94],ArrowLeft:[6,50],ArrowRight:[94,50]};
  R.addEventListener('keydown',function(e){var k=e.key;
    if(k==='Enter'&&e.shiftKey){e.preventDefault();inp.click();return}
    if(k==='Enter'||k===' '){e.preventDefault();release(sample(50,6));return}
    if(E[k]){e.preventDefault();release(sample(E[k][0],E[k][1]));return}
    if(k==='Escape'){files.forEach(function(f){f.cx=1;f.sc.t=0;f.p.t=f.p.x;f.p.v=0});cur=null;kick()}});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  draw();
})();</script>
</body></html>
