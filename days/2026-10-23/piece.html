<style>

</style></head><body>
<div class="sw-stage" id="sw-stage">
<canvas class="sw-cv" id="sw-cv" aria-hidden="true"></canvas>
<div class="sw-p" id="sw-plumb" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="600" aria-valuenow="0" aria-label="Plumb line. A file hangs over a measured shaft 600 units deep. Drag it down or fling it, or drop your own file anywhere. It falls at a speed set by its size. Arrow Down pushes it, Arrow Up flings it up, Enter or Space drops it, Escape hangs it back on the line."></div>
<div class="sw-p" id="sw-mouth" role="region" tabindex="0" aria-label="Ring gauge at the mouth of the well."></div>
<div class="sw-p" id="sw-thread" role="region" tabindex="0" aria-label="Kettle stitch thread. Each landed 64 KB chunk becomes a stitch. Press and hold, or hold Space, to see chunks landed. Tap or press Enter to choose a file. Escape cancels a transfer."></div>
<div class="sw-p" id="sw-strata" role="slider" tabindex="0" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-label="Strata. Every file dropped in settles as a layer and keeps its record. Drag up or down, use the wheel, or the arrow keys to dig through the layers. Flick a layer upward to recover it. Enter picks a file. Escape returns to the newest layer."></div>
<div class="sw-p" id="sw-lift" role="slider" tabindex="0" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-label="Backward fall. Fling a layer up out of the well to recover its file. Arrow keys pick a layer, Enter or Space flings it, or saves a recovered file. Tap the recovered card to save it, drag it down to return it. Escape returns it."></div>
<div class="sw-p" id="sw-log" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="6" aria-valuenow="6" aria-label="Against log. Six checks fold open before any echo. Folds that argue against arrival stay bent. Press and hold to replay the checks. Tap to pick a file. Arrows change layer. Escape folds it shut."></div>

<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  function $(i){return document.getElementById(i)}

  var W=1,H=1,dpr=1,G={},C={},i;
  var CK=['size','chunks','hash','order','name','too easy'],KB=1024,MB=1048576,CH=65536,uid=0;
  var acted=false,muted=false;try{muted=localStorage.getItem('sw-mute')==='1'}catch(e){}

    o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+d);
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g||.08,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);

  snd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSnd()}});
  setSnd();
  function col(){var cs=getComputedStyle(document.documentElement);['bg','ink','acc','warn','mut','hl'].forEach(function(k){C[k]=cs.getPropertyValue('--'+k).trim()})}
  col();
  function cl(v){return v<0?0:v>1?1:v}
  function sstep(m){return m*m*(3-2*m)}
  function spr(o,k,vk,t,dt,eps,kk,dd){var v=(o[vk]+(t-o[k])*(kk||.16)*dt)*Math.pow(dd||.8,dt);o[vk]=v;o[k]+=v*dt;
    if(Math.abs(t-o[k])>eps||Math.abs(v)>eps)return true;o[k]=t;o[vk]=0;return false}
  function maxD(){return Math.hypot(W,H)}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function rng(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}

  function hex(b){var a=new Uint8Array(b),s='';for(var i=0;i<a.length;i++)s+=(a[i]<16?'0':'')+a[i].toString(16);return s}

  function size(b){return b<1e3?b+' bytes':b<1e6?(b/1e3).toFixed(1)+' KB':b<1e9?(b/1e6).toFixed(1)+' MB':(b/1e9).toFixed(2)+' GB'}
  function mbOf(b){return Math.max(1,Math.ceil(b/MB))}
  function badOf(a){var s=[];a.forEach(function(t){var k=CK.indexOf(String(t).split(':')[0]);if(k>=0&&s.indexOf(k)<0)s.push(k)});return s}

  /* geometry */
  function lay(){W=innerWidth;H=innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    var g=G,u=Math.min(W,H);g.u=u;g.cx=W/2;g.e=.28;
    g.rx=Math.max(44,Math.min(W*.2,H*.13,150));
    g.my=H*.25;g.fy=H*.86;g.ty=g.my+(g.fy-g.my)*.32;g.st=g.ty+(g.fy-g.ty)*.2;
    g.x0=g.cx-g.rx;g.x1=g.cx+g.rx;g.k=(g.fy-g.my)/600;g.ss=(g.fy-g.st)/300;
    g.cw=g.rx*.56;g.chh=g.cw*1.25;
    g.hy=Math.max(g.chh/2+34,g.my-g.rx*g.e-g.chh/2-H*.035);
    g.tx0=W*.06;g.tx1=W*.94;
    var gap=Math.max(12,Math.min(48,W*.03));g.lx0=g.x1+gap;g.lx1=g.lx0+Math.max(40,Math.min(W-g.x1-gap-12,g.rx*1.8));
    g.rcx=Math.min((g.x1+W)/2,g.x1+g.rx*1.1);if(g.rcx+g.cw/2>W-8)g.rcx=W-8-g.cw/2;g.rcy=g.hy;
    g.by=g.fy+Math.min(40,(H-g.fy)*.55);
    function pl(el,x,y,w,h){var s=el.style;s.left=Math.round(x)+'px';s.top=Math.round(y)+'px';s.width=Math.round(w)+'px';s.height=Math.round(h)+'px'}
    var ry=g.rx*g.e;
    pl(E.plumb,g.x0,40,g.rx*2,Math.max(10,g.my-ry-48));
    pl(E.mouth,g.cx-g.rx*1.35,g.my-ry-8,g.rx*2.7,ry*2+16);
    pl(E.thread,g.tx0,g.ty-18,g.tx1-g.tx0,36);
    pl(E.strata,g.x0,g.st,g.rx*2,g.fy-g.st);
    pl(E.lift,g.rcx-g.cw*.8,g.rcy-g.chh*.75,g.cw*1.6,g.chh*1.5);
    pl(E.log,g.lx0-4,g.st-4,g.lx1-g.lx0+8,g.by-g.st+10)}
  lay();

  /* strata, rows 1 and 4 */
  function th(b){return(4+1.1*Math.log(Math.max(b,KB)/KB)/Math.LN2)*G.ss}
  function mkL(r,fall){var b=r.bytes,n=Math.min(200,Math.round(48+18*Math.log10(b+1))),R=rng(r.name+b);
    var P={n:n,u:new Float32Array(n),v:new Float32Array(n),r:new Float32Array(n),f:new Float32Array(n),fv:new Float32Array(n)};
    for(var i=0;i<n;i++){P.u[i]=R();P.v[i]=Math.sqrt(R());P.r[i]=R();if(fall)P.f[i]=G.u*.12*(.2+R())}
    var ag=Array.isArray(r.against)?r.against:[];
    return{name:r.name,bytes:b,hash:r.hash||'',against:ag,bad:badOf(ag),id:r.id||('s'+(++uid)+Date.now().toString(36)),P:P,
      y:0,yv:0,h:0,hv:0,ty:0,th:0,o:0,ov:0,st:'stack',vy:0,m:0,mv:0,x:G.cx,xv:0,ding:!!fall}}
  var SEED=[['Monday.txt',3100,[]],['Forever plan.pdf',2400000,[]],
    ['cat-pics-2.zip',38000000,['size: 38 MB sent, 37.9 MB arrived','chunks: 2 of 580 missing']],
    ['Delete.doc',41000,['hash: did not match']],['cat-pics-2 (final).zip',12000000,[]],
    ['Emotional baggage',1200000000,['hash: too heavy to hash','name: no extension']]];
  var L=[],sel=0,top=null,blobs={};
  var stored=null;try{stored=JSON.parse(localStorage.getItem('sw-strata'))}catch(e){}
  if(!Array.isArray(stored)||!stored.length)stored=SEED.map(function(s){return{name:s[0],bytes:s[1],hash:synth(s[0]+s[1]),against:s[2]}});
  L=stored.filter(function(r){return r&&typeof r.name==='string'&&r.bytes>=0}).slice(-64).map(function(r){return mkL(r,false)});
  if(!L.length)L=[mkL({name:'Forever plan.pdf',bytes:2400000},false)];
  sel=L.length-1;
  function saveL(){try{localStorage.setItem('sw-strata',JSON.stringify(L.map(function(l){return{name:l.name,bytes:l.bytes,hash:l.hash,against:l.against,id:l.id}})))}catch(e){}}
  function layout(snap){var g=G,n=L.length,ths=[],rank=0,sum=0,i,l;
    for(i=n-1;i>=0;i--){l=L[i];if(l.st==='top'){ths[i]=0;continue}ths[i]=(rank<12||i===sel)?th(l.bytes):1;rank++;sum+=ths[i]+(ths[i]>1?2:0)}
    var avail=g.fy-g.st-6;
    for(i=0;i<n&&sum>avail;i++){if(i===sel||ths[i]<=3||L[i].st==='top')continue;sum-=ths[i]-3;ths[i]=3}
    var y=g.fy-1;for(i=0;i<n;i++){l=L[i];if(l.st==='top')continue;l.th=ths[i];l.ty=y-ths[i];y=l.ty-(ths[i]>1?2:0);
      if(snap){l.h=l.th;if(l.st==='stack'){l.y=l.ty;l.yv=0;l.x=g.cx}}}
    g.top=y}
  layout(true);

  /* ring gauge, row 5 */
  var gz={mb:1,key:'',rings:[],near:0,nearT:0,sc:1,scv:0,ox:0,oy:0,oxT:0,oyT:0};
  function gLim(){return Math.min(G.cx-12,G.rx*2.7)}
  function gT(i){var n=gz.rings.length||1,rest=Math.min(5,Math.max(1,(gLim()-G.rx)/n)),sp=rest+(14-rest)*gz.near;return G.rx+(i+1)*sp}
  function gauge(b,key,pre){if(gz.key===key)return;gz.key=key;gz.mb=mbOf(b);var c=Math.min(gz.mb,240),now=performance.now(),gap=Math.min(40,1200/c);gz.rings=[];
    for(var i=0;i<c;i++)gz.rings.push({r:G.rx,v:0,b:pre?0:now+i*gap});if(pre)for(i=0;i<c;i++)gz.rings[i].r=gT(i);gz.scv=-.2;ariaMouth();kick()}

  /* rings off the edge and echo, row 6 */
  var PR=[],pendR=[],echo=null,flash=0,parts=[],dust=[],dustUntil=0;
  for(i=0;i<10;i++)dust.push({x:Math.random(),y:Math.random(),v:.002+Math.random()*.003});
  function ringP(k,amb){var n=amb?28:44,sp=Math.max(1,G.u/500);for(var i=0;i<n;i++)PR.push({a:i/n*6.2832+k*.13,r:G.rx,v:amb?.9+Math.random()*.2:3.2*sp+Math.random()*.5,w:(Math.random()-.5)*.003,amb:amb})}
  function burst(x,y,n,c,s){for(var i=0;i<n;i++){var a=Math.random()*6.2832,r=s*(.4+Math.random());parts.push({x:x,y:y,vx:Math.cos(a)*r,vy:Math.sin(a)*r*.5,l:1,c:c})}}

  /* kettle stitch, row 3 */
  var stN=40,stl=[],cnt={l:12,n:40,a:0,hold:false,peek:0};
  function buildSt(n){stN=Math.max(1,Math.min(n,40));stl=[];for(var i=0;i<stN;i++)stl.push({p:0,v:0,t:0,d:0})}
  function markSt(k,snap){for(var i=0;i<stN;i++){var s=stl[i];if(i<k&&!s.t){s.t=1;if(snap)s.p=1}}}
  buildSt(40);markSt(12,true);
  var sag={p:0,v:0};
  function thY(x){var t=(x-G.cx)/(G.rx*2.4);return G.ty+sag.p*Math.max(0,1-t*t)}

  /* against log, row 8 */
  var lg={hp:1,hold:false,pt:0,heard:6,closed:false,rep:false,F:[],sq:{p:1,v:0}};
  for(i=0;i<6;i++)lg.F.push({p:1,v:0});

  /* plumb line file, row 1 */
  var Q=[['cat-pics-2.zip',2516582],['Forever plan.pdf',1153433],['cat-pics-2 (one byte flipped).zip',2516582,1],['Monday.txt',812],['Emotional baggage',41943040],['tax-return-final-FINAL.pdf',88064]],qi=0;
  var f=null,pend=[];
  function newF(n,b,file,flip){return{id:'J'+(++uid),n:n,b:b,file:file||null,flip:!!flip,y:-G.chh/2,v:0,m:1,mv:0,ph:'hang',phi:.08,pv:0,tr:1,tv:0,cl:0,
    splashed:false,N:b?Math.ceil(b/CH):0,landed:0,res:0,bad:[],against:[],hash:'',ok:false,done:false,doneAt:0,cancel:false}}
  function spawn(){if(pend.length){var fl=pend.shift();f=newF(fl.name||'Untitled',fl.size,fl);f.y=G.chh/2+4;f.ph='fall';f.tr=0;live.textContent=f.n+' falling';ariaPlumb();return}
    var q=Q[qi++%Q.length];f=newF(q[0],q[1],null,q[2]);ariaPlumb()}
  spawn();
  function fGeo(F){var g=G,s=sstep(cl(F.m)),sw=g.rx*2-10,sh=Math.max(3,th(F.b));return{w:sw+(g.cw-sw)*s,h:sh+(g.chh-sh)*s,s:s}}
  function lGeo(l){var g=G,s=sstep(cl(l.m)),sw=g.rx*2-8,sh=Math.max(2,l.h);return{w:sw+(g.cw-sw)*s,h:sh+(g.chh-sh)*s,s:s}}
  function cut(F){if(F.ph==='hang'){F.cl=F.y-G.chh/2;F.tr=1;F.tv=0;F.phi=0;F.pv=0}}
  function takeReal(fl){acted=true;if(!fl)return;
    if(f&&f.ph==='hang'){qi=Math.max(0,qi-1);var y=f.y;f=newF(fl.name||'Untitled',fl.size,fl);f.y=y;f.cl=y-G.chh/2;f.tr=1;f.ph='fall';live.textContent=f.n+' falling';ariaPlumb();kick()}
    else{pend.push(fl);live.textContent=fl.name+' waits its turn'}}
  function splash(F){F.splashed=true;flash=1;tone(196,98,.35,.08);
    if(!reduce()){var n=Math.min(mbOf(F.b),8);for(var k=0;k<n;k++)pendR.push({t:k*7,k:k})}
    gauge(F.b,F.id);ariaThread()}

  async function readJob(F){F.res=0;F.bad=[];F.against=[];buildSt(F.N);cnt.n=F.N;cnt.l=0;
    var S=stN,k=0,sz=0,parts2=[];
    function addBad(i,t){F.against.push(CK[i]+': '+t);if(F.bad.indexOf(i)<0)F.bad.push(i)}
    function upd(l){F.landed=l;cnt.l=l;var nk=F.N?Math.floor(l*S/F.N):S;if(nk!==k){k=nk;markSt(k);kick();return true}return false}
    if(F.file){var stp=Math.max(CH,Math.ceil(F.b/400/CH)*CH);
      for(var off=0;off<F.b;off+=stp){if(F.cancel)break;var bl=F.file.slice(off,Math.min(F.b,off+stp)),ab=null;
        try{ab=await bl.arrayBuffer()}catch(e){}if(f!==F)return;if(!ab)break;sz+=ab.byteLength;parts2.push(bl);ab=null;
        if(upd(Math.min(F.N,Math.ceil(sz/CH)))&&!reduce())await sleep(40);if(f!==F)return}}
    else{for(var s=1;s<=S;s++){if(F.cancel)break;var lc=Math.round(s*F.N/S);upd(lc);sz=lc>=F.N?F.b:lc*CH;
        await sleep(reduce()?0:45);if(f!==F)return}}
    if(!F.N){upd(0);markSt(0)}
    if(sz!==F.b)addBad(0,sz+' of '+F.b+' bytes');F.res=1;kick();
    if(F.landed<F.N)addBad(1,(F.cancel?'cancelled at ':'')+F.landed+' of '+F.N);F.res=2;kick();
    if(F.cancel||sz!==F.b)addBad(2,'not computed');
    else if(F.file){if(!(window.crypto&&crypto.subtle))addBad(2,'unavailable');
      else if(F.b>256*MB)addBad(2,'too heavy to hash');
      else{try{var sb=await F.file.arrayBuffer();var sh=hex(await crypto.subtle.digest('SHA-256',sb));sb=null;if(f!==F)return;
        var rb=await new Blob(parts2).arrayBuffer();var rh=hex(await crypto.subtle.digest('SHA-256',rb));rb=null;F.hash=rh;
        if(sh!==rh)addBad(2,'did not match')}catch(e){addBad(2,'failed')}}}
    else{await sleep(reduce()?0:380);F.hash=synth(F.n+F.b);if(F.flip){F.hash=synth(F.n+F.b+'x');addBad(2,'did not match')}}
    if(f!==F)return;F.res=3;kick();
    F.res=4;
    if(F.n.indexOf('.')<0)addBad(4,'no extension');
    for(var j=0;j<L.length;j++){if(F.hash&&L[j].hash===F.hash){addBad(4,'already here as '+L[j].name);break}}
    if(L.some(function(l){return l.name===F.n&&l.hash!==F.hash}))addBad(4,'taken, different contents');
    F.res=5;if(F.b<1024)addBad(5,F.b+' bytes');F.res=6;
    F.ok=F.bad.every(function(i){return i>3});F.done=true;F.doneAt=performance.now();
    if(F.bad.length)live.textContent=F.n+': '+F.against.join('; ');
    ariaThread();ariaLog();kick()}

  function land(F){var g=G,l=mkL({name:F.n,bytes:F.b,hash:F.hash,against:F.against.slice()},!reduce());
    L.push(l);if(F.file)blobs[l.id]=F.file;
    while(L.length>64){var o=L.shift();delete blobs[o.id];if(o===top)top=null}
    sel=L.length-1;layout(false);l.y=l.ty;l.h=l.th;l.x=g.cx;saveL();gz.key='L'+l.id;
    tone(880-Math.min(Math.log(Math.max(F.b,KB)/KB)/Math.LN2,16)*36,0,.14,.12);
    dustUntil=performance.now()+3000;
    if(F.ok){echo={r:maxD(),v:0,n:F.n,b:F.b}}
    else{document.title='No echo · '+F.n;live.textContent=F.n+': no echo. '+F.against.join('; ');tone(233,180,.4,.06,'triangle')}
