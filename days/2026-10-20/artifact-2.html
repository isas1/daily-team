<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewind dial in Backlash</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#17110C;--ink:#EFE4CC;--acc:#D9733B}
:root[data-theme="light"]{--bg:#F2EAD8;--ink:#2A1A0E;--acc:#9A4A1E}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ab1-root:active{cursor:grabbing}
.ab1-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab1-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ab1-num{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink);font:600 clamp(1.25rem,7vmin,3rem)/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="ab1-root" role="slider" tabindex="0" aria-label="Rewind dial. Tap to do something. Drag counterclockwise around the dial, scroll, or press Left Arrow to undo; clockwise or Right Arrow to redo. Enter adds an action. Escape returns to the present. The number shows steps back."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.querySelector('.ab1-root'),cv=document.createElement('canvas'),num=document.createElement('div');
  cv.className='ab1-cv';num.className='ab1-num';cv.setAttribute('aria-hidden','true');num.setAttribute('aria-hidden','true');
  root.appendChild(cv);root.appendChild(num);
  var g=cv.getContext('2d'),T=Math.PI*2,S=60,MAX=59;
  var V=['Start Forever plan','Rename cat-pics-2','Delete Monday','Pack Emotional baggage','Cancel Tuesday','Copy cat-pics-2','Upgrade Forever plan','Move Emotional baggage','Delete cat-pics-3','Rename Monday','Unpack Emotional baggage','Cancel Forever plan'];
  var log=[],vi=0;function add(){log.push(V[vi++%V.length])}
  for(var k=0;k<7;k++)add();
  var tgt=log.length,a=tgt,v=0,lastR=tgt,pulse=0,pulseI=0,drag=null,wacc=0;
  function N(){return log.length}
  function cl(n){return Math.max(0,Math.min(N(),n))}
  function update(){var p=cl(Math.round(tgt)),sb=N()-p;num.textContent=sb;
    root.setAttribute('aria-valuemin','0');root.setAttribute('aria-valuemax',N());root.setAttribute('aria-valuenow',sb);
    root.setAttribute('aria-valuetext',sb+' steps back'+(p>0?'. Next undo: '+log[p-1]:'. Nothing left to undo'))}
  var ac=null,bf=null,br=null,ls=0;
  function snd(back,r){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
      var n=Math.floor(ac.sampleRate*.04);bf=ac.createBuffer(1,n,ac.sampleRate);br=ac.createBuffer(1,n,ac.sampleRate);
      var d=bf.getChannelData(0),e=br.getChannelData(0);
      for(var i=0;i<n;i++){var t=i/ac.sampleRate;d[i]=Math.sin(T*2100*t)*Math.exp(-t/.007)*(.7+.3*Math.random())}
      for(i=0;i<n;i++)e[i]=d[n-1-i]}
    var now=ac.currentTime;if(now-ls<.028)return;ls=now;
    var s=ac.createBufferSource(),gn=ac.createGain();s.buffer=back?br:bf;s.playbackRate.value=r%2?.62:1;
    gn.gain.value=.22;s.connect(gn);gn.connect(ac.destination);s.start()}catch(x){}}
  function step(dt){
    v+=(tgt-a)*.18*dt;v*=Math.pow(.8,dt);a+=v*dt;
    var r=Math.round(a);if(r!==lastR){if(r>=0&&r<=N()&&ac)snd(r<lastR,r);lastR=r}
    if(pulse>0){pulse*=Math.pow(.9,dt);if(pulse<.01)pulse=0}
    if(!drag&&Math.abs(v)<.002&&Math.abs(tgt-a)<.002){a=tgt;v=0}
    return !!drag||a!==tgt||v!==0||pulse>0}
  function snapToTarget(){a=tgt;v=0;pulse=0;lastR=Math.round(a)}
  function draw(){
    var W=cv.width;if(!W)return;var s=W/2,cs=getComputedStyle(root),ink=cs.getPropertyValue('--ink').trim(),acc=cs.getPropertyValue('--acc').trim(),n=N();
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,W);g.translate(s,s);g.lineCap='round';
    function ang(i){return -Math.PI/2+i*T/S}
    for(var i=1;i<=MAX;i++){var th=ang(i),c=Math.cos(th),sn=Math.sin(th);
      if(i<=n){var done=i<=a+.001,r0=done?.79:.86;
        g.globalAlpha=done?1:.32;g.strokeStyle=ink;g.lineWidth=s*(done?.016:.012);
        g.beginPath();g.moveTo(c*r0*s,sn*r0*s);g.lineTo(c*.93*s,sn*.93*s);g.stroke()}
      else{g.globalAlpha=.14;g.fillStyle=ink;g.beginPath();g.arc(c*.93*s,sn*.93*s,s*.007,0,T);g.fill()}}
    g.globalAlpha=1;g.fillStyle=acc;g.beginPath();g.arc(0,-.93*s,s*.016,0,T);g.fill();
    if(n>a+.01){g.globalAlpha=.35;g.strokeStyle=acc;g.lineWidth=s*.012;g.beginPath();
      g.arc(0,0,.7*s,ang(Math.max(a,0)),ang(n));g.stroke()}
    if(pulse>0){var pt=ang(pulseI);g.globalAlpha=pulse;g.strokeStyle=acc;g.lineWidth=s*.008;
      for(var j=0;j<6;j++){var q=pt+(j-2.5)*.05,rr=(.93+(1-pulse)*.12)*s;
        g.beginPath();g.arc(Math.cos(q)*rr,Math.sin(q)*rr,s*.008,0,T);g.stroke()}}
    var h=ang(a),hc=Math.cos(h),hs=Math.sin(h);
    g.globalAlpha=1;g.strokeStyle=acc;g.lineWidth=s*.024;g.beginPath();
    g.moveTo(hc*.22*s,hs*.22*s);g.lineTo(hc*.76*s,hs*.76*s);g.stroke();
    g.fillStyle=acc;g.beginPath();g.arc(hc*.76*s,hs*.76*s,s*.03,0,T);g.fill();
    g.globalAlpha=.45;g.strokeStyle=ink;g.lineWidth=s*.006;g.beginPath();g.arc(0,0,.2*s,0,T);g.stroke();g.globalAlpha=1}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function setT(n){tgt=cl(n);update();kick()}
  function act(){var p=cl(Math.round(tgt));snd(false,p+1);log.length=p;add();
    if(log.length>MAX){log.shift();a-=1;lastR-=1}
    tgt=log.length;pulse=1;pulseI=tgt;update();kick()}
  function pa(e){var b=root.getBoundingClientRect();return Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)}
  root.addEventListener('pointerdown',function(e){root.setPointerCapture(e.pointerId);
    drag={x:e.clientX,y:e.clientY,m:false,base:cl(Math.round(tgt)),acc:0,prev:pa(e)};kick()});
  root.addEventListener('pointermove',function(e){if(!drag)return;
    if(!drag.m&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.m=true;
    var q=pa(e),d=q-drag.prev;if(d>Math.PI)d-=T;if(d<-Math.PI)d+=T;drag.acc+=d;drag.prev=q;
    if(drag.m){var r=drag.base+drag.acc/T*S,n=N();if(r>n)r=n+(r-n)*.3;if(r<0)r*=.3;tgt=r;update();kick()}});
  function up(){if(!drag)return;var m=drag.m;drag=null;if(m)setT(Math.round(tgt));else act()}
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',function(){if(drag){drag.m=true;up()}});
  root.addEventListener('wheel',function(e){e.preventDefault();wacc+=e.deltaY;
    while(Math.abs(wacc)>=40){var d=wacc>0?-1:1;wacc-=d*-40;setT(Math.round(tgt)+d)}},{passive:false});
  root.addEventListener('keydown',function(e){var p=Math.round(tgt),K=e.key;
    if(K==='ArrowLeft'||K==='ArrowDown'){setT(p-1);snd(true,p-1)}
    else if(K==='ArrowRight'||K==='ArrowUp'){setT(p+1);snd(false,p+1)}
    else if(K==='Enter'||K===' ')act();
    else if(K==='Escape')setT(N());
    else if(K==='Home')setT(0);
    else if(K==='End')setT(N());
    else return;e.preventDefault()});
  new ResizeObserver(function(){var r=Math.min(devicePixelRatio||1,2);cv.width=Math.round(root.clientWidth*r);cv.height=cv.width;draw()}).observe(root);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  update();draw();
})();</script>
</body></html>
