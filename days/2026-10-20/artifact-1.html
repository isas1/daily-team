<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seam ripper undo in rewind</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#18120C;--ink:#EADFC8;--acc:#D06A3A}
:root[data-theme="light"]{--bg:#F2EAD8;--ink:#5A3A22;--acc:#A3391C}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:ew-resize;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ab1-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab1-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ab1-n{position:absolute;left:0;right:0;top:62%;text-align:center;color:var(--ink);font:600 clamp(1.25rem,7vmin,2.75rem)/1 ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;pointer-events:none}
</style></head><body>
<div class="ab1-root" role="slider" tabindex="0" aria-label="Forever plan seam. Tap to sew a stitch. Drag left or press Left Arrow to unpick stitches; the holes stay. Drag right or press Right Arrow to resew through the old holes. Enter or Space sews, Escape stops."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.querySelector('.ab1-root');
  var cv=document.createElement('canvas');cv.className='ab1-cv';root.appendChild(cv);
  var num=document.createElement('div');num.className='ab1-n';num.setAttribute('aria-hidden','true');root.appendChild(num);
  var cx=cv.getContext('2d'),W=1,H=1,dpr=1,MAX=20;
  var p=0,v=0,sv=0,holes=0,target=0,drag=false,down=false,sx=0,sp=0,lx=0,lt=0,vel=0,tail=0,lastK=0,bits=[],shown=-1;
  var ac=null,lastTick=0;
  root.setAttribute('aria-valuemin','0');root.setAttribute('aria-valuemax',String(MAX));
  function clamp(x,a,b){return x<a?a:x>b?b:x}
  function tick(hi){if(!ac)return;var n=ac.currentTime;if(n-lastTick<0.04)return;lastTick=n;
    var b=ac.createBuffer(1,ac.sampleRate*0.03|0,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    f.type='bandpass';f.frequency.value=hi?3200:1800;g.gain.value=0.25;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
  function geo(){var x0=W*0.07,sw=W*0.86/MAX;return{x0:x0,sw:sw,y:H*0.44}}
  function pierce(k,dir){var g=geo(),k2=clamp(k,0,MAX-1);
    if(!reduce())for(var i=0;i<4;i++)bits.push({x:g.x0+k2*g.sw+g.sw*(dir<0?0.82:0.18),y:g.y,vx:(Math.random()-0.5)*1.4+dir*0.6,vy:-Math.random()*1.8-0.4,l:1});
    tick(dir<0)}
  function step(dt){var moving=false;
    if(drag){moving=false}
    else if(target===null){
      p+=v*dt;var fr=Math.abs(p-Math.round(p))<0.15?0.9:0.92;v*=Math.pow(fr,dt);
      if(p<0){p=0;v=0}if(p>holes){p=holes;v=0}
      if(Math.abs(v)<0.02){target=Math.round(p);sv=v;v=0}
      moving=true}
    else{var a=(target-p)*0.16;sv=(sv+a*dt)*Math.pow(0.8,dt);p+=sv*dt;
      if(Math.abs(target-p)<0.002&&Math.abs(sv)<0.002){p=target;sv=0}else moving=true}
    var k=Math.floor(clamp(p,0,holes)+0.0001);if(k!==lastK){pierce(Math.min(k,lastK),k<lastK?-1:1);lastK=k}
    var tv=drag?vel:(target===null?v:sv);tail+=(tv-tail)*Math.min(1,0.2*dt);if(Math.abs(tail)>0.002)moving=true;else tail=0;
    for(var i=bits.length-1;i>=0;i--){var b=bits[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=0.08*dt;b.l-=0.035*dt;if(b.l<=0)bits.splice(i,1)}
    return moving||bits.length>0||drag}
  function snapToTarget(){if(!drag){if(target===null)target=Math.round(p);p=target}v=0;sv=0;tail=0;bits.length=0;lastK=Math.floor(p)}
  function draw(){var cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),acc=cs.getPropertyValue('--acc').trim();
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
    var g=geo(),x0=g.x0,sw=g.sw,y=g.y,pc=clamp(p,0,holes),r=Math.max(1.1,W*0.0042),lw=Math.max(1.6,W*0.0075);
    cx.strokeStyle=ink;cx.globalAlpha=0.14;cx.lineWidth=1;cx.beginPath();cx.moveTo(W*0.04,y);cx.lineTo(W*0.96,y);cx.stroke();
    cx.fillStyle=ink;
    for(var k=0;k<holes;k++){var scar=k>=pc-0.0001;cx.globalAlpha=scar?0.9:0.55;
      var ha=x0+k*sw+sw*0.18,hb=x0+k*sw+sw*0.82,rr=scar?r*1.25:r;
      cx.beginPath();cx.arc(ha,y,rr,0,7);cx.arc(hb,y,rr,0,7);cx.fill()}
    cx.globalAlpha=1;cx.strokeStyle=acc;cx.lineCap='round';cx.lineWidth=lw;cx.beginPath();
    var ex=x0+sw*0.18,under=false;
    for(k=0;k<Math.ceil(pc);k++){var f=Math.min(1,pc-k),a=x0+k*sw+sw*0.18,b=x0+k*sw+sw*0.82;
      if(f<=0.6){var e=a+(b-a)*f/0.6;cx.moveTo(a,y);cx.lineTo(e,y);ex=e;under=false}
      else{cx.moveTo(a,y);cx.lineTo(b,y);ex=b+(sw*0.36)*(f-0.6)/0.4;under=true}}
    cx.stroke();
    var sag=clamp(tail,-1.5,1.5),ty=under?y+lw:y;
    cx.globalAlpha=under?0.5:0.9;cx.lineWidth=lw*0.75;cx.beginPath();cx.moveTo(ex,ty);
    cx.quadraticCurveTo(ex+sw*(0.5-sag*1.2),ty-sw*(1.3+Math.abs(sag)*0.8),ex+sw*(1.3-sag*2.2),ty-sw*(0.5-sag*0.4));cx.stroke();
    cx.globalAlpha=1;cx.fillStyle=acc;cx.beginPath();cx.arc(ex,ty,lw*0.9,0,7);cx.fill();
    for(var i=0;i<bits.length;i++){var q=bits[i];cx.globalAlpha=Math.max(0,q.l);cx.lineWidth=1;cx.strokeStyle=ink;
      cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(q.x-q.vx*2,q.y-q.vy*2);cx.stroke()}
    cx.globalAlpha=1;
    var n=Math.round(pc);if(n!==shown){shown=n;num.textContent=String(n);
      root.setAttribute('aria-valuenow',String(n));root.setAttribute('aria-valuetext',n+(n===1?' stitch':' stitches')+' left, '+holes+' holes')}}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function cur(){return target===null?Math.round(p):target}
  function goTo(n){target=clamp(n,0,holes);v=0;kick()}
  function sew(){var n=cur();if(n>=MAX){tick(true);return}holes=Math.max(holes,n+1);target=n+1;v=0;kick()}
  function stop(){drag=false;down=false;target=Math.round(clamp(p,0,holes));v=0;kick()}
  function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume()}
  root.addEventListener('pointerdown',function(e){audio();root.focus();root.setPointerCapture(e.pointerId);
    down=true;drag=false;sx=lx=e.clientX;sp=clamp(p,0,holes);lt=performance.now();vel=0});
  root.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-sx;
    if(!drag&&Math.abs(dx)>6){drag=true;target=null;v=0;sv=0;sx=e.clientX;sp=clamp(p,0,holes);dx=0}
    if(!drag)return;var sw=geo().sw,np=clamp(sp+dx/sw*0.75,0,holes),t=performance.now(),dt=Math.max(1,t-lt)/16.667;
    vel=vel*0.4+((np-p)/dt)*0.6;p=np;lt=t;if(reduce())draw();kick()});
  function up(e){if(!down)return;down=false;
    if(!drag){sew();return}drag=false;
    if(performance.now()-lt>80)vel=0;v=clamp(vel,-1.2,1.2);target=null;kick()}
  root.addEventListener('pointerup',up);
  root.addEventListener('pointercancel',function(){if(down)stop()});
  root.addEventListener('keydown',function(e){var k=e.key,h=true;audio();
    if(k==='ArrowLeft'||k==='ArrowDown')goTo(cur()-1);
    else if(k==='ArrowRight'||k==='ArrowUp')goTo(cur()+1);
    else if(k==='Enter'||k===' ')sew();
    else if(k==='Home')goTo(0);
    else if(k==='End')goTo(holes);
    else if(k==='Escape')stop();
    else h=false;if(h)e.preventDefault()});
  new ResizeObserver(function(){var b=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(1,b.width);H=Math.max(1,b.height);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw()}).observe(root);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  draw();
})();</script>
</body></html>
