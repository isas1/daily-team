<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log viewer with detail sheet for a deploy page</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--ink:#121316;--mu:#5f6168;--hl:rgba(18,19,22,.12);--sel:rgba(18,19,22,.05);--acc:#0b7a66;--sc:rgba(18,19,22,.38);--sh:rgba(18,19,22,.12)}
:root[data-theme="dark"]{--bg:#0e0f11;--sf:#16181b;--ink:#f2f2f0;--mu:#9a9ca2;--hl:rgba(242,242,240,.13);--sel:rgba(242,242,240,.06);--acc:#3cc4a8;--sc:rgba(0,0,0,.55);--sh:rgba(0,0,0,.4)}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.fv9-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;display:grid;grid-template-columns:minmax(0,1fr);background:var(--sf);color:var(--ink);border:1px solid var(--hl);border-radius:12px;overflow:hidden;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.fv9-wide{grid-template-columns:minmax(0,1fr) min(320px,46%)}
.fv9-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.fv9-hd{padding:16px 16px 8px}
.fv9-hd h1{margin:0;font-size:15px;font-weight:650}
.fv9-hint{margin:4px 0 0;font-size:12px;color:var(--mu)}
.fv9-tiny .fv9-hint{display:none}
.fv9-fl{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hl)}
.fv9-f,.fv9-b{min-height:44px;padding:0 12px;border:1px solid var(--hl);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:background .16s,border-color .16s,transform .1s}
.fv9-f{flex:none;white-space:nowrap;color:var(--mu)}
.fv9-f[aria-pressed="true"]{color:var(--ink);font-weight:650;border-color:var(--ink)}
.fv9-ck{display:inline-block;width:1.1em;color:var(--acc);visibility:hidden}
[aria-pressed="true"] .fv9-ck{visibility:visible}
.fv9-n{margin-left:6px;color:var(--mu);font-weight:400}
.fv9-f:active,.fv9-b:active{transform:scale(.97)}
@media(hover:hover){.fv9-f:hover,.fv9-b:hover{background:var(--sel)}}
.fv9-b:disabled{opacity:.4;cursor:default;transform:none;background:none}
.fv9-list{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none}
.fv9-r{display:grid;grid-template-columns:16px 56px minmax(0,1fr);min-height:48px;padding:6px 16px 6px 8px;box-sizing:border-box;align-content:center;border-bottom:1px solid var(--hl);cursor:pointer}
.fv9-r:active,.fv9-r[aria-selected="true"]{background:var(--sel)}
.fv9-g{grid-row:span 2;align-self:center;color:var(--acc);font-weight:700;visibility:hidden}
[aria-selected="true"] .fv9-g{visibility:visible}
.fv9-lv,.fv9-t,.fv9-sev,.fv9-body dd{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.fv9-lv{letter-spacing:.04em}
.fv9-t{color:var(--mu)}
.fv9-m{grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
[aria-selected="true"] .fv9-lv,[aria-selected="true"] .fv9-m{font-weight:700}
.fv9-empty{padding:16px;color:var(--mu)}
.fv9-empty p{margin:0 0 8px}
.fv9-pane{position:relative;background:var(--sf);border-left:1px solid var(--hl);min-height:0}
.fv9-root:not(.fv9-wide) .fv9-pane{position:absolute;left:0;right:0;bottom:0;height:88%;z-index:2;border:0;border-top:1px solid var(--hl);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px var(--sh);visibility:hidden}
.fv9-scrim{position:absolute;inset:0;z-index:1;background:var(--sc);opacity:0;pointer-events:none}
.fv9-wide .fv9-scrim,.fv9-root:not(.fv9-wide) .fv9-prompt,.fv9-wide .fv9-hdl{display:none}
.fv9-prompt{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--mu);font-size:13px}
.fv9-det{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;background:var(--sf)}
.fv9-top{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--hl)}
.fv9-root:not(.fv9-wide) .fv9-top{padding-top:20px;touch-action:none;cursor:grab}
.fv9-hdl{position:absolute;top:8px;left:50%;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:var(--hl)}
.fv9-sev{flex:1;min-width:0;font-weight:700}
.fv9-body{flex:1;min-height:0;overflow:auto;padding:16px}
.fv9-pos{margin:0 0 4px;font-size:12px;color:var(--mu)}
.fv9-body h2{margin:0 0 16px;font-size:16px;font-weight:650;line-height:1.3}
.fv9-body dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}
.fv9-body dt{font-size:12px;color:var(--mu)}
.fv9-body dd{margin:0;word-break:break-all}
.fv9-cp{width:100%;margin-top:16px;border-color:var(--acc);color:var(--acc);font-weight:650}
.fv9-cp[data-s="err"]{border-style:dashed;color:var(--ink)}
.fv9-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 16px;border-top:1px solid var(--hl)}
.fv9-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fv9-root :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fv9-r:focus-visible{outline-offset:-2px}
</style></head><body>
<div class="fv9-root" role="group" aria-label="Deploy log viewer with event details">
<div class="fv9-main" id="fv9-main">
<header class="fv9-hd"><h1>Deploy log · forever-web 4.2</h1><p class="fv9-hint">Tap an event or press Enter to open its details.</p></header>
<div class="fv9-fl" id="fv9-filters" role="group" aria-label="Filter by severity"></div>
<ul class="fv9-list" id="fv9-list" role="listbox" aria-label="Events"></ul>
<div class="fv9-empty" id="fv9-empty" hidden><p>No events at this level.</p><button class="fv9-b" type="button" id="fv9-all">Show all events</button></div>
</div>
<div class="fv9-scrim" id="fv9-scrim"></div>
<aside class="fv9-pane" id="fv9-pane" aria-label="Event details">
<p class="fv9-prompt" id="fv9-prompt">No event open.</p>
<div class="fv9-det" id="fv9-detail">
<div class="fv9-top" id="fv9-top"><span class="fv9-hdl"></span><span class="fv9-sev" id="fv9-sev"></span><button class="fv9-b" type="button" id="fv9-close">Close details</button></div>
<div class="fv9-body"><p class="fv9-pos" id="fv9-pos"></p><h2 id="fv9-msg"></h2><dl><dt>Source</dt><dd id="fv9-src"></dd><dt>Trace</dt><dd id="fv9-tr"></dd><dt>Event ID</dt><dd id="fv9-id"></dd></dl><button class="fv9-b fv9-cp" type="button" id="fv9-copy">Copy event ID</button></div>
<div class="fv9-nav"><button class="fv9-b" type="button" id="fv9-prev">Previous event</button><button class="fv9-b" type="button" id="fv9-next">Next event</button></div>
</div></aside>
<span class="fv9-sr" role="status" id="fv9-st"></span>
</div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0;
  function $(i){return document.getElementById('fv9-'+i)}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  var root=document.querySelector('.fv9-root'),main=$('main'),list=$('list'),fl=$('filters'),emp=$('empty'),pane=$('pane'),det=$('detail'),prm=$('prompt'),scr=$('scrim'),top=$('top'),cls=$('close'),cp=$('copy'),idEl=$('id'),prv=$('prev'),nxt=$('next'),st=$('st');
  var LV={err:'■ ERR',wrn:'▲ WRN',inf:'● INF',ok:'○ OK'};
  var D=[['inf','10:42:01.020','Deploy started: forever-web 4.2.0','build-runner'],
['ok','10:42:02.114','Cache warmed: 596 tiles','cdn-edge'],
['wrn','10:42:03.480','cat-pics-2.zip is 1.2 GB, preview skipped','asset-worker'],
['inf','10:42:04.007','Forever plan limits loaded: 800 req/s','config'],
['err','10:42:05.212','Rate limiter threshold reached: 800 req/s','edge-gw-2'],
['ok','10:42:06.390','Failover healed via standby replica','db-replica-b'],
['wrn','10:42:07.655','"Emotional baggage" is the heaviest upload: 4.8 GB','asset-worker'],
['inf','10:42:08.031','Monday cron moved to 9:00 AM','scheduler'],
['err','10:42:09.874','Health check failed on edge-gw-2: 502','monitor'],
['ok','10:42:11.102','Rollback not needed','deploy-bot'],
['inf','10:42:12.560','Feature flag forever_sync enabled','flags'],
['ok','10:42:14.200','Deploy finished in 14.2 s','build-runner']].map(function(a,i){
    return{l:a[0],t:a[1],m:a[2],s:a[3],id:'evt_42'+String(i+1).padStart(3,'0'),tr:((i+7)*2654435761>>>0).toString(16)+'c21'}});
  var F=[['all','Show all'],['err','Show errors'],['wrn','Show warnings'],['inf','Show info']];
  var vis=[],rows=[],sel=0,open=false,wide=false,p=0,tw=null,drag=null,tok=0,ct;

  F.forEach(function(f){var b=el('button','fv9-f');b.type='button';b.dataset.l=f[0];
    b.append(el('span','fv9-ck','✓'),f[1],el('span','fv9-n',String(D.filter(function(d){return f[0]==='all'||d.l===f[0]}).length)));
    b.onclick=function(){setF(f[0])};fl.append(b)});
  function setF(l){[].forEach.call(fl.children,function(b){b.setAttribute('aria-pressed',b.dataset.l===l)});
    if(open)close(true);render(l)}
  function render(l){vis=[];D.forEach(function(d,i){if(l==='all'||d.l===l)vis.push(i)});
    list.textContent='';rows=vis.map(function(di,k){var d=D[di],li=el('li','fv9-r');li.setAttribute('role','option');
      li.append(el('span','fv9-g','›'),el('span','fv9-lv',LV[d.l]),el('span','fv9-t',d.t.slice(0,8)),el('span','fv9-m',d.m));
      li.onclick=function(){select(k);openE()};list.append(li);return li});
    emp.hidden=!!vis.length;list.hidden=!vis.length;select(0)}
  function select(k,f){if(!vis.length)return;sel=Math.max(0,Math.min(vis.length-1,k));
    rows.forEach(function(r,i){r.setAttribute('aria-selected',i===sel);r.tabIndex=i===sel?0:-1});
    if(f)rows[sel].focus();rows[sel].scrollIntoView({block:'nearest'});if(open)fill()}
  list.addEventListener('keydown',function(e){var k=e.key,n={ArrowDown:sel+1,ArrowUp:sel-1,Home:0,End:vis.length-1}[k];
    if(n!=null){e.preventDefault();select(n,1)}else if(k==='Enter'||k===' '){e.preventDefault();openE()}});
  function fill(){var d=D[vis[sel]];$('sev').textContent=LV[d.l]+'  '+d.t;$('pos').textContent=(sel+1)+' of '+vis.length;
    $('msg').textContent=d.m;$('src').textContent=d.s;$('tr').textContent=d.tr;idEl.textContent=d.id;
    prv.disabled=sel===0;nxt.disabled=sel===vis.length-1;resetCopy()}
  function openE(){if(!vis.length)return;open=true;fill();go(1);if(!wide)cls.focus()}
  function close(nf){if(!open)return;open=false;go(0);if(!nf&&rows[sel])rows[sel].focus()}
  function go(to){tw={f:p,to:to,t0:performance.now(),d:to?260:180};apply();kick()}
  function nav(dir){var b=dir<0?prv:nxt;select(sel+dir);if(b.disabled)(dir<0?nxt:prv).focus()}
  prv.onclick=function(){nav(-1)};nxt.onclick=function(){nav(1)};
  cls.onclick=function(){close()};scr.onclick=function(){close()};$('all').onclick=function(){setF('all')};
  root.addEventListener('keydown',function(e){if(e.key==='Escape'&&open){e.preventDefault();close()}});

  function lbl(s,x){cp.textContent=s;cp.dataset.s=x||''}
  function resetCopy(){clearTimeout(ct);tok++;lbl('Copy event ID')}
  cp.onclick=function(){if(cp.dataset.s==='p')return;clearTimeout(ct);var t=++tok,id=idEl.textContent;lbl('Copying…','p');
    var c=navigator.clipboard,pr=c&&c.writeText?c.writeText(id):Promise.reject();
    Promise.race([pr,new Promise(function(_,r){setTimeout(r,400)})]).then(function(){if(t!==tok)return;
      lbl('✓ Copied ID','ok');st.textContent='Copied '+id;ct=setTimeout(resetCopy,1600)},function(){if(t!==tok)return;
      lbl('Copy failed. ID text selected.','err');st.textContent='Copy failed. ID text selected.';
      var r=document.createRange(),s=getSelection();r.selectNodeContents(idEl);s.removeAllRanges();s.addRange(r)})};

  top.addEventListener('pointerdown',function(e){if(wide||!open||e.target.closest('button'))return;
    drag={y:e.clientY,h:pane.offsetHeight,ly:e.clientY,lt:e.timeStamp,v:0};tw=null;top.setPointerCapture(e.pointerId)});
  top.addEventListener('pointermove',function(e){if(!drag)return;var dy=Math.max(0,e.clientY-drag.y);
    drag.v=(e.clientY-drag.ly)/Math.max(1,e.timeStamp-drag.lt);drag.ly=e.clientY;drag.lt=e.timeStamp;p=1-dy/drag.h;apply()});
  function up(){if(!drag)return;var v=drag.v;drag=null;if(1-p>.3||v>.5)close();else go(1)}
  top.addEventListener('pointerup',up);top.addEventListener('pointercancel',up);

  function step(now){if(!tw)return false;var u=Math.min(1,(now-tw.t0)/tw.d),e=tw.to?1-Math.pow(1-u,4):u*u*u;
    p=tw.f+(tw.to-tw.f)*e;if(u>=1){p=tw.to;tw=null;return false}return true}
  function snapToTarget(){if(tw){p=tw.to;tw=null}}
  function apply(){var on=p>.001||open;main.inert=!wide&&open;
    pane.setAttribute('role',wide?'region':'dialog');pane.setAttribute('aria-modal',!wide&&open);
    if(!wide){pane.style.transform='translateY('+(1-p)*100+'%)';pane.style.visibility=on?'visible':'hidden';
      scr.style.opacity=p;scr.style.pointerEvents=open?'auto':'none';det.style.transform='';det.style.opacity='';det.style.visibility='visible'}
    else{pane.style.transform='';pane.style.visibility='';det.style.transform='translateX('+(1-p)*24+'px)';
      det.style.opacity=p;det.style.visibility=on?'visible':'hidden';prm.style.opacity=1-p}}
  function frame(now){var moving=reduce()?(snapToTarget(),false):step(now);apply();
    raf=moving?requestAnimationFrame(frame):0}
  function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(tw)kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);apply()}});
  new ResizeObserver(function(){var w=root.clientWidth;wide=w>=480;
    root.classList.toggle('fv9-wide',wide);root.classList.toggle('fv9-tiny',w<300);apply()}).observe(root);
  setF('all');apply();
})();</script>
</body></html>
