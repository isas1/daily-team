cp.addEventListener('click',function(){if(busy)return;busy=true;clearTimeout(ct);var t=++tok,id=idEl.textContent;
cp.setAttribute('aria-busy','true');cst.textContent='';setLb('Copying…');
var pr;try{pr=navigator.clipboard.writeText(id)}catch(x){pr=Promise.reject(x)}
Promise.race([pr,new Promise(function(_,r){setTimeout(r,400)})]).then(function(){if(t!==tok)return;busy=false;cp.removeAttribute('aria-busy');
setLb('✓ Copied ID');tone(880,.06,'sine',.04);tone(1320,.08,'sine',.035,0,.07);ct=setTimeout(function(){setLb('Copy event ID')},1600)},
function(){if(t!==tok)return;busy=false;cp.removeAttribute('aria-busy');setLb('Copy event ID');cst.textContent='Copy failed. ID text selected.';
tone(220,.18,'square',.02);var r=D.createRange(),s=getSelection();r.selectNodeContents(idEl);s.removeAllRanges();s.addRange(r)})});

/* list input */
list.addEventListener('click',function(e){var r=e.target.closest('.dl-row');if(!r||r.classList.contains('dl-off'))return;
list.focus({preventScroll:true});var id=+r.dataset.id;if(open){if(id!==sel)tone(1100,.03,'sine',.03);select(id,false)}else{select(id,false);openD(!wide)}});
list.addEventListener('focus',function(){var v=visIds();if(v.length&&v.indexOf(sel)<0&&!open)select(v[0],true)});
list.addEventListener('keydown',function(e){var k=e.key,v=visIds();
if(k==='Escape'){if(open){e.preventDefault();closeD()}return}
if(!v.length)return;var i=v.indexOf(sel),n=-1;
if(k==='ArrowDown')n=i<0?0:Math.min(v.length-1,i+1);else if(k==='ArrowUp')n=i<0?0:Math.max(0,i-1);
else if(k==='Home')n=0;else if(k==='End')n=v.length-1;
else if(k==='Enter'||k===' '){e.preventDefault();if(i<0)select(v[0],true);openD(!wide);return}else return;
e.preventDefault();if(v[n]!==sel)select(v[n],true)});
D.addEventListener('keydown',function(e){
if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();return}
if(e.key==='Escape'&&open&&e.target!==list){e.preventDefault();closeD()}});

/* sample stream */
var live=false,timer=0,run=0,pi=0;
function setStream(){if(live){sg.textContent='●';sg.className='dl-sg dl-live';stx.textContent='Live sample, 1.8s';sBtn.textContent='Pause sample stream'}
else{sg.textContent='‖';sg.className='dl-sg';stx.textContent='Sample stream paused at '+hms(ev[ev.length-1].t);sBtn.textContent='Resume sample stream'}}
function sched(){clearTimeout(timer);if(live&&!D.hidden)timer=setTimeout(tick,1800)}
function pauseS(){clearTimeout(timer);live=false;setStream()}
function resumeS(){live=true;run=0;setStream();sched()}
function tick(){if(!live)return;var a=POOL[pi++%POOL.length],last=ev[ev.length-1];
var e=add(a[0],last.t+1+(pi%2),(last.ms*7+313)%1000,a[1],a[2]);
var pin=list.scrollTop+list.clientHeight>=list.scrollHeight-4,r=mkRow(e);
if(!match(e)){r.classList.add('dl-off');r.setAttribute('aria-hidden','true')}
else if(!reduce()){r.classList.add('dl-new');r.addEventListener('animationend',function(){r.classList.remove('dl-new');if(pin)list.scrollTop=list.scrollHeight},{once:true})}
list.append(r);if(pin)list.scrollTop=list.scrollHeight;
if(ev.length>40){for(var i=0;i<ev.length;i++)if(ev[i].id!==sel){var x=ev[i];rowMap[x.id].remove();delete rowMap[x.id];ev.splice(i,1);break}}
applyFilter();if(sel==null&&match(e)){sel=e.id;markSel()}if(open)fill(false);
if(++run>=10)pauseS();else sched()}
sBtn.addEventListener('click',function(){if(live){pauseS();tone(440,.06,'sine',.03)}else{resumeS();tone(660,.06,'sine',.03)}});
function stop(e){if(live&&!sBtn.contains(e.target))pauseS()}
app.addEventListener('pointerdown',stop,true);
list.addEventListener('wheel',stop,{passive:true});
D.addEventListener('keydown',function(e){if(['Tab','Shift','Control','Alt','Meta'].indexOf(e.key)<0)stop(e)},true);
D.addEventListener('visibilitychange',function(){if(D.hidden)clearTimeout(timer);else sched()});
onMq(mqR,function(){if(reduce()&&live)pauseS()});
onMq(mqW,sync);

/* start */
INIT.forEach(function(a){add(a[0],B+a[1],a[2],a[3],a[4])});
ev.forEach(function(e){list.append(mkRow(e))});
applyFilter();sel=4;markSel();ledger('Filter: all events',1);sync();
if(wide)openD(false,true);
if(reduce())setStream();else resumeS();
})();</script>
</body></html>
