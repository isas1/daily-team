  .rows { display: grid; gap: var(--s2); }
  .row { position: relative; height: 40px; display: grid; grid-template-columns: 32px 1fr; gap: var(--s3); align-items: center; padding-left: var(--s2); }
  .thumb { width: 32px; height: 32px; border-radius: 4px; background: var(--bar); }
  .lines { display: grid; gap: var(--s2); }
  .t { height: 10px; border-radius: 2px; background: var(--bar); }
  .m { height: 6px; width: 40%; border-radius: 2px; background: var(--bar); }

  .loaded .thumb { background: #3B6EA8; }
  .loaded .t { background: var(--text); }
  .loaded .m { background: var(--muted); }
  .selected::before { content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: var(--accent); }

  .failed .rows { opacity: 0.55; }
  .failed .thumb { background: #3B6EA8; }
  .failed .t { background: var(--text); }
  .failed .m { background: var(--muted); }
  .plate { position: absolute; left: var(--s3); right: var(--s3); top: 104px; height: 88px; background: #13202E; border-top: 2px solid var(--red); border-radius: 4px; padding: var(--s3); display: flex; align-items: center; gap: var(--s3); }

  .plate .cause i { display: block; height: 10px; border-radius: 2px; background: var(--text); }
  .plate .cause i + i { height: 6px; width: 60%; background: var(--muted); }
  .retry { width: 88px; height: 40px; border: 2px solid var(--text); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
