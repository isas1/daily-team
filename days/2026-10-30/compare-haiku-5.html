<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Failure plate for a reading-list load</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--pack-bg);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size);color:var(--pack-text)}
.ab1-root{position:relative;width:clamp(180px,92vmin,640px);aspect-ratio:1;box-sizing:border-box;background:var(--pack-bg);border-radius:var(--pack-radii-control);overflow:hidden}
.ab1-root:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.ab1-list{position:absolute;left:var(--pack-spacing-padding);right:var(--pack-spacing-padding);top:var(--pack-spacing-padding);bottom:var(--pack-spacing-padding);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);opacity:.55;overflow:hidden}
.ab1-row{display:flex;align-items:center;gap:var(--pack-spacing-padding);height:56px;box-sizing:border-box;padding:0 var(--pack-spacing-padding);border-bottom:1px solid var(--pack-border)}
.ab1-row[hidden]{display:none}
.ab1-thumb{flex:none;width:40px;height:40px;box-sizing:border-box;border:1px solid var(--pack-border);border-radius:var(--pack-radii-control)}
.ab1-txt{min-width:0;display:grid;gap:calc(var(--pack-spacing-gap) / 2)}
.ab1-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab1-meta{color:var(--pack-muted);font-size:13px}
.ab1-plate{position:absolute;left:var(--pack-spacing-padding);bottom:var(--pack-spacing-padding);width:max-content;max-width:calc(100% - 2 * var(--pack-spacing-padding));max-height:calc(100% - 2 * var(--pack-spacing-padding));overflow:auto;box-sizing:border-box;padding:var(--pack-spacing-padding);display:grid;gap:var(--pack-spacing-padding);background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control)}
.ab1-head{display:flex;align-items:flex-start;gap:var(--pack-spacing-gap)}
.ab1-glyph{flex:none;position:relative;width:24px;height:24px}
.ab1-glyph::before{content:"";position:absolute;left:5px;top:5px;width:14px;height:14px;box-sizing:border-box;border:2px solid var(--pack-text);border-radius:50%}
.ab1-glyph::after{content:"";position:absolute;left:3px;top:11px;width:18px;height:2px;background:var(--pack-text);transform:rotate(-45deg)}
.ab1-msgs{display:grid;flex:1;min-width:0}
.ab1-msg{grid-area:1/1;min-width:0;line-height:20px;font-weight:600;overflow-wrap:break-word;visibility:hidden}
.ab1-msg.ab1-on{visibility:visible}
.ab1-actions{display:flex;flex-wrap:wrap;gap:var(--pack-spacing-gap)}
.ab1-btn{min-width:44px;min-height:44px;padding:0 var(--pack-spacing-padding);font:inherit;font-weight:600;color:var(--pack-text);background:var(--pack-bg);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);cursor:pointer;transition:transform var(--pack-motion-duration) var(--pack-motion-easing),border-color var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-btn:hover{border-color:var(--pack-accent)}
.ab1-btn:active{transform:translateY(1px)}
.ab1-btn[aria-expanded="true"]{border-color:var(--pack-text)}
.ab1-btn:focus-visible{outline:2px solid var(--pack-accent);outline-offset:2px}
.ab1-det{display:grid;gap:calc(var(--pack-spacing-gap) / 2);padding-top:var(--pack-spacing-gap);border-top:1px solid var(--pack-border)}
.ab1-det[hidden]{display:none}
.ab1-kv{display:flex;justify-content:space-between;gap:var(--pack-spacing-padding);color:var(--pack-muted)}
.ab1-kv b{font-weight:600;color:var(--pack-text)}
@media (prefers-reduced-motion:reduce){.ab1-btn{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:160ms;--pack-motion-easing:ease-out;--pack-bg:#111214;--pack-surface:#1a1c1f;--pack-text:#ececee;--pack-muted:#9a9ca3;--pack-accent:#6aa8ff;--pack-border:#2c2f34}:root[data-theme="light"]{--pack-bg:#f6f6f7;--pack-surface:#ffffff;--pack-text:#17181a;--pack-muted:#5d6068;--pack-accent:#2457c5;--pack-border:#d9dbe0}</style></head>
<body>
<div class="ab1-root" role="group" aria-label="Load failure for the Archive source"></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var DUR=160,raf=0,last=0;
  var root=document.querySelector('.ab1-root');
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}

  var CASES=[
    {msg:'Timed out after 6 s · showing copy from 14:02',elapsed:'6.0 s',lg:true},
    {msg:'Cancelled at 9 s · showing copy from 14:02',elapsed:'9.0 s',lg:true},
    {msg:'Nothing loaded yet',elapsed:'6.0 s',lg:false}
  ];
  var BOOKS=[
    ['Field notes on rail signalling','Archive · 4 min'],
    ['Reading lists that survive a reload','Archive · 7 min'],
    ['Forever plan worksheet','Archive · 3 min'],
    ['Notes on slow networks','Archive · 9 min']
  ];
  var s={c:0,open:false,p:1};

  var list=el('div','ab1-list');
  list.setAttribute('inert','');
  var rows=BOOKS.map(function(b){
    var r=el('div','ab1-row'),t=el('div','ab1-txt');
    t.appendChild(el('div','ab1-title',b[0]));
    t.appendChild(el('div','ab1-meta',b[1]));
    r.appendChild(el('div','ab1-thumb'));
    r.appendChild(t);
    list.appendChild(r);
    return r;
  });

  var plate=el('section','ab1-plate');
  plate.setAttribute('aria-label','Load failure');
  var head=el('div','ab1-head'),glyph=el('span','ab1-glyph'),msgs=el('div','ab1-msgs');
  glyph.setAttribute('aria-hidden','true');
  msgs.setAttribute('aria-live','polite');
  var MSG=CASES.map(function(c){var m=el('div','ab1-msg',c.msg);msgs.appendChild(m);return m});
  head.appendChild(glyph);
  head.appendChild(msgs);

  var acts=el('div','ab1-actions');
  var bDet=el('button','ab1-btn','Details'),bNext=el('button','ab1-btn','Next state');
  bDet.type='button';bNext.type='button';
  bDet.setAttribute('aria-expanded','false');
  bDet.setAttribute('aria-controls','ab1-det');
  acts.appendChild(bDet);
  acts.appendChild(bNext);

  var det=el('div','ab1-det');
  det.id='ab1-det';
  det.hidden=true;
  det.setAttribute('role','region');
  det.setAttribute('aria-label','Failure details');
  var KV=['Source','Attempt','Elapsed'].map(function(k){
    var r=el('div','ab1-kv'),v=el('b',null,'');
    r.appendChild(el('span',null,k));
    r.appendChild(v);
    det.appendChild(r);
    return v;
  });

  plate.appendChild(head);
  plate.appendChild(acts);
  plate.appendChild(det);
  root.appendChild(list);
  root.appendChild(plate);

  function draw(){
    var e=1-Math.pow(1-s.p,3);
    plate.style.opacity=String(e);
    plate.style.transform='translateY('+((1-e)*4).toFixed(2)+'px)';
    bDet.setAttribute('aria-expanded',s.open?'true':'false');
    det.hidden=!s.open;
  }
  function setCase(i,anim){
    s.c=i;
    var C=CASES[i];
    MSG.forEach(function(m,j){m.classList.toggle('ab1-on',j===i)});
    KV[0].textContent='Archive';
    KV[1].textContent='1';
    KV[2].textContent=C.elapsed;
    rows.forEach(function(r){r.hidden=!C.lg});
    s.p=(anim&&!reduce())?0:1;
    if(anim)kick();
    draw();
  }
  function step(ms){
    if(s.p>=1)return false;
    s.p=Math.min(1,s.p+ms/DUR);
    return s.p<1;
  }
  function frame(now){
    var ms=last?Math.min(now-last,50):0;
    last=now;
    var moving=reduce()?(s.p=1,false):step(ms);
    draw();
    raf=moving?requestAnimationFrame(frame):0;
  }
  function kick(){
    if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick();
  });
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});

  bDet.addEventListener('click',function(){s.open=!s.open;draw()});
  bNext.addEventListener('click',function(){setCase((s.c+1)%CASES.length,true)});
  root.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&s.open){
      s.open=false;bDet.focus();draw();e.preventDefault();
    }else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      var d=e.key==='ArrowRight'?1:-1;
      setCase((s.c+CASES.length+d)%CASES.length,true);
      e.preventDefault();
    }
  });

  setCase(0,false);
})();</script>
</body></html>
