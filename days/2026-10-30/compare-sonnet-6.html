<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loaded list - reading list panel for a notes tool</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:var(--pack-bg);--ink:var(--pack-text);--acc:var(--pack-accent);--s1:4px;--s2:var(--pack-spacing-gap);--s3:var(--pack-spacing-padding)}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:var(--pack-typography-size) var(--pack-typography-family)}
*{box-sizing:border-box}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;display:flex;flex-direction:column;background:var(--pack-surface);border:1px solid var(--pack-border);border-radius:var(--pack-radii-control);overflow:hidden}
button,.ab1-opt{font:inherit;color:inherit}
button:focus-visible,.ab1-opt:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.ab1-tabs{display:flex;gap:var(--s1);padding:var(--s1);border-bottom:1px solid var(--pack-border)}
.ab1-tab{flex:1;min-width:0;min-height:44px;padding:0;border:0;border-radius:var(--s1);background:transparent;color:var(--pack-muted);font-size:13px;cursor:pointer;transition:background var(--pack-motion-duration) var(--pack-motion-easing),color var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-tab[aria-pressed=true]{background:var(--pack-bg);color:var(--ink);font-weight:600}
.ab1-list{flex:1;min-height:0;overflow-y:auto;margin:0;padding:0;transition:opacity var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-list.ab1-busy{opacity:.4}
.ab1-opt{position:relative;display:grid;grid-template-columns:40px 1fr;align-items:center;gap:var(--s2);height:56px;padding:var(--s2) var(--s3);cursor:pointer;border-bottom:1px solid var(--pack-border);list-style:none;-webkit-tap-highlight-color:transparent}
.ab1-opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc);transform:scaleY(0);transition:transform var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-opt[aria-selected=true]{background:var(--pack-bg)}
.ab1-opt[aria-selected=true]::before{transform:scaleY(1)}
.ab1-th{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--pack-border);border-radius:var(--s1);background:var(--pack-bg);color:var(--pack-muted);font-weight:600}
.ab1-tx{min-width:0}
.ab1-ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:16px}
.ab1-me{display:block;font-size:11px;line-height:12px;color:var(--pack-muted)}
.ab1-empty{display:flex;align-items:center;height:56px;padding:var(--s2) var(--s3);color:var(--pack-muted);font-size:13px}
.ab1-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s1) var(--s2) var(--s1) var(--s3);border-top:1px solid var(--pack-border)}
.ab1-ft{min-width:0;font-size:12px}
.ab1-note{display:block;min-height:16px;line-height:16px;color:var(--pack-muted);font-size:11px;overflow-wrap:anywhere}
.ab1-re{min-width:56px;min-height:44px;padding:0 var(--s2);border:1px solid var(--pack-border);border-radius:var(--s1);background:transparent;cursor:pointer;font-size:13px;transition:background var(--pack-motion-duration) var(--pack-motion-easing),transform 100ms var(--pack-motion-easing)}
.ab1-re:active{transform:scale(.96);background:var(--pack-bg)}
.ab1-re:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:160ms;--pack-motion-easing:ease-out;--pack-bg:#111214;--pack-surface:#1a1c1f;--pack-text:#ececee;--pack-muted:#9a9ca3;--pack-accent:#6aa8ff;--pack-border:#2c2f34}:root[data-theme="light"]{--pack-bg:#f6f6f7;--pack-surface:#ffffff;--pack-text:#17181a;--pack-muted:#5d6068;--pack-accent:#2457c5;--pack-border:#d9dbe0}</style></head><body>
<div class="ab1-root" role="group" aria-label="Reading list: pick an article">
<div class="ab1-tabs" id="ab1-tabs"></div>
<ul class="ab1-list" id="ab1-list" role="listbox" aria-label="Articles"></ul>
<div class="ab1-foot"><div class="ab1-ft"><span id="ab1-count"></span><span class="ab1-note" id="ab1-note" aria-live="polite"></span></div><button class="ab1-re" id="ab1-re" type="button">Reload</button></div>
</div>
<script>(function(){
  var mq=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var D={
    inbox:[["Forever plan, in plain words","3 min · Mon"],["cat-pics-2 (final) (final-2)","1 min · Mon"],["Field notes on rail signalling","6 min · Sun"],["Emotional baggage, 14 lb","4 min · Sun"],["Monday, but gentler","2 min · Sat"],["Forever backup checklist for people who never back up anything and are very sure it is fine","9 min · Sat"],["Delete, then regret","2 min · Fri"],["Notes from the meeting that could have been a note","5 min · Fri"],["Cancel culture for subscriptions","3 min · Thu"],["Forever plan renewal, again","1 min · Thu"],["cat-pics-3","1 min · Wed"],["Snack inventory, 3 oz left","2 min · Wed"]],
    shared:[],
    archive:[["Forever plan, 2024 edition","4 min · Jan"],["cat-pics-1","1 min · Jan"],["Old notes, new notes","3 min · Feb"],["Emotional baggage, 9 lb","4 min · Feb"],["Delete me later","1 min · Mar"],["Forever backup, the sequel","7 min · Mar"],["Cancel the cancel button","2 min · Apr"],["Monday, a retrospective","3 min · Apr"],["Snack inventory, 5 oz left","2 min · May"]]
  };
  var names={inbox:"Inbox",shared:"Shared",archive:"Archive"},src="inbox",busy=0;
  var raf=0,last=0,rem=0;
  var S={};for(var k in D)S[k]={sel:null,foc:0,n:0};
  var $=function(i){return document.getElementById(i)},tabs=$('ab1-tabs'),list=$('ab1-list'),cnt=$('ab1-count'),note=$('ab1-note'),re=$('ab1-re');
  function items(){var s=S[src];return D[src].map(function(d,i){return{id:src+i,t:d[0],m:d[1]}}).filter(function(o,i){return !(s.n%2&&i%4===2)})}
  function time(){return"14:"+("0"+(6+S[src].n)).slice(-2)}
  function opts(){return list.querySelectorAll('.ab1-opt')}
  function tabBtns(){
    tabs.replaceChildren();
    Object.keys(names).forEach(function(k){var b=document.createElement('button');b.type='button';b.className='ab1-tab';b.textContent=names[k];b.setAttribute('aria-pressed',k===src);
      b.onclick=function(){if(busy||k===src)return;src=k;note.textContent='';tabBtns();render()};tabs.appendChild(b)})}
  function mark(){var s=S[src];opts().forEach(function(o,i){o.setAttribute('aria-selected',o.dataset.id===s.sel);o.tabIndex=i===s.foc?0:-1})}
  function pick(o){var s=S[src];
    if(s.sel===o.dataset.id){s.sel=null;note.textContent='Selection cleared'}
    else{s.sel=o.dataset.id;note.textContent='Selected: '+o.dataset.t}
    mark()}
  function focusAt(i){var os=opts(),s=S[src];if(!os.length)return;i=Math.max(0,Math.min(os.length-1,i));s.foc=i;mark();os[i].focus();os[i].scrollIntoView({block:'nearest'})}
  function render(){
    var its=items(),s=S[src];list.replaceChildren();
    if(s.sel&&!its.some(function(o){return o.id===s.sel})){s.sel=null;note.textContent='Selection no longer in list'}
    s.foc=Math.min(s.foc,Math.max(0,its.length-1));
    if(!its.length){var e=document.createElement('li');e.className='ab1-empty';e.setAttribute('role','presentation');e.textContent='No shared articles';list.appendChild(e)}
    its.forEach(function(it,i){
      var li=document.createElement('li');li.className='ab1-opt';li.setAttribute('role','option');
      li.dataset.id=it.id;li.dataset.t=it.t;li.title=it.t;li.setAttribute('aria-label',it.t+', '+it.m);
      var th=document.createElement('span');th.className='ab1-th';th.textContent=it.t.charAt(0).toUpperCase();
      var tx=document.createElement('span');tx.className='ab1-tx';
      var ti=document.createElement('span');ti.className='ab1-ti';ti.textContent=it.t;
      var me=document.createElement('span');me.className='ab1-me';me.textContent=it.m;
      tx.appendChild(ti);tx.appendChild(me);li.appendChild(th);li.appendChild(tx);
      li.onclick=function(){s.foc=i;pick(li)};
      li.onkeydown=function(ev){var k=ev.key;
        if(k==='ArrowDown'){focusAt(i+1)}else if(k==='ArrowUp'){focusAt(i-1)}
        else if(k==='Home'){focusAt(0)}else if(k==='End'){focusAt(1e3)}
        else if(k==='Enter'||k===' '){pick(li)}
        else if(k==='Escape'){if(s.sel){s.sel=null;note.textContent='Selection cleared';mark()}}
        else return;ev.preventDefault()};
      list.appendChild(li)});
    cnt.textContent='Loaded '+its.length+' · '+time();
    mark();
  }
  function finish(){
    S[src].n++;busy=0;rem=0;re.disabled=false;list.classList.remove('ab1-busy');list.removeAttribute('aria-busy');render();re.focus()}
  function frame(now){
    var dt=last?Math.min(now-last,50):0;last=now;
    rem=mq()?0:rem-dt;
    if(rem<=0){raf=0;finish()}else raf=requestAnimationFrame(frame)}
  function kick(){if(busy&&!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else kick()});
  re.onclick=function(){
    if(busy)return;busy=1;rem=320;re.disabled=true;list.classList.add('ab1-busy');list.setAttribute('aria-busy','true');note.textContent='';
    if(mq()){finish()}else kick()};
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))document.documentElement.setAttribute('data-theme',m.theme)});
  tabBtns();render();
})();</script>
</body></html>
