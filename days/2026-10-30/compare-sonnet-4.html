<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retry guard: retrying the Archive source in a reading list</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:var(--pack-bg);--sf:var(--pack-surface);--ink:var(--pack-text);--mu:var(--pack-muted);--acc:var(--pack-accent);--bd:var(--pack-border);--g:var(--pack-spacing-gap);--r:var(--pack-radii-control);--d:var(--pack-motion-duration);--e:var(--pack-motion-easing)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:var(--pack-typography-size)/1.3 var(--pack-typography-family)}
.rg1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:calc(var(--r) * 2);padding:clamp(8px,4vmin,var(--pack-spacing-padding));display:flex;flex-direction:column;gap:var(--g);overflow:auto}
.rg1-head{display:flex;align-items:center;gap:var(--g);min-height:24px}
.rg1-glyph{width:24px;height:24px;flex:none;color:var(--ink)}
.rg1-glyph svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rg1-arc{transform-origin:12px 12px}
.rg1-title{font-weight:600;flex:1}
.rg1-msg{margin:0;min-height:2.6em}
.rg1-msg b{display:block;font-weight:600}
.rg1-msg span{color:var(--mu);font-size:.87em}
.rg1-pips{display:flex;align-items:center;gap:var(--g);color:var(--mu);font-size:.87em}
.rg1-pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);transition:background var(--d) var(--e),border-color var(--d) var(--e)}
.rg1-pip[data-s=fail]{border-color:var(--ink);background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 4px)}
.rg1-pip[data-s=run]{border-color:var(--acc)}
.rg1-pip[data-s=ok]{border-color:var(--acc);background:var(--acc)}
.rg1-slot{display:grid;margin-top:auto}
.rg1-slot>button{grid-area:1/1}
.rg1-btn{min-height:44px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sf);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0 var(--pack-spacing-padding);transition:transform 100ms var(--e),background var(--d) var(--e),opacity var(--d) var(--e)}
.rg1-btn.rg1-pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.rg1-btn:active{transform:scale(.97)}
.rg1-btn[aria-disabled=true]{opacity:.65;cursor:default}
.rg1-btn[hidden]{display:none}
.rg1-lab{grid-area:1/1;display:flex;align-items:center;gap:var(--g)}
.rg1-sz{grid-area:1/1;visibility:hidden;height:0;overflow:hidden}
.rg1-sp{width:16px;height:16px;display:none}
.rg1-btn[data-busy=true] .rg1-sp{display:block}
.rg1-sp svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transform-origin:50% 50%}
.rg1-log{margin:0;color:var(--mu);font-size:.87em;display:flex;justify-content:space-between;gap:var(--g)}
.rg1-log.rg1-nudge span:last-child{animation:rg1-n 200ms var(--e)}
.rg1-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@keyframes rg1-n{50%{transform:translateY(-2px)}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:160ms;--pack-motion-easing:ease-out;--pack-bg:#111214;--pack-surface:#1a1c1f;--pack-text:#ececee;--pack-muted:#9a9ca3;--pack-accent:#6aa8ff;--pack-border:#2c2f34}:root[data-theme="light"]{--pack-bg:#f6f6f7;--pack-surface:#ffffff;--pack-text:#17181a;--pack-muted:#5d6068;--pack-accent:#2457c5;--pack-border:#d9dbe0}</style></head><body>
<div class="rg1-root" id="rg1-root" role="group" aria-label="Retry guard for the Archive source"></div>
<script>(function(){
var root=document.getElementById('rg1-root'),NS='http://www.w3.org/2000/svg';
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var S,raf=0,last=0,ang=0,DUR=1200;
function init(){S={status:'failed',attempt:1,req:S?S.req+1:1,sent:1,ignored:0,hist:['fail'],el:0}}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function svg(h){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.appendChild(h);return s}
function sh(t,a){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);return n}
var glyph=el('div','rg1-glyph'),title=el('div','rg1-title','Archive');
var head=el('div','rg1-head');head.appendChild(glyph);head.appendChild(title);
var msg=el('p','rg1-msg'),mb=el('b'),ms=el('span');msg.appendChild(mb);msg.appendChild(ms);
msg.setAttribute('role','status');msg.setAttribute('aria-live','polite');
var pw=el('div','rg1-pips'),pl=el('span','','Attempts'),pips=[];pw.appendChild(pl);
for(var i=0;i<3;i++){var p=el('span','rg1-pip');p.setAttribute('data-s','none');pips.push(p);pw.appendChild(p)}
var slot=el('div','rg1-slot');
var rb=el('button','rg1-btn rg1-pri');rb.type='button';
var lab=el('span','rg1-lab'),sp=el('span','rg1-sp'),lt=el('span','','Retry');
sp.appendChild(svg(sh('path',{d:'M12 3a9 9 0 1 1-9 9'})));
lab.appendChild(sp);lab.appendChild(lt);rb.appendChild(lab);rb.appendChild(el('span','rg1-sz','Retrying'));
var xb=el('button','rg1-btn','Break it again');xb.type='button';xb.hidden=true;
slot.appendChild(rb);slot.appendChild(xb);
var log=el('p','rg1-log'),ls=el('span'),li=el('span');log.appendChild(ls);log.appendChild(li);
[head,msg,pw,slot,log].forEach(function(n){root.appendChild(n)});
function setGlyph(k){
  glyph.textContent='';var g;
  if(k==='run'){g=svg(sh('path',{d:'M12 3a9 9 0 1 1-9 9','class':'rg1-arc'}))}
  else{g=svg(sh('circle',{cx:12,cy:12,r:8}));
    if(k==='fail')g.appendChild(sh('path',{d:'M6.5 17.5l11-11'}));
    if(k==='ok'){g.appendChild(sh('circle',{cx:12,cy:12,r:3.5,fill:'currentColor'}))}}
  glyph.appendChild(g)}
function spin(){
  var a=reduce()?0:ang,t=a?'rotate('+a+'deg)':'';
  glyph.querySelectorAll('.rg1-arc').forEach(function(n){n.style.transform=t});
  sp.firstChild.style.transform=t}
function render(){
  var st=S.status;
  setGlyph(st==='retrying'?'run':st==='loaded'?'ok':'fail');
  if(st==='retrying'){mb.textContent='Retrying';ms.textContent='Attempt '+S.attempt+' is running'}
  else if(st==='loaded'){mb.textContent='Loaded 9 articles';ms.textContent='Attempt '+S.attempt+' worked'}
  else{mb.textContent=S.attempt===1?'Timed out after 6 s':'Attempt '+S.attempt+' failed';ms.textContent='Press Retry once. Extra presses are ignored.'}
  for(var i=0;i<3;i++)pips[i].setAttribute('data-s',S.hist[i]||'none');
  var busy=st==='retrying';
  rb.setAttribute('aria-disabled',busy);rb.setAttribute('data-busy',busy);
  lt.textContent=busy?'Retrying':'Retry';
  rb.hidden=st==='loaded';xb.hidden=st!=='loaded';
  ls.textContent='Requests sent '+S.sent;li.textContent='Ignored '+S.ignored;
  spin()}
function settle(){
  var a=S.attempt,ok=a>=3;S.hist[a-1]=ok?'ok':'fail';S.status=ok?'loaded':'failed';render()}
function frame(now){
  var dt=last?Math.min(now-last,50):16;last=now;
  if(S.status==='retrying'){
    S.el+=dt;ang=(ang+dt*0.4)%360;
    if(S.el>=DUR)settle();else spin();
  }
  raf=S.status==='retrying'&&!document.hidden?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden&&S.status==='retrying'){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
function retry(){
  if(S.status==='loaded')return;
  if(S.status==='retrying'){S.ignored++;log.classList.remove('rg1-nudge');if(!reduce()){void log.offsetWidth;log.classList.add('rg1-nudge')}render();return}
  S.attempt++;S.sent++;S.req++;S.el=0;S.status='retrying';S.hist[S.attempt-1]='run';
  render();kick()}
function reset(){cancelAnimationFrame(raf);raf=0;init();render();rb.focus()}
rb.addEventListener('click',retry);
xb.addEventListener('click',reset);
root.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='r'||e.key==='R'){e.preventDefault();retry()}
  else if(e.key==='Escape'){e.preventDefault();reset()}});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
    document.documentElement.setAttribute('data-theme',m.theme)});
init();render();
})();</script>
</body></html>
