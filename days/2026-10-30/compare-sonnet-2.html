  function mk(c,p,t){var e=document.createElement('div');e.className=c;if(t)e.textContent=t;if(p)p.appendChild(e);return e}

  function set(el,t){if(el.textContent!==t)el.textContent=t}
  function busy(){return S==='waiting'||S==='still'||S==='cancelling'||S==='hidden'}
  function spinning(){return S==='waiting'||S==='still'||S==='cancelling'}

  function frame(now){
    raf=0;
    if(document.hidden||!spinning())return;
    if(reduce()){ring.style.transform='';return}
    ring.style.transform='rotate('+((now/900*360)%360)+'deg)';
    raf=requestAnimationFrame(frame);
  }
  function kick(){if(!raf&&!document.hidden&&spinning()&&!reduce())raf=requestAnimationFrame(frame)}

  function render(){
    var n=secs(),k='hide',l='Not loaded',h='9 articles ready to fetch',b='Load Archive',off=false;
    if(S==='idle'){k='';}
    else if(S==='hidden'){b='Cancel';off=true;h='Starting request'}
    else if(S==='waiting'){k='spin';l='Waiting \u00b7 '+n+' s';h='Cancel available at 8 s';b='Cancel';off=true}
    else if(S==='still'){k='spin';l='Still waiting \u00b7 '+n+' s';h='This is slow. You can cancel.';b='Cancel'}
    else if(S==='cancelling'){k='spin';l='Cancelling';h='';b='Cancelling';off=true}
    else if(S==='cancelled'){k='stop';l='Cancelled at '+cancelAt+' s';h='Retry starts a new attempt.';b='Retry'}
    else if(S==='loaded'){k='done';l='Loaded 9 articles';h='Newest: cat-pics-2';b='Reload'}
    if(ring.dataset.k!==k)ring.dataset.k=k;
    var m=reduce()?'1':'0';if(ring.dataset.m!==m)ring.dataset.m=m;

    set(line,l);set(hint,h);set(btn,b);
    btn.setAttribute('aria-disabled',off?'true':'false');
    kick();
  }
  function tick(){
    if(S==='waiting'&&secs()>=8){S='still';say('Still waiting. Cancel is available.')}

  }
  function startTick(){clearInterval(iv);iv=setInterval(tick,250)}
  function stopTick(){clearInterval(iv);iv=0}

  function start(slow){
    var my=++id,c=ctrl=new AbortController();
    S='hidden';t0=performance.now();render();startTick();
    setTimeout(function(){if(my===id&&S==='hidden'){S='waiting';say('Waiting');render()}},400);

      var h=setTimeout(res,slow?12000:2000);
      c.signal.addEventListener('abort',function(){clearTimeout(h);rej()});
    }).then(function(){
      if(my!==id)return;
      S='loaded';stopTick();say('Loaded 9 articles');render();
    },function(){});
  }
  function cancel(){
    if(S!=='still')return;
    var my=++id;cancelAt=secs();S='cancelling';ctrl.abort();render();
    setTimeout(function(){if(my===id&&S==='cancelling'){S='cancelled';stopTick();say('Cancelled at '+cancelAt+' seconds. Retry is available.');render()}},400);

  btn.addEventListener('click',function(){
    if(S==='still')cancel();
    else if(S==='idle'||S==='loaded')start(true);
    else if(S==='cancelled')start(false);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')cancel()});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){stopTick();cancelAnimationFrame(raf);raf=0}
    else if(busy()){startTick();tick()}
  });
