<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loaded list for a notes tool reading-list panel</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:var(--pack-bg);--sf:var(--pack-surface);--ink:var(--pack-text);--mu:var(--pack-muted);--acc:var(--pack-accent);--bd:var(--pack-border);--r:var(--pack-radii-control);--g:var(--pack-spacing-gap);--p:var(--pack-spacing-padding);--d:var(--pack-motion-duration);--e:var(--pack-motion-easing)}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--pack-typography-family);font-size:var(--pack-typography-size)}
.hp6-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--g);padding:var(--p);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);container-type:inline-size;overflow:hidden}
.hp6-bar{display:flex;gap:var(--g);align-items:center}
.hp6-seg{display:flex;flex:1;min-width:0;gap:4px}
.hp6-root button{font:inherit;color:var(--mu);background:transparent;border:0;border-radius:var(--r);min-height:44px;min-width:44px;padding:0 var(--g);cursor:pointer;transition:color var(--d) var(--e),background-color var(--d) var(--e)}
.hp6-seg button{flex:1;position:relative}
.hp6-root button[aria-pressed=true]{color:var(--ink)}
.hp6-rl{display:flex;align-items:center;justify-content:center;gap:var(--g);border:1px solid var(--bd)!important;color:var(--ink)!important}
.hp6-root button:active{transform:translateY(1px)}
.hp6-ic{width:16px;height:16px;flex:none}
.hp6-busy .hp6-ic{animation:hp6-sp .8s linear infinite}
.hp6-hid .hp6-ic{animation-play-state:paused}
@keyframes hp6-sp{to{transform:rotate(360deg)}}
.hp6-body{flex:1;min-height:0;display:flex;flex-direction:column;transition:opacity var(--d) var(--e)}
.hp6-busy .hp6-body{opacity:.55}
.hp6-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--g)}
.hp6-row{flex:0 0 56px;height:56px;box-sizing:border-box;display:grid;grid-template-columns:40px 1fr auto;gap:var(--g);align-items:center;padding:0 var(--g) 0 var(--p);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:background-color var(--d) var(--e)}
.hp6-mk{position:relative}
.hp6-mk::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--acc);transform:scaleY(0);transition:transform var(--d) var(--e)}
.hp6-mk[aria-selected=true]::before,.hp6-mk[aria-pressed=true]::before{transform:scaleY(1)}
.hp6-row[aria-selected=true]{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.hp6-th{width:40px;height:40px;box-sizing:border-box;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);display:grid;place-items:center;color:var(--mu);font-size:13px;font-weight:600}
.hp6-ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:18px;min-width:0}
.hp6-me{color:var(--mu);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hp6-empty{height:56px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:var(--g);border:1px dashed var(--bd);border-radius:var(--r);color:var(--mu)}
.hp6-empty[hidden],.hp6-list[hidden]{display:none}
.hp6-ft{display:flex;flex-wrap:wrap;gap:4px var(--g);align-items:center;min-height:24px;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.hp6-nt{color:var(--ink)}
.hp6-root :focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@container (max-width:260px){
.hp6-bar,.hp6-seg{gap:4px}
.hp6-root button{padding:0 4px;font-size:13px}
.hp6-rl span{display:none}
.hp6-row{grid-template-columns:1fr auto;padding-left:var(--g)}
.hp6-th{display:none}
.hp6-ti{font-size:13px;line-height:16px}
}
@media (prefers-reduced-motion:reduce){.hp6-root *,.hp6-root *::before{transition:none!important;animation:none!important}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:160ms;--pack-motion-easing:ease-out;--pack-bg:#111214;--pack-surface:#1a1c1f;--pack-text:#ececee;--pack-muted:#9a9ca3;--pack-accent:#6aa8ff;--pack-border:#2c2f34}:root[data-theme="light"]{--pack-bg:#f6f6f7;--pack-surface:#ffffff;--pack-text:#17181a;--pack-muted:#5d6068;--pack-accent:#2457c5;--pack-border:#d9dbe0}</style></head><body>
<div class="hp6-root" role="group" aria-label="Reading list: loaded articles">
  <div class="hp6-bar">
    <div class="hp6-seg" role="group" aria-label="Source">
      <button class="hp6-mk" id="hp6-s-inbox" data-src="inbox" aria-pressed="true">Inbox</button>
      <button class="hp6-mk" id="hp6-s-shared" data-src="shared" aria-pressed="false">Shared</button>
    </div>
    <button class="hp6-rl" id="hp6-rl" aria-label="Reload"><span id="hp6-rlt">Reload</span></button>
  </div>
  <div class="hp6-body" id="hp6-body" aria-busy="false">
    <ul class="hp6-list" id="hp6-list" role="listbox" aria-labelledby="hp6-s-inbox"></ul>
    <div class="hp6-empty" id="hp6-empty" tabindex="-1" hidden><span aria-hidden="true">&#8212;</span>No shared articles</div>
  </div>
  <div class="hp6-ft" role="status" aria-live="polite"><span id="hp6-ct"></span><span class="hp6-nt" id="hp6-nt"></span></div>
</div>
<script>(function(){
var A=[['f1','Field notes on rail signalling',6],['f2','Forever plan: what carries over',4],['c3','cat-pics-2: a retrospective',2],['e4','Packing light when the heaviest item is emotional baggage',9],['m5','Monday standup notes',3],['w6','Why a loader should say how long',5],['k7','Keeping the old copy when a load fails',7],['x8','Forever archive export checklist',4],['r9','Retry once, not twice',3],['h10','Row heights that never move',5],['d11','Delete drafts older than a year',2],['t12','Friday reading list cleanup',2]];
var B=A.filter(function(a){return a[0]!=='c3'});
var NAME={inbox:'Inbox',shared:'Shared'};
var $=function(id){return document.getElementById(id)};
var root=document.querySelector('.hp6-root'),list=$('hp6-list'),empty=$('hp6-empty'),body=$('hp6-body'),ct=$('hp6-ct'),nt=$('hp6-nt'),rl=$('hp6-rl'),rlt=$('hp6-rlt');
var segs=[].slice.call(document.querySelectorAll('.hp6-seg button'));
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
var st={inbox:{items:A,sel:'f1',fi:0,at:6,flip:0},shared:{items:null,sel:null,fi:0,at:0}};
var src='inbox',rid=0,busy=false,clk=6,note='',job=null,raf=0,last=0;

var NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg'),pa=document.createElementNS(NS,'path');
svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('class','hp6-ic');svg.setAttribute('aria-hidden','true');
pa.setAttribute('d','M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5');pa.setAttribute('fill','none');pa.setAttribute('stroke','currentColor');pa.setAttribute('stroke-width','2');pa.setAttribute('stroke-linecap','round');pa.setAttribute('stroke-linejoin','round');
svg.appendChild(pa);rl.insertBefore(svg,rlt);

function hm(m){return '14:'+(m<10?'0':'')+m}
function el(t,c,p,tx){var e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;p.appendChild(e);return e}

function render(){
  var s=st[src],items=s.items||[];
  list.replaceChildren();
  list.setAttribute('aria-labelledby','hp6-s-'+src);
  items.forEach(function(a,i){
    var o=el('li','hp6-row hp6-mk',list);
    o.id='hp6-o-'+a[0];o.dataset.id=a[0];o.dataset.i=i;o.setAttribute('role','option');o.title=a[1];
    el('span','hp6-th',o,a[1].charAt(0).toUpperCase()).setAttribute('aria-hidden','true');
    el('span','hp6-ti',o,a[1]);
    el('span','hp6-me',o,a[2]+' min');
  });
  list.hidden=!items.length;empty.hidden=!!items.length;
  ct.textContent='Loaded '+items.length+' \u00b7 '+hm(s.at);
  nt.textContent=note;
  sync();
}
function sync(){
  var s=st[src],os=list.children;
  for(var i=0;i<os.length;i++){
    os[i].setAttribute('aria-selected',String(os[i].dataset.id===s.sel));
    os[i].tabIndex=i===s.fi?0:-1;
  }
}
function focusRow(i){
  var o=list.children[i];if(!o)return;
  st[src].fi=i;sync();o.focus({preventScroll:true});
  o.scrollIntoView({block:'nearest',behavior:reduce()?'auto':'smooth'});
}
function select(i){
  var s=st[src],o=list.children[i];if(!o)return;
  s.sel=o.dataset.id;s.fi=i;note='';nt.textContent='';sync();
}
function setBusy(b,reload){
  busy=b;root.classList.toggle('hp6-busy',b);body.setAttribute('aria-busy',String(b));
  var t=b&&reload?'Reloading':'Reload';rlt.textContent=t;rl.setAttribute('aria-label',t);
}
function finish(j){
  if(j.r!==rid)return;
  var s=j.s,d=st[s];
  clk++;d.at=clk;
  if(s==='inbox'){if(j.reload){d.flip^=1;d.items=d.flip?B:A}}else d.items=[];
  var idx=-1;
  if(d.sel){for(var i=0;i<d.items.length;i++)if(d.items[i][0]===d.sel)idx=i;
    if(idx<0){d.sel=null;note='Selection no longer in list'}}
  d.fi=idx>=0?idx:Math.min(d.fi,Math.max(d.items.length-1,0));
  setBusy(false);render();
  if(j.reload){if(d.items.length)focusRow(d.fi);else empty.focus()}
}
function frame(now){
  var dt=last?Math.min(now-last,100):16;last=now;
  if(job){job.left-=dt;if(job.left<=0){var j=job;job=null;finish(j)}}
  raf=job?requestAnimationFrame(frame):0;
}
function kick(){if(!raf&&job&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
function load(reload){
  var r=++rid,s=src;
  setBusy(true,reload);note='';nt.textContent='';
  ct.textContent='Loading '+NAME[s];
  job={r:r,s:s,reload:reload,left:s==='inbox'?1200:800};
  kick();
}

list.addEventListener('click',function(e){
  var o=e.target.closest('.hp6-row');if(!o)return;
  select(+o.dataset.i);o.focus({preventScroll:true});
});
list.addEventListener('keydown',function(e){
  var n=list.children.length,i=st[src].fi,k=e.key;if(!n)return;
  if(k==='ArrowDown')focusRow(Math.min(i+1,n-1));
  else if(k==='ArrowUp')focusRow(Math.max(i-1,0));
  else if(k==='Home')focusRow(0);
  else if(k==='End')focusRow(n-1);
  else if(k==='Enter'||k===' ')select(i);
  else if(k==='Escape'){st[src].sel=null;sync()}
  else return;
  e.preventDefault();
});
segs.forEach(function(b,j){
  b.addEventListener('click',function(){
    var t=b.dataset.src;if(t===src)return;
    src=t;segs.forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    note='';load(false);
  });
  b.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();segs[(j+1)%2].focus()}
  });
});
rl.addEventListener('click',function(){if(!busy)load(true)});

document.addEventListener('visibilitychange',function(){
  var h=document.hidden;root.classList.toggle('hp6-hid',h);
  if(h){cancelAnimationFrame(raf);raf=0}else kick();
});
window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
    document.documentElement.setAttribute('data-theme',m.theme)});
render();
})();</script>
</body></html>
