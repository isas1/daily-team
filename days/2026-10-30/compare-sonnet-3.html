<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserved skeleton for a reading-list panel</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:var(--pack-bg);--ink:var(--pack-text);--acc:var(--pack-accent);--s1:4px;--s2:var(--pack-spacing-gap);--s3:var(--pack-spacing-padding);--s4:24px;--stage:312px}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;box-sizing:border-box;container-type:inline-size;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2);overflow:hidden;background:var(--pack-surface);color:var(--ink);font:var(--pack-typography-size)/1.3 var(--pack-typography-family);border-radius:var(--pack-radii-control);box-shadow:inset 0 0 0 1px var(--pack-border)}
.ab1-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);flex:none}
.ab1-btn{font:inherit;color:var(--ink);background:var(--bg);border:0;min-height:44px;min-width:44px;padding:0 var(--s1);border-radius:var(--pack-radii-control);box-shadow:inset 0 0 0 1px var(--pack-border);cursor:pointer;touch-action:manipulation;transition:transform 100ms var(--pack-motion-easing),background var(--pack-motion-duration) var(--pack-motion-easing)}
.ab1-btn:hover{background:var(--pack-border)}
.ab1-btn:active{transform:scale(.97)}
.ab1-btn[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--acc)}
.ab1-btn:focus-visible,.ab1-scroll:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab1-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ab1-stage{min-height:var(--stage);position:relative}
.ab1-list{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.ab1-row{box-sizing:border-box;height:56px;padding:var(--s2) var(--s3);display:grid;grid-template-columns:40px 1fr;gap:var(--s3);align-items:center;background:var(--bg);border-radius:var(--pack-radii-control);box-shadow:inset 0 0 0 1px var(--pack-border)}
.ab1-th{width:40px;height:40px;border-radius:var(--pack-radii-control);display:grid;place-items:center;font-weight:600;color:var(--acc);box-shadow:inset 0 0 0 1px var(--pack-border)}
.ab1-col{display:grid;gap:var(--s1);min-width:0}
.ab1-skcol{display:grid;gap:var(--s2);min-width:0}
.ab1-sk{background:var(--pack-border);box-shadow:none}
.ab1-b1{height:12px;border-radius:var(--s1)}
.ab1-b2{height:8px;width:40%;border-radius:var(--s1)}
.ab1-ti{font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab1-me{font-size:12px;line-height:16px;color:var(--pack-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab1-plate{box-sizing:border-box;height:var(--stage);padding:var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);text-align:center;border-radius:var(--pack-radii-control);box-shadow:inset 0 0 0 1px var(--pack-border)}
.ab1-plate p{margin:0}
.ab1-pm{color:var(--pack-muted);font-size:13px}
.ab1-retry{padding:0 var(--s3)}
.ab1-status{flex:none;margin:0;min-height:var(--s4);font-size:12px;line-height:16px;color:var(--pack-muted)}
@container (max-width:240px){.ab1-btn{font-size:12px}.ab1-status{font-size:11px}}
@media (prefers-reduced-motion:reduce){.ab1-btn{transition:none}}
</style><style data-pack-tokens>:root{--pack-typography-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--pack-typography-size:15px;--pack-spacing-gap:8px;--pack-spacing-padding:16px;--pack-radii-control:6px;--pack-motion-duration:160ms;--pack-motion-easing:ease-out;--pack-bg:#111214;--pack-surface:#1a1c1f;--pack-text:#ececee;--pack-muted:#9a9ca3;--pack-accent:#6aa8ff;--pack-border:#2c2f34}:root[data-theme="light"]{--pack-bg:#f6f6f7;--pack-surface:#ffffff;--pack-text:#17181a;--pack-muted:#5d6068;--pack-accent:#2457c5;--pack-border:#d9dbe0}</style></head><body>
<div class="ab1-root" role="group" aria-label="Reserved skeleton: reading-list rows that hold their height while loading"></div>
<script>(function(){
  var P='ab1-',root=document.querySelector('.ab1-root');
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,fade=[],fadeT=0,fadeTotal=0;
  function el(t,c,x){var e=document.createElement(t);
    if(c)e.className=c.split(' ').map(function(k){return P+k}).join(' ');
    if(x!=null)e.textContent=x;return e}
  var DATA={
    Inbox:[['F','Forever plan, in plain words','3 min · Monday'],['C','cat-pics-2','Folder · 41 files'],['E','Emotional baggage','Heaviest item · 12 lb'],['N','Notes for Monday','1 min · Draft'],['B','Forever backup, again','2 min · Saved']],
    Shared:[['R','Receipts nobody owns','Shared · 4 min'],['D','Delete this later','Shared · 1 min']],
    Archive:[['O','cat-pics-1','Folder · 38 files'],['F','Forever plan, old edition','5 min · Last year'],['T','Taxes, part 3','Shared · 9 min'],['M','Monday, again','1 min · Draft'],['L','Lunch ideas','2 min · Saved']]
  };
  var NAMES=['Inbox','Shared','Archive'],W=[72,64,80,58,68];
  var st={src:'Inbox',status:'pending',left:0,cause:'',tries:{Archive:0}};
  var bar=el('div','bar'),btns=[];
  bar.setAttribute('role','group');bar.setAttribute('aria-label','Source');
  NAMES.forEach(function(n){var b=el('button','btn',n);b.type='button';
    b.addEventListener('click',function(){load(n)});btns.push(b);bar.appendChild(b)});
  var sc=el('div','scroll'),stage=el('div','stage'),status=el('p','status');
  sc.setAttribute('tabindex','0');sc.setAttribute('role','region');sc.setAttribute('aria-label','Reading list preview');
  status.setAttribute('aria-live','polite');
  sc.appendChild(stage);root.appendChild(bar);root.appendChild(sc);root.appendChild(status);

  function render(fresh){
    fade=[];
    while(stage.firstChild)stage.removeChild(stage.firstChild);
    btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.textContent===st.src))});
    stage.setAttribute('aria-busy',String(st.status==='pending'));
    if(st.status==='failed'){
      var p=el('div','plate');
      p.appendChild(el('p','',st.src+' '+st.cause));
      p.appendChild(el('p','pm','Nothing moved. Try again.'));
      var r=el('button','btn retry','Try again');r.type='button';
      r.addEventListener('click',function(){load(st.src)});
      p.appendChild(r);stage.appendChild(p);return;
    }
    var ul=el('ul','list');
    if(st.status==='pending'){
      ul.setAttribute('aria-hidden','true');
      for(var i=0;i<5;i++){
        var li=el('li','row'),c=el('div','skcol'),b1=el('div','b1 sk');
        b1.style.width=W[i]+'%';
        c.appendChild(b1);c.appendChild(el('div','b2 sk'));
        li.appendChild(el('span','th sk'));li.appendChild(c);ul.appendChild(li);
      }
    }else{
      DATA[st.src].forEach(function(d){
        var li=el('li','row'),c=el('div','col'),t=el('div','ti',d[1]);
        t.title=d[1];
        c.appendChild(t);c.appendChild(el('div','me',d[2]));
        li.appendChild(el('span','th',d[0]));li.appendChild(c);ul.appendChild(li);
        if(fresh){li.style.opacity=0;fade.push(li)}
      });
      if(fresh){fadeT=0;fadeTotal=160+fade.length*40}
    }
    stage.appendChild(ul);
  }
  function say(m){status.textContent=m+' · panel '+stage.offsetHeight+' px'}
  function finish(){
    var src=st.src;
    if(src==='Archive'&&st.tries.Archive++===0){st.status='failed';st.cause='timed out';render();say('Archive timed out')}
    else{st.status='loaded';render(true);say(src+': '+DATA[src].length+' of 5 rows')}
  }
  function frame(now){
    var dt=last?Math.min(now-last,50):0;last=now;var mv=false;
    if(st.status==='pending'){st.left-=dt;if(st.left<=0)finish();else mv=true}
    if(fade.length){
      if(reduce())fadeT=fadeTotal;else fadeT+=dt;
      for(var i=0;i<fade.length;i++){
        var o=Math.max(0,Math.min(1,(fadeT-i*40)/160));
        fade[i].style.opacity=o>=1?'':o;
      }
      if(fadeT<fadeTotal)mv=true;else fade=[];
    }
    raf=mv?requestAnimationFrame(frame):0;
  }
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  function load(src){
    if(st.status==='pending'&&st.src===src)return;
    st.src=src;st.status='pending';st.left=2400;
    render();say('Loading '+src);kick();
  }
  function cancel(){
    if(st.status!=='pending')return;
    st.left=0;st.status='failed';st.cause='cancelled';
    render();say(st.src+' cancelled');
  }
  root.addEventListener('keydown',function(e){
    if(e.key==='Escape'){cancel();return}
    var i=btns.indexOf(document.activeElement);
    if(i<0)return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();btns[(i+(e.key==='ArrowRight'?1:2))%3].focus();
    }
  });
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))
      document.documentElement.setAttribute('data-theme',m.theme)});
  load('Inbox');
})();</script>
</body></html>
