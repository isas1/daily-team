<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline panel: retry a failed build step</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--pn:#141518;--ink:#f2f2f0;--mut:#a3a5aa;--hair:#2a2c31;--lit:#1d1e22;--hov:#18191c;--acc:#f2b705;--on:#0e0f11}
:root[data-theme="light"]{--bg:#f7f7f5;--pn:#fff;--ink:#121316;--mut:#5c5e63;--hair:#deded9;--lit:#efeff0;--hov:#f5f5f4;--acc:#8a6400;--on:#fff}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;container-type:inline-size;background:var(--pn);border:1px solid var(--hair);border-radius:14px;overflow:hidden;box-sizing:border-box}
.ab1-w{position:absolute;inset:0;display:flex;flex-direction:column;font-size:clamp(11px,5.1cqi,15px);font-variant-numeric:tabular-nums}
.ab1-hd{padding:.8em 1em .6em;border-bottom:1px solid var(--hair)}
.ab1-tt{margin:0;font-size:1.15em;font-weight:650;letter-spacing:-.01em}
.ab1-sub{margin:.15em 0 0;color:var(--mut);font-size:.82em;line-height:1.35}
.ab1-ls{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;position:relative;overscroll-behavior:contain}
.ab1-row{width:100%;min-height:44px;display:grid;grid-template-columns:1.3em 1fr auto;gap:.5em;align-items:center;padding:.3em 1em;background:transparent;border:0;border-bottom:1px solid var(--hair);color:var(--ink);font:inherit;text-align:left;position:relative;cursor:pointer;transition:background-color .3s ease-out}
.ab1-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:0;transition:opacity .3s ease-out}
.ab1-row:hover{background:var(--hov)}
.ab1-row.ab1-lit{background:var(--lit)}
.ab1-row.ab1-lit::before{opacity:1}
.ab1-row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.ab1-n,.ab1-nm{opacity:.7;transition:opacity .3s ease-out}
.ab1-n{color:var(--mut)}
.ab1-lit .ab1-n,.ab1-lit .ab1-nm{opacity:1}
.ab1-lit .ab1-nm{font-weight:600}
.ab1-st{font-weight:600;font-size:.88em;white-space:nowrap;display:flex;align-items:center;gap:.35em}
.ab1-d{color:var(--mut);font-weight:400}
.ab1-spin{width:.7em;height:.7em;border:1.5px solid var(--hair);border-top-color:var(--acc);border-radius:50%;animation:ab1-r .8s linear infinite}
@keyframes ab1-r{to{transform:rotate(360deg)}}
.ab1-log{margin:.45em .8em .6em 2.2em;padding:.45em .6em;background:var(--bg);border:1px solid var(--hair);border-radius:8px;font:.76em/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:8.2em;overflow:auto;white-space:pre;opacity:0;transform:translateY(8px);transition:opacity .22s cubic-bezier(.2,0,0,1),transform .22s cubic-bezier(.2,0,0,1)}
.ab1-log.ab1-show{opacity:1;transform:none}
.ab1-log:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ab1-t{color:var(--mut);margin-right:.7em}
.ab1-e{color:var(--acc);font-weight:650}
.ab1-em{color:var(--mut);white-space:normal}
.ab1-ft{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.5em .75em .55em 1em;border-top:1px solid var(--hair)}
.ab1-cap{color:var(--mut);font-size:.8em;line-height:1.3}
.ab1-btn{min-height:44px;min-width:8.4em;padding:0 1em;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--on);font:inherit;font-weight:650;cursor:pointer;transition:transform .12s ease-out,background-color .16s,color .16s;flex:none}
.ab1-btn:active:not(:disabled){transform:scale(.97);transition-duration:.08s}
.ab1-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab1-btn:disabled{background:transparent;border-color:var(--hair);color:var(--mut);cursor:default}
.ab1-btn.ab1-2nd{background:transparent;color:var(--ink);border-color:var(--hair)}
@container (max-width:230px){.ab1-cap{display:none}.ab1-ft{justify-content:flex-end}}
.ab1-still *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.ab1-root *{transition:none!important;animation:none!important}}
</style></head><body>
<div class="ab1-root" role="group" aria-label="Pipeline status for forever-app build">
<div class="ab1-w">
<div class="ab1-hd"><p class="ab1-tt" id="ab1-tt">Build failed</p><p class="ab1-sub" id="ab1-sub" aria-live="polite"></p></div>
<ul class="ab1-ls" id="ab1-ls"></ul>
<div class="ab1-ft"><span class="ab1-cap" id="ab1-cap"></span><button type="button" class="ab1-btn" id="ab1-btn">Retry step</button></div>
</div></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,root=document.querySelector('.ab1-root'),ls=document.getElementById('ab1-ls'),
    tt=document.getElementById('ab1-tt'),sub=document.getElementById('ab1-sub'),cap=document.getElementById('ab1-cap'),btn=document.getElementById('ab1-btn');
  function L(t,x,c){return [t,x,c||'']}
  function base(){return [
    {nm:'Checkout',st:'Passed',d:'0:08',log:[L('12:01:02','git clone forever-app'),L('12:01:09','on cat-pics-2 @ 4b9f2c8')]},
    {nm:'Lint',st:'Passed',d:'0:24',log:[L('12:01:10','eslint . (348 files)'),L('12:01:34','0 warnings, 1 strong opinion')]},
    {nm:'Unit tests',st:'Passed',d:'0:52',log:[L('12:01:35','vitest run'),L('12:02:27','184 suites passed')]},
    {nm:'Build',st:'Failed',d:'1:21',log:[L('12:03:16','vite build --mode forever'),L('12:04:12','chunking vendor modules'),L('12:04:31','warn heap 3,740 of 4,096 MB'),L('12:04:37','Killed process 8421 (node)','e'),L('12:04:37','Exit code 137: out of memory','e')]},
    {nm:'Publish image',st:'Skipped',d:'',log:[]},
    {nm:'Smoke test',st:'Skipped',d:'',log:[]}]}
  var S,msg;
  function reset(){S={ph:'failed',t:0,ei:0,lit:3,open:3,s:base(),key:'',fol:false};msg=['Build failed','cat-pics-2 stopped at step 4 of 6 · exit 137']}
  function lite(i){S.lit=S.open=i;S.fol=true}
  var EV=[
    [0,function(s){s[3].st='Running';s[3].d='';s[3].log=[L('12:06:01','retry on 8 GB runner')];s[4].st=s[5].st='Queued';lite(3);msg=['Build running','Retrying step 4 on 8 GB']}],
    [700,function(s){s[3].log.push(L('12:06:40','heap peak 5,120 of 8,192 MB'))}],
    [1400,function(s){s[3].st='Passed';s[3].d='1:14';s[3].log.push(L('12:07:15','built dist/ in 1:14'));s[4].st='Running';s[4].log=[L('12:07:16','push forever-app:cat-pics-2')];lite(4);msg=['Build running','Step 4 passed in 1:14 · Publish image running']}],
    [1800,function(s){s[4].log.push(L('12:07:31','pushed emotional-baggage layer (212 MB)'))}],
    [2200,function(s){s[4].st='Passed';s[4].d='0:23';s[5].st='Running';s[5].log=[L('12:07:40','smoke /login /inbox')];lite(5);msg=['Build running','Publish image passed · Smoke test running']}],
    [2600,function(s){s[5].log.push(L('12:07:57','2 of 2 checks passed'))}],
    [3000,function(s){s[5].d='0:18';s[5].st='Passed';S.ph='done';msg=['Build passed','All 6 steps passed on cat-pics-2']}]];
  var rows=[];
  base().forEach(function(x,i){var li=document.createElement('li'),b=document.createElement('button');
    b.type='button';b.className='ab1-row';
    var n=document.createElement('span');n.className='ab1-n';n.textContent=i+1;
    var nm=document.createElement('span');nm.className='ab1-nm';nm.textContent=x.nm;
    var st=document.createElement('span');st.className='ab1-st';
    b.append(n,nm,st);li.appendChild(b);ls.appendChild(li);
    b.addEventListener('click',function(){if(S.open===i){S.open=-1}else{S.open=i;S.lit=i}S.fol=false;draw()});
    rows.push({li:li,b:b,st:st,log:null})});
  ls.addEventListener('keydown',function(e){var i=rows.findIndex(function(r){return r.b===document.activeElement});if(i<0)return;
    var j=e.key==='ArrowDown'?i+1:e.key==='ArrowUp'?i-1:e.key==='Home'?0:e.key==='End'?rows.length-1:-9;
    if(j===-9)return;e.preventDefault();rows[Math.max(0,Math.min(rows.length-1,j))].b.focus()});
  root.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.open>=0){var r=rows[S.open];S.open=-1;S.fol=false;draw();r.b.focus()}});
  btn.addEventListener('click',function(){if(S.ph==='failed'){S.ph='run';S.t=0;S.ei=0;kick()}else if(S.ph==='done'){reset();draw()}});
  function buildLog(x){var d=document.createElement('div');d.className='ab1-log';d.id='ab1-log';d.tabIndex=0;
    d.setAttribute('role','region');d.setAttribute('aria-label',x.nm+' log');
    if(!x.log.length){var m=document.createElement('div');m.className='ab1-em';
      m.textContent=x.st==='Queued'?'Waiting for the step before.':'No log. Skipped after step 4 failed.';d.appendChild(m)}
    x.log.forEach(function(l){var r=document.createElement('div');if(l[2])r.className='ab1-'+l[2];
      var t=document.createElement('span');t.className='ab1-t';t.textContent=l[0];r.append(t,document.createTextNode(l[1]));d.appendChild(r)});
    return d}
  function step(dt){if(S.ph!=='run')return false;S.t+=dt;
    while(S.ei<EV.length&&EV[S.ei][0]<=S.t){EV[S.ei][1](S.s);S.ei++}
    return S.ph==='run'}
  function draw(){var still=reduce();root.classList.toggle('ab1-still',still);
    tt.textContent=msg[0];if(sub.textContent!==msg[1])sub.textContent=msg[1];
    cap.textContent=S.ph==='done'?'Steps 4–6 reran on 8 GB':'Reruns steps 4–6 on 8 GB';
    btn.textContent=S.ph==='run'?'Retrying':S.ph==='done'?'Reset demo':'Retry step';
    btn.disabled=S.ph==='run';btn.classList.toggle('ab1-2nd',S.ph==='done');
    S.s.forEach(function(x,i){var r=rows[i];r.b.classList.toggle('ab1-lit',S.lit===i);
      r.b.setAttribute('aria-expanded',S.open===i?'true':'false');
      r.st.textContent='';if(x.st==='Running'){var sp=document.createElement('span');sp.className='ab1-spin';sp.setAttribute('aria-hidden','true');r.st.appendChild(sp)}
      r.st.appendChild(document.createTextNode(x.st));
      if(x.d){var d=document.createElement('span');d.className='ab1-d';d.textContent='· '+x.d;r.st.appendChild(d)}});
    var key=S.open<0?'':S.open+':'+S.s[S.open].st+':'+S.s[S.open].log.length;
    if(key!==S.key){var prev=S.key.split(':')[0],fresh=String(S.open)!==prev;
      rows.forEach(function(r){if(r.log){r.log.remove();r.log=null}r.b.removeAttribute('aria-controls')});
      if(S.open>=0){var r=rows[S.open],lg=buildLog(S.s[S.open]);r.li.appendChild(lg);r.log=lg;r.b.setAttribute('aria-controls','ab1-log');
        lg.scrollTop=lg.scrollHeight;
        if(fresh&&!still){void lg.offsetWidth;requestAnimationFrame(function(){lg.classList.add('ab1-show')})}else lg.classList.add('ab1-show');
        if(S.fol){var li=r.li,top=li.offsetTop,bot=top+li.offsetHeight;
          if(top<ls.scrollTop||bot>ls.scrollTop+ls.clientHeight)ls.scrollTo({top:Math.max(0,bot-ls.clientHeight),behavior:still?'auto':'smooth'})}}
      S.key=key}}
  function frame(now){var dt=last?Math.min(now-last,50):16;last=now;
    var moving=step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(S.ph==='run')kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  reset();draw();
})();</script>
</body></html>
