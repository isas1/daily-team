var D={key:'',d:null,lg:null,lines:[],nodes:[],on:-2};
function buildDet(r,k){var s=r.steps[k],d=el('div','mc-det'),lines=vis(r,k),nodes=[];d.id='mc-det';
 if(s.key!=null&&(s.st==='failed'||s.st==='passed')){
  var c=el('div','mc-cut'+(s.st==='passed'?' mc-ok':'')),ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg'),pa=document.createElementNS(ns,'path');
  sv.setAttribute('aria-hidden','true');sv.setAttribute('viewBox','0 0 24 44');pa.setAttribute('d','M4 0V28H22');sv.appendChild(pa);
  var lb=el('button','mc-lb');lb.type='button';lb.append(el('span',null,s.kl),el('span','mc-lnn','line '+(s.key+1)));
  lb.addEventListener('click',jumpKey);c.append(sv,lb);d.appendChild(c)}
 var lg=el('div','mc-log');lg.tabIndex=0;lg.setAttribute('role','region');lg.setAttribute('aria-label',NAMES[k]+' log');
 if(!lines.length)lg.appendChild(el('div','mc-em',s.st==='skipped'?'No log. Skipped after step 4 failed.':s.st==='queued'?'Queued. Starts after step '+k+'.':'Running on the '+(r.big?'8':'4')+' GB runner'));
 lines.forEach(function(l,j){var n=el('div','mc-ln'+(l.k?' mc-l'+l.k:'')+(j===s.key&&s.st==='failed'?' mc-key':''));
  n.append(el('span','mc-t',fmt(l.t)),el('span','mc-x',l.x));lg.appendChild(n);nodes.push(n)});
 d.appendChild(lg);D.d=d;D.lg=lg;D.lines=lines;D.nodes=nodes}
function jumpKey(){var r=R[V.sel],s=r.steps[V.open];if(!s||s.key==null)return;stopIntro();
 if(!liveView())V.cur=s.log[s.key].t;draw();var n=D.nodes[Math.max(0,s.key-2)];
 if(n)D.lg.scrollTo({top:n.offsetTop-4,behavior:reduce()?'auto':'smooth'});SFX.tick()}
function keepRow(li){var top=li.offsetTop,bot=top+li.offsetHeight,st=list.scrollTop,h=list.clientHeight;
 if(bot>st+h)list.scrollTop=Math.min(top,bot-h);else if(top<st)list.scrollTop=top}

/* retry flow */
var r4=$('r4'),r8=$('r8');
function setLab(b,k){[].forEach.call(b.children,function(s){var on=s.dataset.k===k;s.classList.toggle('mc-vis',on);if(on)b.setAttribute('aria-label',s.textContent)})}
function startRetry(k){if(V.mode!=='idle')return;stopIntro();V.mode='undo';V.kind=k;V.ut=0;draw();$('ub').focus();
 say((k==='8'?'Retry on 8 GB':'Retry')+' starts in 4 seconds. Undo is available.');SFX.go();kick()}
function undo(){if(V.mode!=='undo')return;V.mode='idle';draw();(V.kind==='8'?r8:r4).focus();say('Retry canceled. Nothing reran.');SFX.back()}
function begin(){var f=document.activeElement===$('ub'),big=V.kind==='8',r=runN(big);R.push(r);
 V.sel=R.length-1;V.open=V.lit=3;V.run={r:r,i:3,t:0,big:big};V.mode='run';
 say('Step 4 running on the '+(big?'8':'4')+' GB runner. Steps 5 and 6 queued.');draw();if(f)(big?r8:r4).focus();SFX.ok()}
function advance(dt){var u=V.run,r=u.r,s=r.steps;u.t+=dt;if(u.t<(u.i===3?1400:800))return;u.t=0;
 var see=R[V.sel]===r;
 if(u.i===3&&!u.big){s[3].st='failed';s[4].st=s[5].st='skipped';s[4].log=s[5].log=[];s[4].est=s[5].est=true;
  r.st='failed';r.peak=3980;V.run=null;V.mode='idle';if(see){V.open=V.lit=3;V.cur=keyTime(r,3)}
  say('Step 4 failed again with exit code 137. Retry on 8 GB is available.');SFX.fail();return}
 s[u.i].st='passed';
 if(u.i<5){u.i++;s[u.i].st='running';if(see)V.open=V.lit=u.i;
  say(u.i===4?'Step 4 passed in 1:14. Publish image running.':'Publish image passed. Smoke test running.');SFX.ok();return}
 r.st='passed';r.peak=5120;V.run=null;V.mode='done';if(see){V.open=V.lit=5;V.cur=total(r)}
 say('Build passed. All 6 steps passed.');SFX.pass()}
r4.addEventListener('click',function(){if(r4.getAttribute('aria-disabled')!=='true')startRetry('4')});
r8.addEventListener('click',function(){if(r8.getAttribute('aria-disabled')!=='true')startRetry('8')});
$('ub').addEventListener('click',undo);
$('reset').addEventListener('click',function(){reset();V.intro=null;V.cur=164;D.key='';draw();r8.focus();say('Demo reset. Step 4 failed.');SFX.back()});
$('snd').addEventListener('click',function(){snd=!snd;var b=$('snd');b.setAttribute('aria-pressed',String(snd));b.textContent=snd?'Sound on':'Sound off';if(snd)SFX.tick()});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;
 if(V.mode==='undo'){e.preventDefault();undo();return}
 if(V.open>=0){var i=V.open;V.open=-1;draw();rows[i].b.focus()}});

function stopIntro(){if(V.intro!=null){V.intro=null;V.cur=164}}

/* draw */
function draw(){
 $('app').classList.toggle('mc-still',reduce());
 var lastR=R[R.length-1],r=R[V.sel],c=cur(),T=total(r),i;
 var sum,bad=false;
 if(V.mode==='undo')sum=(V.kind==='8'?'Retry on 8 GB':'Retry')+' queued';
 else if(V.run)sum=V.run.i===3?'Retrying step 4 on '+(V.run.big?'8':'4')+' GB':'Running step '+(V.run.i+1)+' of 6';
 else if(lastR.st==='passed')sum='Build passed in Run '+lastR.n;
 else if(lastR.n>1){sum='Failed again at step 4 · exit 137';bad=true}
 else{sum='Build failed at step 4 of 6';bad=true}
 tx($('sum'),sum);$('sum').classList.toggle('mc-bad',bad);
 /* plate */
 tabs.forEach(function(b,k){var x=R[k];b.hidden=!x;if(!x)return;tx(b.firstChild,'Run '+x.n);tx(b.lastChild,WORD[x.st]);
  b.classList.toggle('mc-bad',x.st==='failed');b.setAttribute('aria-selected',String(k===V.sel));b.tabIndex=k===V.sel?0:-1});
 $('hint').hidden=R.length>1;$('panel').setAttribute('aria-labelledby','mc-t'+V.sel);
 tx($('cap'),'Run '+r.n+' · '+WORD[r.st]+' · '+(r.peak?fmtN(r.peak)+' of '+fmtN(r.limit)+' MB':fmtN(r.limit)+' MB limit'));
 var f=$('fill');f.style.transform='scaleX('+(r.peak?r.peak/8192:0)+')';f.classList.toggle('mc-bad',r.st==='failed');
 $('tw').style.transform='translateX('+(r.limit/8192*100)+'%)';
 /* sweep */
 r.steps.forEach(function(s,k){var g=segs[k];g.style.flexGrow=s.dur;
  var cl='mc-seg'+({failed:' mc-sf',skipped:' mc-ss',queued:' mc-sq',running:' mc-sr'}[s.st]||'')+(k===V.lit?' mc-sl':'');
  if(g.className!==cl)g.className=cl});
 $('cur').style.left=(Math.min(c,T)/T*100)+'%';
 rng.max=T;rng.value=Math.round(c);rng.disabled=liveView();
 var si=stepAt(r,c),stTxt=(si+1)+' '+NAMES[si]+' · '+WORD[r.steps[si].st];
 tx($('time'),fmt(c)+' of '+fmt(T));tx($('step'),stTxt);
 rng.setAttribute('aria-valuetext',fmt(c)+' of '+fmt(T)+', step '+stTxt);
 /* rows */
 r.steps.forEach(function(s,k){var w=rows[k];w.li.classList.toggle('mc-lit',V.lit===k);
  w.b.setAttribute('aria-expanded',String(V.open===k));
  var cl='mc-row'+(s.st==='failed'?' mc-fail':'')+(s.st==='running'?' mc-run':'')+(s.st==='skipped'||s.st==='queued'?' mc-soft':'');
  if(w.cls!==cl){w.cls=cl;w.b.className=cl}
  tx(w.w,WORD[s.st]);tx(w.d,!s.est&&(s.st==='passed'||s.st==='failed')?'· '+fmt(s.dur):'')});
 /* detail */
 var dk='';if(V.open>=0)dk=V.sel+':'+V.open+':'+r.steps[V.open].st+':'+vis(r,V.open).length;
 if(dk!==D.key){var fresh=D.key.split(':').slice(0,2).join(':')!==V.sel+':'+V.open;
  if(D.d){D.d.remove();D.d=null}
  rows.forEach(function(w){w.b.removeAttribute('aria-controls')});
  if(V.open>=0){var s=r.steps[V.open];buildDet(r,V.open);rows[V.open].li.appendChild(D.d);rows[V.open].b.setAttribute('aria-controls','mc-det');
   if(fresh&&!reduce())D.d.classList.add('mc-fresh');
   if(s.st==='running')D.lg.scrollTop=D.lg.scrollHeight;
   else if(s.key!=null&&D.nodes.length)D.lg.scrollTop=D.nodes[Math.max(0,s.key-2)].offsetTop-4;
   if(fresh)keepRow(rows[V.open].li)}
  D.key=dk;D.on=-2}
 if(D.d){var on=-1;D.lines.forEach(function(l,j){if(l.t<=c)on=j});
  D.nodes.forEach(function(n,j){n.classList.toggle('mc-on',j===on);n.classList.toggle('mc-fut',D.lines[j].t>c)});
  if(on>=0&&on!==D.on){var n=D.nodes[on],lg=D.lg,t=n.offsetTop,b=t+n.offsetHeight;
   if(t<lg.scrollTop)lg.scrollTop=t-4;else if(b>lg.scrollTop+lg.clientHeight)lg.scrollTop=b-lg.clientHeight+4}
  D.on=on}
 /* dock */
 var m=V.mode,again=R.some(function(x){return x.n>1&&!x.big});
 var k4=m==='run'&&V.kind==='4'?'pend':again?'again':'retry',k8=m==='run'&&V.kind==='8'?'pend':m==='done'?'pass':'retry';
 setLab(r4,k4);setLab(r8,k8);
 r4.setAttribute('aria-disabled',String(m!=='idle'||again));r8.setAttribute('aria-disabled',String(m!=='idle'));
 r8.classList.toggle('mc-ok',m==='done');r8.classList.toggle('mc-pri',m!=='done');
 $('acts').hidden=m==='undo';$('undo').hidden=m!=='undo';
 if(m==='undo'){var p=Math.min(1,V.ut/4000),left=Math.max(1,Math.ceil(4-p*4));
  $('ubar').style.transform='scaleX('+(reduce()?left/4:1-p)+')';tx($('cd'),'Starting in '+left+' s')}
 tx($('note'),m==='undo'?'Undo window. Then reruns steps 4–6.':m==='run'?'Steps 4–6 on the '+(V.kind==='8'?'8':'4')+' GB runner':m==='done'?'Steps 4–6 reran on 8 GB':again?'Retry hit 4 GB again · 8 GB reruns steps 4–6':'Reruns steps 4–6 · Retry keeps the 4 GB limit');
 $('reset').hidden=!(R.length>1&&(m==='idle'||m==='done'));
}

/* loop */
function tick(dt){var mv=false;
 if(V.intro!=null){V.intro+=dt;var p=Math.min(1,V.intro/1100);V.cur=164*(1-Math.pow(1-p,3));if(p>=1)V.intro=null;else mv=true}
 if(V.mode==='undo'){V.ut+=dt;if(V.ut>=4000)begin();mv=true}
 else if(V.mode==='run'){advance(dt);mv=V.mode==='run'}
 return mv}
function frame(now){var dt=last?Math.min(now-last,50):16.7;last=now;var mv=tick(dt);draw();raf=mv?requestAnimationFrame(frame):0}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(V.intro!=null||V.mode==='undo'||V.mode==='run')kick()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',function(){if(reduce())stopIntro();draw()});
reset();draw();kick();
})();</script>
