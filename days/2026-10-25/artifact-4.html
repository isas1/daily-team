<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>breadcrumb dial in many views of one step</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--ink:#f2f2f0;--acc:#3cc4a8}
:root[data-theme="light"]{--bg:#f7f7f5;--ink:#121316;--acc:#0b7a66}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.hk4-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.hk4-root:active{cursor:grabbing}
.hk4-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hk4-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hk4-tx{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:var(--ink);font:500 clamp(11px,2.6vmin,16px)/1 system-ui,-apple-system,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;opacity:.72;pointer-events:none}
</style></head><body>
<div class="hk4-root" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3" aria-label="trail of footprints back home, seen from many viewpoints. drag around the circle, use the wheel, or the arrow keys to choose how many steps back. each print deepens when you reach it. enter steps back one more, escape returns to this page."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.querySelector('.hk4-root');
  var cv=document.createElement('canvas');cv.className='hk4-cv';root.appendChild(cv);
  var tx=document.createElement('div');tx.className='hk4-tx';root.appendChild(tx);
  var ctx=cv.getContext('2d'),S=300,dpr=1;
  var names=['home','forever plan','cat-pics-2','monday','this page'];
  var dep=[5,4,3,2,1],dT=[5,4,3,2,1],dV=[0,0,0,0,0];
  var v=0,vel=0,target=0,drag=false,a0=0,wt=0,shown=-1;
  function clamp(x,a,b){return x<a?a:x>b?b:x}
  function commit(s){s=clamp(Math.round(s),0,4);target=s;var i=4-s;dT[i]=Math.min(dT[i]+1,9);
    root.setAttribute('aria-valuenow',s);root.setAttribute('aria-valuetext',s+' steps back, '+names[i]);kick()}
  function step(dt){var m=false,k=0.16,d=Math.pow(0.8,dt);
    if(!drag){vel=vel*d+(target-v)*k*dt;v+=vel*dt;
      if(Math.abs(target-v)>0.0008||Math.abs(vel)>0.0008)m=true;else{v=target;vel=0}}else m=true;
    for(var i=0;i<5;i++){dV[i]=dV[i]*Math.pow(0.78,dt)+(dT[i]-dep[i])*0.12*dt;dep[i]+=dV[i]*dt;
      if(Math.abs(dT[i]-dep[i])>0.002||Math.abs(dV[i])>0.002)m=true;else{dep[i]=dT[i];dV[i]=0}}
    return m}
  function snapToTarget(){if(!drag){v=target;vel=0}for(var i=0;i<5;i++){dep[i]=dT[i];dV[i]=0}}
  var sole=[];for(var j=0;j<28;j++){var u=j/28*Math.PI*2,su=Math.sin(u);
    sole.push([0.5*su,0.5*Math.cos(u)*(0.8+0.25*su-0.24*Math.exp(-su*su*14))])}
  function draw(){var cs=getComputedStyle(document.documentElement),
    ink=cs.getPropertyValue('--ink').trim(),acc=cs.getPropertyValue('--acc').trim();
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
    var cx=S/2,cy=S*0.46,R=S*0.3,t=clamp(v,-0.4,4.4)/4*1.22,ct=Math.cos(t),st=Math.sin(t);
    var L=S*0.13,W=S*0.058,sel=4-v,sp=Math.PI/3;
    ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.globalAlpha=0.13;ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(cx,cy,R,Math.max(R*ct,0.5),0,0,Math.PI*2);ctx.stroke();
    var ord=[0,1,2,3,4].map(function(i){var p=Math.PI/2+(i-sel)*sp;return{i:i,p:p,z:Math.sin(p)}});
    ord.sort(function(a,b){return a.z-b.z});
    ord.forEach(function(o){var i=o.i,p=o.p,side=(i%2?1:-1)*S*0.028,
      rx=Math.cos(p),rz=Math.sin(p),px=rx*(R+side),pz=rz*(R+side),
      hx=-rz,hz=rx,nx=rx,nz=rz,D=Math.max(dep[i],0.2),dd=D*S*0.012,
      w=Math.max(0,1-Math.abs(i-sel)),n=Math.ceil(D-0.001);
      for(var k=n;k>=0;k--){var f=Math.min(k/D,1),a=k===0?1:(k<n?0.42:0.42*(D-(n-1)));
        var sc=1-f*(0.55*ct+0.12),yo=f*dd*st;
        ctx.globalAlpha=k===0?0.55+0.45*Math.max(w,0.35):a*(0.6+0.4*w);
        ctx.strokeStyle=w>0.5?acc:ink;ctx.lineWidth=k===0?1+w*1.2:1;
        ctx.beginPath();
        for(var j=0;j<sole.length;j++){var lx=sole[j][0]*L*sc,ly=sole[j][1]*W*sc,
          wx=px+lx*hx+ly*nx,wz=pz+lx*hz+ly*nz,
          X=cx+wx,Y=cy+wz*ct+yo;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}
        ctx.closePath();ctx.stroke()}
      if(st>0.05){ctx.globalAlpha=0.25*st*(0.5+0.5*w);ctx.strokeStyle=w>0.5?acc:ink;ctx.lineWidth=1;
        ctx.beginPath();[0.25,0.75].forEach(function(q){var sj=sole[Math.round(q*28)%28];
          var wx=px+sj[1]*W*nx,wz=pz+sj[1]*W*nz,s2=1-(0.55*ct+0.12);
          ctx.moveTo(cx+wx,cy+wz*ct);
          ctx.lineTo(cx+px+sj[1]*W*s2*nx,cy+(pz+sj[1]*W*s2*nz)*ct+dd*st)});ctx.stroke()}});
    ctx.globalAlpha=1;
    var s=clamp(Math.round(v),0,4);if(s!==shown){shown=s;tx.textContent='steps back: '+s}}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function ang(e){var r=root.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height*0.46,e.clientX-r.left-r.width/2)}
  root.addEventListener('pointerdown',function(e){drag=true;a0=ang(e);vel=0;root.setPointerCapture(e.pointerId);root.focus();kick()});
  root.addEventListener('pointermove',function(e){if(!drag)return;var a=ang(e),d=a-a0;
    if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;a0=a;
    var nv=v+d/(Math.PI/3);if(nv<0||nv>4)nv=v+d/(Math.PI/3)*0.3;v=clamp(nv,-0.5,4.5);target=v;kick()});
  function up(){if(!drag)return;drag=false;commit(v)}
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  root.addEventListener('wheel',function(e){e.preventDefault();drag=true;
    v=clamp(v+(e.deltaY+e.deltaX)*0.004,-0.3,4.3);target=v;kick();
    clearTimeout(wt);wt=setTimeout(function(){drag=false;commit(v)},140)},{passive:false});
  root.addEventListener('keydown',function(e){var k=e.key,s=Math.round(target);
    if(k==='ArrowRight'||k==='ArrowUp'||k==='Enter'||k===' ')s++;
    else if(k==='ArrowLeft'||k==='ArrowDown')s--;
    else if(k==='Escape')s=0;else if(k==='Home')s=0;else if(k==='End')s=4;else return;
    e.preventDefault();commit(s)});
  new ResizeObserver(function(){var r=root.getBoundingClientRect();S=r.width||300;
    dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);draw()}).observe(root);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  draw();commit(3);
})();</script>
</body></html>
