<style>

function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

// the dye-sample library

// parts
function mk(tag,cls,at){var e=D.createElement(tag);e.className=cls;for(var k in at)e.setAttribute(k,at[k]);D.body.appendChild(e);return e}
var eStrip=mk('div','wb-part wb-strip',{role:'slider',tabindex:'0','aria-orientation':'horizontal','aria-valuemin':'1','aria-label':'the trail back up, a line of footprints. library, home, is the deepest print; the page you are on is the newest and shallowest. move near a print to sink it a little, tap or press enter to step back to it. arrow keys move along the line, escape returns to where you are.'});
var eScene=mk('div','wb-part wb-scene',{role:'slider',tabindex:'0','aria-orientation':'vertical','aria-valuemin':'0','aria-label':'the snow slope. drag the walker along the trail or fling it up toward home; every print it passes sinks deeper and never fills in. the wheel turns the view. arrow keys step one print, enter throws you partway home, escape throws you back down.'});

var eTitle=D.createElement('span');eTitle.className='wb-title';eTitle.textContent='the way back up';eUi.appendChild(eTitle);
var eSnd=D.createElement('button');eSnd.type='button';eSnd.className='wb-snd';eSnd.textContent='sound on';eSnd.setAttribute('aria-pressed','true');eUi.appendChild(eSnd);

// state per part

var bp=3.4,bv=0,bMode='spring',bTg=4,bUser=false,bDrag=false,bly=0,blt=0,bvel=0;
var va=0,vv=0,vt=0,vDrag=false,vWt=0,VD=[0,90,160],VN=['from above, names','from the side, depth','from low behind the walker'];
var hp=0,hpv=0,hd=0,hdv=0,hb=0,hbv=0,holding=false,holdStart=0,hSteps=0,hTimer=0,hDownAt=0;
var f8=[0,0,0,0,0],f8v=[0,0,0,0,0],near8=null,sel8=4,down8=null;
var parts=[];
var grains=[];for(var g=0;g<320;g++)grains.push([Math.random(),Math.random(),Math.random()]);
var hg=[],seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(g=0;g<170;g++){var ga=rnd()*6.283,gr=1.05+Math.pow(rnd(),2)*.16;hg.push([Math.cos(ga)*gr,Math.sin(ga)*gr,.6+rnd()*1.2])}
var U=[],M=72;
for(var j=0;j<M;j++){var ut=j/M*Math.PI*2,uy=-Math.cos(ut),us=Math.sin(ut),uw=.37+.06*(-uy)-.1*Math.exp(-Math.pow((uy-.25)/.22,2));
  if(us<0)uw-=.07*Math.exp(-Math.pow((uy-.15)/.28,2));U.push([us*uw,uy])}

// layout
function place(e,r){e.style.left=r.x+'px';e.style.top=r.y+'px';e.style.width=r.w+'px';e.style.height=r.h+'px'}
function layout(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  var m=Math.min(W,H),pad=Math.max(10,m*.03),sh=cl(H*.14,64,120),bh=cl(m*.26,96,170),cw=cl(W*.17,64,150);

// geometry
function sPos(i){var s=L.strip;return[s.x+s.w*(i+.5)/5,s.y+s.h*.36+(i%2?1:-1)*s.h*.05]}
function lp(){var S=L.scene;return Math.min(66,Math.min(S.w,S.h)*.13)}
function sp0(q){var S=L.scene,t=q/4,amp=Math.min(S.w*.24,S.h*.3);return[S.x+S.w*.5+amp*Math.sin(t*Math.PI*1.5+.6),S.y+S.h*(.12+.72*t)]}

  for(var t=-4;t<=4;t++){var tx=t*Lx/10;cx.moveTo(tx,-Wy);cx.lineTo(tx,Wy)}cx.stroke();cx.restore();
  sole(Lx,Wy,dep,fl);cx.lineWidth=(isCur?1.8:1)*lw;cx.strokeStyle=isCur?C.acc:rgba(INK,.25+.4*dm);cx.stroke();cx.restore()}

function drawStrip(){var s=L.strip,n=trail.length,slot=s.w/5,Lx=Math.min(slot*.5,s.h*.5),Wy=Lx*.44,dp=deepest(),i,a,b;
  cx.strokeStyle=rgba(INK,.18);cx.lineWidth=1;cx.setLineDash([2,5]);cx.beginPath();
  for(i=0;i<n-1;i++){a=sPos(i);b=sPos(i+1);cx.moveTo(a[0]+Lx*.6,a[1]);cx.lineTo(b[0]-Lx*.6,b[1])}cx.stroke();cx.setLineDash([]);
  var fs=cl(s.h*.13,10,15);cx.textAlign='center';cx.textBaseline='middle';
  for(i=0;i<n;i++){var q=sPos(i),dep=base(dd[i])+.2*n1[i],fl=i%2?1:-1,sc=.86+.14*Math.min(dep,1.2);
    foot(q[0],q[1],fl*.05,Lx,Wy,sc,sc,dep,fl,i===cur,i===dp,1);
    if(i===foc1&&foc1!==cur){cx.fillStyle=C.acc;cx.beginPath();cx.arc(q[0],q[1]+Wy*.95,2,0,7);cx.fill()}
    fitText(trail[i],fs,slot*.92,serif);cx.fillStyle=i===cur?C.acc:rgba(INK,i===foc1?.9:.6);cx.fillText(trail[i],q[0],s.y+s.h*.82)}}

function drawScene(){var S=L.scene,n=trail.length,f1=cl(va/90,0,1),f2=cl((va-90)/70,0,1),side=f1*(1-f2),Lp=lp(),Wp=Lp*.44,dp=deepest(),i,q,P;
  if(f2>.01){var hy=S.y+S.h*.1,vx=S.x+S.w*.5;cx.strokeStyle=rgba(INK,.18*f2);cx.lineWidth=1;cx.beginPath();
    cx.moveTo(S.x,hy);cx.lineTo(S.x+S.w,hy);cx.moveTo(vx-S.w*.04,hy);cx.lineTo(S.x,S.y+S.h);cx.moveTo(vx+S.w*.04,hy);cx.lineTo(S.x+S.w,S.y+S.h);cx.stroke()}
  if(side>.01){cx.strokeStyle=rgba(INK,.4*side);cx.lineWidth=1;cx.beginPath();
    for(q=-.6;q<=4.61;q+=.2){P=proj(q);q<-.5?cx.moveTo(P.x,P.y):cx.lineTo(P.x,P.y)}cx.stroke()}
  if(n>1){cx.setLineDash([2,6]);cx.strokeStyle=rgba(INK,.18*(1-side));cx.lineWidth=1;cx.beginPath();
    for(q=0;q<=n-1+.001;q+=.1){P=proj(q);q?cx.lineTo(P.x,P.y):cx.moveTo(P.x,P.y)}cx.stroke();cx.setLineDash([])}
  var fs=cl(S.h*.032,11,16),ifs=cl(Lp*.22,10,13);cx.textAlign='center';cx.textBaseline='middle';
  for(i=0;i<n;i++){P=proj(i);var A=proj(i-.12),B=proj(i+.12),ang=Math.atan2(B.y-A.y,B.x-A.x),dep=base(dd[i]),fl=i%2?1:-1,o=Lp*.28*fl*(1-side),
      sx=P.s*(1-.45*f2),sy=Math.max(.12,P.s*(1-.8*side)),al=i>cur?.55:1;
    foot(P.x-Math.sin(ang)*o,P.y+Math.cos(ang)*o,ang,Lp*P.s>0?Lp:Lp,Wp,sx,sy,dep,fl,i===cur,i===dp,al);
    if(side>.02){var nn=Math.min(10,Math.round(Math.max(0,dd[i]))),gap=Math.max(2.5,Lp*.07);
      cx.globalAlpha=side*al;cx.strokeStyle=i===cur?C.acc:rgba(INK,.5);cx.lineWidth=1;cx.beginPath();
      for(var k=0;k<nn;k++){var hw=Lp*(.42-k*.03),yy=P.y+Wp*.15+gap*(k+1);cx.moveTo(P.x-hw,yy);cx.lineTo(P.x+hw,yy)}cx.stroke();
      cx.font=sans(ifs);cx.textAlign='left';cx.fillStyle=i===cur?C.acc:rgba(INK,.7);cx.fillText(cnt[i]+' in',P.x+Lp*.6,P.y+Wp*.15+gap*(nn/2+.5));
      cx.textAlign='center';cx.globalAlpha=1}
    if(f1<.98){cx.globalAlpha=(1-f1)*(i>cur?.5:.9);cx.font=serif(fs);cx.fillStyle=i===cur?C.acc:C.ink;cx.fillText(trail[i],P.x,P.y+Lp*.62);cx.globalAlpha=1}}

function drawDial(){var d=L.dial,r=d.w*.38,ox=d.x+d.w/2,oy=d.y+d.w/2,rad=Math.PI/180,i;
  cx.strokeStyle=rgba(INK,.22);cx.lineWidth=1;cx.beginPath();cx.arc(ox,oy,r,0,7);cx.stroke();
  cx.strokeStyle=rgba(INK,.5);cx.lineWidth=2;cx.beginPath();cx.arc(ox,oy,r,-90*rad,70*rad);cx.stroke();
  cx.lineWidth=1;cx.beginPath();for(i=0;i<3;i++){var a=(VD[i]-90)*rad;cx.moveTo(ox+Math.cos(a)*r*.78,oy+Math.sin(a)*r*.78);cx.lineTo(ox+Math.cos(a)*r*1.08,oy+Math.sin(a)*r*1.08)}cx.stroke();
  var na=(va-90)*rad,tx=ox+Math.cos(na)*r*.7,ty=oy+Math.sin(na)*r*.7;
  cx.strokeStyle=C.acc;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(tx,ty);cx.stroke();

  cx.font=sans(L.dfs);cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle=rgba(INK,.72);
  cx.fillText('steps back: '+(trail.length-1-cur),ox,d.y+d.w+L.dfs*.9)}

function drawCol(){var c=L.col,h=c.h/5,n=trail.length,dp=deepest(),fs=cl(c.w*.14,10,13),i,k;
  for(i=0;i<5;i++){var y0=c.y+i*h+h*.38,x=c.x+c.w*(.5+(i%2?.1:-.1)),w=c.w*.44,xl=x-w/2,xr=x+w/2;
    if(i>=n){cx.strokeStyle=rgba(INK,.12);cx.lineWidth=1;cx.beginPath();cx.moveTo(c.x,y0);cx.lineTo(c.x+c.w,y0);cx.stroke();continue}
    var f=cl(f8[i],0,1.3),d=Math.max(0,dd[i]),dpx=d*h*.05+f*h*.08,ins=w*(.34-.26*cl(f,0,1)),fy=y0+dpx,gap=Math.max(2.5,h/40),nn=Math.min(10,Math.round(d)),on=i===sel8;

eBoot.addEventListener('keydown',function(e){var k=e.key,n=trail.length,r=cl(Math.round(bMode==='spring'?bTg:bp),0,n-1);bUser=true;
