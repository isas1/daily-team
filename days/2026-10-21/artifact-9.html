<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fastness column in dye bath</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#1A130C;--ink:#EBDDB8;--acc:#E0A040}
:root[data-theme="light"]{--bg:#F4ECD6;--ink:#2A1E10;--acc:#9A5A12}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.fc9-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.fc9-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fc9-cv{display:block;width:100%;height:100%}
</style></head><body>
<div class="fc9-root" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Fastness column, five dye vats stacked top to bottom. Press and hold on a vat and the cloth sinks into it and slowly takes its color; let go and it lifts. Up and Down arrows pick a vat, hold Space or Enter to dip, Escape lifts. The number is percent fixed. The cloth is saved in this browser."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var R=document.querySelector('.fc9-root'),C=document.createElement('canvas');C.className='fc9-cv';R.appendChild(C);
  var X=C.getContext('2d'),S=1;
  var VATS=[[201,162,39],[168,67,44],[46,74,107],[90,61,38],[75,42,58]];
  var NAMES=['Monday','Forever','cat-pics-2','Forever plan','Emotional baggage'];
  function lin(c){c/=255;return c<.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)}
  function srgb(l){l=Math.max(0,Math.min(1,l));return Math.round(255*(l<.0031308?l*12.92:1.055*Math.pow(l,1/2.4)-.055))}
  var VL=VATS.map(function(c){return c.map(lin)}),LINEN=[239,230,212].map(lin);
  var TOP=.3,BH=.13,REST=.25,LEN=.4,KEY='fastcol.v9';
  var s={b:LINEN.slice(),v:1,t:2.2};
  try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&o.b&&o.b.length===3&&o.v>=-1&&o.v<5&&o.t>=0)s=o}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
  function depth(){return s.v<0?0:1-Math.exp(-s.t/6)}
  function col(){var d=depth();if(s.v<0)return s.b;return s.b.map(function(x,i){return x+(VL[s.v][i]-x)*d})}
  var p=REST,v=0,sw=0,sv=.012,ph=0,held=false,sel=s.v<0?0:s.v,sinceSave=0,lastPct=-1;
  function target(){return TOP+(sel+.62)*BH}
  function vatAt(y){return Math.max(0,Math.min(4,Math.floor((y-TOP)/BH)))}
  function dye(dt){
    if(!held||p<TOP+.02)return;
    var i=vatAt(p);
    if(i!==s.v){s.b=col();s.v=i;s.t=0}
    s.t+=dt/60;sinceSave+=dt;if(sinceSave>30){sinceSave=0;save()}
  }
  function aria(){var pc=Math.round(depth()*100);if(pc===lastPct)return;lastPct=pc;
    R.setAttribute('aria-valuenow',pc);
    R.setAttribute('aria-valuetext',(s.v<0?'Undyed':NAMES[s.v]+' vat')+', '+pc+' percent fixed. Selected vat: '+NAMES[sel])}
  function step(dt){
    if(held){v+=(target()-p)*.12*dt;v*=Math.pow(.8,dt)}
    else{if(p>REST)v-=.0022*dt;v*=Math.pow(.92,dt)}
    p+=v*dt;
    if(!held&&p<REST){p=REST;v=Math.abs(v)<.002?0:-v*.3}
    sv+=(-sw*.06+v*.04)*dt;sv*=Math.pow(.95,dt);sw+=sv*dt;
    ph+=dt*.05;dye(dt);aria();
    return held||Math.abs(v)>1e-4||Math.abs(p-REST)>1e-3||Math.abs(sw)>2e-4||Math.abs(sv)>1e-4;
  }
  function snapToTarget(dt){p=held?target():REST;v=0;sw=0;sv=0;dye(dt);aria();return held}
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function rgb(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
  function bands(a){
    for(var i=0;i<5;i++){X.fillStyle=rgb(VATS[i],a);X.fillRect(.2*S,(TOP+i*BH)*S,.6*S,BH*S+1)}
  }
  function draw(){
    var bg=css('--bg'),ink=css('--ink'),acc=css('--acc');
    X.fillStyle=bg;X.fillRect(0,0,S,S);
    bands(1);
    X.strokeStyle=bg;X.globalAlpha=.25;X.lineWidth=Math.max(1,S*.003);
    for(var i=1;i<5;i++){var y=(TOP+i*BH)*S;X.beginPath();X.moveTo(.2*S,y);X.lineTo(.8*S,y);X.stroke()}
    X.globalAlpha=1;
    X.fillStyle=acc;X.fillRect(.83*S,(TOP+sel*BH+.02)*S,.012*S,(BH-.04)*S);
    var cx=(.5+sw)*S,top=(p-LEN)*S,w=.14*S,c=col(),cs=[srgb(c[0]),srgb(c[1]),srgb(c[2])];
    X.strokeStyle=ink;X.globalAlpha=.6;X.lineWidth=Math.max(1,S*.004);
    X.beginPath();X.moveTo(.5*S,0);X.lineTo(cx,top);X.stroke();X.globalAlpha=1;
    X.save();X.translate(cx,top);X.rotate(-sw*1.2);
    X.fillStyle=rgb(cs,1);X.fillRect(-w/2,0,w,LEN*S);
    X.strokeStyle=ink;X.globalAlpha=.08;X.lineWidth=1;
    for(var k=S*.012;k<LEN*S;k+=S*.012){X.beginPath();X.moveTo(-w/2,k);X.lineTo(w/2,k);X.stroke()}
    X.globalAlpha=.5;X.strokeStyle=rgb(cs,1);X.lineWidth=Math.max(1,S*.003);
    for(var f=-w/2+S*.008;f<w/2;f+=S*.016){X.beginPath();X.moveTo(f,LEN*S);X.lineTo(f+Math.sin(f+ph)*S*.003,LEN*S+S*.018);X.stroke()}
    X.restore();X.globalAlpha=1;
    if(p>TOP){X.save();X.beginPath();X.rect(cx-w/2-S*.02,TOP*S,w+S*.04,(p-TOP)*S+S*.03);X.clip();bands(.42);X.restore()}
    X.strokeStyle=ink;X.globalAlpha=.35;X.lineWidth=Math.max(1,S*.004);X.beginPath();
    for(var x=.2;x<=.8001;x+=.01){var yy=(TOP+Math.sin(x*28+ph)*.003)*S;x<.2001?X.moveTo(x*S,yy):X.lineTo(x*S,yy)}
    X.stroke();
    if(p>TOP-.02){var r=w*.6+Math.min(Math.abs(v)*S*3,S*.06);X.globalAlpha=.5;X.beginPath();
      X.ellipse(cx,TOP*S,r,r*.18,0,0,Math.PI*2);X.stroke()}
    X.globalAlpha=1;X.fillStyle=ink;X.textBaseline='middle';
    X.font='600 '+Math.round(S*.075)+'px system-ui,-apple-system,sans-serif';
    X.fillText(Math.round(depth()*100)+'%',.2*S,.13*S);
  }
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?snapToTarget(dt):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  function press(){held=true;kick()}
  function lift(){if(!held)return;held=false;save();kick()}
  function pick(e){var b=R.getBoundingClientRect();sel=vatAt((e.clientY-b.top)/b.height);lastPct=-1;aria()}
  R.addEventListener('pointerdown',function(e){e.preventDefault();R.focus();try{R.setPointerCapture(e.pointerId)}catch(x){}pick(e);press()});
  R.addEventListener('pointermove',function(e){if(held)pick(e)});
  R.addEventListener('pointerup',lift);R.addEventListener('pointercancel',lift);
  R.addEventListener('blur',lift);
  R.addEventListener('keydown',function(e){var k=e.key;
    if(k==='ArrowUp'||k==='ArrowLeft'){sel=Math.max(0,sel-1)}
    else if(k==='ArrowDown'||k==='ArrowRight'){sel=Math.min(4,sel+1)}
    else if(k===' '||k==='Enter'){e.preventDefault();if(!e.repeat)press();return}
    else if(k==='Escape'){lift();return}
    else return;
    e.preventDefault();lastPct=-1;aria();draw();kick()});
  R.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')lift()});
  new ResizeObserver(function(){var d=Math.min(devicePixelRatio||1,2);
    S=Math.max(1,Math.round(R.clientWidth*d));C.width=C.height=S;draw()}).observe(R);
  aria();draw();kick();
})();</script>
</body></html>
