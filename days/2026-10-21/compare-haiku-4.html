<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fling cloth through dye pots</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--ink:#f2f2f0;--acc:#f2b705}
:root[data-theme="light"]{--bg:#f7f7f5;--ink:#121316;--acc:#8a6400}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.wp4-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:grab;outline:none}
.wp4-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wp4-root canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.wp4-n{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:var(--ink);font-size:14px;line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
</style></head><body>
<div class="wp4-root" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Cloth in dye pots. Drag or fling the cloth down the column. It takes the color of the pot beside it. The number counts visits."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var KEY='wp4.v1',NP=5,TOP=0.16,BOT=0.84,FR=0.93,TAU=Math.PI*2;
  var root=document.querySelector('.wp4-root');
  var cv=document.createElement('canvas');
  var num=document.createElement('span');
  num.className='wp4-n';num.setAttribute('aria-hidden','true');
  root.appendChild(cv);root.appendChild(num);
  var ctx=cv.getContext('2d'),cw=0,ch=0,dpr=1;
  var raf=0,last=0,samples=[];

  function clamp(x,a,b){return x<a?a:x>b?b:x}

  var saved={};
  try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  var st={visits:0,p:0,v:0,dd:0,dv:0,drag:false,wasMoving:false};
  st.visits=(+saved.visits||0)+1;
  st.p=typeof saved.p==='number'?clamp(saved.p,0,1):0;

  function nPots(){return Math.min(NP,st.visits)}
  function lv(i){return 0.6+0.4*i/(NP-1)}
  function levelAt(p){var i=Math.round(p*(NP-1));return lv(Math.min(i,nPots()-1))}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({visits:st.visits,p:st.p}))}catch(e){}}

  // One short glide into the saved place on load, skipped under reduced motion.
  if(!reduce()){
    var s0=Math.max(0,st.p-0.08);
    st.v=(st.p-s0)*(1-FR);
    st.p=s0;
  }
  st.dd=levelAt(st.p);
  save();

  function hx(s){s=s.trim();return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]}
  function mix(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')'}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}

  function draw(){
    if(!cw)return;
    var cs=getComputedStyle(root);
    var bg=hx(cs.getPropertyValue('--bg')),ink=hx(cs.getPropertyValue('--ink')),acc=hx(cs.getPropertyValue('--acc'));
    var W=cw,H=ch,x0=W*0.34,xc=W*0.66,r=W*0.07,n=nPots();
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=1;
    ctx.strokeStyle=rgba(ink,0.22);
    ctx.beginPath();ctx.moveTo(xc,H*TOP);ctx.lineTo(xc,H*BOT);ctx.stroke();
    for(var i=0;i<NP;i++){
      var y=H*(TOP+(BOT-TOP)*i/(NP-1));
      ctx.beginPath();ctx.arc(x0,y,r,0,TAU);
      if(i<n){ctx.fillStyle=mix(bg,acc,lv(i));ctx.fill()}
      ctx.strokeStyle=rgba(ink,i<n?0.4:0.18);ctx.stroke();
    }
    var cy=H*(TOP+(BOT-TOP)*st.p),sw=W*0.22,sh=H*0.11;
    ctx.fillStyle=mix(bg,acc,st.dd);
    ctx.fillRect(xc-sw/2,cy-sh/2,sw,sh);
    ctx.strokeStyle=rgba(ink,0.5);
    ctx.strokeRect(xc-sw/2+0.5,cy-sh/2+0.5,sw-1,sh-1);
    num.textContent=String(st.visits);
    root.setAttribute('aria-valuenow',String(Math.round(st.p*100)));
  }

  function step(dt){
    if(!st.drag){
      st.p+=st.v*dt;
      st.v*=Math.pow(FR,dt);
      if(st.p<0){st.p=0;st.v=-st.v*0.35}
      if(st.p>1){st.p=1;st.v=-st.v*0.35}
      if(Math.abs(st.v)<0.00004)st.v=0;
    }
    var tg=levelAt(st.p);
    st.dv=(st.dv+(tg-st.dd)*0.18)*0.8;
    st.dd+=st.dv;
    return st.drag||st.v!==0||Math.abs(st.dv)>0.0005||Math.abs(tg-st.dd)>0.0005;
  }

  // Reduced motion: jump to where the fling would rest.
  function snap(){
    if(!st.drag){st.p=clamp(st.p+st.v/(1-FR),0,1);st.v=0}
    st.dd=levelAt(st.p);st.dv=0;
  }

  function frame(now){
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snap(),false):step(dt);
    draw();
    if(!moving&&st.wasMoving)save();
    st.wasMoving=moving;
    raf=moving?requestAnimationFrame(frame):0;
  }
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

  function size(){
    var r=root.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    cw=r.width;ch=r.height;
    cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  if(window.ResizeObserver)new ResizeObserver(size).observe(root);
  else window.addEventListener('resize',size);

  function toP(e){
    var b=root.getBoundingClientRect();
    var f=clamp((e.clientY-b.top)/b.height,0,1);
    return clamp((f-TOP)/(BOT-TOP),0,1);
  }

  root.addEventListener('pointerdown',function(e){
    st.drag=true;st.v=0;
    root.setPointerCapture(e.pointerId);
    st.p=toP(e);
    samples=[{p:st.p,t:e.timeStamp}];
    kick();
  });
  root.addEventListener('pointermove',function(e){
    if(!st.drag)return;
    st.p=toP(e);
    samples.push({p:st.p,t:e.timeStamp});
    if(samples.length>8)samples.shift();
    kick();
  });
  function release(e){
    if(!st.drag)return;
    st.drag=false;
    var L=samples.length,b=samples[L-1];
    st.v=0;
    if(L>1&&e.timeStamp-b.t<100){
      var a=samples[Math.max(0,L-4)];
      if(b.t>a.t)st.v=clamp((b.p-a.p)/(b.t-a.t)*16.667,-0.1,0.1);
    }
    samples=[];
    save();kick();
  }
  root.addEventListener('pointerup',release);
  root.addEventListener('pointercancel',release);

  function impulse(d){st.v=clamp(st.v+d,-0.1,0.1);kick()}
  root.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowDown'||k==='ArrowRight')impulse(0.025);
    else if(k==='ArrowUp'||k==='ArrowLeft')impulse(-0.025);
    else if(k==='Enter'||k===' ')impulse(0.07);
    else if(k==='Escape'){st.v=0;save();kick()}
    else return;
    e.preventDefault();
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      cancelAnimationFrame(raf);raf=0;
      st.drag=false;st.v=0;samples=[];
      save();
    }else kick();
  });

  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});

  size();
  kick();
})();</script>
</body></html>
