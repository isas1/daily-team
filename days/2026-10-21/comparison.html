:root{color-scheme:light;--ink:#0e2a47;--accent:#a53f3f;--paper:#fdfdfb;--line:#dce2e9}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Mozilla,system-ui,sans-serif}
::selection{background:var(--ink);color:white}button,select{font:inherit;color:inherit;accent-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cmp-stage{container-type:inline-size;width:min(100vw,calc(100dvh - 76px));aspect-ratio:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));margin:auto;outline:1px solid var(--line)}
.cmp-cell{min-width:0;min-height:0;overflow:hidden;position:relative;border:1px solid var(--line)}

  // srcdoc has an opaque origin. Give every preview its own fresh, volatile store.\n  Object.defineProperty(window, 'localStorage', { configurable: true, value: {\n    getItem: (k) => memory.has(String(k)) ? memory.get(String(k)) : null,\n    setItem: (k, v) => memory.set(String(k), String(v)), removeItem: (k) => memory.delete(String(k)),\n    clear: () => memory.clear(), key: (n) => [...memory.keys()][n] ?? null,\n    get length() { return memory.size; },\n  } });\n  // Synthetic pointers have no native capture. Preserve handlers that request it.\n  const capture = Element.prototype.setPointerCapture;\n  Element.prototype.setPointerCapture = function (id) { try { capture.call(this, id); } catch {} };\n  let jobs = [];\n  const later = (fn, ms) => jobs.push(setTimeout(fn, ms));\n  const send = (data) => parent.postMessage({ type: 'comparison:state', ...data }, '*');\n  window.addEventListener('error', (e) => send({ error: e.message }));\n  window.addEventListener('message', (e) => {\n    if (e.source !== parent || e.data?.type !== 'comparison:demo') return;\n    jobs.forEach(clearTimeout); jobs = [];\n    const root = document.querySelector('[role][aria-label]') || document.querySelector('button,canvas') || document.body;\n    const target = root.querySelector('canvas,button,input') || root;\n    const key = (type, value) => root.dispatchEvent(new KeyboardEvent(type, { key: value,\n      code: value === ' ' ? 'Space' : value, bubbles: true, cancelable: true }));\n    const pointer = (type, x, y, buttons = 0) => {\n      const b = root.getBoundingClientRect();\n      target.dispatchEvent(new PointerEvent(type, { clientX: b.left + b.width * x,\n        clientY: b.top + b.height * y, pointerId: 1, pointerType: 'mouse',\n        buttons, button: 0, isPrimary: true, bubbles: true, cancelable: true }));\n    };\n    if (!e.data.play) { key('keyup', ' '); pointer('pointerup', .7, .6); return; }\n    const duration = e.data.seconds * 1000;\n    const input = e.data.input | cx.globalAlpha=1;\n    for(j=0;j\u003cN;j++){col(j);cx.fillStyle=rgb(cc);cx.beginPath();\n      cx.arc((hx[j]+ox[j]+sw*Math.sin(T*1.6+hx[j]*9+hy[j]*5))*S,(hy[j]+oy[j]+sw*Math.cos(T*1.3+hx[j]*6-hy[j]*8))*S,rr*Math.max(.2,1+sc[j]),0,6.2832);cx.fill()}\n    for(k=0;k\u003cpr.length;k++){p=pr[k];cx.globalAlpha=p.k?Math.min(1,p.l/18):1;\n      cx.fillStyle='rgb('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+')';cx.beginPath();cx.arc(p.x*S,p.y*S,rp,0,6.2832);cx.fill()}\n    for(k=0;k\u003cpots;k++){var cxp=SLOT[k]*S,cyp=(PYY+po[k])*S,r=PR*S*Math.max(0,ps[k]);\n      if(pn[k]>.04){cx.globalAlpha=Math.min(1,pn[k]*.9);cx.strokeStyle=rgb(vc[k]);cx.beginPath();cx.arc(cxp,cyp,PR*S*1.75,0,6.2832);cx.stroke()}\n      cx.globalAlpha=1;cx.fillStyle=rgb(vc[k]);cx.beginPath();cx.arc(cxp,cyp,r,0,6.2832);cx.fill()}\n    cx.globalAlpha=1}\n\n  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;\n    var moving=reduce()?(snapToTarget(),false):step(dt);draw();\n    raf=moving?requestAnimationFrame(frame):0;}\n  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}\n  function poke(){awake=performance.now()+6000;kick()}\n  document.addEventListener('visibilitychange',function(){\n    if(document.hidden){cancelAnimationFrame(raf);raf=0;save()}else kick()});\n  window.addEventListener('pagehide',save);\n  window.addEventListener('message',function(e){var m=e.data;\n    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){\n      document.documentElement.setAttribute('data-theme',m.theme);theme();draw()}});\n  var mq=matchMedia('(prefers-color-scheme: light)');\n  if(mq.addEventListener)mq.addEventListener('change',function(){theme();draw()});\n\n  function size(){var r=root.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);S=r.width;\n    cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);draw()}\n  if(window.ResizeObserver)new ResizeObserver(size).observe(root);\n  window.addEventListener('resize',size);\n\n  func  draw();kick();\n})();\u003c/script>\n\u003c/body>\u003c/html>\n"},"haiku":{"file":"compare-haiku-8.html","hash":"3fc9e3cb99e65d0b20f2a9830d075820b2a4270cbe11c479466739f76532f5e4","requestedModel":"claude-haiku-5-5","model":"claude-haiku-5-5","status":"ok","problems":[],"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cscript>(function demoBootstrap() {\n  const memory = new Map();\n  // srcdoc has an opaque origin. Give every preview its own fresh, volatile store.\n  Object.defineProperty(window, 'localStorage', { configurable: true, value: {\n    getItem: (k) => memory.has(String(k)) ? memory.get(String(k)) : null,\n    setItem: (k, v) => memory.set(String(k), String(v)), removeItem: (k) => memory.delete(String(k)),\n    clear: () => memory.clear(), key: (n) => [...memory.keys()][n] ?? null,\n    get length() { return memory.size; },\n  } });\n  // Synthetic pointers have no native capture. Preserve handlers that request it.\n  const capture = Element.prototype.setPointerCapture;\n  Element.prototype.setPointerCapture = function (id) { try { capture.call(this, id); } catch {} };\n  let jobs = [];\n  const later = (fn, ms) => jobs.push(setTimeout(fn, ms));\n  const send = (data) => parent.postMessage({ type: 'comparison:state', ...data }, '*');\n  window.addEventListener('error', (e) => send({ error: e.message }));\n  window.addEventListener('message', (e) => {\n    if (e.source !== parent || e.data?.type !== 'comparison:demo') return;\n    jobs.forEach(clearTimeout); jobs = [];\n    const root = document.querySelector('[role][aria-label]') || document.querySelector('button,canvas') || document.body;\n    const target = root.querySelector('canvas,button,input') || root;\n    const key = (type, value) => root.dispatchEvent(new KeyboardEvent(type, { key: value,\n      code: value === ' ' ? 'Space' : value, bubbles: true, cancelable: true }));\n    const pointer = (type, x, y, buttons = 0) => {\n      const b = root.getBoundingClientRect();\n      target.dispatchEvent(new PointerEvent(type, { clientX: b.left + b.width * x,\n        clientY: b.top + b.height * y, pointerId: 1, pointerType: 'mouse',\n        buttons, button: 0, isPrimary: true, bubbles: true, cancelable: true }));\n    };\n    if (!e.data.play) { key('keyup', ' '); pointer('pointerup', .7, .6); return; }\n    const duration = e.data.seconds * 1000;\n    const input = e.data.input || 'tap';\n    const state = (phase) => send({ phase, value: root.getAttribute('aria-valuenow'), text: root.getAttribute('aria-valuetext') });\n    later(() => state('rest'), 100);\n    later(() => {\n      if (/hold/.test(input)) { key('keydown', 'ArrowRight'); key('keydown', ' '); }\n      else if (/wheel|scrub/.test(input)) {\n        [0, 180, 360].forEach((d) => later(() => target.dispatchEvent(new WheelEvent('wheel',\n          { deltaY: 90, bubbles: true, cancelable: true })), d));\n      } else if (/drag|fling/.test(input)) {\n        pointer('pointerdown', .3, .4, 1);\n        const steps = /fling/.test(input) ? 8 : 28;\n        for (let j = 1; j \u003c= steps; j++) later(() => pointer('pointermove', .3 + .4 * j / steps,\n          .4 + .22 * j / steps, 1), j * (/fling/.test(input) ? 18 : 40));\n        later(() => pointer('pointerup', .7, .62), steps * (/fling/.test(input) ? 18 : 40) + 30);\n      } else if (/nearness|hover/.test(input)) {\n        // Enter is the shared accessible equivalent of moving onto a vat; model layouts differ.\n        key('keydown', 'Enter'); key('keyup', 'Enter');\n      } else { key('keydown', 'Enter'); key('keyup', 'Enter'); }\n      state('action');\n    }, 500);\n    later(() => {\n      key('keyup', ' ');\n      pointer('pointerup', .7, .6);\n      pointer('pointerleave', .7, .6);\n      state('settle');\n    }, duration - 1100);\n    later(() => state('done'), duration - 100);\n  });\n  window.addEventListener('DOMContentLoaded', () => send({ phase: 'ready' }));\n})()\u003c/script>\n\u003cmeta http-equiv=\"Content-Security-Pol
