<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varnish coats: one swatch, finish by scrolling</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--ink:#f2f2f0;--acc:#f2b705}
:root[data-theme="light"]{--bg:#f7f7f5;--ink:#121316;--acc:#8a6400}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.vc1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;outline:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.vc1-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vc1-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
</style></head><body>
<div class="vc1-root" role="slider" tabindex="0" aria-label="Varnish coats on one swatch. Drag up or scroll down to add a coat, drag down or scroll up to sand one off. Up to seven coats. Escape clears all coats." aria-valuemin="0" aria-valuemax="7" aria-valuenow="2" aria-valuetext="2 coats"><canvas class="vc1-cv" id="vc1-cv"></canvas></div>
<script>(function(){
var root=document.querySelector('.vc1-root'),cv=document.getElementById('vc1-cv'),ctx=cv.getContext('2d');
var KEY='varnish.v1',MAX=7,K=0.18,DAMP=0.8;
var raf=0,last=0,goal=2,f=2,v=0,dpr=1,drag=null,wacc=0;
var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
try{var s=JSON.parse(localStorage.getItem(KEY));
  if(s&&typeof s.coats==='number'){goal=f=Math.max(0,Math.min(MAX,Math.round(s.coats)))}}catch(e){}
root.setAttribute('aria-valuenow',goal);
root.setAttribute('aria-valuetext',goal+(goal===1?' coat':' coats'));
function save(){try{localStorage.setItem(KEY,JSON.stringify({coats:goal}))}catch(e){}}
function setGoal(n,dir){
  n=Math.max(0,Math.min(MAX,n));
  if(n===goal){if(dir){v+=dir*0.06;kick()}return}
  goal=n;save();
  root.setAttribute('aria-valuenow',n);
  root.setAttribute('aria-valuetext',n+(n===1?' coat':' coats'));
  kick();
}
function col(h){h=h.trim();return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){var A=col(a),B=col(b);
  return 'rgb('+A.map(function(c,i){return Math.round(c+(B[i]-c)*t)}).join(',')+')'}
function step(dt){
  v=(v+(goal-f)*K*dt)*Math.pow(DAMP,dt);
  f+=v*dt;
  if(Math.abs(v)<0.0005&&Math.abs(goal-f)<0.0005){f=goal;v=0;return false}
  return true;
}
function draw(){
  var st=getComputedStyle(root),bg=st.getPropertyValue('--bg'),ink=st.getPropertyValue('--ink'),acc=st.getPropertyValue('--acc');
  var W=cv.width,H=cv.height,u=W/100,S=u*72,x=(W-S)/2,y=(H-S)/2,lw=dpr;
  ctx.globalAlpha=1;ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var fv=Math.max(0,Math.min(MAX+0.5,f));
  ctx.fillStyle=mix(bg,acc,Math.min(1.06,fv/MAX));
  ctx.fillRect(x,y,S,S);
  ctx.lineWidth=lw;ctx.strokeStyle=mix(bg,ink,0.25);
  ctx.strokeRect(x,y,S,S);
  ctx.strokeStyle=mix(bg,ink,0.5);
  for(var i=1;i<=MAX;i++){
    var al=Math.min(1,fv-(i-1));
    if(al<=0)break;
    var ins=u*1.5*i;
    ctx.globalAlpha=al;
    ctx.strokeRect(x+ins,y+ins,S-2*ins,S-2*ins);
  }
  ctx.globalAlpha=1;
}
function frame(now){
  var dt=last?Math.min(now-last,50)/16.667:1;last=now;
  var moving;
  if(reduce()){f=goal;v=0;moving=false}else moving=step(dt);
  draw();
  raf=moving?requestAnimationFrame(frame):0;
}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
function size(){
  var r=root.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
}
new ResizeObserver(function(){size();draw()}).observe(root);

root.addEventListener('pointerdown',function(e){
  drag={y:e.clientY,g:goal};
  root.setPointerCapture(e.pointerId);
  root.focus();
  e.preventDefault();
});
root.addEventListener('pointermove',function(e){
  if(!drag)return;
  var sp=root.clientHeight/8;
  var raw=drag.g+Math.round((drag.y-e.clientY)/sp);
  setGoal(raw,raw>goal?1:(raw<goal?-1:0));
});
function up(){drag=null}
root.addEventListener('pointerup',up);
root.addEventListener('pointercancel',up);

root.addEventListener('wheel',function(e){
  e.preventDefault();
  wacc+=e.deltaY;
  if(Math.abs(wacc)>=40){var d=wacc>0?1:-1;wacc=0;setGoal(goal+d,d)}
},{passive:false});

root.addEventListener('keydown',function(e){
  var k=e.key,d=0;
  if(k==='ArrowUp'||k==='ArrowRight'||k==='PageUp'||k===' '||k==='Enter')d=1;
  else if(k==='ArrowDown'||k==='ArrowLeft'||k==='PageDown')d=-1;
  if(d){setGoal(goal+d,d)}
  else if(k==='Home'){setGoal(0,-1)}
  else if(k==='End'){setGoal(MAX,1)}
  else if(k==='Escape'){setGoal(0,-1)}
  else return;
  e.preventDefault();
});

window.addEventListener('message',function(e){var m=e.data;
  if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
    document.documentElement.setAttribute('data-theme',m.theme);draw()}});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});

size();
draw();
})();</script>
</body></html>
