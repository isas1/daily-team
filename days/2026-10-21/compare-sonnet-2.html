<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swatch coats in a dye bath</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--ink:#f2f2f0;--acc:#ff4d5e;--un:#34363a}
:root[data-theme="light"]{--bg:#f7f7f5;--ink:#121316;--acc:#c8102e;--un:#d9d9d5}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.vc2-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;cursor:ns-resize;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.vc2-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vc2-cv{display:block;width:100%;height:100%}
</style></head><body>
<div class="vc2-root" role="slider" tabindex="0" aria-label="Dye swatch coats. Scroll, drag down, tap or press arrows to add a coat, drag up to sand one off, Escape to clear" aria-valuemin="0" aria-valuemax="7" aria-valuenow="2" aria-valuetext="2 of 7 coats"></div>
<script>(function(){
  var KEY='fasthouse.v1',MAX=7;
  var root=document.querySelector('.vc2-root');
  var cv=document.createElement('canvas');cv.className='vc2-cv';root.appendChild(cv);
  var ctx=cv.getContext('2d'),S=0,dpr=1;
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var coats=2,tgt,d,dv=0,es=0,ev=0,sx=0,sv=0;

  function store(write){
    try{
      var o=JSON.parse(localStorage.getItem(KEY))||{};
      if(write){o.strip=o.strip||{};o.strip.coats=coats}
      else{
        o.visits=(o.visits|0)+1;
        var c=o.strip&&o.strip.coats;
        if(typeof c==='number'&&c>=0&&c<=MAX)coats=Math.round(c);
      }
      localStorage.setItem(KEY,JSON.stringify(o));
    }catch(e){}
  }
  store(false);
  tgt=coats;d=coats;

  function rgb(h){h=h.trim();return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function mix(a,b,t){var o=[];for(var i=0;i<3;i++){
    o.push(Math.round(255*Math.pow((1-t)*Math.pow(a[i]/255,2.2)+t*Math.pow(b[i]/255,2.2),1/2.2)))}
    return 'rgb('+o.join(',')+')'}
  function clamp(x,a,b){return x<a?a:x>b?b:x}
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

  function spring(x,v,t,k,dm,dt){v+=(t-x)*k*dt;v*=Math.pow(dm,dt);return[x+v*dt,v]}
  function step(dt){
    var m=false,r;
    r=spring(d,dv,tgt,.16,.8,dt);d=r[0];dv=r[1];
    if(Math.abs(tgt-d)<.002&&Math.abs(dv)<.002){d=tgt;dv=0}else m=true;
    r=spring(es,ev,0,.2,.78,dt);es=r[0];ev=r[1];
    if(Math.abs(es)<.0005&&Math.abs(ev)<.0005){es=0;ev=0}else m=true;
    r=spring(sx,sv,0,.2,.75,dt);sx=r[0];sv=r[1];
    if(Math.abs(sx)<.0005&&Math.abs(sv)<.0005){sx=0;sv=0}else m=true;
    return m;
  }
  function snapToTarget(){d=tgt;dv=0;es=ev=sx=sv=0}

  function draw(){
    if(!S)return;
    var cs=getComputedStyle(root);
    var bg=cs.getPropertyValue('--bg'),ink=cs.getPropertyValue('--ink').trim(),
        acc=cs.getPropertyValue('--acc').trim(),un=cs.getPropertyValue('--un');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,S,S);ctx.globalAlpha=1;ctx.setLineDash([]);
    var side=S*.48,gap=S*.026,r=S*.03,h=side/2,i,o;
    ctx.translate(S/2+sx*S,S/2);
    var sc=1+es;ctx.scale(sc,sc);
    ctx.lineWidth=1;ctx.strokeStyle=ink;ctx.setLineDash([2,4]);ctx.globalAlpha=.14;
    for(i=0;i<MAX;i++){o=(i+1)*gap;rr(-h-o,-h-o,side+2*o,side+2*o,r+o);ctx.stroke()}
    ctx.setLineDash([]);
    for(i=0;i<MAX;i++){
      var f=clamp(d-i,0,1);if(f<=.001)continue;
      o=(i+1)*gap*f;
      var nw=i===tgt-1;
      if(nw&&d>tgt)o+=(d-tgt)*gap*1.2;
      if(o<0)o=0;
      rr(-h-o,-h-o,side+2*o,side+2*o,r+o);
      ctx.globalAlpha=nw?f:.34*f;
      ctx.strokeStyle=nw?acc:ink;
      ctx.lineWidth=nw?1.5:1;
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    rr(-h,-h,side,side,r);
    ctx.fillStyle=mix(rgb(un),rgb(acc),clamp(d*.14,0,.98));ctx.fill();
    ctx.save();ctx.clip();
    var w=Math.max(3,Math.round(side/56)),p;
    ctx.lineWidth=1;ctx.beginPath();
    for(p=-h;p<=h;p+=w){ctx.moveTo(p+.5,-h);ctx.lineTo(p+.5,h)}
    ctx.strokeStyle=bg;ctx.globalAlpha=.24;ctx.stroke();
    ctx.beginPath();
    for(p=-h+w/2;p<=h;p+=w){ctx.moveTo(-h,p+.5);ctx.lineTo(h,p+.5)}
    ctx.strokeStyle=ink;ctx.globalAlpha=.06;ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }

  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

  function aria(){root.setAttribute('aria-valuenow',coats);
    root.setAttribute('aria-valuetext',coats+' of '+MAX+' coats')}
  function bump(dir){sv+=dir*.008;ev+=.004;kick()}
  function setTo(n,dir){
    n=clamp(n,0,MAX);
    if(n===coats){bump(dir);return}
    coats=n;tgt=n;ev+=dir>0?-.012:.01;store(true);aria();kick();
  }
  function change(dir){var n=coats+dir;if(n<0||n>MAX){bump(dir);return}setTo(n,dir)}

  /* pointer: tap adds, vertical scrub adds or sands */
  var pid=null,y0=0,yl=0,acc=0,moved=false;
  root.addEventListener('pointerdown',function(e){
    pid=e.pointerId;y0=yl=e.clientY;acc=0;moved=false;
    try{root.setPointerCapture(pid)}catch(x){}
  });
  root.addEventListener('pointermove',function(e){
    if(e.pointerId!==pid)return;
    var T=Math.max(26,S*.05);
    acc+=e.clientY-yl;yl=e.clientY;
    if(Math.abs(e.clientY-y0)>8)moved=true;
    while(acc>=T){acc-=T;change(1)}
    while(acc<=-T){acc+=T;change(-1)}
  });
  function up(e){
    if(e.pointerId!==pid)return;
    pid=null;
    if(e.type==='pointerup'&&!moved)change(1);
  }
  root.addEventListener('pointerup',up);
  root.addEventListener('pointercancel',up);

  /* wheel: scroll down lays a coat, scroll up sands one */
  var wacc=0,wlast=0;
  root.addEventListener('wheel',function(e){
    e.preventDefault();
    wacc+=e.deltaY*(e.deltaMode===1?16:1);
    var T=50,now=performance.now();
    while(Math.abs(wacc)>=T){
      if(now-wlast<90){wacc=clamp(wacc,-T*.99,T*.99);break}
      var dir=wacc>0?1:-1;wacc-=dir*T;wlast=now;change(dir);
    }
  },{passive:false});

  root.addEventListener('keydown',function(e){
    var k=e.key,h=true;
    if(k==='ArrowUp'||k==='ArrowRight'||k==='Enter'||k===' ')change(1);
    else if(k==='ArrowDown'||k==='ArrowLeft')change(-1);
    else if(k==='Escape'||k==='Home')setTo(0,-1);
    else if(k==='End')setTo(MAX,1);
    else h=false;
    if(h)e.preventDefault();
  });

  function size(){
    S=root.clientWidth;dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=cv.height=Math.round(S*dpr);draw();
  }
  if(window.ResizeObserver)new ResizeObserver(size).observe(root);
  else window.addEventListener('resize',size);

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});

  aria();size();
  if(!reduce()){dv=.22;kick()}
})();</script>
</body></html>
