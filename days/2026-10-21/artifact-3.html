<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warp threads in dye bath</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#1D1813;--ink:#EDE3CF;--acc:#D0703A;--lin:#EFE6D4}
:root[data-theme="light"]{--bg:#D6C8AC;--ink:#2B2119;--acc:#8E3A1F;--lin:#F8F2E5}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg)}
.wv3-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;overflow:hidden}
.wv3-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wv3-cv{display:block;width:100%;height:100%}
</style></head><body>
<div class="wv3-root" role="slider" tabindex="0" aria-valuemin="1" aria-valuemax="40" aria-valuenow="1" aria-label="Warp threads in a dye bath. Tap a vat at the bottom to choose it, then drag across the threads to dip the ones you cross. Arrow keys move between threads and vats, Enter or Space dips, Escape undyes."></div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.querySelector('.wv3-root'),cv=document.createElement('canvas'),cx=cv.getContext('2d');
  cv.className='wv3-cv';root.appendChild(cv);
  var N=40,KEY='wv3-warp',VATS=[[178,64,44],[201,160,40],[38,66,104],[104,74,50]],
      VN=['Forever Red','Monday Mustard','Emotional Indigo','Walnut'],
      th=[],vat=0,cur=0,kb=false,W=0,H=0,dpr=1,parts=[],lift=[0,0,0,0],lv=[0,0,0,0],drag=null,i;
  function lin(v){v/=255;return v<.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
  function srgb(v){v=v<.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055;return Math.round(Math.max(0,Math.min(1,v))*255)}
  function mix(a,b,k){return [0,1,2].map(function(j){return srgb(lin(a[j])*(1-k)+lin(b[j])*k)})}
  function hex(s){s=s.trim().slice(1);return [0,2,4].map(function(j){return parseInt(s.substr(j,2),16)})}
  function rgb(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a==null?1:a)+')'}
  for(i=0;i<N;i++)th.push({c:null,n:0,d:0,t:0,x:0,v:0});
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(s&&s.th){s.th.forEach(function(o,j){if(th[j]&&o&&o.c&&o.t>0){th[j].c=o.c;th[j].n=o.n|0;th[j].t=th[j].d=o.t}});vat=(s.vat|0)%4}
  else for(i=6;i<14;i++){th[i].c=VATS[0].slice();th[i].t=.55;th[i].d=.05}
  lift[vat]=.03;
  function save(){try{localStorage.setItem(KEY,JSON.stringify({vat:vat,th:th.map(function(o){return {c:o.c,n:o.n,t:o.t}})}))}catch(e){}}
  function geo(){var x0=W*.08;return {x0:x0,sp:W*.84/(N-1),by:H*.15,bt:H-Math.max(44,H*.16)}}
  function aria(){var o=th[cur];root.setAttribute('aria-valuenow',cur+1);
    root.setAttribute('aria-valuetext','Thread '+(cur+1)+' of 40, '+(o.t>0?Math.round(o.t*100)+' percent '+VN[o.n]:'undyed')+'. Vat: '+VN[vat])}
  function dip(j,dir,f){var o=th[j],v=VATS[vat];
    o.c=(o.c&&o.t>0)?mix(o.c,v,.5):v.slice();o.n=vat;o.t=Math.min(1,o.t+.3);
    o.v+=dir*(f||3);
    for(var k=0;k<5;k++)parts.push({i:j,y:Math.random()*6,s:1.4+Math.random()*1.2,a:1})}
  function step(dt){var mv=false,L=geo().bt-geo().by;
    th.forEach(function(o,j){
      var df=o.t-o.d;
      if(Math.abs(df)>.002){o.d+=df*(1-Math.pow(.988,dt));mv=true;
        if(df>0&&Math.random()<.3*dt)parts.push({i:j,y:0,s:1.6+Math.random(),a:1})}
      else{o.d=o.t;if(o.t===0)o.c=null}
      o.v+=-.16*o.x*dt;o.v*=Math.pow(.8,dt);o.x+=o.v*dt;
      if(Math.abs(o.x)>.05||Math.abs(o.v)>.05)mv=true;else o.x=o.v=0});
    for(var k=0;k<4;k++){var tg=k===vat?.03:0;lv[k]+=(tg-lift[k])*.18*dt;lv[k]*=Math.pow(.8,dt);lift[k]+=lv[k]*dt;
      if(Math.abs(tg-lift[k])>.0005||Math.abs(lv[k])>.0005)mv=true;else{lift[k]=tg;lv[k]=0}}
    parts=parts.filter(function(p){var top=th[p.i].d*L;
      if(p.y<top)p.y=Math.min(top,p.y+p.s*dt);else p.a-=.05*dt;return p.a>0});
    return mv||parts.length>0}
  function snapToTarget(){th.forEach(function(o){o.d=o.t;o.x=o.v=0;if(o.t===0)o.c=null});
    for(var k=0;k<4;k++){lift[k]=k===vat?.03:0;lv[k]=0}parts=[]}
  function draw(){if(!W)return;
    var cs=getComputedStyle(document.documentElement),bg=cs.getPropertyValue('--bg').trim(),
        ink=hex(cs.getPropertyValue('--ink')),acc=cs.getPropertyValue('--acc').trim(),l0=hex(cs.getPropertyValue('--lin')),
        g=geo(),L=g.bt-g.by,tw=Math.max(1.3,g.sp*.56),av=[0,0,0];
    cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle=bg;cx.fillRect(0,0,W,H);cx.lineCap='butt';
    var X=function(o,j,y){return g.x0+j*g.sp+o.x*(y-g.by)/L};
    th.forEach(function(o,j){var on=o.c&&o.d>.001,col=on?mix(l0,o.c,.35+.65*o.d):l0;
      for(var k=0;k<3;k++)av[k]+=lin(on?(o.d>.5?col[k]:mix(l0,o.c,.35+.65*o.d*o.d)[k]):l0[k]);
      cx.lineWidth=tw;cx.strokeStyle=rgb(l0);cx.beginPath();cx.moveTo(X(o,j,g.by),g.by);cx.lineTo(X(o,j,H+4),H+4);cx.stroke();
      if(on){var y1=g.bt-o.d*L;cx.strokeStyle=rgb(col);cx.beginPath();cx.moveTo(X(o,j,y1),y1);cx.lineTo(X(o,j,H+4),H+4);cx.stroke()}});
    parts.forEach(function(p){var o=th[p.i];if(!o.c)return;var y=g.bt-p.y,r=Math.max(1.4,tw*.5);
      cx.fillStyle=rgb(mix(o.c,[20,14,10],.25),p.a);cx.fillRect(X(o,p.i,y)-r/2,y-r/2,r,r)});
    var bh=Math.max(3,H*.013);cx.fillStyle=rgb(av.map(function(v){return srgb(v/N)}));
    cx.fillRect(g.x0-g.sp*2,g.by-bh,W*.84+g.sp*4,bh);
    for(var k=0;k<4;k++){var tp=g.bt-lift[k]*H;cx.fillStyle=rgb(VATS[k],k===vat?.96:.72);
      cx.fillRect(k*W/4+1,tp,W/4-2,H-tp)}
    var bs=-1,bl=0,rs=-1;
    for(var j=0;j<=N;j++){if(j<N&&th[j].t===0){if(rs<0)rs=j}else if(rs>=0){if(j-rs>bl){bl=j-rs;bs=rs}rs=-1}}
    if(bl>0){var xa=g.x0+bs*g.sp-tw/2,xb=g.x0+(bs+bl-1)*g.sp+tw/2,yb=g.by-H*.035,fs=Math.max(10,W*.026);
      cx.strokeStyle=rgb(ink,.4);cx.lineWidth=1;cx.beginPath();cx.moveTo(xa,yb+4);cx.lineTo(xa,yb);cx.lineTo(xb,yb);cx.lineTo(xb,yb+4);cx.stroke();
      cx.fillStyle=rgb(ink,.62);cx.font=fs+'px system-ui,-apple-system,sans-serif';cx.textAlign='center';cx.textBaseline='bottom';
      cx.fillText('undyed',Math.min(W-fs*2,Math.max(fs*2,(xa+xb)/2)),yb-3)}
    if(kb){var xc=X(th[cur],cur,g.by+H*.02);cx.fillStyle=acc;cx.fillRect(xc-1.5,g.by+2,3,H*.04)}}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  function pt(e){var r=root.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function setVat(k){vat=(k+4)%4;aria();kick()}
  root.addEventListener('pointerdown',function(e){root.setPointerCapture(e.pointerId);kb=false;
    var p=pt(e),g=geo();drag={x:p.x,y:p.y,hit:{}};
    if(p.y>g.bt-.03*H)setVat(Math.max(0,Math.min(3,Math.floor(p.x/W*4))));
    else if(p.y>g.by){var j=Math.round((p.x-g.x0)/g.sp);if(j>=0&&j<N){drag.hit[j]=1;dip(j,1,2);cur=j;aria()}}
    kick();e.preventDefault()});
  root.addEventListener('pointermove',function(e){if(!drag)return;var p=pt(e),g=geo(),dx=p.x-drag.x;
    if(dx){var a=Math.min(drag.x,p.x),b=Math.max(drag.x,p.x);
      for(var j=Math.max(0,Math.ceil((a-g.x0)/g.sp));j<N;j++){var xj=g.x0+j*g.sp;if(xj>b)break;
        var y=drag.y+(p.y-drag.y)*(xj-drag.x)/dx;
        if(!drag.hit[j]&&y>g.by&&y<H){drag.hit[j]=1;dip(j,dx>0?1:-1,Math.min(9,2+Math.abs(dx)*.5));cur=j}}
      aria();kick()}
    drag.x=p.x;drag.y=p.y});
  function end(){if(drag){drag=null;save()}}
  root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
  root.addEventListener('keydown',function(e){var k=e.key,h=true;
    if(k==='ArrowLeft'||k==='ArrowRight'){cur=Math.max(0,Math.min(N-1,cur+(k==='ArrowLeft'?-1:1)));th[cur].v+=k==='ArrowLeft'?-1.5:1.5}
    else if(k==='ArrowUp'||k==='ArrowDown')setVat(vat+(k==='ArrowUp'?1:-1));
    else if(k==='Enter'||k===' ')dip(cur,1,3);
    else if(k==='Escape'||k==='Delete'||k==='Backspace'){th[cur].t=0;th[cur].v-=2}
    else h=false;
    if(h){e.preventDefault();kb=true;aria();save();kick()}});
  new ResizeObserver(function(en){var r=en[0].contentRect;W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw()}).observe(root);
  aria();draw();kick();
})();</script>
</body></html>
