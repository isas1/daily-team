<!doctype html>
<html lang="en"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mordant rack: dip by holding</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{--bg:#0e0f11;--ink:#f2f2f0;--acc:#ff6b3d}
:root[data-theme="light"]{--bg:#f7f7f5;--ink:#121316;--acc:#c43d12}
html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.ab1-root{width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.ab1-root:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ab1-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ab1-read{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
</style></head><body>
<div class="ab1-root" role="slider" tabindex="0"
 aria-label="Mordant rack. Five vats in a row. Press and hold, or press Space or Enter, to dip the cloth into the chosen vat. Drag, or use the left and right arrows, to choose a vat. Escape lifts the cloth. Dyed depth is kept on this device."
 aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Vat 1, 0.0 s held"></div>
<script>(function(){
  var KEY='ab1-mordant.v1',N=5,HALF=6,CAP=120;
  var root=document.querySelector('.ab1-root');
  var cv=document.createElement('canvas');cv.className='ab1-cv';root.appendChild(cv);
  var rd=document.createElement('div');rd.className='ab1-read';root.appendChild(rd);
  var ctx=cv.getContext('2d'),S=1,dpr=1;
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,ptr=false;
  var sel=0,secs=[0,0,0,0,0],holding=false,holdStart=0;
  var cx=0.5,cxV=0,dip=0,dipV=0,ripE=0.5,phase=0;

  try{
    var o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){
      if(Number.isInteger(o.sel)&&o.sel>=0&&o.sel<N)sel=o.sel;
      if(Array.isArray(o.secs))for(var i=0;i<N;i++){var v=+o.secs[i];if(isFinite(v)&&v>0)secs[i]=Math.min(CAP,v)}
    }
  }catch(e){}
  cx=(sel+1)/(N+1);

  function save(){try{localStorage.setItem(KEY,JSON.stringify({sel:sel,secs:secs}))}catch(e){}}
  function heldNow(){return holding?(performance.now()-holdStart)/1000:0}
  function depthOf(s){return 1-Math.exp(-s/HALF)}
  function press(i){sel=i;holding=true;holdStart=performance.now();kick()}
  function lift(){if(!holding)return;secs[sel]=Math.min(CAP,secs[sel]+heldNow());holding=false;save();kick()}
  function idxAt(e){
    var r=root.getBoundingClientRect(),k=Math.round((e.clientX-r.left)/r.width*(N+1))-1;
    return k<0?0:k>N-1?N-1:k;
  }

  root.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    root.setPointerCapture(e.pointerId);ptr=true;
    lift();press(idxAt(e));
  });
  root.addEventListener('pointermove',function(e){
    if(!ptr)return;
    var i=idxAt(e);
    if(i!==sel){lift();press(i)}
  });
  function release(){ptr=false;lift()}
  root.addEventListener('pointerup',release);
  root.addEventListener('pointercancel',release);
  root.addEventListener('contextmenu',function(e){e.preventDefault()});

  root.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'){
      e.preventDefault();
      if(holding)return;
      var n=sel+(k==='ArrowRight'?1:-1);
      if(n>=0&&n<N){sel=n;save();kick()}
    }else if(k===' '||k==='Enter'){
      e.preventDefault();
      if(!holding&&!e.repeat)press(sel);
    }else if(k==='Escape'){
      e.preventDefault();lift();
    }
  });
  root.addEventListener('keyup',function(e){
    if((e.key===' '||e.key==='Enter')&&!ptr){e.preventDefault();lift()}
  });
  root.addEventListener('blur',function(){ptr=false;lift()});

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ptr=false;lift();cancelAnimationFrame(raf);raf=0}else kick()});

  function size(){
    S=root.clientWidth||1;dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);draw();
  }
  new ResizeObserver(size).observe(root);

  function step(dt){
    var tc=(sel+1)/(N+1),td=holding?1:0;
    cxV=(cxV+(tc-cx)*0.16)*0.8;cx+=cxV*dt;
    dipV=(dipV+(td-dip)*0.2)*0.78;dip+=dipV*dt;
    ripE=Math.min(1,ripE*0.97+Math.min(0.5,(Math.abs(dipV)+Math.abs(cxV))*4));
    phase+=0.12*dt;
    return holding||Math.abs(tc-cx)>5e-4||Math.abs(cxV)>5e-4||Math.abs(td-dip)>5e-4||Math.abs(dipV)>5e-4||ripE>0.01;
  }
  function snap(){cx=(sel+1)/(N+1);cxV=0;dip=holding?1:0;dipV=0;ripE=0}

  function frame(now){
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snap(),holding):step(dt);
    draw();
    raf=moving?requestAnimationFrame(frame):0;
  }
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

  function H(h){h=h.trim();return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function mix(a,b,t){return[0,1,2].map(function(j){return a[j]+(b[j]-a[j])*t})}
  function css(c){return'rgb('+c.map(function(x){return Math.round(x)}).join(',')+')'}

  function draw(){
    var cs=getComputedStyle(document.documentElement);
    var bg=H(cs.getPropertyValue('--bg')),ink=H(cs.getPropertyValue('--ink')),acc=H(cs.getPropertyValue('--acc'));
    var g=ctx,railY=0.2*S,vatTop=0.46*S,vatBot=0.84*S,vatW=0.12*S;
    var sec=secs[sel]+heldNow(),d=depthOf(sec);

    g.setTransform(dpr,0,0,dpr,0,0);
    g.globalAlpha=1;g.fillStyle=css(bg);g.fillRect(0,0,S,S);
    g.strokeStyle=css(ink);g.lineWidth=1;

    g.globalAlpha=0.5;g.beginPath();g.moveTo(0.1*S,railY+0.5);g.lineTo(0.9*S,railY+0.5);g.stroke();

    for(var i=0;i<N;i++){
      var x=(i+1)/(N+1)*S,l=x-vatW/2;
      g.globalAlpha=1;g.fillStyle=css(mix(bg,acc,0.08+0.05*i));
      g.fillRect(l,vatTop,vatW,vatBot-vatTop);
      g.globalAlpha=i===sel?1:0.4;
      g.strokeRect(l+0.5,vatTop+0.5,vatW-1,vatBot-vatTop-1);
    }

    var vx=(sel+1)/(N+1)*S,amp=ripE*0.012*S;
    g.globalAlpha=1;g.beginPath();
    for(var k=0;k<=24;k++){
      var u=k/24,px=vx-vatW/2+u*vatW,py=vatTop+amp*Math.sin(phase*4+u*9);
      if(k===0)g.moveTo(px,py);else g.lineTo(px,py);
    }
    g.stroke();

    var cw=0.09*S*(1-0.08*dip),sx=cx*S,cl=sx-cw/2,cr=sx+cw/2;
    var cb=(0.38+0.36*dip)*S,bulge=0.02*S*dip*Math.sin(phase*3);
    var dyeC=mix(ink,acc,Math.min(1,0.45+0.14*sel));
    var cloth=mix(ink,dyeC,d);
    g.globalAlpha=1;g.fillStyle=css(cloth);
    g.beginPath();g.moveTo(cl,railY);g.lineTo(cr,railY);g.lineTo(cr,cb);
    g.quadraticCurveTo(sx,cb+bulge,cl,cb);g.closePath();g.fill();

    var t=sec.toFixed(1)+' s';
    if(rd.textContent!==t)rd.textContent=t;
    root.setAttribute('aria-valuenow',String(sel+1));
    root.setAttribute('aria-valuetext','Vat '+(sel+1)+', '+t+' held');
  }

  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});

  size();kick();
})();</script>
</body></html>
